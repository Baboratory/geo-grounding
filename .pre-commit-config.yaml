repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-jsonschema]
        files: ^(scripts|usage_examples)/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
  - repo: local
    hooks:
      - id: validate-data
        name: validate GeoGrounding data
        entry: python3 scripts/validate.py
        language: system
        pass_filenames: false
        files: ^(data|schema)/
      - id: validate-tests
        name: test scripts/validate.py itself
        entry: python3 -m pytest tests/
        language: system
        pass_filenames: false
        files: ^(scripts/validate\.py|tests/)
