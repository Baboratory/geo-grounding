[project]
name = "geo-grounding"
# Not the dataset's authoritative version -- this repo isn't distributed
# as a PyPI package, this field only exists because [project] requires
# one. The real version (SemVer over the schema, see VERSIONING.md) lives
# in git tags, not here; don't bump this to track that.
version = "0.1.0"
description = "Structured, source-cited geographic and cultural data for grounding AI/LLM applications"
license = "MIT"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/baboratory/geo-grounding"
Repository = "https://github.com/baboratory/geo-grounding"
Issues = "https://github.com/baboratory/geo-grounding/issues"

[project.optional-dependencies]
dev = [
  "pyyaml",
  "jsonschema[format]",
  "black",
  "ruff",
  "mypy",
  "types-PyYAML",
  "types-jsonschema",
  "codespell",
  "yamllint",
  "pre-commit",
  "pytest",
]


[tool.setuptools]
packages = []
py-modules = []
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
# off: PyYAML's stubs return Any from safe_load(), which trips this on every
# YAML read regardless of our own type annotations -- not a real bug.
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.codespell]
skip = "*.json,.git"
ignore-words-list = "pont,gard,socio-economic,connexion,handel,sme,ore,claus,dokument,tread,som,te,parlament,ine,toke,revered,hace,oficial,flor,oriente,ake,blong,fale,takin,modee"
