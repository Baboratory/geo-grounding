alpha3: SLB
alpha2: SB
name:
  eng: Solomon Islands
  local:
    - languageCode: eng
      value: Solomon Islands
    - languageCode: pis
      value: Solomon Aelan
flagEmoji: "🇸🇧"
capital: Honiara
isSovereign: true
# Classified unitary-small: Solomon Islands is a small archipelagic state (~0.72M,
# 2019 census) with 9 provinces plus the Honiara capital territory, but no
# regional language has statutory official recognition and the split between
# ~120 indigenous language areas is geographic rather than a widely recognized
# cultural-historical regional identity with its own codified status (the same
# reasoning as FJI/VUT). English and Pijin are national de facto/official,
# not region-bearing. One synthetic WHOLE region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  # English is the de facto/official language of law, government, administration
  # and education; the Constitution gives it no formal official-language clause
  # but it operates as the legal/administrative language.
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: constitution
  # Solomon Islands Pijin (ISO 639-3 'pis') is the de facto national lingua
  # franca but is NOT legally official, so it is locallySpoken, not official.
  - languageCode: pis
    domain: locallySpoken
    speakersShare: 0.684
    sourceId: census-2019
  # English as a living first/completed language of a minority (a locallySpoken
  # row alongside its official legal status); the majority speak Pijin at home.
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.25
    sourceId: pijin-estimate
# ethnicGroups: 2019 census and Minority Rights Group 2019 reporting.
ethnicGroups:
  - group: Melanesian
    percent: 95.3
    sourceId: world-factbook-ethnic
  - group: Polynesian
    percent: 3.1
    sourceId: world-factbook-ethnic
  - group: Micronesian
    percent: 1.2
    sourceId: world-factbook-ethnic
  - group: Other (incl. Chinese, European, mixed)
    percent: 0.3
    sourceId: world-factbook-ethnic
timezones:
  - name: Pacific/Guadalcanal
    standardUtcOffset: "UTC+11"
    observesDst: false
currency:
  code: SBD
  symbol: "SI$"
  name: Solomon Islands dollar
legalConstraints:
  - topic: "official languages"
    description: "English is the language of government, legislation and the courts (the Constitution provides no formal official-language clause but the legal system operates in English). Solomon Islands Pijin (ISO 639-3 'pis') is the de facto national lingua franca used across the islands but carries no statutory official status."
    sourceId: constitution
  - topic: "customary law"
    description: "The Constitution recognises customary law ('kastom'): s.75 requires Parliament to have particular regard to the customs, values and aspirations of Solomon Islanders, and customary land tenure and village governance remain legally significant alongside the formal system."
    sourceId: constitution
  - topic: "liquor purchase age"
    description: "The minimum age to purchase or consume liquor is 21 (Liquor Act Cap 144); supplying liquor to a person under 21 is an offence."
    sourceId: liquor-act
paymentCulture:
  popularMethods:
    - "Cash — the everyday default for markets, kiosks and informal transactions"
    - "EFTPOS/debit cards — accepted in larger Honiara retailers and hotels"
    - "Bank transfers for larger/formal payments (BSP, ANZ and other commercial banks)"
    - "Mobile and agency banking are growing but coverage is limited outside Honiara"
  tipping:
    expected: false
    typicalAmount: "Not customary; a modest 'thank you' tip at resorts is appreciated but not expected"
    autoIncludedInBill: false
    note: "Tipping is not widely expected in Solomon Islands; round up for taxis and village guides. Many rural areas are effectively cash-only."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Warm, polite and community-oriented; respect elders and chiefs. English is standard in government and business while Pijin is the common vernacular."
  greetingNorms: "'Halo' (hello) or a warm handshake open the conversation; Pijin 'Olketa' greetings and sharing of betel nut or kava mark social visits."
  meetingEtiquette: "Relationship- and trust-driven; building rapport before business matters. Punctuality is relaxed ('island time' is common). Consensus and deference to leaders are valued; dress modestly in village settings."
  topicsToAvoid:
    - "The inter-island tensions and communal violence of 1998-2003"
    - "Land disputes and customary tenure disagreements"
    - "Ethnic generalizations between island groups"
  giftGivingNotes: "A small thoughtful gift is appreciated; gifts are presented with both hands. In village settings, sharing food is the customary form of welcome."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
  - id: constitution
    name: "Constitution of Solomon Islands"
    publisher: "Solomon Islands Parliament / Constitute Project"
    url: "https://constituteproject.org/constitution/Solomon_Islands_2018"
    year: 2018
    accessedDate: "2026-09-18"
    note: "English functions as the language of government and the courts; s.75 recognises customary law. Basis for the eng official row."
  - id: census-2019
    name: "2019 National Population and Housing Census"
    publisher: "Solomon Islands National Statistics Office (SINSO)"
    url: "https://solomons.gov.sb/wp-content/uploads/2023/09/Solomon-Islands-2019-Population-and-Housing-Census_National-Report-Vol-1-2.pdf"
    year: 2019
    accessedDate: "2026-09-18"
    note: "Total enumerated population 720,956. Basis for the pis locallySpoken share (~68.4% speak Pijin, aged 5+ per the 2019 census as reported); religious and household data referenced in the region file."
  - id: iso-pis
    name: "ISO 639-3 entry: pis — Pijin"
    publisher: "SIL International (ISO 639-3 Registration Authority)"
    url: "https://iso639-3.sil.org/code/pis"
    year: 2026
    accessedDate: "2026-09-18"
    note: "Verifies ISO 639-3 code pis = Pijin (Solomon Islands), the de facto national lingua franca."
  - id: world-factbook-ethnic
    name: "CIA World Factbook — Solomon Islands people and society (2009 estimate)"
    publisher: "CIA World Factbook (archival copy)"
    url: "https://worldfactbookarchive.org/archive/2024/SB"
    year: 2009
    accessedDate: "2026-09-18"
    note: "Ethnic composition (Melanesian 95.3%, Polynesian 3.1%, Micronesian 1.2%, other 0.3%). An estimate; the 2019 census reports broadly comparable shares."
  - id: liquor-act
    name: "Liquor Act (Cap 144) of Solomon Islands"
    publisher: "Pacific Islands Legal Information Institute (PacLII)"
    url: "http://paclii.org/sb/criminal-law/ch50-liquor-act.htm"
    year: 2025
    accessedDate: "2026-09-18"
    note: "Minimum age 21 for purchase/consumption of liquor on licensed premises."
  - id: cbsi-currency
    name: "Central Bank of Solomon Islands Act / SBD currency"
    publisher: "Central Bank of Solomon Islands"
    url: "https://www.cbsi.com.sb/"
    year: 2026
    accessedDate: "2026-09-18"
    note: "The Solomon Islands dollar (SBD) is the official currency, issued by the CBSI."
  - id: pijin-estimate
    name: "Composite estimate — English/local-language coverage in Solomon Islands"
    publisher: "Composite estimate"
    url: "https://iso639-3.sil.org/code/pis"
    year: 2026
    accessedDate: "2026-09-18"
    note: "No authoritative English-proficiency census exists; the share of the resident population for whom English is a first/living language is an ESTIMATE built around English's role as the administrative/legal language with Pijin as the home lingua franca."
