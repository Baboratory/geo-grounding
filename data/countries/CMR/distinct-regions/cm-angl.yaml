      - "Warm cardigans on the cool, rainy highlands (July)"
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "08:00-17:30 Mon-Fri; English-language documents and common-law contracts dominate."
  lunchBreakTiming: "13:00-14:00."
  notes: "The Anglophone crisis (since 2016) has disrupted commerce, schooling and travel in parts of the NW/SW, limiting activity in some rural zones. Cameroon Pidgin (Kamtok) is the everyday informal lingua franca."
