code: WHOLE
name:
  eng: Cameroon
  local:
    - languageCode: fra
      value: Cameroun
    - languageCode: eng
      value: Cameroon
# Country-wide fallback for Cameroon (unitary-large, curated regional set).
# The national character folds together the Anglophone West, the Islamized
# Sahelian North and the Christian forest-coast.
climates:
  - koppenCode: Aw
    description: "Tropical wet-dry savanna across the interior plateaus and the North."
  - koppenCode: Af
    description: "Tropical rainforest along the coastal and southern forest belt."
  - koppenCode: Am
    description: "Tropical monsoon and highland climate on the SW coast and Mt Cameroon."
  - koppenCode: BSh
    description: "Hot semi-arid steppe in the extreme Far North (Lake Chad basin, Maroua)."
landmarks:
  - name: Mount Cameroon
    description: "At 4,095m the highest peak in West and Central Africa; an active volcano."
  - name: Waza National Park
    description: "Flagship Sahelian park in the Far North known for elephants and lions."
  - name: Dja Faunal Reserve
    description: "UNESCO World Heritage Site; one of the largest protected rainforest reserves in Africa."
culturalTraits:
  - "'Africa in Miniature' — over 250 ethnic groups and 24 major African language clusters"
  - "Official bilingualism (French and English) with equal constitutional status"
  - "Strong chiefdom and *fon* traditions, esp. among the Bamileke and Anglophone grassfields"
  - "Makossa and bikutsi music arising from Douala and the Centre"
prideOf:
  - "Cultural and linguistic diversity ('Africa in Miniature')"
  - "National football team and its storied African Cup of Nations history"
  - "Mount Cameroon and the protected rainforests"
animals:
  popular:
    - "African elephant"
    - "Gorilla and chimpanzee (western lowland gorilla in the south)"
    - "Lion"
    - "Giraffe"
  unique:
    - "Drill monkey (Mandrill/Drill country)"
    - "Preuss's monkey and other endemic highland primates"
industries:
  - "Petroleum and natural gas (SW coast)"
  - "Cocoa, coffee, cotton and palm oil"
  - "Timber and rubber"
  - "Hydroelectric power (incl. the Sanaga basin)"
  - "Manufacturing and the port of Douala"
sports:
  - "Football (association football)"
  - "Athletics"
  - "Wrestling (traditional and modern)"
  - "Boxing"
religions:
  # CIA World Factbook, 2018 est. (corrected to match what cwf-religion
  # actually carries).
  - name: Roman Catholic
    percent: 38.3
    sourceId: cwf-religion
  - name: Protestant (incl. Pentecostal and Presbyterian)
    percent: 25.5
    sourceId: cwf-religion
  - name: Other Christian (incl. Jehovah's Witnesses)
    percent: 6.9
    sourceId: cwf-religion
  - name: Muslim (Sunni/Maliki; incl. Ahmadiyya)
    percent: 24.4
    sourceId: cwf-religion
  - name: Traditional / indigenous beliefs (animist)
    percent: 2.2
    sourceId: cwf-religion
  - name: Other
    percent: 0.5
    sourceId: cwf-religion
  - name: None / unspecified
    percent: 2.2
    sourceId: cwf-religion
entertainment:
  - season: allYear
    items:
      - "Football — the national passion, from street kickabouts to league matches"
      - "Music and dance: makossa, bikutsi and contemporary Afropop"
  - season: dry
    items:
      - "Waza National Park safaris in the Far North"
      - "Mt Cameroon 'Race of Hope' (annual ascent race, February)"
  - season: wet
    items:
      - "Indoor community and church events"
      - "Regional harvest and festival gatherings"
traditionalDishes:
  - season: allYear
    items:
      - "Ndolé (bitterleaf stew with groundnuts, shrimp and meat)"
      - "Achu and yellow soup (Anglophone/West highland staple)"
      - "Plantains and beans"
      - "Brochettes (grilled meat skewers)"
  - season: dry
    items:
      - "Groundnut and palm-oil stews with maize"
traditionalClothing:
  - season: allYear
    items:
      - "Brightly coloured wrappers and wax-print cloth"
      - "Boubou/gandoura gowns in the North"
      - "Western-style suits in business settings"
  - season: dry
    items:
      - "Light cotton clothing for the hot dry season"
seasonCalendar:
  - season: dry
    months: [11, 12, 1, 2, 3]
  - season: wet
    months: [4, 5, 6, 7, 8, 9, 10]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "08:00-18:00 Mon-Fri; many close for lunch; in the North there is a pause for Friday midday prayers"
  lunchBreakTiming: "12:30-14:00 in most offices."
  notableShutdownPeriods:
    - period: "Public holidays"
      description: "National Day (20 May) and religious holidays (Christmas, Eid)."
  notes: "Mobile money (MTN MoMo, Orange Money) dominates even semi-urban payments; banking penetration is below 20%. The Anglophone crisis since 2016 and Boko Haram in the Far North disrupt commerce in those zones."
sources:
  - id: cwf-religion
    name: "CIA World Factbook — Cameroon (People: religion, 2022 est.)"
    publisher: "CIA World Factbook (archived via Theodora.com)"
    url: "https://theodora.com/world_fact_book_2024/cameroon/cameroon_people.html"
    year: 2022
    accessedDate: "2026-09-19"
    note: "Roman Catholic 33.1%, Protestant 27.1%, other Christian 6.1%, Muslim 30.6%, traditional 1.3%, none 1.2%."
  - id: no-unesco-note
    name: "UNESCO World Heritage Centre — Cameroon sites"
    publisher: "UNESCO World Heritage Centre"
    url: "https://whc.unesco.org/en/statesparties/cm"
    year: 2026
    accessedDate: "2026-09-19"
    note: "Confirms the Dja Faunal Reserve (inscribed 1987) as a UNESCO World Heritage Site in Cameroon."
