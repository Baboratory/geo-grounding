code: CM-FORE
name:
  eng: Coastal & Southern Rainforest Belt
  local:
    - languageCode: fra
      value: Littoral, Sud et Est
climates:
  - koppenCode: Af
    description: "Tropical rainforest climate with year-round high humidity (Douala estuary, East region dense forest)."
  - koppenCode: Am
    description: "Tropical monsoon near the Gulf of Guinea coast."
landmarks:
  - name: Douala and the Wouri estuary
    description: "Cameroon's economic capital and main port, on the Wouri; the Douala port is central to Central African trade."
  - name: Dja Faunal Reserve
    description: "UNESCO World Heritage Site — one of Africa's largest protected rainforest reserves, rich in gorillas and elephants."
  - name: Campo-Ma'an National Park
    description: "Coastal rainforest park home to western lowland gorillas and forest elephants."
culturalTraits:
  - "Bantu coastal and forest peoples (Duala, Basaa, Beti-Pahuin/Fang, Maka)"
  - "Coastal palm-oil and fishing economy centred on Douala"
  - "BaAka ('pygmy') forest traditions in the southern forests"
  - "Port-city urbanity and the birthplace of makossa music"
prideOf:
  - "Douala as the economic heart and main gateway of Cameroon and Central Africa"
  - "The gorilla and forest-elephant country of the Dja and Campo-Ma'an"
animals:
  popular:
    - "Western lowland gorilla"
    - "Forest elephant"
    - "Chimpanzee"
  unique:
    - "Bongo antelope and mandrill of the forest belt"
    - "Dja's rich endemic and sacred forest fauna"
industries:
  - "Petroleum and gas (incl. the Kribi port and hydroelectric projects)"
  - "Cocoa, palm oil and rubber"
  - "Timber"
  - "Fishing (coastal and riverine)"
  - "Port logistics and manufacturing (Douala)"
sports:
  - "Football"
  - "Canoe/river regattas (Douala)"
