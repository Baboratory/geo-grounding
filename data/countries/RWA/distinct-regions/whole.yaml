entertainment:
  - season: allYear
    items:
      - "Football and volleyball on TV; the energetic Kigali nightlife and live music scene"
      - "Traditional Intore dance and drumming performances"
      - "Basketball at BK Arena"
  - season: dry
    items:
      - "Best gorilla trekking and volcano hiking in the Virungas (Jun-Aug)"
      - "Lake Kivu beach and water activities"
      - "Festivals and outdoor cultural events"
  - season: wet
    items:
      - "Hiking the green hills (muddy trails caution) and mountain scenery"
      - "Indoor/city culture and coffee tastings"
traditionalDishes:
  - season: allYear
    items:
      - "Ugali / isombe — cassava or maize dough; cassava-leaf peanut stew"
      - "Ibijumba (sweet potato) and ibishyimbo (red-bean stew)"
      - "Grilled goat brochettes at weekend gatherings"
      - "Fresh Rwandan coffee and tea"
  - season: dry
    items:
      - "Amandazi (fried dough) with brochettes at markets and celebrations"
  - season: wet
    items:
      - "Hearty bean and pumpkin stews (ibihaza, ubunyobwa) during the rainy months"
traditionalClothing:
  - season: allYear
    items:
      - "Colourful kitenge/wax-print cloth worn by women; men in smart-casual and Western dress"
      - "Umushanana ceremonial cloth for weddings and formal occasions"
  - season: dry
    items:
      - "Light cotton wear suited to the warmer dry-season days"
seasonCalendar:
  - season: dry
    months: [6, 7, 8]
  - season: wet
    months: [1, 2, 3, 4, 5, 9, 10, 11, 12]
businessRhythm:
  restDays:
    - saturday
    - sunday
  typicalWorkHours: "Government and offices roughly 08:00-17:00 Mon-Fri."
  lunchBreakTiming: "A standard midday break around 12:00-14:00; lunch is the main meal."
  notableShutdownPeriods:
    - period: "Christmas and New Year"
      description: "Reduced business over the Christmas/New Year week."
    - period: "National holidays"
      description: "Liberation Day (4 Jul), Independence Day (1 Jul), and the Genocide memorial day (7 Apr) are public holidays with reduced business."
  notes: "Umuganda communal service takes place the last Saturday morning. A punctual, orderly business culture; Kigali is heavily cashless."
