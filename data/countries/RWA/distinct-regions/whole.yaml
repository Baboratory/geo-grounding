# Generic country-wide fallback content for Rwanda (unitary-small, single
# synthetic whole region). Used via the 'whole-country-fallback' path.
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry (savanna) in the lower-lying eastern border regions — hot with a pronounced dry season."
  - koppenCode: Cwb
    description: "Temperate/subtropical highland climate on the central plateau — the 'land of a thousand hills' has mild, rainy and year-round moderate temperatures; the dominant climate across most of the country."
  - koppenCode: Cfb
    description: "Maritime/equatorial highland climate on the highest volcanic massifs (Virunga, Volcanoes NP) — cool and very wet."
landmarks:
  - name: Volcanoes National Park
    description: "Home of the endangered mountain gorillas on the Virunga massif; the leading gorilla-trekking destination."
    unescoWorldHeritage: false
  - name: Nyungwe National Park
    description: "Large montane rainforest with chimpanzees and a canopy walkway; inscribed a UNESCO World Heritage Site in 2023."
    unescoWorldHeritage: true
  - name: Akagera National Park
    description: "Savanna park in the east with the 'Big Five' (lion, elephant, buffalo, leopard, rhinoceros) restored."
  - name: Kigali Genocide Memorial
    description: "The Gisozi memorial commemorating the 1994 genocide against the Tutsi; a place of remembrance and education."
  - name: Lake Kivu
    description: "One of Africa's great lakes on the western border; a scenic highland lake with beach resorts."
culturalTraits:
  - "Umuganda — the communal national service on the last Saturday of each month"
  - "Deep post-genocide commitment to reconciliation and national unity"
  - "Kinyarwanda spoken by virtually all Rwandans as a unifying mother tongue"
  - "Traditional Intore dance and the powerful royal drumming tradition"
  - "Coffee and tea culture — flagship highland export crops"
  - "Warm hospitality and an ethos of social order and cleanliness"
  - "'Land of a thousand hills' identity and mountainous scenery"
prideOf:
  - "Mountain gorillas of the Virunga massif"
  - "The post-genocide reconciliation story and 'Rwanda model' of order (Kigali as 'Africa's cleanest city')"
  - "Umuganda community service and national unity"
  - "High-quality coffee and tea"
  - "The scenic 'land of a thousand hills'"
animals:
  popular:
    - "Mountain gorilla (Gorilla beringei beringei)"
    - "Golden monkey"
    - "Chimpanzee"
    - "Savanna 'Big Five' in Akagera (lion, elephant, buffalo, leopard, rhino)"
    - "Colobus monkey"
  unique:
    - "Endemic Albertine Rift montane birds"
    - "Mountain gorillas and golden monkeys of the Virunga volcanoes"
industries:
  - "Agriculture — coffee and tea (flagship exports) plus food crops (beans, plantains)"
  - "Mining and quarrying — tin, coltan/tantalum, gold"
  - "Tourism — gorilla and wildlife trekking"
  - "Services and ICT (one of Africa's fastest-growing tech hubs)"
  - "Construction, manufacturing and energy"
sports:
  - "Football (soccer) — the most popular sport (Rayon Sports, APR)"
  - "Basketball — very popular (APR, the BAL at BK Arena)"
  - "Cycling — the UCI-sanctioned Tour du Rwanda"
  - "Volleyball and athletics"
