code: NP-P3
name:
  eng: Bagmati
  local:
    - languageCode: npi
      value: वाग्मती
climates:
  - koppenCode: Cwb
    description: "Subtropical highland / monsoon-influenced climate of the Kathmandu Valley and central hills: mild winters, warm summers, heavy monsoon rain Jun-Sep."
  - koppenCode: Aw
    description: "Tropical savanna in the southern Terai districts (Chitwan, Makwanpur lowlands) bordering the national park."
landmarks:
  - name: Kathmandu Valley
    description: "Seven monument zones of Hindu and Buddhist heritage — Durbar Squares, Pashupatinath, Boudhanath, Swayambhunath, Changu Narayan."
    unescoWorldHeritage: true
  - name: Chitwan National Park
    description: "Subtropical inner-Terai national park home to one-horned rhinoceros and Bengal tiger."
    unescoWorldHeritage: true
  - name: Namobuddha
    description: "A Himalayan Buddhist pilgrimage site east of the valley."
  - name: Mount Gaurishankar
    description: "A sacred peak visible north of the valley."
culturalTraits:
  - "The seat of government, the capital and the Newar 'living heritage' of the Kathmandu Valley"
  - "Deep Hindu-Buddhist coexistence personified in valley sites like Swayambhunath and Pashupatinath"
  - "Cosmopolitan, educated and fast-growing — Nepal's political, financial and cultural centre"
prideOf:
  - "The World-Heritage Kathmandu Valley and its living Newar culture"
  - "Being the capital and engine of Nepal"
  - "Chitwan National Park and its rhinos"
animals:
  popular:
    - "The greater one-horned rhinoceros (Chitwan)"
    - "Bengal tiger (Chitwan)"
    - "The red panda in high forest; clouded leopard"
  unique:
    - "The greater one-horned rhinoceros and the Bengal tiger of Chitwan National Park"
industries:
  - Government, finance, banking and headquarters of most companies and NGOs
  - Tourism (Kathmandu, Chitwan safari)
  - IT services, media and education
  - Construction and real estate
sports:
  - Cricket (national teams and the stadium)
  - Football
  - Basketball and volleyball in the valley
  - Mountaineering logistics (institutions based in Kathmandu)
religions:
  - name: Hinduism
    percent: 81.0
    sourceId: "npl-census-2011"
  - name: Buddhism
    percent: 18.0
    sourceId: "npl-census-2011"
entertainment:
  - season: dry
    items:
      - "Sightseeing in the Kathmandu valley's world-heritage sites"
      - "Chitwan jungle safaris and elephant/wildlife tours"
  - season: wet
    items:
      - "The monsoon brings rain; indoor culture, theatres and cafes thrive"
  - season: allYear
    items:
      - "Thamel nightlife, live music and cafes"
      - "Museums, monasteries and temple festivals year-round"
traditionalDishes:
  - season: allYear
    items:
      - "Daal bhat tarkari and momo (the valley's signature street food)"
      - "Juju dhau ('king of yoghurt') from Bhaktapur"
      - "Newar festival cuisine (kwati, chhoyla, samay baji)"
  - season: dry
    items:
      - "Festival feasts at Dashain and Tihar"
  - season: wet
    items:
      - "Steamed momo and warm chiya with the rains"
traditionalClothing:
  - season: allYear
    items:
      - "Daura-suruwal, Dhaka-topi and waistcoat for men; gunyo cholo/saree for women on festival days"
      - "Western dress standard in the capital"
  - season: dry
    items:
      - "Light layers for the valley's pleasant dry season"
  - season: wet
    items:
      - "Umbrellas and waterproofs for the monsoon"
seasonCalendar:
  - season: dry
    months: [10, 11, 12, 1, 2, 3, 4, 5]
  - season: wet
    months: [6, 7, 8, 9]
businessRhythm:
  restDays:
    - saturday
  typicalWorkHours: "Government and corporate offices 10:00-17:00/18:00 (Sunday to Friday); shops and Thamel businesses often until 19:00-21:00."
  lunchBreakTiming: "An extended lunch break around 13:00-14:00 is common in offices."
  notableShutdownPeriods:
    - period: "Dashain (Sep-Oct)"
      description: "The capital largely empties as people return to their home villages; offices and many shops close for ~a week."
    - period: "Tihar (Oct-Nov)"
      description: "Festival of lights; offices close or work reduced hours."
  notes: "Saturday is the main rest day. Being the capital, Bagmati hosts parliament, ministries and headquarters; peak business activity follows the national working week, with major slowdowns at Dashain and Tihar."
sources:
  - id: npl-census-2011
    name: "National Population and Housing Census 2011 (province-level religion)"
    publisher: "Central Bureau of Statistics, Government of Nepal"
    url: "https://censusnepal.cbs.gov.np"
    year: 2011
    note: "Province-level religion estimates for Bagmati (indicative)."
  - id: npl-unesco
    name: "UNESCO World Heritage List — Nepal"
    publisher: "UNESCO"
    url: "https://whc.unesco.org/en/statesparties/np"
    note: "Kathmandu Valley (1979) and Chitwan National Park (1984)."
