code: NP-P5
name:
  eng: Lumbini
  local:
    - languageCode: npi
      value: लुम्बिनी
climates:
  - koppenCode: Aw
    description: "Tropical savanna across the southern Terai plain — hot year-round with a strong summer monsoon (Jun-Sep)."
  - koppenCode: Cwb
    description: "Subtropical highland in the northern hill districts bordering the Himalaya."
landmarks:
  - name: Lumbini, the Birthplace of the Buddha
    description: "The sacred garden where Siddhartha Gautama was born — Maya Devi Temple, the Ashoka pillar and the world's oldest-recorded Buddhist pilgrimage site."
    unescoWorldHeritage: true
  - name: Bardia National Park
    description: "Nepal's largest national park in the Terai lowlands, in far western Lumbini — tigers, rhinos, and the Karnali river system."
  - name: Kapilvastu
    description: "The archaeological remains of the Buddha's childhood home."
culturalTraits:
  - "The Buddhist holy land — the single most important pilgrimage site for world Buddhism"
  - "Diverse Terai (Madhesi), Tharu and hill cultures meeting in the western plains"
  - "Rich Tharu village culture across the southern belt"
prideOf:
  - "Hosting the birthplace of the Buddha"
  - "Bardia National Park and its wild tigers"
  - "The Tharu indigenous heritage"
animals:
  popular:
    - "Bengal tiger (Bardia)"
    - "Greater one-horned rhinoceros"
    - "Gharial and Gangetic dolphin in the Karnali river"
  unique:
    - "The Bengal tiger and one-horned rhinoceros of Bardia; the Gangetic river dolphin"
industries:
  - Tourism and Buddhist pilgrimage
  - Agriculture (rice, sugarcane and the Terai's fertile farmland)
  - Hydropower and irrigation along the Karnali
sports:
  - Football
  - Volleyball (very popular in the Terai)
  - Cricket
  - Kabaddi
religions:
  - name: Hinduism
    percent: 88.0
    sourceId: "npl-census-2011"
  - name: Buddhism
    percent: 10.0
    sourceId: "npl-census-2011"
entertainment:
  - season: dry
    items:
      - "Pilgrimage to Lumbini and Kapilvastu (Oct-May)"
      - "Safari in Bardia National Park"
  - season: wet
    items:
      - "Monsoon; farming season and village life"
  - season: allYear
    items:
      - "Buddhist sites, Tharu cultural performances and Terai village festivals"
traditionalDishes:
  - season: allYear
    items:
      - "Daal bhat and the rice dishes of the Terai"
      - "Tharu cuisine including dhikri (steamed rice dumplings) and fish curries"
  - season: dry
    items:
      - "Fresh river fish and grilled festal meats"
  - season: wet
    items:
      - "Warm chiya and monsoon snacks"
traditionalClothing:
  - season: allYear
    items:
      - "Dhoti/kurta for Terai men; saree and ghagra for women"
      - "Tharu women's colourful woven blouses and skirts"
  - season: dry
    items:
      - "Light cotton clothing for the hot Terai"
  - season: wet
    items:
      - "Rain protection for the monsoon"
seasonCalendar:
  - season: dry
    months: [10, 11, 12, 1, 2, 3, 4, 5]
  - season: wet
    months: [6, 7, 8, 9]
businessRhythm:
  restDays:
    - saturday
  typicalWorkHours: "Shops and markets 8:00-19:00 (Sunday to Friday); offices 10:00-17:00."
  notes: "Saturday is the main rest day. Pilgrimage tourism peaks in the dry season; Dashain, Tihar and Buddha Jayanti bring significant festival closures."
sources:
  - id: npl-census-2011
    name: "National Population and Housing Census 2011 (province-level religion)"
    publisher: "Central Bureau of Statistics, Government of Nepal"
    url: "https://censusnepal.cbs.gov.np"
    year: 2011
    note: "Province-level religion estimates for Lumbini (indicative)."
  - id: npl-unesco
    name: "UNESCO World Heritage List — Nepal"
    publisher: "UNESCO"
    url: "https://whc.unesco.org/en/statesparties/np"
    note: "Lumbini, the Birthplace of the Buddha, inscribed 1997."
