code: NP-P6
name:
  eng: Karnali
  local:
    - languageCode: npi
      value: कर्णाली
climates:
  - koppenCode: Cwb
    description: "Subtropical highland in the mid-hill districts — mild summers, cold winters, monsoon rain Jun-Sep."
  - koppenCode: ET/EF
    description: "Alpine and ice climate on the high western Himalaya (Himali district, near the Tibetan border)."
landmarks:
  - name: Rara Lake
    description: "Nepal's largest lake, set in a high-mountain basin at ~2,990 m."
  - name: The Karnali river gorge
    description: "One of the world's deepest river gorges, carved by the Karnali through the Himalaya."
  - name: Jumla and the Sinja valley
    description: "The cradle of early Khas/Gorkhali culture and the historic Sino-Jan (Malla) kingdom."
culturalTraits:
  - "The most remote, least populated and most traditional province of Nepal"
  - "Cradle of the Khas Karnali culture from which the Nepali language spread"
  - "Tight-knit agrarian hill communities with strong Hindu and indigenous customs"
prideOf:
  - "Rara Lake's pristine beauty"
  - "Being the ancestral heartland of the Nepali (Khas) language"
  - "A remote, unspoilt Himalayan way of life"
animals:
  popular:
    - "Snow leopard in the high hills"
    - "Musk deer and Himalayan monal"
    - "Himalayan black bear"
  unique:
    - "The snow leopard and the Himalayan musk deer of the Karnali highlands"
industries:
  - Agriculture and livestock (the economic base)
  - Remittances from migration
  - Emerging ecotourism around Rara
sports:
  - Volleyball (dominant in the hills)
  - Dandi Biyo
  - Football
  - Mountain trekking
religions:
  - name: Hinduism
    percent: 94.0
    sourceId: "npl-census-2011"
  - name: Buddhism
    percent: 5.0
    sourceId: "npl-census-2011"
entertainment:
  - season: dry
    items:
      - "Trekking to Rara and the Karnali highlands"
      - "Festival pilgrimages to local temples"
  - season: wet
    items:
      - "Monsoon farming; travel is hard on rural tracks"
  - season: allYear
    items:
      - "Village festivals, folk song (Deuda) and close-knit community life"
traditionalDishes:
  - season: allYear
    items:
      - "Daal bhat and millet (kodo) porridge and bread of the hills"
      - "Gundruk and sinki (fermented greens/radish)"
      - "Raksi (millet liquor)"
  - season: dry
    items:
      - "Festival feasts of rice and mutton"
  - season: wet
    items:
      - "Warm dishes with the rains"
traditionalClothing:
  - season: allYear
    items:
      - "Daura-suruwal and Dhaka-topi for men; gunyo cholo for women at festivals"
      - "Warm wool and pashmina wraps in the high hills"
  - season: dry
    items:
      - "Heavy wool and down for the cold highland winter"
  - season: wet
    items:
      - "Rain gear for the monsoon"
seasonCalendar:
  - season: dry
    months: [10, 11, 12, 1, 2, 3, 4, 5]
  - season: wet
    months: [6, 7, 8, 9]
businessRhythm:
  restDays:
    - saturday
  typicalWorkHours: "Government and offices 10:00-17:00 (Sunday to Friday); local markets follow rural weekly haat (market) days."
  notes: "Saturday is the main rest day. Karnali is Nepal's least commercialised province; rural weekly markets and the festival calendar (Dashain, Tihar) largely set the rhythm. Monsoon (Jun-Sep) makes many rural roads impassable."
sources:
  - id: npl-census-2011
    name: "National Population and Housing Census 2011 (province-level religion)"
    publisher: "Central Bureau of Statistics, Government of Nepal"
    url: "https://censusnepal.cbs.gov.np"
    year: 2011
    note: "Province-level religion estimates for Karnali (indicative)."
