legalConstraints:
  - topic: "VAT rate and price display"
    description: "The standard Value Added Tax rate is 13% (Value Added Tax Act 2052/1996). Consumer prices are normally displayed in Nepalese rupees; VAT is applied on top at the standard 13% rate for most goods and services."
    sourceId: "npl-vat"
  - topic: "consumer protection"
    description: "The Consumer Protection Act 2075 (2018) establishes consumer rights (safety, information, choice, fair price, redress) and enforcement by the Department of Consumer Protection and Trade Management within the Ministry of Industry, Commerce and Supplies; misleading advertising and unfair trade practices are penalized."
    sourceId: "npl-consumer-act"
  - topic: "data protection / privacy"
    description: "The Right to Privacy Act 2075 (2018) protects personal information — collecting personal data requires the individual's consent, collected data may be used only for the disclosed purpose, and unauthorized disclosure is an offence. Nepal has NO GDPR-style omnibus data-protection law or dedicated data-protection authority; a draft Information Technology and Cyber Security Bill (2024) adding privacy provisions is yet to be enacted."
    sourceId: "npl-privacy-act"
  - topic: "official language"
    description: "Nepali in the Devanagari script is the official language of Nepal (Constitution of Nepal 2015, Article 7(1)); under Article 7(2) a province may, by provincial law, additionally adopt one or more languages of the nation spoken by a majority as additional official languages."
    sourceId: "npl-constitution-art7"
paymentCulture:
  popularMethods:
    - "Cash — still dominant for everyday retail and the bazaar/market economy"
    - "eSewa and Khalti — the two leading licensed mobile wallets (with IME Pay, PrabhuPay, Fonepay and others)"
    - "QR-code payments under the national NEPALPAY QR scheme (Nepal Rastra Bank's NepalQR standard, operated by Nepal Clearing House Ltd.), increasingly used even by small street merchants"
    - "Mobile banking and internet banking (connect IPS, instant bank fund transfer/IBFT) for larger sums and bills"
    - "ATM cash withdrawal remains very common; many rural and small merchants remain cash-only"
  tipping:
    expected: false
    typicalAmount: "Tipping is modest and not expected; rounding up or leaving ~10% for good service in tourist-oriented restaurants is appreciated; guides and porters on treks commonly receive a tip."
    autoIncludedInBill: false
    note: "Service charge is sometimes added in upscale tourist restaurants; otherwise tips are discretionary. In rural and local settings tipping is rare."
communicationStyle:
  contextLevel: mixed
  formalityNorms: "Uses respectful honorifics in Nepali: 'tapāī' (respectful 'you'), and titles like Dai (elder brother) / Didi (elder sister) as terms of respect even for non-relatives; Mr./Mrs. (Shree/Shreemati) and professional titles (Prof./Dr.) are used formally. Elders are addressed with clear respect."
  greetingNorms: "The traditional greeting is 'namaste' (नमस्ते) with palms pressed together and a slight bow — still common and well received. Among the urban and younger population a handshake has become standard, sometimes with the free hand at the chest. 'Namaste' remains the safe, polite default."
  meetingEtiquette: "Punctuality is appreciated but a degree of flexibility is common and normal; meetings often open with tea (chiya) and polite small talk before business. Relationships and personal trust matter greatly, and decisions often depend on seniority and consensus rather than being made on the spot. Business cards are exchanged; use the right hand for giving/receiving."
  topicsToAvoid:
    - "Caste and ethnic hierarchies — a legally abolished but still sensitive subject; avoid making assumptions or jokes about caste"
    - "The 1996-2006 civil war (Maoist insurgency) and related political divisions, unless raised warmly by the other side"
    - "Religion and politics: sectarian or party-political comments can be divisive"
    - "Disparaging remarks about the Himalayas, Mount Everest, or national pride"
  giftGivingNotes: "A small, modest gift is appreciated when invited to a home — fruit, sweets, or a souvenir from your country. Avoid leather goods when the recipient is a practicing Hindu; when buying flowers prefer marigold (sacred) and avoid lilies (used for death). Use both hands or the right hand when offering."
