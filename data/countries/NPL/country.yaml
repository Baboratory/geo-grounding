sources:
  - id: npl-constitution-art7
    name: "Constitution of Nepal 2015, Articles 6-7 (Languages of the Nation / Official Language)"
    publisher: "Law Commission of Nepal"
    url: "http://www.lawcommission.gov.np"
    year: 2015
    note: "Article 7(1) Nepali in Devanagari script is the official language; Article 7(2) provinces may add official languages. Basis for npi official status."
  - id: npl-census-2011
    name: "National Population and Housing Census 2011 (caste/ethnicity, mother tongue, religion tables)"
    publisher: "Central Bureau of Statistics, Government of Nepal"
    url: "https://censusnepal.cbs.gov.np"
    year: 2011
    note: "Mother-tongue shares (Nepali 44.6%, Maithili 11.7%, Bhojpuri 5.98%, Tharu 5.77%), ethnic shares (Chhetri 16.6%, Bahun-Hill 12.2%, Magar 7.1%, Tharu 6.6%, Tamang 5.8%, Newar 5.0%, Kami 4.8%, Muslim 4.4%, Yadav 4.0%, Rai 2.3%) and religion (Hindu 81.3%, Buddhist 9.0%, Muslim 4.4%, Kirat 3.1%, Christian 1.4%)."
  - id: npl-vat
    name: "Value Added Tax Act 2052 (1996)"
    publisher: "Inland Revenue Department / Law Commission of Nepal"
    url: "https://ird.gov.np"
    year: 1996
    note: "13% standard VAT rate; registration threshold NPR 5 million (goods) / 2 million (services)."
  - id: npl-consumer-act
    name: "Consumer Protection Act 2075 (2018)"
    publisher: "Law Commission of Nepal"
    url: "http://www.lawcommission.gov.np"
    year: 2018
    note: "Consumer rights and trade-practice enforcement."
  - id: npl-privacy-act
    name: "Right to Privacy Act 2075 (2018); no GDPR-equivalent regime"
    publisher: "Law Commission of Nepal / DLA Piper Data Protection Laws of the World"
    url: "http://www.lawcommission.gov.np"
    year: 2018
    note: "Consent-based personal-information rules; no dedicated data-protection authority; draft IT & Cyber Security Bill 2024 pending."
  - id: npl-nrb-payments
    name: "Payment Systems Oversight Report; List of Licensed PSOs/PSPs"
    publisher: "Nepal Rastra Bank (central bank)"
    url: "https://www.nrb.org.np"
    year: 2024
    note: "Licensed wallets (eSewa, Khalti, IME Pay, PrabhuPay, Fonepay), NEPALPAY QR national scheme, connect IPS."
  - id: npl-unesco
    name: "UNESCO World Heritage List — Nepal"
    publisher: "UNESCO"
    url: "https://whc.unesco.org/en/statesparties/np"
    note: "Sagarmatha NP (1979), Kathmandu Valley (1979), Chitwan NP (1984), Lumbini (1997)."
  - id: npl-iso639
    name: "ISO 639-3 Registration Authority code npi (Nepali)"
    publisher: "SIL International"
    url: "https://iso639-3.sil.org/code/npi"
    note: "Confirms npi = Nepali (individual language), member of the Nepali macrolanguage."
  - id: npl-iso3166
    name: "ISO 3166-2:NP — province codes (NP-P1..NP-P7)"
    publisher: "International Organization for Standardization (ISO)"
    url: "https://www.iso.org/obp/ui/#iso:code:3166:NP"
    note: "Koshi NP-P1, Madhesh NP-P2, Bagmati NP-P3, Gandaki NP-P4, Lumbini NP-P5, Karnali NP-P6, Sudurpashchim NP-P7."
  - id: npl-eng-est
    name: "English as a foreign language in Nepal — estimated"
    publisher: "Composite estimate"
    url: "https://censusnepal.cbs.gov.np"
    note: "FLAGGED ESTIMATE: English is the leading foreign language in business, education and tourism; no official proficiency percentage exists — disclosed as an estimate."
