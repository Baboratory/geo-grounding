    description: "Humid continental (warm-summer) — relatively mild coastal winters for North Korea and warm summers, near the Chinese and Russian borders."
landmarks:
  - name: Rajin-Sonbong Special Economic Zone
    description: "The DPRK's first and most prominent special economic zone (SEZ), a free-trade and trans-shipment hub at the tri-border area with China and Russia."
  - name: Rason port complex
    description: "Deep-water ice-free ports (Rajin and Sonbong) promoted for international transshipment and trade."
