code: ID-PA
name:
  eng: Papua
  local:
    - languageCode: ind
      value: Papua
climates:
  - koppenCode: Af
    description: "Tropical rainforest climate along the north coast and islands (Jayapura, Biak, Yapen) — hot, humid and wet year-round. The Cyclops Mountains behind Jayapura are cooler at altitude."
landmarks:
  - name: Lake Sentani
    description: "A large freshwater lake south of Jayapura, ringed by traditional stilt villages and the source of papeda, the region's signature dish."
  - name: Teluk Youtefa (Youtefa Bay)
    description: "A scenic bay and mangrove park in Jayapura city, crossed by the Youtefa (Holtekamp) Bridge toward the Skouw border with Papua New Guinea."
  - name: Goa Jepang (Japanese Cave), Biak
    description: "A WWII-era limestone cave system on Biak Island that sheltered Japanese forces during the 1944 Battle of Biak."
  - name: Biak and Yapen Islands
    description: "Coral-fringed islands in Cenderawasih Bay off the north coast, known for beaches, birdwatching and diving."
culturalTraits:
  - "Home to the Sentani, Biak and Yapen peoples, among many other Papuan ethnic and language communities"
  - "A land of strong indigenous identity, distinct from the rest of the country (Melanesian heritage)"
  - "Special autonomy region since 2001, reorganized in 2022 into a smaller Papua province alongside four new sister provinces (Highland, Central, South and Southwest Papua) carved from the former, larger Papua province"
prideOf:
  - "Lake Sentani's stilt-village lake culture and its annual Sentani Lake Festival"
  - "Biak's WWII history and Cenderawasih Bay's reefs and birdlife"
  - "Being the historic heart of Indonesia's Papua region, home to the provincial capital Jayapura"
animals:
  popular:
    - "Bird-of-paradise"
    - "Cassowary"
    - "Green tree python"
  unique:
    - "Birds-of-paradise and the endemic rattus and marsupial fauna of the Papuan rainforest"
    - "Coral reefs and migratory wildlife off Biak and Yapen in Cenderawasih Bay"
industries:
  - "Fisheries and marine resources (Cenderawasih Bay)"
  - "Forestry and agriculture (sago, oil palm)"
  - "Government and services — Jayapura is the provincial capital"
  - "Tourism — diving around Biak/Yapen and WWII heritage travel"
sports:
  - "Football"
  - "Sepak takraw"
  - "Traditional canoe racing (Lake Sentani)"
entertainment:
  - season: allYear
    items:
      - "Lake Sentani boat trips and the annual Sentani Lake Festival"
      - "Biak diving and WWII history tours (Goa Jepang)"
      - "Jayapura's Teluk Youtefa waterfront"
traditionalDishes:
  - season: allYear
    items:
      - "Papeda — sago porridge, the signature dish associated with the Sentani lake area"
      - "Babi bakar (grilled pork, especially in Christian-majority areas)"
      - "Baked sago, taro and sweet potato (ubijalar)"
      - "Ikan bakar (grilled lake and reef fish)"
traditionalClothing:
  - season: allYear
    items:
      - "Traditional bark cloth and woven fibre adornment for ceremonial wear"
      - "Modern, modest everyday clothing; festival bead-and-feather adornment"
seasonCalendar:
  - season: dry
    months: [6, 7, 8, 9, 10, 11]
  - season: wet
    months: [12, 1, 2, 3, 4, 5]
businessRhythm:
  restDays:
    - sunday
    - saturday
  typicalWorkHours: "Generally 08:00-16:00/17:00 weekdays; government offices may close earlier (15:00) on Fridays."
  lunchBreakTiming: "Lunch around 12:00-13:00."
  notableShutdownPeriods:
    - period: "Christmas and New Year (Christian-majority region)"
      description: "Major holiday period sees many closures."
    - period: "Regional and national public holidays"
      description: "Public holidays close government and many businesses."
