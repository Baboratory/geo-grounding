legalConstraints:
  - topic: "official language"
    description: "Article 36 of the 1945 Constitution declares Bahasa Indonesia (Indonesian) the official/national language. Article 32 requires the state to respect and maintain regional languages (bahasa daerah) as part of the national cultural heritage."
    sourceId: constitution-1945
  - topic: "data protection"
    description: "Law No. 27 of 2022 on Personal Data Protection (UU PDP) — a GDPR-aligned framework — was enacted 17 October 2022 with a two-year transition, fully enforceable from October 2024. It regulates consent, data-subject rights, breach notification and cross-border transfer, supervised by a dedicated data-protection authority."
    sourceId: pdp-law-2022
  - topic: "value added tax (VAT) price display"
    description: "Value Added Tax (PPN) has a statutory headline rate of 12% from 1 January 2025, but for most goods it is computed as 12% of an 11/12 base, giving an effective standard rate of 11%; a genuine 12% applies to certain luxury goods. Prices in shops are generally displayed VAT-inclusive."
    sourceId: ppn-2025
  - topic: "consumer protection"
    description: "Consumer protection rests on Law No. 8 of 1999 (UUPK), establishing consumer rights to safety, accurate information and compensation for defective goods/services, plus sectoral regulators such as Bank Indonesia and OJK for financial consumers."
    sourceId: uupk-1999
paymentCulture:
  popularMethods:
    - "QRIS (national QR payment standard) accepted at almost every merchant, from street stalls to malls"
    - "E-wallets — GoPay, OVO, DANA, ShopeePay and LinkAja dominate urban cashless payments"
    - "Cash — still widely used, especially outside Java and for small informal purchases"
    - "Bank cards (Visa/Mastercard/JCB) in larger retailers, hotels and online"
    - "Bank transfers (including virtual-account transfers) for formal commerce and salary"
  tipping:
    expected: false
    typicalAmount: "Not expected; service charge is usually already added (5-10%) at restaurants. A small tip for guides, drivers and hotel staff is appreciated."
    autoIncludedInBill: true
    note: "Qualitative and customary. QRIS and e-wallets mean even tiny payments are typically cashless in cities."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Warm, polite and indirect. Titles matter — use Pak (Mr) / Bu (Mrs) plus the given name. Vanity is avoided and harmony (rukun) is valued."
  greetingNorms: "A smile and a light handshake or a nod with palms together; 'how are you' (apa kabar) is a standard opener. Let the older/more senior person be greeted and offered a seat first."
  meetingEtiquette: "Meetings begin with small talk and refreshments; decisions are consultative and may take time. Avoid confrontation; deliver criticism tactfully and via relationship."
  topicsToAvoid:
    - "Religion and ethnicity, especially direct comments on Papua and Aceh"
    - "Politics, the 1965 events and sensitive historical issues"
    - "Directly criticising a host or senior person"
  giftGivingNotes: "Not required in business. When visiting a home, a modest gift or sweets is warmly received; use the right hand when giving/ receiving."
