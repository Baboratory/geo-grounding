alpha3: IDN
alpha2: ID
name:
  eng: Indonesia
  local:
    - languageCode: ind
      value: Indonesia
flagEmoji: "🇮🇩"
capital: Jakarta
isSovereign: true
# Classified unitary-large: Indonesia's population (~270-281M) is far above the
# small-state threshold; its 1945 Constitution art. 32 explicitly recognises and
# protects the country's many regional languages (javanese, Sundanese, Balinese,
# etc.) as part of the national cultural heritage; and it has genuinely,
# widely-recognised cultural-historical regional identities (Java, Bali, Aceh,
# Papua, the Batak and Bugis homelands, etc.). It is a unitary republic (38
# provinces under the 1945 Constitution, with special autonomy for Aceh, Papua
# and Yogyakarta, but no residual sovereignty held by any unit) so NOT federal.
# Curated regions follow real ISO 3166-2 provinces: Jakarta (ID-JK, the capital),
# Yogyakarta (ID-YO, Javanese culture), Bali (ID-BA), Papua (ID-PA, Papuan
# languages), North Sumatra (ID-SU, Batak) + WHOLE as national fallback.
governanceType: unitary-large
iso3166_2_prefix: ID
hasSubdivisions: true
languageUsage:
  # Indonesian (Bahasa Indonesia) is the sole official and national language
  # under Article 36 of the 1945 Constitution — official-domain flag = 1.0.
  - languageCode: ind
    domain: official
    speakersShare: 1.0
    sourceId: constitution-1945
  # Indonesian is spoken fluently by the overwhelming majority as a first or
  # second language (~94-97% across recent estimates).
  - languageCode: ind
    domain: locallySpoken
    speakersShare: 0.95
    sourceId: bps-2020longform
  # Major regional languages, share as home/first language (composite estimates
  # derived from the 2010 census ethnicity data — Indonesia's census records
  # ethnicity, and language-in-family usage is captured imperfectly).
  - languageCode: jav
    domain: locallySpoken
    speakersShare: 0.40
    sourceId: bps-2020longform
  - languageCode: sun
    domain: locallySpoken
    speakersShare: 0.15
    sourceId: bps-2020longform
  - languageCode: mad
    domain: locallySpoken
    speakersShare: 0.03
    sourceId: bps-2020longform
  - languageCode: min
    domain: locallySpoken
    speakersShare: 0.027
    sourceId: bps-2020longform
  - languageCode: bug
    domain: locallySpoken
    speakersShare: 0.027
    sourceId: bps-2020longform
  - languageCode: ban
    domain: locallySpoken
    speakersShare: 0.017
    sourceId: bps-2020longform
  - languageCode: bjn
    domain: locallySpoken
    speakersShare: 0.017
    sourceId: bps-2020longform
  - languageCode: ace
    domain: locallySpoken
    speakersShare: 0.014
    sourceId: bps-2020longform
  # English is widely studied as a foreign language in schools and business.
  - languageCode: eng
    domain: foreign
    speakersShare: 0.05
    sourceId: cia-id
