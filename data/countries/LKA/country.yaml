    note: "Source of ethnic-composition percentages (Sinhalese 74.9%, Sri Lankan Tamil 11.2%, Moor 9.3%, Indian Tamil 4.1%) and religion shares (Buddhist 70.2%, Hindu 12.6%, Muslim 9.7%, Christian 7.4%)."
