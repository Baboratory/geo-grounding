alpha3: ROU
alpha2: RO
name:
  eng: Romania
  local:
    - languageCode: ron
      value: România
flagEmoji: "🇷🇴"
capital: Bucharest
isSovereign: true
# Classified unitary-small: Romania is a unitary semi-presidential republic of
# 41 counties (județe) plus the capital. Although it has a recognised Hungarian
# minority concentrated in Transylvania and several historical regions
# (Moldavia, Wallachia, Transylvania, Dobruja), the state is unitary and no
# region carries co-official status of the kind that warrants curated
# sub-regions, so a single synthetic whole-country region is used.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: ron
    domain: official
    speakersShare: 1.0
    sourceId: ro-constitution-art-13
  - languageCode: ron
    domain: locallySpoken
    speakersShare: 0.916
    sourceId: ro-census-2021
  - languageCode: hun
    domain: locallySpoken
    speakersShare: 0.063
    sourceId: ro-census-2021
  - languageCode: rom
    domain: locallySpoken
    speakersShare: 0.012
    sourceId: ro-census-2021
  - languageCode: eng
    domain: foreign
    speakersShare: 0.55
    sourceId: ef-english-proficiency-2024
# Romanian is the sole official language (Constitution Art. 13). The 2021
# census recorded mother tongue as Romanian 91.6%, Hungarian 6.3% and Romani
# 1.2% among those who answered; Hungarian speakers are concentrated in
# eastern Transylvania. The English figure (~55%) is an estimate based on
# Romania's 'high proficiency' EF EPI ranking (12th globally in 2024); no
# official percentage exists.
ethnicGroups:
  - group: Romanians
    percent: 89.3
    sourceId: ro-census-2021
  - group: Hungarians
    percent: 6.0
    sourceId: ro-census-2021
  - group: Roma
    percent: 3.4
    sourceId: ro-census-2021
  - group: Ukrainians
    percent: 0.3
    sourceId: ro-census-2021
  - group: Germans
    percent: 0.1
    sourceId: ro-census-2021
  - group: Other
    percent: 0.9
    sourceId: ro-census-2021
timezones:
  - name: Europe/Bucharest
    standardUtcOffset: "UTC+2"
    observesDst: true
    dstUtcOffset: "UTC+3"
    dstPeriod: "Last Sunday of March to last Sunday of October (EU-wide schedule)."
currency:
  code: RON
  symbol: "lei"
  name: "Romanian leu"
legalConstraints:
  - topic: "VAT price display"
    description: "Consumer-facing prices must be shown VAT-inclusive (the final price to the consumer, not a pre-tax figure)."
    sourceId: eu-directive-98-6-ec
  - topic: "consumer withdrawal right"
    description: "Consumers buying at a distance (online, etc.) have a 14-day no-reason withdrawal/return right, EU-wide."
    sourceId: eu-directive-2011-83-eu
  - topic: "data protection (GDPR)"
    description: "Collecting or processing personal data (names, emails, browsing/behavioral data, etc.) requires a lawful basis such as consent, must be limited to a stated purpose, and grants individuals rights including access, correction, and erasure ('right to be forgotten') — the EU-wide GDPR, directly applicable in Romania."
    sourceId: eu-regulation-2016-679-gdpr
  - topic: "consumer guarantee"
    description: "Goods sold to consumers carry a minimum 2-year legal guarantee of conformity from delivery, during which a faulty item must be repaired, replaced, discounted, or refunded free of charge — independent of and in addition to any commercial/manufacturer warranty."
    sourceId: eu-directive-2019-771
paymentCulture:
  popularMethods:
    - "Cards (Visa and Mastercard) — bank cards are increasingly used at points of sale; contactless is now common"
    - "Cash (leu) — still widely used in smaller shops, markets and rural areas"
    - "Bank transfers (including instant transfer) for larger and recurring payments"
  tipping:
    expected: true
    autoIncludedInBill: false
    typicalAmount: "In restaurants a tip of about 10% is customary and appreciated, usually paid in cash or by rounding up. Leaving small change for taxi drivers is also common."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Romanians use the formal 'dumneavoastră/Dumnevoastră' address with strangers and older people, and switch to informal 'tu' when invited or after acquaintanceship develops. Titles such as 'Doctore' or 'Inginer' are respected in professional contexts."
  greetingNorms: "A firm handshake (often with eye contact and a smile) is standard in business. Among friends, two or three kisses on alternate cheeks are common, but a handshake is appropriate in professional settings."
  meetingEtiquette: "Punctuality is appreciated but a short grace period is common. Meetings often begin with light small talk and coffee before business. Communication can be warm and expressive once a personal relationship is built; decisions may take time and often sit with senior management."
  topicsToAvoid:
    - "Personal income, salary and wealth"
    - "Sensitive historical/political topics until you know the person well"
  giftGivingNotes: "Not required at a first business meeting. If invited to a Romanian home, bring flowers (an odd number) or a small gift such as chocolates or wine. Refusing hospitality or a drink can be taken as a slight."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
  - id: ro-constitution-art-13
    name: "Constituția României, Articolul 13 (official language)"
    publisher: "Președinția României (constitutional text)"
    url: "https://www.presidency.ro/en/the-constitution"
    accessedDate: "2026-09-20"
    note: "Article 13 provides that in Romania the official language is Romanian, and that other languages used by ethnic minorities are recognized and guaranteed."
  - id: ro-census-2021
    name: "Recensământul 2021 (Census 2021): ethnic, mother-tongue and religious composition"
    publisher: "Institutul Național de Statistică (National Institute of Statistics, INS)"
    url: "https://www.insse.ro/cns/cms/en"
    year: 2021
    accessedDate: "2026-09-20"
    note: "2021 census results among respondents: mother tongue Romanian 91.6%, Hungarian 6.3%, Romani 1.2%; ethnic composition Romanians 89.3%, Hungarians 6.0%, Roma 3.4%, Ukrainians 0.3%, Germans 0.1%, other 0.9% (~13% of the population did not respond to the ethnicity question; Roma are often undercounted and may form a higher true share)."
  - id: ef-english-proficiency-2024
    name: "EF English Proficiency Index 2024 (Romania score)"
    publisher: "EF Education First"
    url: "https://www.ef.com/wwen/epi/"
    year: 2024
    accessedDate: "2026-09-20"
    note: "Romania ranked 12th globally in 2024 with a 'high proficiency' score (~593). The ~55% share is an estimate based on this ranking; no official percentage exists."
  - id: eu-directive-98-6-ec
    name: "Directive 98/6/EC on consumer protection in the indication of the prices of products offered to consumers"
    publisher: "European Parliament and Council (EUR-Lex)"
    url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A31998L0006"
    year: 1998
    accessedDate: "2026-09-20"
    note: "The EU-wide requirement that consumer prices be shown VAT-inclusive; applies in Romania as an EU member state."
  - id: eu-directive-2011-83-eu
    name: "Directive 2011/83/EU on consumer rights"
    publisher: "European Parliament and Council (EUR-Lex)"
    url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32011L0083"
    year: 2011
    accessedDate: "2026-09-20"
    note: "The EU-wide 14-day distance-sale withdrawal right, applicable in Romania as an EU member state."
  - id: eu-regulation-2016-679-gdpr
    name: "Regulation (EU) 2016/679 (General Data Protection Regulation)"
    publisher: "European Parliament and Council (EUR-Lex)"
    url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
    year: 2016
    accessedDate: "2026-09-20"
    note: "The legal basis for the GDPR data-protection rules applying to personal-data collection/processing in Romania as an EU member state."
  - id: eu-directive-2019-771
    name: "Directive (EU) 2019/771 on certain aspects concerning contracts for the sale of goods"
    publisher: "European Parliament and Council (EUR-Lex)"
    url: "https://eur-lex.europa.eu/eli/dir/2019/771/oj/eng"
    year: 2019
    accessedDate: "2026-09-20"
    note: "The legal basis for the EU-wide minimum 2-year consumer guarantee on goods, in force since 1 January 2022."
