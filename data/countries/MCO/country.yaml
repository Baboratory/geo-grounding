# locallySpoken shares are ESTIMATES: Monaco collects no language census. French
# is the overwhelming everyday language; English reflects the international
# finance/hospitality community; Italian the large Italian-resident population;
# Monegasque (a Ligurian variety) is a national/cultural language spoken by a
# small minority of Monegasque nationals (patois, school-taught, few native
# speakers) — it is NOT the official language (French is, per Constitution
# Art. 8). Monegasque nationals are roughly a fifth of residents.
