# Classified unitary-small: Monaco is a city-state with a small population
# (~38,000) and no meaningful subdivisions — French is the sole official language
# (Constitution Art. 8). Monaco is a hereditary principality ruled by the House of
# Grimaldi and is not an EU member, though it uses the euro via a Monetary
# Agreement and applies French VAT.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
