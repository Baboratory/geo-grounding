alpha3: ZMB
alpha2: ZM
name:
  eng: Zambia
  local:
    - languageCode: eng
      value: Zambia
flagEmoji: "🇿🇲"
capital: Lusaka
isSovereign: true
# Classified unitary-large: Zambia's ~20M population (ZamStats 2022 census) exceeds
# the small-state threshold, and it has a genuine, widely-recognized regional
# ethnolinguistic mosaic: the seven main recognized home languages each anchor a
# distinct cultural group (Bemba in the North/Luapula/Copperbelt, Nyanja/Chewa in
# the East and Lusaka, Tonga in the South, Lozi in the West/Barotseland, Kaonde/
# Luvale/Lunda in the North-West). The state is constitutionally unitary (10
# provinces, 116 districts, no residual provincial sovereignty) so NOT federal.
# Curated regions: Copperbelt (ZM-08, Bemba-dominant mining belt), Western
# (ZM-01, Lozi/Barotseland), Lusaka (ZM-09, capital + Nyanja lingua franca) + WHOLE.
governanceType: unitary-large
iso3166_2_prefix: ZM
hasSubdivisions: true
languageUsage:
  # English is the official language (Constitution, as amended 2016) — official
  # domain is a legal-status flag = 1.0.
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: constitution-2016
  # Home languages, share as first language from census language data (2010/2022
  # composite estimates; Zambia's census records province of enumeration and
  # language shares imperfectly, so these are flagged as estimates).
  - languageCode: bem
    domain: locallySpoken
    speakersShare: 0.33
    sourceId: zamstats-census
  - languageCode: nya
    domain: locallySpoken
    speakersShare: 0.20
    sourceId: zamstats-census
  - languageCode: toi
    domain: locallySpoken
    speakersShare: 0.14
    sourceId: zamstats-census
  - languageCode: loz
    domain: locallySpoken
    speakersShare: 0.05
    sourceId: zamstats-census
  - languageCode: tum
    domain: locallySpoken
    speakersShare: 0.025
    sourceId: zamstats-census
  - languageCode: kqn
    domain: locallySpoken
    speakersShare: 0.023
    sourceId: zamstats-census
  - languageCode: lun
    domain: locallySpoken
    speakersShare: 0.021
    sourceId: zamstats-census
  - languageCode: lue
    domain: locallySpoken
    speakersShare: 0.015
    sourceId: zamstats-census
# Notes on language shares: Bemba is the most widely spoken first language
# (Northern, Luapula, Muchinga, Copperbelt); Nyanja/Chewa spans Eastern Province
# and is the urban lingua franca of Lusaka; Tonga (Zambia, toi) dominates the
# South; Lozi the West (Barotseland); Kaonde/Luvale/Lunda the North-West; Tumbuka
# parts of the East. Shares are composite estimates from census language data
# (ZamStats 2010/2022) and do not account for the large number who speak a given
# language as a second language.
ethnicGroups:
  # ZamStats 2022 Census national analytical report, major ethnolinguistic groups.
  - group: Bemba
