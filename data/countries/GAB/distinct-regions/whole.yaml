entertainment:
  - season: allYear
    items:
      - "Live music, dance and nightlife in Libreville and Port-Gentil"
      - "Festivals celebrating Fang, Punu, Myene and Njebi traditions"
      - "Football matches and the national-team calendar"
  - season: dry
    items:
      - "Best months for beach and national-park tourism on the coast (gorilla and elephant safaris)"
      - "Outdoor markets and cultural events in the long dry season (June-September)"
  - season: wet
    items:
      - "Rainforest ecotourism and river trips along the Ogooué in the wetter months"
      - "Indoor venues and music-club culture during heavy rains"
traditionalDishes:
  - season: allYear
    items:
      - "Poulet nyembwe — chicken stewed in palm nut (nyembwe) sauce, a national favorite"
      - "Atlantic fish and smoked fish with plantain or cassava"
      - "Manihot (cassava) dough and plantains with peanut or palm-nut sauce"
      - "Mbongo-chobi — smoked meat/fish in a spice-and-bitter bark sauce"
      - "Grilled bushmeat and farmed alternatives; fresh mango, pineapple and papaya"
  - season: wet
    items:
      - "Hearty palm-nut and cassava-leaf stews in the rainy months"
traditionalClothing:
  - season: allYear
    items:
      - "Colorful wax-print (pagne) clothing for women and formal wear for men"
      - "Light cotton attire suited to the hot, humid climate"
      - "Traditional ceremonial dress and masks for Bwiti and mask-dance rituals"
  - season: dry
    items:
      - "Lightweight summer wear in the June-September dry season"
seasonCalendar:
  - season: dry
    months: [6, 7, 8, 9]
  - season: wet
    months: [10, 11, 12, 1, 2, 3, 4, 5]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Government and offices roughly 07:30-15:30/16:00 Mon-Fri; retail and markets often run Mon-Sat."
  lunchBreakTiming: "A midday break is common, especially outside the capital."
  notableShutdownPeriods:
    - period: "August and year-end holidays"
      description: "Reduced business through August (long dry season) and again over Christmas-New Year."
    - period: "Easter and national public holidays"
      description: "Several public holidays (e.g. 1 May, 17 August independence) slow official activity."
  notes: "Sunday is widely a rest day, especially outside commercial and oil-town zones; the August long dry season is a common annual-leave period."
