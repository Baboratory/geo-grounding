code: WHOLE
name:
  eng: Gabon
  local:
    - languageCode: fra
      value: Gabon
# Generic country-wide fallback content for Gabon (unitary-small, single
# synthetic whole region). Used via the 'whole-country-fallback' path.
climates:
  - koppenCode: Af
    description: "Tropical rainforest — hot and humid all year with heavy rainfall; dominant across most of the forested interior and much of the coast."
  - koppenCode: Am
    description: "Tropical monsoon — coastal areas (e.g. Libreville and the south coast) with a shorter, drier season amid otherwise heavy rainfall."
landmarks:
  - name: Lopé-Okanda National Park
    description: "UNESCO World Heritage Site in central Gabon — a mosaic of rainforest and savanna with exceptional archaeological evidence of Bantu settlement and one of the world's largest mandrill aggregations."
    unescoWorldHeritage: true
  - name: Loango National Park, Ogooué coast
    description: "Famed 'Africa's last eden' — pristine Atlantic beaches where forest elephants, buffalo, hippopotamuses and sea turtles share the shoreline and surf."
  - name: Ivindo National Park and Kongou Falls
    description: "UNESCO-listed rainforest park in the northeast; the Kongou and Mingouli waterfalls and Raffia-Palm biosphere forest."
  - name: Crystal Mountains
    description: "Biodiverse lowland rainforest range near Libreville, a stronghold for Gabon's endemic flora and fauna."
  - name: Libreville and Pointe Denis
    description: "The Gabonese capital on the Ogooué estuary, with markets, colonial-era quarters, and the beaches of nearby Pointe Denis."
culturalTraits:
  - "French-Gabonese blend: French as the official working language alongside a wealth of Bantu vernacular cultures"
  - "Fang culture and the mvett — a heroic epic sung to a harp-zither, a pillar of Bantu oral tradition"
  - "Bwiti spirituality and iboga — a syncretic initiation religion rooted among the Fang and Mitsogo"
  - "Sculptural heritage — Punu white-face masks and Kota reliquary figures are among Africa's most celebrated artworks"
  - "Rainforest and river life along the Ogooué, the country's great artery"
  - "Hospitality (convivialité) and an easy-going, warm social style"
prideOf:
  - "Extraordinary biodiversity — about 85-90% of the country under forest cover, with Africa's largest western lowland gorilla population"
  - "The national parks network (13 parks, ~10-11% of national territory, incl. Lopé-Okanda UNESCO site)"
  - "Oil wealth and one of Central Africa's higher GDP-per-capita economies"
  - "Peaceful stability and cultural fusion in a young, heavily urbanized society"
  - "The mvett-guitar and the global reach of Gabonese music (e.g. artist SeBa, who sings in Njebi)"
animals:
  popular:
    - "Western lowland gorilla — Gabon holds one of the largest populations anywhere"
    - "Forest elephant — including the surf-beach elephants of Loango"
    - "Chimpanzee"
    - "Mandrill — including the massive troops of Lopé-Okanda"
    - "African forest buffalo"
  unique:
    - "Grey parrot (Psittacus erithacus) — mostly from the Congo Basin forests"
    - "Sun-tailed monkey (Cercopithecus solatus) — endemic to Gabon"
    - "Forest buffalo and the Loango surf hippopotamuses"
industries:
  - "Oil and gas — the dominant export and state-revenue pillar"
  - "Manganese mining — among the world's top producers"
  - "Timber and forestry (okoumé and other tropical hardwoods)"
  - "Fishing and seafood along the Atlantic coast"
  - "Ecotourism around the national parks"
  - "Emerging special economic zones and logistics (e.g. Nouvelle-Gabon infrastructure, Port-Gentil)"
sports:
  - "Football (soccer) — the national passion"
  - "Basketball and handball"
  - "Athletics, boxing and karting"
  - "Traditional Bwiti-inspired dance and music festivals"
