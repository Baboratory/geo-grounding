    publisher: "Wikipedia (Languages of Gabon) / SIL ISO 639-3"
    url: "https://en.wikipedia.org/wiki/Languages_of_Gabon"
    year: 2023
    accessedDate: "2026-09-19"
    note: "French is the sole official language; Fang (fan), Myene (mye), Njebi/Nzebi (nzb) and Punu (puu) are widely spoken national languages with ISO 639-3 codes verified on iso639-3.sil.org/code/<code>. All locallySpoken shares are ESTIMATES (no official proficiency census)."
