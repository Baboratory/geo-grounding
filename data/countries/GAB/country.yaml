alpha3: GAB
alpha2: GA
name:
  eng: Gabon
  local:
    - languageCode: fra
      value: Gabon
flagEmoji: "🇬🇦"
capital: Libreville
isSovereign: true
# Classified unitary-small: Gabon meets NONE of the 3 DESIGN.md unitary-large
# criteria. (1) Population ~2.4M (2023 est.) — far below the 20-25M threshold.
# (2) Only one official language (French); no co-official regional languages and
# no recognized multi-language federal structure — the recognized national
# languages (Fang, Myene, Njebi/Nzebi, Punu, etc.) are important vernaculars but
# are NOT official. (3) No widely recognized federal/multi-region identity — the
# 9 provinces are administrative units with a relatively small, urbanized
# population concentrated around Libreville and the coast. One synthetic WHOLE
# region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: fra
    domain: official
    speakersShare: 1.0
    sourceId: gab-language
  - languageCode: fra
    domain: locallySpoken
    speakersShare: 0.35
    sourceId: gab-language
  - languageCode: fan
    domain: locallySpoken
    speakersShare: 0.3
    sourceId: gab-language
  - languageCode: mye
    domain: locallySpoken
    speakersShare: 0.1
    sourceId: gab-language
  - languageCode: nzb
    domain: locallySpoken
    speakersShare: 0.12
    sourceId: gab-language
  - languageCode: puu
    domain: locallySpoken
    speakersShare: 0.2
    sourceId: gab-language
# French is the sole official language (Constitution of 1991). Fang (fan),
# Myene (mye), Njebi/Nzebi (nzb) and Punu (puu) are the most widely spoken
# recognized national languages; the country has at least 40 ethnic groups, many
# with their own Bantu language. All locallySpoken shares are ESTIMATES — Gabon
# has held no full language-proficiency census (the last general census with
# ethno-linguistic detail dates to 1993), so local-first shares reflect SIL and
# census-informed approximations, not precise measurements.
ethnicGroups:
  # CIA World Factbook 2021 estimate — no official census breakdown since 1993.
  - group: Fang
    percent: 23.5
    sourceId: gab-ethnic-2021
  - group: Shira-Punu-Vili
    percent: 20.6
    sourceId: gab-ethnic-2021
  - group: Nzabi-Duma
    percent: 11.2
    sourceId: gab-ethnic-2021
  - group: Mbede-Teke
    percent: 5.6
    sourceId: gab-ethnic-2021
  - group: Myene
    percent: 4.4
    sourceId: gab-ethnic-2021
  - group: Kota-Kele
    percent: 4.3
    sourceId: gab-ethnic-2021
  - group: Okande-Tsogho
    percent: 1.6
    sourceId: gab-ethnic-2021
  - group: other
    percent: 12.6
    sourceId: gab-ethnic-2021
  - group: foreigner
    percent: 16.2
    sourceId: gab-ethnic-2021
# CIA-estimated composition (2021). Because Gabon last published a full ethnic
# breakdown in the 1993 census, these are estimates, not official census data;
# the sizable foreign column reflects migrant labor in the oil/timber sectors.
timezones:
  - name: Africa/Libreville
    standardUtcOffset: "UTC+1"
    observesDst: false
currency:
  code: XAF
  symbol: "FCFA"
  name: Central African CFA franc (BEAC)
legalConstraints:
  - topic: "EU data-protection regime inapplicable"
    description: "Gabon is NOT an EU member or EEA state. EU rules — GDPR, VAT-inclusive price display, the 14-day withdrawal right, the 2-year guarantee — do NOT apply directly; national law governs."
    sourceId: gab-not-eu
  - topic: "data protection"
    description: "National law governs: Law No. 001/2011 of 25 September 2011 on the protection of personal data, amended by Law No. 025/2023 of 9 July 2023. The regulator is the Gabonese data-protection authority (CNPDCP, renamed APDPVP under the 2023 amendment). Processing requires consent; sensitive-data categories (ethnic origin, religion, health, etc.) are restricted, and the authority is an observer of the Council of Europe Convention 108 family."
    sourceId: gab-data-protection
  - topic: "electronic marketing consent"
    description: "Law No. 025/2021 of 28 December 2021 regulating electronic transactions in Gabon requires the express consent of the recipient for most electronic-marketing activities; consent can be withdrawn."
    sourceId: gab-emarketing
paymentCulture:
  popularMethods:
    - "Cash — the everyday norm, especially outside Libreville and for small transactions"
    - "Mobile money (Airtel Money, Moov Money) — the most dynamic segment for remittances and peer-to-peer transfers"
    - "Bank cards (Visa/Mastercard) — standard in hotels, larger restaurants and modern retail in Libreville"
    - "Bank transfers and mobile banking growing in urban centers; low overall banking penetration (~10-15%)"
    - "Remittances and a large informal cash economy around the oil and logging sectors"
  tipping:
    expected: false
    typicalAmount: "Not customary; a 5-10% tip is appreciated in upscale restaurants and hotels when service is good"
    autoIncludedInBill: false
    note: "Tipping is not normally expected, but small gratuities for attentive service in restaurants, hotels and porters are welcome. Bargaining is common at markets and with informal taxi drivers."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "French is the language of business and government; formal 'Monsieur/Madame' with surnames is the norm until a first-name basis is offered. Elder respect (respect des aînés) matters."
  greetingNorms: "A handshake with eye contact is standard; 'Bonjour/Bonsoir' first, then the local greeting 'Mbolo' is widely used across communities. Asking after family/general wellbeing before business is normal."
  meetingEtiquette: "Relationship-building precedes deals; punctuality is appreciated in formal settings although a relaxed pace is common. Decisions tend to rest with senior leadership, often personally."
  topicsToAvoid:
    - "Criticizing the political leadership or dwelling on the 2023 political transition"
    - "Ethnic stereotyping or treating Gabon's many groups as interchangeable"
    - "Comparing Gabon's wealth only to oil or framing the country narrowly as an extractive state"
    - "Overly blunt, direct criticism delivered without warmth"
  giftGivingNotes: "Not required at business meetings; a small, thoughtful gift is welcome once a relationship forms. Gift-giving centers on hospitality and festivals rather than business protocol."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
  - id: gab-language
