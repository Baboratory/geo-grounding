alpha3: MRT
alpha2: MR
name:
  eng: Mauritania
  local:
    - languageCode: ara
      value: "موريتانيا (Mūrītāniyā)"
flagEmoji: "🇲🇷"
capital: Nouakchott
isSovereign: true
# Classified unitary-small: Mauritania (~4.7M, 2024 est.; ~5.4M by 2026) sits
# well under the ~20-25M threshold for unitary-large and is a unitary
# semi-presidential Islamic republic with no federal structure. The official
# language is Arabic; Pulaar, Soninke and Wolof are constitutionally recognized
# national languages (Art. 6), but the country does not have a widely recognized
# cultural-historical regional fault line of the kind that merits curated
# regions (the Moor north and the black-African south interweave rather than
# forming two clean territorial blocks). One synthetic WHOLE region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: ara
    domain: official
    speakersShare: 1.0
    sourceId: mrt-constitution-art6
  - languageCode: mey
    domain: locallySpoken
    speakersShare: 0.83
    sourceId: mrt-languages-est
  - languageCode: fuc
    domain: locallySpoken
    speakersShare: 0.05
    sourceId: mrt-languages-est
  - languageCode: snk
    domain: locallySpoken
    speakersShare: 0.01
    sourceId: mrt-languages-est
  - languageCode: wol
    domain: locallySpoken
    speakersShare: 0.005
    sourceId: mrt-languages-est
  - languageCode: fra
    domain: foreign
    speakersShare: 0.15
    sourceId: mrt-languages-est
# Arabic is the sole official language and Modern Standard Arabic the language
# of administration, law and education (Constitution Art. 6). Hassaniyya (mey),
# a Bedouin Arabic dialect, is the dominant everyday vernacular (~83%, mainly
# among the Moor population). Pulaar, Soninke and Wolof are recognized national
# languages of the sub-Saharan communities, with limited institutional use.
# French persists as a secondary language of administration, higher education
# and business (~15% functional). LocallySpoken/Foreign shares are Composite
# estimates.
ethnicGroups:
  - group: Haratin (black Moors)
    percent: 40.0
    sourceId: mrt-ethnic
  - group: Bidhan / Beidane (white Moors)
    percent: 30.0
    sourceId: mrt-ethnic
  - group: Halpulaar, Fulani (Pulaar), Soninké and Wolof (black sub-Saharan groups)
    percent: 30.0
    sourceId: mrt-ethnic
timezones:
  - name: Africa/Nouakchott
    standardUtcOffset: "UTC+0"
    observesDst: false
currency:
  code: MRU
  symbol: "UM"
  name: Mauritanian ouguiya
legalConstraints:
  - topic: "official languages"
    description: "The Constitution (Art. 6) declares Arabic the country's sole official language, while recognizing Arabic, Pulaar, Soninke and Wolof as national languages. French has no official status but is used in administration and higher education."
    sourceId: mrt-constitution-art6
  - topic: "state religion"
    description: "Mauritania is an Islamic republic; Islam is the state religion and Sunni Islam (Maliki school) is adhered to by virtually the entire population. The 1985 Constitutional Charter declared sharia the law of the land, though the current Civil and Commercial Codes and civil law coexist with Islamic law in personal-status matters."
    sourceId: mrt-islam
  - topic: "data protection"
    description: "Mauritania has no GDPR-equivalent omnibus data-protection law; data handling is governed by narrower provisions (Law No. 2017-020 on personal-data protection, establishing a Data Protection Authority, adopted 2017 but not yet reported in force). Enforcement capacity is limited."
    sourceId: mrt-dpa-2016
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
