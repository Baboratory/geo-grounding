    publisher: "UNESCO Creative Cities Network"
    url: "https://en.unesco.org/creative-cities/gaziantep"
    year: 2015
    accessedDate: "2026-09-20"
    note: "Gaziantep designated a UNESCO City of Gastronomy in 2015; known for pistachios (Antep fistiği), baklava, and a large export economy."
