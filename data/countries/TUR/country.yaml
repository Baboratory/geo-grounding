sources:
  - id: tur-constitution-art3
    name: "Constitution of the Republic of Turkey (1982), Article 3"
    publisher: "Grand National Assembly of Turkey / Constitutional Court"
    url: "https://www.anayasa.gov.tr/media/7258/anayasa_eng.pdf"
    year: 1982
    accessedDate: "2026-09-20"
    note: "Article 3: 'The State of Turkey, with its territory and nation, is an indivisible entity. Its language is Turkish... Its capital is Ankara.'"
  - id: tur-tuik
    name: "Address Based Population Registration System, 2024 (ADNKS)"
    publisher: "Turkish Statistical Institute (TÜİK)"
    url: "https://www.tuik.gov.tr"
    year: 2024
    accessedDate: "2026-09-20"
    note: "Population 85,664,944 as of 31 Dec 2024; Istanbul 15,701,602; Ankara 5,864,049; Izmir 4,493,242; Gaziantep 2,193,363. Does not itself carry a Turkish-speaker percentage; the 95% locallySpoken share is a disclosed ESTIMATE based on Turkish being the dominant home language of the large majority ethnic-Turk population."
  - id: tur-kvkk
    name: "Law on the Protection of Personal Data (KVKK), Law No. 6698 (2016)"
    publisher: "Personal Data Protection Authority (KVKK)"
    url: "https://www.kvkk.gov.tr/Icerik/6649/Personal-Data-Protection-Law"
    year: 2016
    accessedDate: "2026-09-20"
    note: "In force 7 April 2016, modeled on the GDPR; establishes the KVKK Board; Art. 9 on cross-border transfer. Also referenced for the Consumer Protection Law's general consumer-protection framework."
  - id: tur-bkm
    name: "BKM 2024 Annual Bulletin (Kartli Ödemeler)"
    publisher: "Interbank Card Center (Bankalararasi Kart Merkezi, BKM)"
    url: "https://bkm.com.tr/wp-content/uploads/2025/01/BKM-2024-Yillik-Bulten-.pdf"
    year: 2025
    accessedDate: "2026-09-20"
    note: "2024 card payments totaled 15.8 trillion TRY; 435.4M cards; 33% in-store contact, 37% online/MOTO, 30% contactless by value."
  - id: tur-uscirf
    name: "USCIRF 2023 Annual Report: Turkey"
    publisher: "U.S. Commission on International Religious Freedom"
    url: "https://uscirf.gov/sites/default/files/2023-05/Turkey.pdf"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Government claims ~99% Muslim; ~78% Hanafi Sunni; Alevi estimated 10-25M (largest religious minority). Estimates only - Turkey publishes no official religious breakdown."
  - id: tur-govuk-kurds
    name: "Country Policy and Information Note: Kurds, Turkey (2023)"
    publisher: "UK Home Office / DFAT Country Information"
    url: "https://www.gov.uk/government/publications/turkey-country-policy-and-information-notes/country-policy-and-information-note-kurds-turkey-october-2023-accessible"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Kurds estimated ~18-20% of the population (international observers ~70-75% Turk, ~19% Kurd). The Turkish state does not recognize Kurds as a minority, only non-Muslims. Kurmanji dominant; Zaza and Sorani smaller. Estimates only - no ethnic census since 1965."
  - id: tur-unesco
    name: "UNESCO World Heritage List: Türkiye"
    publisher: "UNESCO World Heritage Centre"
    url: "https://whc.unesco.org/en/list/"
    year: 2025
    accessedDate: "2026-09-20"
    note: "Inscribed sites incl. Historic Areas of Istanbul (1985), Göreme/Cappadocia (1985), Ephesus (2015), Nemrut Dağ (1987), Göbekli Tepe (2018). Basis for landmarks/culturalTraits text only -- does not carry language or religion figures."
  - id: tur-language-religion-estimate
    name: "Türkiye Armenian/foreign-language and Christian/Jewish shares — composite estimate"
    publisher: "Composite estimate (no single official survey carries these figures)"
    url: "https://en.wikipedia.org/wiki/Languages_of_Turkey"
    year: 2024
    accessedDate: "2026-09-20"
    note: "Armenian home-language use (~0.1%), German as a foreign language (~15%, a legacy of Turkish-German labor migration) and English as a foreign language (~20%) are disclosed ESTIMATEs; no dedicated nationwide language-proficiency census exists. (Previously mis-cited to tur-unesco, a heritage-sites list with no connection to language.)"
  - id: tur-tcmb
    name: "Turkish Lira Sign & Central Bank of the Republic of Türkiye (TCMB)"
    publisher: "Central Bank of the Republic of Turkey"
    url: "https://www.tcmb.gov.tr/wps/wcm/connect/EN/TCMB+EN/Main+Menu/About+the+Bank/Turkish+Lira+Sign"
    year: 2012
    accessedDate: "2026-09-20"
    note: "Currency code TRY, symbol ₺; TCMB is the issuing central bank and operates the payments ecosystem; the symbol was adopted in 2012."
  - id: tur-labor
    name: "Turkish Labor Law No. 4857"
    publisher: "Republic of Türkiye, official legislation database (mevzuat.gov.tr)"
    url: "https://mevzuat.gov.tr/mevzuatmetin/1.5.4857.pdf"
    year: 2003
    accessedDate: "2026-09-20"
    note: "Art. 63: max 45 hrs/week (11 hrs/day). Art. 45-46: minimum 24-hr uninterrupted weekly rest. Friday is a normal working day."
  - id: tur-gaziantep-un
    name: "Gaziantep: UNESCO Creative Cities Network - City of Gastronomy (2015)"
    publisher: "UNESCO Creative Cities Network"
    url: "https://en.unesco.org/creative-cities/gaziantep"
    year: 2015
    accessedDate: "2026-09-20"
    note: "Gaziantep designated a UNESCO City of Gastronomy in 2015; known for pistachios (Antep fistiği), baklava, and a large export economy."
