legalConstraints:
  - topic: "data protection"
    description: "Personal-data protection is governed by the Law on the Protection of Personal Data (KVKK), Law No. 6698, in force since April 2016 and modeled closely on the EU GDPR. It establishes a Personal Data Protection Authority (KVKK Board) in Ankara, consent and processing principles, and rules on cross-border transfer of personal data (Art. 9, amended by Law No. 7499 in June 2024)."
    sourceId: tur-kvkk
  - topic: "price display and currency"
    description: "Prices for goods and services must be displayed in Turkish lira (TRY). Under the Regulation on Prices (Fiyat Etiketi Yönetmeliği) of the Ministry of Trade, retail prices must be shown in TL, and goods sold at tourist/exchange-rate-denominated prices must still quote the TRY equivalent."
    sourceId: tur-tcmb
  - topic: "consumer rights"
    description: "Consumer protection is regulated by the Consumer Protection Law No. 6502 of 2013, which broadly mirrors EU consumer law: withdrawal rights for distance sales (14 days), warranty/defect remedies, and rules on installment and unfair contract terms."
    sourceId: tur-kvkk
  - topic: "weekly rest and working hours"
    description: "Working time is capped at 45 hours per week (Labor Law No. 4857, Art. 63) with a maximum of 11 hours per day. Workers are entitled to a minimum uninterrupted 24-hour weekly rest (Art. 45-46). Friday is a normal working day; the weekly rest day is typically Sunday (often with a half-day Saturday), and Sunday is not a government-imposed rest day."
    sourceId: tur-labor
# paymentMethodShares intentionally omitted: TCMB/BKM publish card-channel activity, not a
# clean cash-vs-card total-mix split, so no single authoritative paymentMethodShares breakdown
# exists to cite. The paymentCulture block describes the actual mix instead.
paymentCulture:
  popularMethods:
    - "Credit card (dominant)"
    - "Contactless debit/prepaid card"
    - "Cash (still widely accepted, esp. small retail)"
    - "Bank transfer / FAST instant transfer"
    - "Local TROY card scheme and digital wallets (e.g. BKM Express)"
  tipping:
    expected: false
    typicalAmount: "5-10%"
    autoIncludedInBill: false
    note: "Tipping is optional and appreciated rather than expected; rounding up the bill or leaving 5-10% is common in restaurants, and some upscale restaurants add an automatic service charge."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Use respectful titles (Bey/Hanım after first names) and the formal 'siz' form with strangers, elders and new acquaintances; first names only after an invitation."
  greetingNorms: "A firm handshake and direct eye contact for men; 'Merhaba' (hello) and 'Nasılsınız?' (how are you) are standard; a slight nod/head-tilt or hand-over-heart gesture is a warm sign of gratitude."
  meetingEtiquette: "Business is relationship-driven and hospitality matters: expect tea or Turkish coffee to be served, some small talk before business, and multiple meetings to build trust before concluding deals. Punctuality is valued in formal settings, though a relaxed attitude is common socially."
  topicsToAvoid:
    - "Kurdish separatism / the PKK conflict"
    - "the Armenian Genocide / Armenian relations"
    - "modern Turkish political party conflicts (AKP/CHP divisiveness)"
    - "criticism of Mustafa Kemal Atatürk"
    - "religion and sectarian identity unless the host raises it"
    - "sensitive history (Cyprus, Greece relations)"
  giftGivingNotes: "Giving small gifts is appreciated but not expected; bring sweets, tea/coffee or flowers when visiting a home. Avoid alcohol or pork as gifts for conservative Muslims, and it is generally improper to give an intimate gift to a business contact's spouse."
