businessRhythm:
  restDays: []
  notes: "National rhythm identical to the rest of Türkiye: work Monday-Friday, Friday is a normal working day and the weekly rest is Sunday; Turkish national holidays (Republic Day Oct 29, Ramadan and Eid, Kurban Bayramı) shift schedules. The Erciyes winter-sports season (roughly December-April) puts local tourism and hospitality businesses into high gear, while the hot dry summer slows midday outdoor work. Kayseri is overwhelmingly Sunni Muslim, same as the national default — this file exists on climate grounds (trigger 5), not religion."
  typicalWorkHours: "08:30-17:30 Mon-Fri (government); 09:00-18:00 (private/industry)."
