    months: [12, 1, 2]
  - season: spring
    months: [3, 4, 5]
  - season: summer
    months: [6, 7, 8]
  - season: autumn
    months: [9, 10, 11]
businessRhythm:
  restDays: []
  notes: "Follows the national Turkish pattern: Monday-Friday working week with Sunday as the weekly rest; Friday is a normal working day. Industrial zones and the pastırma/sucuk trade push a six-day rhythm; the Erciyes ski season (winter) is the main tourist peak. Government offices run 08:30-17:30."
  typicalWorkHours: "09:00-18:00 Mon-Fri (government 08:30-17:30)."
