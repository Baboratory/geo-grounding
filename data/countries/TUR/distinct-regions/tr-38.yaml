code: TR-38
name:
  eng: Kayseri Province (Central Anatolia)
  local:
    - languageCode: tur
      value: Kayseri
climates:
  - koppenCode: BSk
    description: "Cold semi-arid / cold steppe on the Central Anatolian plateau at the base of Mount Erciyes: very cold, snowy winters (Dec-Feb), hot dry summers (Jun-Aug), large diurnal temperature swings and annual rainfall below the semi-arid threshold (~400 mm). Fires trigger 5 — main class B, unrepresented by the curated set."
landmarks:
  - name: "Mount Erciyes (Erciyes Dağı)"
    description: "A dormant stratovolcano rising to 3,917 m, the highest summit in Central Anatolia and the city's dominant backdrop (~25-30 km south of Kayseri). Hosts the Erciyes Ski Resort, one of Turkey's largest, with lifts reaching above 3,000 m."
    unescoWorldHeritage: false
  - name: "Kayseri Castle (Kayseri Kalesi)"
    description: "Ancient inner-and-outer walled citadel in the city centre, attested from Roman times (3rd century AD) and repeatedly repaired by the Byzantine, Danishmendid, Seljuk, Karamanid and Ottoman rulers; the inner fort with its 18 towers survives intact."
    unescoWorldHeritage: false
  - name: "Hunat Hatun Complex"
    description: "13th-century Seljuk complex of mosque, medrese, hamam and türbe, built in 1237 by Mahperi Hunat Hatun, wife of Seljuk Sultan Alaeddin Keykubat I; the medrese long served as Kayseri's museum."
    unescoWorldHeritage: false
  - name: "Gevher Nesibe Medical Complex (Seljuk medical school)"
    description: "Seljuk-era hospital and medical school founded in 1206 by Gıyaseddin Keyhüsrev I in memory of his sister Gevher Nesibe Sultan — one of Anatolia's earliest centres of medicine; now home to the Museum of Seljuk Civilization."
    unescoWorldHeritage: false
  - name: "Kayseri Ulu Cami (Grand Mosque)"
    description: "Large mosque near the castle, among the oldest examples in Anatolia of the Seljuk Ulu Cami (columned longitudinal) tradition, with a minaret added during the 1206 repair; the Islamic-era minaret is Kayseri's oldest."
    unescoWorldHeritage: false
  - name: "Kayseri Archaeology Museum (Kayseri Arkeoloji Müzesi)"
    description: "Regional archaeological museum displaying finds from Kültepe/Kanesh and the broader Kayseri region's long history."
    unescoWorldHeritage: false
culturalTraits:
  - "Major Seljuk city: Kayseri flourished under the Sultanate of Rum, leaving a dense legacy of Seljuk medreses, mosques, caravanserais and hospitals"
  - "Anatolian steppe culture rooted in the cold semi-arid Central Anatolian plateau, with a hearty grain- and meat-based table"
  - "Winter-sports and mountaineering identity centred on Mount Erciyes and its ski resort"
  - "Conservative, devout and famously hard-working local identity; Kayseri's industrialists are archetypal 'Anatolian tigers'"
  - "Deep civic pride in craft and trade — pastırma/sucuk production, furniture and textiles"
prideOf:
  - "Mount Erciyes and the Erciyes Ski Resort, one of Turkey's largest"
  - "The Seljuk heritage of Kayseri — medreses, the Gevher Nesibe medical school and Hunat Hatun Complex"
  - "Kayseri as the home of pastırma, sucuk and Kayseri mantısı"
  - "Being a leading Anatolian industrial and manufacturing powerhouse ('furniture capital of Türkiye')"
animals:
  popular:
    - "Anatolian wolf (kurt)"
    - "Wild goat / ibex (dağ keçisi) on the Erciyes slopes"
    - "Golden eagle (kaya kartalı)"
    - "Wild horses (yılkı) of the Erciyes highlands"
  unique:
    - "Erciyes wild goat (dağ keçisi) populations"
    - "Yılkı (feral horse) herds of Mount Erciyes"
    - "Endemic Erciyes flora such as Astragalus argaeus"
industries:
  - "Furniture manufacturing — Kayseri is described as the 'furniture capital of Türkiye'"
  - "Textiles and knitted upholstery fabric"
  - "Food processing: pastırma and sucuk cured-meat production"
  - "Agriculture on the plateau (wheat, sugar beet)"
  - "Winter and alpine tourism (Erciyes Ski Resort)"
  - "Machinery, metalworking and general manufacturing ('Anatolian tiger' economy)"
sports:
  - "Football (Kayserispor, founded 1966)"
  - "Skiing and snowboarding at Erciyes Ski Resort"
  - "Mountaineering and trekking on Mount Erciyes"
