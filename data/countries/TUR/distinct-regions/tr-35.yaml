code: TR-35
name:
  eng: İzmir Province (Aegean)
  local:
    - languageCode: tur
      value: İzmir
climates:
  - koppenCode: Csa
    description: "Hot-summer Mediterranean: long hot dry summers and mild, wet winters with abundant sunshine."
landmarks:
  - name: Ephesus
    description: "UNESCO World Heritage Site (2015) in the Selçuk district of İzmir: a great ancient harbor city with the Library of Celsus and the Temple of Artemis."
    unescoWorldHeritage: true
  - name: "Clock Tower (Saat Kulesi)"
    description: "The 1901 Ottoman clock tower in Konak Square, an iconic symbol of İzmir."
    unescoWorldHeritage: false
  - name: "Kemeraltı Bazaar and Kadifekale"
    description: "Historic covered market and the ancient citadel overlooking the Gulf of İzmir."
    unescoWorldHeritage: false
  - name: "Asansör (The Elevator)"
    description: "A 1907 historical elevator connecting the coastal quarter with the hill of Karataş."
    unescoWorldHeritage: false
culturalTraits:
  - "Turkey's most liberal, outward-looking and free-spirited Aegean port city"
  - "Historical religious and ethnic plurality (Greek Orthodox, Levantine/Sephardic Jewish communities) and a strong winemaking and rakı culture"
  - "Laid-back coastal Mediterranean lifestyle with a strong café and promenade culture"
  - "A Western-facing trading city with a tolerant, intellectual identity"
  - "Center of the Aegean agricultural and olive heartland"
prideOf:
  - "The ancient heritage of Smyrna and Ephesus"
  - "A liberal, cosmopolitan identity and Aegean seaside way of life"
  - "The olive groves and vineyards of the Aegean"
  - "The Gulf of İzmir and its sunset promenades"
