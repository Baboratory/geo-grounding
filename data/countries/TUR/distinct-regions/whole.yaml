code: WHOLE
name:
  eng: Türkiye
  local:
    - languageCode: tur
      value: Türkiye
climates:
  - koppenCode: Csa
    description: "Hot-summer Mediterranean along the Marmara, Aegean and Mediterranean coasts: hot dry summers, mild wet winters."
  - koppenCode: Cfb
    description: "Oceanic/'Black Sea' climate along the northern Black Sea coast: temperate, humid and rainy year-round."
  - koppenCode: Dsb
    description: "Dry-summer continental on the Central Anatolian plateau: hot dry summers with very cold, snowy winters."
  - koppenCode: BSh
    description: "Hot semi-arid steppe on the Southeastern Anatolian plains: very hot dry summers, cool winters."
  - koppenCode: Dsa
    description: "Harsh continental climate in Eastern Anatolia: long cold winters, short warm summers, low precipitation."
landmarks:
  - name: "Historic Areas of Istanbul (Hagia Sophia, Topkapı Palace, Sultanahmet)"
    description: "UNESCO World Heritage Site (1985) encompassing the Byzantine and Ottoman imperial monuments of the historic capital."
    unescoWorldHeritage: true
  - name: "Göreme National Park and the Rock Sites of Cappadocia"
    description: "UNESCO mixed natural/cultural site (1985) of volcanic 'fairy chimney' valleys and rock-cut Byzantine churches, in Nevşehir."
    unescoWorldHeritage: true
  - name: Ephesus
    description: "UNESCO World Heritage Site (2015) in İzmir province: a great Hellenistic-Roman harbor city with the Library of Celsus and the Temple of Artemis."
    unescoWorldHeritage: true
  - name: Göbekli Tepe
    description: "UNESCO site (2018) near Şanlıurfa: a Pre-Pottery Neolithic ritual complex with T-shaped megalithic pillars, among the oldest known monumental structures."
    unescoWorldHeritage: true
  - name: Mount Nemrut
    description: "UNESCO site (1987) in Adıyaman with colossal late-Hellenistic Commagene kingdom statues and stelae."
    unescoWorldHeritage: true
  - name: Pamukkale-Hierapolis
    description: "UNESCO site (1988) of white travertine terraces alongside the Greco-Roman city of Hierapolis in Denizli."
    unescoWorldHeritage: true
  - name: Anıtkabir
    description: "The monumental mausoleum of Mustafa Kemal Atatürk in Ankara, a major national landmark and museum."
    unescoWorldHeritage: false
culturalTraits:
  - "Hospitality ('misafirperverlik') is a core value; guests are plied with tea, coffee and food"
  - "Tea (çay) culture is central to daily social and business life, often served in tulip-shaped glasses"
  - "Strong family and community ties; elders are deeply respected and given deference"
  - "A secular republic with an Ottoman-Balkan-Anatolian heritage blending East and West"
  - "Alevi-Sunni religious diversity coexists within a predominantly Muslim society"
  - "Rich bazaar and artisan traditions: carpets, copperware, ceramics (Iznik) and baklava"
prideOf:
  - "Mustafa Kemal Atatürk and the founding of the modern Turkish Republic (1923)"
  - "Ottoman imperial and Seljuk heritage, including Istanbul's Byzantine-Ottoman monuments"
  - "Turkish cuisine, gazetted globally (UNESCO gastronomy city of Gaziantep, Turkish-coffee heritage)"
  - "Historic achievements in science, medicine and craftsmanship"
  - "The Turkish flag and national anthem, and national sporting success"
  - "A civilization spanning millennia, from Göbekli Tepe and Troy to the present"
animals:
  popular:
