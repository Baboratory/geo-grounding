businessRhythm:
  restDays: []
  notes: "The conventional work week is Monday-Friday. Weekly rest is a minimum of 24 uninterrupted hours under Labor Law Art. 45-46, typically taken on Sunday (many businesses also close or shorten hours Saturday afternoon). Friday is a normal working day. Government offices commonly run 08:30-17:30; private offices 09:00-18:00 with a lunch break. The month of Ramadan and end-of-year holidays shift schedules."
  typicalWorkHours: "09:00-18:00 Mon-Fri (government 08:30-17:30)."
sources:
  - id: tur-uscirf
    name: "USCIRF 2023 Annual Report: Turkey"
    publisher: "U.S. Commission on International Religious Freedom"
    url: "https://uscirf.gov/sites/default/files/2023-05/Turkey.pdf"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Government claims ~99% Muslim; ~78% Hanafi Sunni; Alevi estimated 10-25M (largest religious minority). Estimates only - Turkey publishes no official religious breakdown."
