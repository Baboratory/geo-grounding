  - name: "Alevi Muslim"
    percent: 12.0
    sourceId: tur-uscirf
  - name: "Other Muslim"
    percent: 9.0
    sourceId: tur-uscirf
  - name: "Christian (Orthodox, Armenian, Syriac, Protestant, Catholic)"
    percent: 0.2
    sourceId: tur-uscirf
  - name: Jewish
    percent: 0.03
    sourceId: tur-uscirf
