code: TR-06
name:
  eng: Ankara Province (Central Anatolia)
  local:
    - languageCode: tur
      value: Ankara
climates:
  - koppenCode: Dsb
    description: "Dry-summer continental steppe on the Central Anatolian plateau: hot dry summers, very cold and snowy winters, large diurnal temperature swings."
landmarks:
  - name: "Anıtkabir (Atatürk's Mausoleum)"
    description: "The monumental mausoleum of Atatürk and the national shrine of modern Turkey."
    unescoWorldHeritage: false
  - name: Museum of Anatolian Civilizations
    description: "A celebrated museum of Anatolian archaeology spanning prehistory through the Hittites and beyond."
    unescoWorldHeritage: false
  - name: "Gordion (Gordium)"
    description: "Ancient Phrygian capital at Yassıhöyük, near Polatlı, inscribed as a UNESCO World Heritage Site in 2023; site of the legendary Gordian Knot."
    unescoWorldHeritage: true
  - name: Kocatepe Mosque
    description: "One of Turkey's largest 20th-century mosques dominating the Ankara skyline."
    unescoWorldHeritage: false
culturalTraits:
  - "Seat of government and the state bureaucracy"
  - "Turkey's political and administrative center, more reserved and orderly than Istanbul"
  - "Bureaucratic, universities- and defense-cluster-driven economy"
  - "Purpose-built capital city with wide boulevards and Atatürk-era civic architecture"
  - "Friendly but formal Central Anatolian business culture"
prideOf:
  - "Being the capital and seat of the Turkish Republic"
  - "Anıtkabir and the Atatürk legacy"
  - "The Museum of Anatolian Civilizations and the Hittite heritage"
  - "Modern, planned architecture and a strong university life"
animals:
  popular:
    - Ankara cat
    - "Angora goat (Ankara keçisi)"
    - Kangal dog (Anatolian shepherd)
  unique:
    - Ankara cat
    - "Angora rabbit and goat breeds"
industries:
  - "Public administration and government services"
  - "Defense and aerospace (TAI, ASELSAN, Roketsan, Havelsan headquarters)"
  - "Universities and R&D"
  - Manufacturing
  - "Agriculture (wheat, sugar beet) in the province"
  - Construction and trade
sports:
  - "Football (Ankaragücü, Gençlerbirliği)"
  - Basketball
  - Volleyball
  - Ice skating/hockey (BelPa ice rink)
