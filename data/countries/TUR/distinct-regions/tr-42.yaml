businessRhythm:
  restDays: []
  notes: "Follows the national Turkish pattern: Monday-Friday working week with Sunday as the weekly rest; Friday is a normal working day. Agriculture and the large industrial zones set the tempo -- busy harvest times on the steppe and a strong pilgrimage-driven tourism calendar around Mevlana (peak December). Government offices run 08:30-17:30."
  typicalWorkHours: "09:00-18:00 Mon-Fri (government 08:30-17:30)."
