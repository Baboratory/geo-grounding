code: TR-42
name:
  eng: Konya Province (Central Anatolia)
  local:
    - languageCode: tur
      value: Konya
climates:
  - koppenCode: BSk
    description: "Cold semi-arid steppe climate of the Central Anatolian plain: hot, dry summers and cold, snowy winters with large diurnal temperature swings and low, strongly seasonal rainfall -- the archetypal Anatolian steppe."
landmarks:
  - name: "Mevlana Museum"
    description: "The turquoise-domed mausoleum and lodge of the mystic poet Mevlana Celaleddin Rumi (Jalal ad-Din), founder of the Mevlevi Sufi order of the Whirling Dervishes; Turkey's most visited museum and a pilgrimage centre. (The Mevlevi 'Sema' is UNESCO Intangible Cultural Heritage; the museum itself is not a World Heritage Site.)"
    unescoWorldHeritage: false
  - name: "Çatalhöyük"
    description: "An extraordinary Neolithic proto-city of densely packed mud-brick houses entered through the roof, occupied c. 7100-5700 BCE on the Konya Plain; a UNESCO World Heritage Site (inscribed 2012) and among the most intensively studied early urban settlements on Earth."
    unescoWorldHeritage: true
  - name: "Karatay Madrasa (Karatay Medresesi)"
    description: "A 13th-century Seljuk madrasa in Konya now housing a celebrated museum of Seljuk tile and ceramic artwork."
    unescoWorldHeritage: false
culturalTraits:
  - "Turkey's deepest well of Seljuk heritage -- Konya was the capital of the Anatolian Seljuk Sultanate in the 12th-13th centuries"
  - "A devoutly conservative, Sufi- and pilgrimage-centred city, home and burial place of Mevlana Rumi"
  - "Known for whirling-dervish (Mevlevi) culture and the annual Rumi Commemoration Week (December)"
  - "Fierce regional pride in its flat, fertile steppe and agrarian bounty"
  - "Formal, hospitable and traditional Central Anatolian social culture"
prideOf:
  - "Mevlana Rumi and the Mevlevi Order -- 'come, come, whoever you are'"
  - "Being the wellspring of Seljuk architecture and the capital of the Anatolian Seljuks"
  - "Çatalhöyük and the deep Neolithic roots of the Konya Plain"
  - "Being Turkey's breadbasket and largest province by area"
animals:
  popular:
    - "Central Anatolian Merino sheep"
    - "Anatolian shepherd / Kangal dog (kept in the steppe)"
    - "Angora goat"
  unique:
    - "Çatalhöyük-era domesticated cattle lineage (archaeological heritage)"
industries:
  - "Agriculture and agri-food on the vast Konya Plain (wheat, sugar beet, legumes) -- Turkey's principal grain-producing province"
  - "Carpet and kilim handicrafts (Konya carpet-making tradition)"
  - "Food processing and refrigerated supply chains"
  - "Machinery, agricultural equipment and manufacturing"
  - "Defence and aerospace (a major Turkish Aerospace plant; wind-tunnel and aviation heritage)"
  - "Cultural/religious tourism (Mevlana pilgrimage, Çatalhöyük)"
sports:
  - "Football (Konyaspor)"
  - "Basketball"
  - "Wrestling and traditional Central Anatolian strength sports"
  # Religion is not a coverage trigger for Konya (it is curated on climate,
  # trigger 5). Konya is overwhelmingly Sunni Muslim with no shape-shifting
  # statutory distinction from the national picture; no reliable province-level
  # religious breakdown exists and Turkey's official census last asked religion
  # in 1965, so religions[] is deliberately omitted rather than guessed.
