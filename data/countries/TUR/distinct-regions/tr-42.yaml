businessRhythm:
  restDays: []
  notes: "Follows the national Turkish pattern: Monday-Friday working week with Sunday as the weekly rest; Friday is a normal working day. Agriculture and the large sugar/food-industrial zones set the tempo — busy at harvest times and around sugar processing season. Religious holidays (Ramadan and Eid) and the annual Mevlana pilgrimage/dervish season (peak December) shape the cultural calendar. Konya is overwhelmingly Sunni Muslim, same as the national default — this file exists on climate grounds (trigger 5), not religion."
  typicalWorkHours: "09:00-18:00 Mon-Fri (government 08:30-17:30)."
