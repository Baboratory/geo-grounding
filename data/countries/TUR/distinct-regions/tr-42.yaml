code: TR-42
name:
  eng: Konya Province (Central Anatolia)
  local:
    - languageCode: tur
      value: Konya
climates:
  - koppenCode: BSk
    description: "Cold semi-arid steppe climate on the Central Anatolian plain: hot, dry summers, cold, snowy winters, large diurnal temperature swings and low, strongly seasonal rainfall (~300-325 mm/yr) — the archetypal Anatolian steppe. Fires trigger 5: main class B is unrepresented in the curated set."
landmarks:
  - name: "Mevlana Museum"
    description: "The turquoise-domed mausoleum and lodge of the Sufi mystic poet Mevlana Celaleddin Rumi, founder of the Mevlevi order of the Whirling Dervishes; Turkey's most-visited museum and a major pilgrimage centre. (The Mevlevi Sema is on UNESCO's Intangible Cultural Heritage list; the museum is not a World Heritage Site.)"
    unescoWorldHeritage: false
  - name: Çatalhöyük
    description: "An extraordinary Neolithic proto-city of densely packed mud-brick houses entered through the roof, occupied c. 7100-5700 BCE on the Konya Plain; a UNESCO World Heritage Site (inscribed 2012) and among the most intensively studied early urban settlements on Earth."
    unescoWorldHeritage: true
  - name: "Alaeddin Mosque"
    description: "The largest surviving Seljuk mosque in Konya, built on Alaeddin Hill (the old citadel mound) in stages from the mid-12th to mid-13th centuries; it served as the 'mosque of the throne' for the Seljuk Sultans of Rum and houses their dynastic mausoleum."
    unescoWorldHeritage: false
  - name: "Selimiye Mosque (Konya)"
    description: "A 16th-century Ottoman mosque (commissioned 1558 by Selim II) in the Classical Ottoman style, standing next to the Mevlana Museum in the city centre; a double-minaret domed mosque resembling the Fatih Mosque in Istanbul."
    unescoWorldHeritage: false
  - name: "Karatay Madrasa (Karatay Medresesi)"
    description: "A 13th-century Seljuk madrasa in Konya, commissioned in 1251, now housing a celebrated museum of Seljuk and Ottoman tile work; its stones were quarried in Sille."
    unescoWorldHeritage: false
  - name: "Sille (historic village)"
    description: "A historic village on Konya's western outskirts, one of the last Greek-Orthodox villages of central Anatolia before the 1923 population exchange; known for its rock-cut churches, caves and Ottoman-era houses."
    unescoWorldHeritage: false
  - name: "Konya Plain"
    description: "Turkey's vast, mostly treeless breadbasket — a flat, fertile, irrigated steppe plain on the southern edge of the Anatolian Plateau that produces a large share of the country's wheat and sugar beet and is home to Çatalhöyük."
    unescoWorldHeritage: false
  - name: "Lake Tuz (Tuz Gölü)"
    description: "Turkey's second-largest lake and one of the largest hypersaline lakes in the world, lying at the junction of Konya, Aksaray and Ankara provinces; in summer it dries into a brilliant white salt pan supplying a large share of Turkey's salt."
    unescoWorldHeritage: false
culturalTraits:
  - "Turkey's deepest well of Seljuk heritage — Konya was the capital of the Anatolian Seljuk Sultanate in the 12th-13th centuries"
  - "A devoutly conservative, Sufi- and pilgrimage-centred city, home and burial place of Mevlana Rumi"
  - "Known for whirling-dervish (Mevlevi) culture and the annual Rumi Commemoration Week (December)"
  - "Fierce regional pride in its flat, fertile steppe and agrarian bounty"
  - "Formal, hospitable and traditional Central Anatolian social culture"
prideOf:
  - "Mevlana Rumi and the Mevlevi Order — 'come, come, whoever you are'"
  - "Being the wellspring of Seljuk architecture and the capital of the Anatolian Seljuks"
  - "Çatalhöyük and the deep Neolithic roots of the Konya Plain"
  - "Being Turkey's breadbasket and largest province by area"
animals:
  popular:
    - "Central Anatolian Merino sheep"
    - "Anatolian shepherd / Kangal dog (kept by steppe herders)"
    - "Angora goat"
  unique:
    - "Çatalhöyük-era domesticated-cattle lineage (archaeological heritage)"
industries:
  - "Agriculture and agri-food on the vast Konya Plain (wheat, sugar beet, legumes) — Turkey's largest grain-producing and largest farming-area province, often called the national breadbasket"
  - "Sugar production (Konya is Turkey's leading sugar-beet and sugar producer)"
  - "Food processing and refrigerated supply chains"
  - "Carpet and kilim handicrafts (long Konya carpet-weaving tradition)"
  - "Machinery, agricultural equipment and manufacturing"
  - "Defence and aerospace (a major Turkish Aerospace plant)"
  - "Cultural and religious tourism (Mevlana pilgrimage, Çatalhöyük)"
sports:
  - "Football (Konyaspor, Süper Lig)"
  - Basketball
  - "Wrestling and traditional Central Anatolian strength sports"
