      - "Parks and tea gardens on the Konya steppe"
      - "Day trips to Çatalhöyük and the plain's historic caravanserais"
  - season: winter
    items:
      - "Quiet, indoor-friendly winters around the Seljuk monuments"
      - "Mevlana Commemoration Week (December) events and commemorations"
  - season: allYear
    items:
