code: TR-31
name:
  eng: Hatay
  local:
    - languageCode: tur
      value: Hatay
climates:
  - koppenCode: Csa
    description: "Hot-summer Mediterranean — the dominant climate of Hatay's coast and Amik Plain (Antakya): very hot, long, dry summers and cool, rainy, mild winters."
  - koppenCode: Csb
    description: "Warm-summer Mediterranean, the cooler high-altitude variant in the Nur (Amanos) Mountains that run north-south through the province."
landmarks:
  - name: "Antakya (ancient Antioch)"
    description: "Provincial seat and the ancient city of Antioch-on-the-Orontes, for centuries a major Hellenistic, Roman and early-Christian metropolis. The name 'Christian' was first used for the followers of Jesus here (Acts 11:26)."
    unescoWorldHeritage: false
  - name: "Church of St Peter (Saint Pierre Kilisesi), Antakya"
    description: "One of the oldest churches in the world — a natural cave (grotto) church cut into Mount Staurin where the early Christians of Antioch gathered under St Peter. On Turkey's Tentative List for UNESCO World Heritage status."
    unescoWorldHeritage: false
  - name: "Harbiye (Daphne) Waterfalls"
    description: "A cascade and springs about 6-8 km south of Antakya in the district of Defne, set in the valley of ancient Daphne, the legendary suburban pleasure-garden of Roman Antioch famed for its springs and laurel groves."
    unescoWorldHeritage: false
  - name: "Hatay Archaeology Museum (Hatay Arkeoloji Müzesi), Antakya"
    description: "Antakya's archaeological museum, internationally known for its large and exquisite collection of Roman and Byzantine floor mosaics excavated from ancient Antioch, Daphne and Seleucia Pieria."
    unescoWorldHeritage: false
  - name: "Mount Habib-i Neccar"
    description: "The hill rising behind Antakya (the ancient Mount Silpius), whose terraces carry the Habib-i Neccar Mosque and the shrines of Habib al-Najjar ('the beloved carpenter'); a place of pilgrimage shared by Muslims and Christians."
    unescoWorldHeritage: false
  - name: "Vespasianus / Titus Tunnel (Çevlik), Samandağ"
    description: "An ancient water-tunnel cut through solid rock in the 1st-2nd centuries AD to divert the torrent threatening Seleucia Pieria, the port of Antioch. On Turkey's Tentative List for UNESCO World Heritage status."
    unescoWorldHeritage: false
  - name: "Orontes River (Asi Nehri)"
    description: "The river that gave ancient Antioch its epithet 'on the Orontes'; it rises in Lebanon's Bekaa Valley, crosses Syria, runs through Hatay and empties into the Mediterranean in a delta at Samandağ."
    unescoWorldHeritage: false
culturalTraits:
  - "A large, locally distinctive Arab Alawite (Nusayri) community — a heterodox Shia tradition distinct from both mainstream Sunni Islam and Turkish Alevism — that forms a local majority in the southern coastal districts of Samandağ, Defne and Arsuz and is often described as making up 'nearly half' of the province's population"
  - "A genuinely unique political history as the Sanjak of Alexandretta under the French Mandate of Syria, then the short-lived Hatay State (1938-39), annexed to Turkey by the 1939 referendum — the only part of the post-Ottoman Levant to join Turkey from the Mandate"
  - "A diverse Arab (Alawite, Sunni and Christian) and Turkish population living side by side; Arabic is still widely spoken alongside Turkish"
  - "Antioch's ancient Christian heritage — the city where, according to Acts 11, the followers of Jesus were first called 'Christians', with one of the oldest church traditions and the cave Church of St Peter"
  - "A culinary crossroads of Turkish and Arab cuisine — famed as a UNESCO City of Gastronomy (2017) with over 600 signature dishes"
  - "Arabic-influenced religious and seasonal customs, including the Arab Alawite celebration of the Rumi New Year on 14 January"
prideOf:
  - "Hatay's multi-faith coexistence — Alawites, Sunnis, Antiochian Orthodox and other Christians — often celebrated as the 'city of siblings' (kardeşler şehri)"
  - "Being the former Sanjak of Alexandretta / Hatay State, whose 1939 union with Turkey is remembered as 'the return to the homeland'"
  - "Recognition as a UNESCO City of Gastronomy (2017) with a deeply rooted culinary tradition"
  - "The ancient heritage of Antioch, one of the earliest centers of Christianity and a great classical metropolis"
animals:
  popular:
    - "Wild boar (Sus scrofa), common in the Nur/Amanos mountains, Amik Plain and reed beds"
    - "Sea turtles on the Samandağ coast — loggerhead (Caretta caretta) and green (Chelonia mydas) turtles nest on its beaches each summer"
    - "Migratory waterfowl and raptors along the Anatolian-Levantine flyway feeding in Hatay's wetlands"
  unique:
    - "Green sea turtle (Chelonia mydas) — Samandağ beach is one of the most important green-turtle nesting beaches in the Mediterranean"
    - "Nile/African softshell turtle (Trionyx triunguis), a Vulnerable species in the Orontes river delta at Samandağ"
industries:
  - "Agriculture: citrus and olives are major crops — Hatay (notably Dörtyol) is among the leading Turkish provinces for orange/citrus and olive production"
  - "Trade via the Syria border: the Reyhanlı-Cilvegözü crossing is a key Turkey-Syria land gateway for commerce, trucks and, since 2011, humanitarian and refugee movement"
  - "Tourism: Mediterranean coast (Arsuz, Samandağ), Antakya's old city, archaeology and gastronomy tourism"
  - "Industry and logistics: İskenderun hosts Turkey's largest iron-and-steel plant and a major seaport"
sports:
  - "Football (Hatayspor, based in Antakya — the province's flagship club, promoted to the Süper Lig in 2019-20)"
religions:
  - name: "Arab Alawite (Nusayri) Muslim"
    percent: 45.0
    sourceId: pbs-alawite
  - name: "Sunni Muslim"
    percent: 45.0
    sourceId: investinhatay-demography
  - name: "Christian (Antiochian Greek Orthodox, Armenian, Syriac, Maronite and Catholic)"
    percent: 3.0
    sourceId: investinhatay-demography
entertainment:
  - season: dry
    items:
      - "Beaches and swimming/sea-turtle season on the Samandağ and Arsuz coasts"
      - "Harbiye (Daphne) waterfalls and open-air cafés in the hills behind Antakya"
      - "Summer festivals and outdoor dining in Antakya's old town"
  - season: wet
    items:
      - "Hatay Archaeology Museum and the covered Long Bazaar (Uzun Çarşı) of Antakya"
      - "Coffeehouse culture and hammam (traditional bath)"
      - "Künefe salons — sociable dessert-houses serving Antakya künefe hot"
  - season: allYear
    items:
      - "Gastronomy tourism across Hatay's Turkish-Arab fusion cuisine"
traditionalDishes:
  - season: allYear
    items:
      - "Antakya künefe — the signature dessert, fried shredded kadayıf with unsalted cheese and syrup, bearing a geographical-indication registration"
      - "Hatay kaytaz böreği — a traditional minced-meat pastry (registered as an EU geographical indication)"
      - "Hummus — Antakya is famous for its hummus (chickpea purée with tahini, lemon, spices)"
      - "Lahmacun — thin spiced minced-meat flatbread, baked in stone ovens"
      - "Zahter salatası — Hatay thyme salad of wild thyme (zahter) with onion, tomato, olive oil and pomegranate molasses"
      - "Kuşbaşı tava / Belen tava — spiced diced-lamb baked in a tray, a Hatay specialty"
      - "Oruk (içli köfte) — the local stuffed bulgur köfte, and surke, a spicy sun-dried cheese"
  - season: dry
    items:
      - "Fresh summer mezze and cold salads dressed with Hatay olive oil and pomegranate molasses"
      - "Citrus from the Dörtyol orchards — oranges and lemons"
seasonCalendar:
  - season: wet
    months: [11, 12, 1, 2, 3]
  - season: dry
    months: [4, 5, 6, 7, 8, 9, 10]
businessRhythm:
  restDays: []
  notes: "Follows Turkey's national calendar — nationwide public holidays and Ramadan/Bayram observance apply as everywhere (national legal rules sit in the country file). Observance is widespread among Hatay's Sunni and Alawite populations, and in Antakya restaurant/café hours shift for iftar/sahur during Ramadan. Locally, citrus and olive harvest in autumn-winter and the Reyhanlı-Cilvegözü border gate are major seasonal drivers."
  typicalWorkHours: "09:00-18:00 Mon-Fri."
