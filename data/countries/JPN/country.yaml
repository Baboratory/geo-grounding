sources:
  - id: moj-jpn-constitution
    name: "Constitution of Japan (1946) — full text"
    publisher: "Government of Japan (via the National Diet Library / Prime Minister's Office English translation)"
    url: "https://japan.kantei.go.jp/constitution_and_government_of_japan/constitution_e.html"
    year: 1946
    accessedDate: "2026-09-21"
    note: "The Constitution makes no provision for a national official language; Japanese is the de facto national language."
  - id: moi-jpn
    name: "How Japan administers language — English-language academic summary"
    publisher: "Oxford Research Encyclopedia of Linguistics (academic source; not a Government of Japan publication despite the sourceId name)"
    url: "https://oxfordre.com/linguistics/display/10.1093/acrefore/9780199738930.001.0001"
    year: 2021
    accessedDate: "2026-09-21"
    note: "Confirms Japan has no statutory official language and Japanese serves as the de facto national language; Ainu and Ryukyuan are recognized without official status."
