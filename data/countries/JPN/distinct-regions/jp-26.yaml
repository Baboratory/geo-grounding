industries:
  - "Tourism and hospitality (a leading global cultural destination)"
  - "Traditional crafts and textiles (Nishijin-ori)"
  - "High-tech industry (Kyocera, Nintendo are headquartered in Kyoto)"
  - "Sake brewing and confectionery"
sports:
  - "Baseball"
  - "Football"
