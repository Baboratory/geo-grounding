name:
  eng: Kyoto (prefecture)
  local:
    - languageCode: jpn
      value: 京都府 (きょうとふ)
climates:
  - koppenCode: Cfa
    description: "Humid subtropical climate with hot humid summers (Kyoto is in a basin that intensifies the heat) and cold, mild winters."
landmarks:
  - name: Kinkaku-ji (Golden Pavilion)
    description: "A Zen temple whose top two floors are covered in gold leaf, beside a mirror pond (UNESCO 1994)."
    unescoWorldHeritage: true
  - name: Kiyomizu-dera
    description: "A hillside Buddhist temple with a famous wooden stage and city views (UNESCO 1994)."
    unescoWorldHeritage: true
  - name: Fushimi Inari-taisha
    description: "A vast Shinto shrine famous for thousands of red torii gates snaking up Mount Inari."
  - name: Gion District
    description: "Kyoto's iconic geisha quarter, with preserved machiya townhouses and tea houses."
culturalTraits:
  - "Japan's ancient imperial capital and the heart of traditional Japanese culture"
  - "Over a thousand Buddhist temples and Shinto shrines, gardens, tea ceremony and craft traditions"
  - "A refined, formal artistic heritage: kimonos, tea ceremony, kaiseki cuisine and maiko/geisha"
prideOf:
  - "Seventeen UNESCO World Heritage sites and an incomparable historical legacy"
  - "Being the birthplace of the tea ceremony, geisha culture and classic kaiseki dining"
  - "Preserving traditional crafts: Kyo-yaki pottery, Nishijin weaving, Wagashi confectionery"
