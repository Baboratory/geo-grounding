# Spanish is the sole official language (Const. 1982 Art. 6). Indigenous and
# Afro-Honduran languages are recognized/protected but NOT co-official, so they
# appear as locallySpoken rows (never the 1.0 official flag). Miskito (miq, ISO
# 639-3 'miq' — NOT 'mis', which is the 'miscellaneous/uncoded' special code)
# ~80,007 / 8,303,771 per the 2013 census; Garifuna (cab) ~43,111 / 8,303,771.
# English and Bay Islands Creole on the north coast are a small ESTIMATE (~0.002).
# NOTE: the Lenca are the largest indigenous people (~5.46%) but the Lenca
# language is EXTINCT with NO ISO 639-3 code, so they appear only as an ethnic
# group and cultural trait, never as a language row.
ethnicGroups:
