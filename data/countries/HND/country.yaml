legalConstraints:
  - topic: "official language"
    description: "Spanish is the SOLE official language of Honduras (Constitución 1982 Art. 6: 'El idioma oficial de Honduras es el español. El Estado protegerá su pureza e incrementará su enseñanza.'). The State legally recognizes the indigenous and Afro-Honduran communities and protects their languages and education, but no indigenous language is co-official."
    sourceId: constitucion-1982
  - topic: "minority language rights"
    description: "Honduras ratified ILO Convention No. 169 concerning Indigenous and Tribal Peoples (1995), which obliges recognition and protection of indigenous languages, cultures and territories. Honduran law/curricula mandate bilingual, mother-tongue education for indigenous peoples on the Atlantic coast and in La Mosquitia — recognition/protection, not official-language co-status."
    sourceId: ilo-169
  - topic: "currency / legal tender"
    description: "The national currency is the Lempira (HNL), issued as legal tender solely by the Banco Central de Honduras. The US dollar is not legal tender, though it circulates informally in some trade sectors."
    sourceId: bch
  - topic: "ethnicity/religion data collection"
    description: "The INE census collects ethnicity (pueblo de pertenencia) but does NOT record religion. Religion figures are survey estimates (CID-Gallup), not census statistics — do not present them as census data."
    sourceId: usdos-irf-2023
paymentCulture:
  popularMethods:
    - "Cash (lempira) — dominant for everyday retail, markets and the informal/mass economy"
    - "Visa and Mastercard-branded debit/credit cards — no domestic card scheme"
    - "Mobile money / digital wallets (e.g. Tigo Money, CHIP, banca móvil) — growing, low bank penetration"
    - "Bank transfers / interbank rails (ACH-style settlement)"
    - "International remittances — a major driver (cash pickup and mobile/digital rails)"
  tipping:
    expected: true
    typicalAmount: "About 10% in nicer restaurants; a 10% 'propina' ('servicio') is commonly added to restaurant bills"
    autoIncludedInBill: true
    note: "Qualitative and customary — no official national payment-share study was located, so no paymentMethodShares are asserted. Cash remains most common in the mass economy; bank and mobile-money penetration is partial."
communicationStyle:
  contextLevel: mixed
  formalityNorms: "Warm, relational and polite. Business Spanish uses professional honorifics (Licenciado/a, Doctor/Doctora, Ingeniero/a); first names come once a trusting relationship forms. In indigenous communities (Lenca highlands, Miskito, Garifuna) extra warmth and respect for community elders is expected."
  greetingNorms: "Firm handshake with eye contact in business; a hug or kiss on the cheek among friends and acquaintances. A friendly 'Buenos días / buenas tardes' and inquiry after family is normal."
  meetingEtiquette: "Meetings are relational — expect warm small talk before the agenda. Punctuality is relaxed ('hora catracha'); arrive on time but do not take a late host as disrespect. Decisions flow through senior, personal relationships and take time."
  topicsToAvoid:
    - "The 2009 constitutional/political crisis and current polarized politics"
    - "Political corruption and crime/insecurity discussions in casual settings"
    - "Personal wealth or income display"
    - "Speaking as an outsider about Miskitu/Garifuna/Lenca community struggles or the La Mosquitia land disputes, except with care"
  giftGivingNotes: "Not expected at a first business meeting. When visiting a home, a modest gift (coffee, regional chocolate/cacao, fruit) is welcome. Avoid anything that could read as a bribe in a business context."
