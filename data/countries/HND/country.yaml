isSovereign: true
# Classified unitary-large: meets 2 of the 3 DESIGN.md criteria even though its
# ~9.4M population (USDoS 2023) is below the >20-25M threshold. (2) The State
# legally recognizes and protects the indigenous and Afro-Honduran communities
# and their languages (Const. 1982 Art. 6 makes Spanish the SOLE official
# language, so none are co-official; but recognition/protection is real — ILO
# Convention 169 ratified 1995, and mother-tongue education on the Atlantic coast
# and in La Mosquitia), and (3) widely recognized regional identities exist — the
# Garifuna Caribbean north coast, the English-speaking Bay Islands, La Mosquitia
# (Miskitu self-governed territory) and the Lenca highlands. The state is
# constitutionally unitary (18 departments) so NOT federal. Curated regions:
# Francisco Morazán (HN-FM), Cortés (HN-CR), Gracias a Dios (HN-GD) + WHOLE.
governanceType: unitary-large
iso3166_2_prefix: "HN"
hasSubdivisions: true
