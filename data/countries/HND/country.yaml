sources:
  - id: constitucion-1982
    name: "Constitución de la República de Honduras (1982, with reforms to 2004) — Artículo 6"
    publisher: "Gobierno de Honduras (text hosted by Tribunal Superior de Cuentas / VERTIC)"
    url: "https://tsc.gob.hn/web/leyes/Constitucion_de_la_republica.pdf"
    year: 1982
    accessedDate: "2026-09-17"
    note: "Art. 6: 'El idioma oficial de Honduras es el español. El Estado protegerá su pureza e incrementará su enseñanza.' Basis for the spa official 1.0 row and the official-language legal constraint."
  - id: ine-censo-2013
    name: "XVII Censo de Población y VI de Vivienda 2013 — Resultados (pueblo de pertenencia)"
    publisher: "Instituto Nacional de Estadística (INE) Honduras"
    url: "https://ine.gob.hn/censo-de-poblacion-y-vivienda-2013"
    year: 2013
    accessedDate: "2026-09-17"
    note: "Census base population 8,303,771. Self-identified indigenous/Afro-Honduran counts total ~717,618 (~8.6%): Lenca 453,672, Miskito 80,007, Garifuna 43,111, Maya-Ch'orti' 33,256, Tolupan 19,033, Bay Creoles 12,337, Nahua 6,339, Pech 6,024, Tawahka 2,690."
  - id: ine-proyecciones-2022
    name: "Principales Indicadores Demográficos 2022 (based on 2013 census projections)"
    publisher: "Instituto Nacional de Estadística (INE) Honduras"
    url: "https://temp.ine.gob.hn/wp-content/uploads/2025/05/Principales-Indicadores-Demograficos-2022.pdf"
    year: 2022
    accessedDate: "2026-09-17"
    note: "States the 2013 census total = 8.3M and gives projected 2022 total population 9,597,739. Used for the governance classification (population far below the >20-25M threshold) and projection-era denominators."
  - id: usdos-irf-2023
    name: "2023 Report on International Religious Freedom: Honduras"
    publisher: "U.S. Department of State, Office of International Religious Freedom"
    url: "https://www.state.gov/reports/2023-report-on-international-religious-freedom/honduras/"
    year: 2023
    accessedDate: "2026-09-17"
    note: "US population estimate 9.4M (midyear 2023). Religion estimates from a CID-Gallup 2020 poll: 48% evangelical Protestant, 34% Catholic. FLAGGED as estimates — the census does not record religion."
  - id: ilo-169
    name: "ILO Convention No. 169 concerning Indigenous and Tribal Peoples (ratified by Honduras 1995)"
    publisher: "International Labour Organization / Congress of Honduras"
    url: "https://normlex.ilo.org/"
    year: 1995
    accessedDate: "2026-09-17"
    note: "Ratification obliges recognition and protection of indigenous languages, cultures and territories. Basis for the minority-language legal constraint — recognition/protection, not official-language co-status."
  - id: bch
    name: "Lempira — national currency / Banco Central de Honduras"
    publisher: "Banco Central de Honduras (BCH)"
    url: "https://www.bch.hn/"
    accessedDate: "2026-09-17"
    note: "The Lempira (HNL) is the national legal tender, coined/issued solely by the BCH; the US dollar is not legal tender."
  - id: iana-timezones
    name: "IANA Time Zone Database"
    publisher: "Internet Assigned Numbers Authority (IANA)"
    url: "https://www.iana.org/time-zones"
    accessedDate: "2026-09-17"
    note: "America/Tegucigalpa = UTC-6, no daylight saving time observed; the sole timezone for Honduras."
  - id: estimate-flag
    name: "Estimated / secondary figures — marked as non-primary"
    publisher: "this factsheet"
    url: "https://ine.gob.hn/"
    accessedDate: "2026-09-17"
    note: "Placeholder sourceId for values that are estimates or could not be verified against a directly-fetchable primary source: the spa locallySpoken (~0.97) and eng locallySpoken (~0.002) shares."