  code: SAR
  symbol: "﷼"
  name: Saudi riyal
legalConstraints:
  - topic: "data protection regime"
    description: "The Personal Data Protection Law (PDPL, Royal Decree M/19 of 2021, effective 14 September 2023) regulates the processing of personal data within the Kingdom and of residents of the Kingdom by entities outside it. It is overseen by the Saudi Data and AI Authority (SDAIA); it sets out lawful-basis requirements, data-subject rights, security obligations and cross-border transfer rules."
    sourceId: sau-pdpl-m19
  - topic: "price display and VAT"
    description: "Prices must be displayed clearly in Saudi riyals; a 15% value-added tax (VAT) is applied to most goods and services and is normally included in displayed retail prices, so final prices are typically VAT-inclusive."
    sourceId: sau-zatca-vat
  - topic: "consumer withdrawal right"
    description: "The E-Commerce Law (Royal Decree M/7 of 2019) gives consumers a right to cancel an online purchase and return the product during the agreed withdrawal period, and obliges online sellers to disclose the return policy; the Consumer Protection Law protects against false advertising, defective goods and exploitation."
    sourceId: sau-ecommerce-m7
  - topic: "trading hours and prayer closures"
    description: "Businesses close briefly for the five daily Islamic prayers, and most offices and many shops close on Friday (the main weekly rest day); working weeks commonly run Sunday to Thursday in the public sector."
    sourceId: sau-labor-law
paymentMethodShares:
  - method: "mada card (national debit network)"
    percent: 55.0
    sourceId: sau-sama-payments-2023
  - method: "cash"
    percent: 30.0
    sourceId: sau-sama-payments-2023
  - method: "instant transfer / mobile wallet (SARIE, STC Pay, Apple Pay)"
    percent: 12.0
    sourceId: sau-sama-payments-2023
  - method: "other (international cards, bank transfer, BNPL)"
    percent: 3.0
    sourceId: sau-sama-payments-2023
paymentCulture:
  popularMethods:
    - "mada — the national debit/ATM card network, ubiquitous and used for the large majority of point-of-sale and online payments"
    - "SARIE — the instant real-time payment system of the Saudi Central Bank (SAMA), used for phone-number transfers"
    - "STC Pay (now 'STC Pay'/'My Tamara') and Apple Pay/Google Pay via local banks — growing rapidly"
    - "SADAD — the national bill-payment service for government and utility invoices"
  tipping:
    expected: false
    typicalAmount: "10%"
    autoIncludedInBill: false
    note: "Tipping is appreciated but not obligatory; 10% in restaurants and cafés is common and some venues add a discretionary service charge. Many locals round up or leave a modest cash tip."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Hospitality and personal relationships matter greatly. Address people by their title and first name; wait to move to first-name basis. A warm, respectful and indirect style is preferred over blunt directness. Showing respect to elders and to family is important."
  greetingNorms: "The greeting 'As-salamu alaykum' ('peace be upon you') with the reply 'Wa alaykum as-salam' is standard. Men greet with a handshake, often accompanied by 'Kayf halak' (how are you); it is customary to ask about family. Traditional Gulf greeting can involve touching noses or kissing the shoulder among close Arab friends. Physical contact between men and unrelated women is generally avoided; greetings with women are verbal or a nod unless the woman offers her hand."
  meetingEtiquette: "Punctuality is appreciated but meetings may start a little late. Meetings open with tea, coffee (qahwa) and hospitality before business; jumping straight to business is considered impolite. Titles and hierarchy matter — deference to senior people is expected. Decisions may be slower and relationship-based. Do not show the soles of your feet; use the right hand for eating, shaking hands and passing items."
  topicsToAvoid:
    - "Religion, except respectfully and in context — Islam is integral and deeply respected"
    - "Criticism of the royal family or government"
    - "Comments about Saudi women's roles or dress"
    - "Politics of the region and sensitive neighbours"
    - "Alcohol and pork (both prohibited in public life)"
  giftGivingNotes: "Giving gifts is appreciated when a relationship is established. A good-quality, tactful gift is welcome; sweets, dates, perfumes (oud) and quality items are safe. Use both senses: offer and receive gifts with the right hand. Do not give alcohol or pork products. It is polite to open a gift right away. Be gracious and non-pushy when offering."
