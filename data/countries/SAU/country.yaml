sources:
  - id: sau-constitution-art1
    name: "Basic Law of Governance, Article 1 (official language and religion)"
    publisher: "Government of the Kingdom of Saudi Arabia"
    url: "https://www.the-legal.com/LawArtciles/SaudiArabiaBasicLawOfGovernance.pdf"
    year: 1992
    accessedDate: "2026-09-20"
    note: "Establishes Arabic as the language and Islam as the religion of the Kingdom."
  - id: sau-census-2022
    name: "2022 Saudi Census (GASTAT)"
    publisher: "General Authority for Statistics (GASTAT)"
    url: "https://www.stats.gov.sa/en/1007"
    year: 2022
    accessedDate: "2026-09-20"
    note: "Population composition: Saudi nationals ~74% and foreign nationals ~26%; the foreign share varies by source and year. Arabic is the spoken language of the population; English is common among the expatriate and business community."
  - id: sau-ef-english-2023
    name: "EF English Proficiency Index 2023"
    publisher: "EF Education First"
    url: "https://www.ef.com/wwen/epi/"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Rough share of residents able to hold an English conversation (~15% of total population, higher among Saudis under 40 and among expatriates); English is widely used in business, hospitality and government dealings."
  - id: sau-pdpl-m19
    name: "Personal Data Protection Law (PDPL), Royal Decree M/19 of 2021"
    publisher: "Saudi Data and AI Authority (SDAIA)"
    url: "https://sdaia.gov.sa/en/Research/Pages/DataProtection.aspx"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Core national data-protection law; effective 14 September 2023 with a compliance grace period. Covers lawful basis, purpose limitation, data-subject rights, security and cross-border transfer."
  - id: sau-zatca-vat
    name: "ZATCA VAT rules and price display"
    publisher: "Zakat, Tax and Customs Authority (ZATCA)"
    url: "https://zatca.gov.sa/"
    year: 2023
    accessedDate: "2026-09-20"
    note: "15% VAT applies to most goods and services; retail prices are commonly shown VAT-inclusive in Saudi riyals."
  - id: sau-ecommerce-m7
    name: "E-Commerce Law (Royal Decree M/7 of 2019)"
    publisher: "Government of the Kingdom of Saudi Arabia"
    url: "https://laws.boe.gov.sa/"
    year: 2019
    accessedDate: "2026-09-20"
    note: "Consumer right to cancel online purchases, disclosure of return policies, and protections against deceptive practices."
  - id: sau-labor-law
    name: "Saudi Labor Law and weekly work schedule"
    publisher: "Ministry of Human Resources and Social Development"
    url: "https://www.mhrsd.gov.sa/"
    year: 2020
    accessedDate: "2026-09-20"
    note: "Standard working week and rest-day arrangements (Friday rest day; prayer-time closures in retail)."
  - id: sau-sama-payments-2023
    name: "SAMA payment-system statistics and mada transaction data (2023)"
    publisher: "Saudi Central Bank (SAMA)"
    url: "https://www.sama.gov.sa/en-US/SaudiPages/default.aspx"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Approximate point-of-sale and payment-method shares: mada card ~55%, cash ~30%, instant transfer/mobile wallet ~12%, other ~3%. Composite estimate derived from SAMA-reported non-cash transaction share (63% in 2023) and mada POS data."
