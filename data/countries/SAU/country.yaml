capital: Riyadh
isSovereign: true
# Classified unitary-large: population ~36M exceeds the threshold, and while
# Arabic is the sole official language the country has a widely recognized
# cultural-historical regional identity (the historic Hejaz, Najd and Eastern
# Province). Real ISO 3166-2 region files are curated (a representative subset)
# alongside the WHOLE fallback.
governanceType: unitary-large
iso3166_2_prefix: SA
hasSubdivisions: true
languageUsage:
  - languageCode: ara
    domain: official
    speakersShare: 1.0
    sourceId: sau-constitution-art1
  - languageCode: ara
    domain: locallySpoken
    speakersShare: 1.0
    sourceId: sau-census-2022
  - languageCode: eng
    domain: foreign
    speakersShare: 0.15
    sourceId: sau-ef-english-2023
ethnicGroups:
