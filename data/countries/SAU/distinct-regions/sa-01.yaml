culturalTraits:
  - "The political and administrative heart of the Kingdom — seat of government and the royal family"
  - "The historic capital of the house of Saud and of the Najd region"
  - "A fast-modernising metropolis with grand giga-projects and a growing cultural scene"
  - "Deep-rooted Najdi identity — hospitality, conservatism and pride in Arab heritage"
prideOf:
  - "Diriyah and the founding history of the Kingdom"
  - "The rapid transformation into a global business and investment hub"
  - "Najdi traditions, poetry and hospitality"
  - "Modern landmarks like Kingdom Centre and the King Abdulaziz Historical Centre"
