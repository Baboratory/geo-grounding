businessRhythm:
  restDays:
    - friday
  typicalWorkHours: "Government and corporate offices commonly run Sunday-Thursday, roughly 8:00am-5:00pm, with a prayer and lunch break midday; many international firms also observe part of Saturday off."
  lunchBreakTiming: "A midday break around 12:00-1:00pm for Dhuhr prayer and lunch is standard."
  notableShutdownPeriods:
    - period: Eid al-Fitr and Eid al-Adha
      description: "Offices close for the Eid holidays; shops may keep shorter hours."
    - period: Ramadan
      description: "Working hours shorten during Ramadan; a late-evening business life develops."
  notes: "Friday is the main rest day. Riyadh is the nerve centre of the Kingdom — expect a formal, hierarchical and relationship-driven business culture."
