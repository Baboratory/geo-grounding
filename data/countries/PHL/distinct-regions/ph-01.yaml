code: PH-01
name:
  eng: Ilocos Region (Region I)
  local:
    - languageCode: fil
      value: Rehiyong Ilocos
climates:
  - koppenCode: Am
    description: Tropical monsoon climate on the Ilocos lowlands, with a pronounced wet season and a drier warm-dry period.
landmarks:
  - name: Vigan City Cathedral (St. Paul's)
    description: Baroque Roman Catholic cathedral in Vigan, capital of Ilocos Sur, part of the Historic City of Vigan UNESCO World Heritage Site.
  - name: Paoay Church (San Agustin Church)
    description: Baroque Roman Catholic church in Paoay, Ilocos Norte, inscribed as part of the "Baroque Churches of the Philippines" UNESCO World Heritage Site.
  - name: Bangui Windmills
    description: Rows of wind turbines along the Ilocos Norte coastline near Bangui, one of the region's most recognizable modern landmarks.
culturalTraits:
  - "Heartland of the Iloko (Ilocano) people and language, one of the constitutionally recognized regional languages"
  - "Deep-rooted Roman Catholic faith with a strong fiesta and processional tradition, and the region's iconic Bangui windmills and coastal dunes"
prideOf:
  - "The Ilocano language and distinct regional identity"
  - "The UNESCO-listed heritage of Vigan and the Baroque churches of Ilocos (Paoay)"
animals:
  popular:
    - Carabao (water buffalo) of the rice paddies
    - Philippine dwarf (pygmy) hog-deer in lowland forest
  unique:
    - Philippine eagle (rare, in the northern cordilleras)
industries:
  - Rice and vegetable farming in the northern lowlands
  - Tobacco, garlic and vinegar production across the Ilocos lowlands
  - Tourism focused on Vigan and the rice-terrace landscape
  - Weaving and handicrafts
sports:
  - Basketball
  - Volleyball
  - Association football
  - Hiking and mountaineering in the Cordillera
entertainment:
  - season: allYear
    items:
      - "Fiestas and religious processions honoring local patron saints"
  - season: summer
    items:
      - "Santacruzan May processions"
  - season: winter
    items:
      - "Simbang Gabi (dawn Masses before Christmas) and cool-weather feasts"
traditionalDishes:
  - season: allYear
    items:
      - "Pinakbet (vegetables stewed in bagoong shrimp paste)"
      - "Adobo and sinigang as elsewhere in the country"
  - season: winter
    items:
      - "Warm dinengdeng and pinapaitan-style soups during the cool season"
traditionalClothing:
  - season: allYear
    items:
      - "Barong Tagalog for men and the terno for women at formal and fiesta occasions"
seasonCalendar:
  - season: spring
    months: [3, 4, 5]
  - season: summer
    months: [6, 7, 8]
  - season: autumn
    months: [9, 10, 11]
  - season: winter
    months: [12, 1, 2]
businessRhythm:
  restDays:
    - sunday
  notes: "Standard Monday-Friday working week; Sunday is a rest day. Village markets and fiestas pause for religious feasts, and vinegar and tobacco markets are busiest after harvest."
sources: []
