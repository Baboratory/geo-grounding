    publisher: "Philippine Statistics Authority"
    url: "https://psa.gov.ph/node/1684041577"
    year: 2020
    accessedDate: "2026-09-21"
    note: "Household-language shares from the 2020 CPH: Tagalog 39.9%, Bisaya/Binisaya 16.0%, Hiligaynon 7.3%, Ilocano 7.1%, Cebuano 6.5%, Bikol 3.9%, Waray 2.6%, Kapampangan 2.4%, Maguindanao 1.4%, Pangasinan 1.3%. Used as a proxy for resident speaker share."
