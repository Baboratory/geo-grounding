# Filipino (based on Tagalog) is the national language and co-official with
# English (1987 Constitution, Article XIV). The 2020 Census of Population and
# Housing reports the language spoken at home per household: Tagalog ~39.9%,
# Bisaya/Binisaya ~16.0% (grouped here under Cebuano), Hiligaynon 7.3%,
# Ilocano 7.1%, Bikol 3.9%, Waray 2.6%, Kapampangan 2.4%, Pangasinan 1.3%.
# These are household-language shares, expressed as a proxy for resident
# speaker share; the country's major regional languages are constitutionally
# recognized auxiliary official languages in their regions.
