    name: "The 1987 Constitution of the Republic of the Philippines (Article XIV, ss.6-7)"
    publisher: "Government of the Republic of the Philippines"
    url: "https://lawphil.net/consti/cons1987.html"
    year: 1987
    accessedDate: "2026-09-21"
    note: "Declares Filipino the national language (s.6) and Filipino and English the official languages, with the regional languages as auxiliary official languages in their respective regions (s.7)."
