legalConstraints:
  - topic: "value-added tax"
    description: "A 12% value-added tax (VAT) applies to the sale, barter, exchange or lease of goods, properties and services in the Philippines (National Internal Revenue Code, ss.106, 108); exports are zero-rated and certain goods/services are exempt."
    sourceId: nirc-phl
  - topic: "consumer protection"
    description: "The Consumer Act of the Philippines (RA 7394) protects consumers against hazards to health and safety, deceptive/unfair/unconscionable sales acts, and provides rights of redress and consumer representation in policy."
    sourceId: consumer-act-phl
  - topic: "data protection"
    description: "The Data Privacy Act of 2012 (RA 10173) governs the collection, holding, processing and use of personal information, establishes lawful-processing criteria, grants data-subject rights, and created the National Privacy Commission to enforce it."
    sourceId: data-privacy-phl
paymentCulture:
  popularMethods:
    - "Cash remains very widely used for everyday retail transactions"
    - "E-wallets and digital payment apps (GCash, Maya/PayMaya, ShopeePay) are now dominant for online and many in-store payments"
    - "Debit and credit cards (Visa, Mastercard) and bank transfers (instaPay, PESONet) are common, especially in urban areas"
    - "QR-code payments (via banks and e-wallets) are growing rapidly"
  tipping:
    expected: false
    autoIncludedInBill: false
    typicalAmount: "Tipping is not customary and not expected; a service charge is occasionally added in tourist-facing restaurants and hotels. Many Filipinos round up or leave a small amount for good service, but there is no obligation."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Use respectful honorifics ('po', 'opo') and titles; first names are used among friends but elders and superiors are addressed with deference. Seniority and authority are respected."
  greetingNorms: "A warm smile with a light handshake or a slight bow; close friends and family may exchange a light hug or cheek touch. 'Kumusta ka?' (How are you?) is a common opener."
  meetingEtiquette: "Relationships matter as much as the agenda; expect warm pleasantries before business. Decisions often involve consensus and respect for hierarchy; avoid confrontation and always save face for the other party."
  topicsToAvoid:
    - "Political figures and the Marcos–Duterte eras (highly polarizing)"
    - "The Muslim-majority south in Mindanao and insurgent conflicts"
    - "Personal income and family finances"
  giftGivingNotes: "Gifts are appreciated at social visits (fruit, pastries, small items); give and receive with both hands or the right hand. Avoid giving an odd number of flowers or items in black/white wrappers."
