# Classified unitary-large: the Philippines is a unitary presidential republic
# with a population of ~110M (2020 census), far above the small-state threshold,
# and a real, government-recognized cultural-historical regional divide: the
# 1987 Constitution (Art. XIV, ss.6-7) declares Filipino the national language
# and Filipino and English the official languages, while the major regional
# languages (Cebuano, Ilocano, Hiligaynon, Kapampangan, Pangasinan, Bikol,
# Waray) are "auxiliary official languages in their respective regions". Real
# ISO 3166-2 region codes (PH-xx) are used; WHOLE is the national fallback.
governanceType: unitary-large
iso3166_2_prefix: PH
hasSubdivisions: true
