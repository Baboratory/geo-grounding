culturalTraits:
  - "Ukraine's capital and political, economic and cultural centre"
  - "A resilient city — site of the 2013-2014 Euromaidan and of fierce defence in 2022"
  - "Thriving tech, creative and café culture"
  - "Historic heartland of Ukrainian identity (the 'Mother of Rus cities')"
prideOf:
  - "Independence and the Euromaidan heritage"
  - "Golden-domed churches and UNESCO-listed monasteries"
  - "A modern IT and start-up scene"
  - "Chestnut trees and the greenery along the Dnipro"
animals:
  popular:
    - Hooded crow
    - Grey heron (Dnipro islands)
  unique:
    - Dnipro river islands' birdlife (herons, terns)
industries:
  - "Information technology and start-ups (the 'hubs' of the Ukrainian IT boom)"
  - "Finance, banking and corporate services"
  - "Media and creative industries"
  - "Government and public administration"
  - "Tourism and hospitality"
sports:
  - Football (Dynamo Kyiv)
  - Basketball
  - Boxing
  - Chess
