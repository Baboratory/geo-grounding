businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices typically run 9:00am-6:00pm; Kyiv's tech and creative sectors often keep flexible or later hours. Wartime curfews can shorten evening activity."
  lunchBreakTiming: "A ~1-hour lunch around 1:00pm; the city has a dynamic café and lunch culture."
  notableShutdownPeriods:
    - period: early January
      description: "New Year holidays largely close offices, as across Ukraine."
  notes: "Sunday is the standard rest day; shops and restaurants open daily. Kyiv Day (last weekend of May) and Euro day mark major civic celebrations."
