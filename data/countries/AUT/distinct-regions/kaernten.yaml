code: AT-2
name:
  eng: Carinthia
  local:
    - languageCode: deu
      value: Kärnten
    - languageCode: slv
      value: Koroška
climates:
  - koppenCode: Cfb
    description: Mild central-Alpine climate of the southern valleys and lake basins — among Austria's warmest and sunniest regions, with hot summers and relatively mild winters in the Klagenfurt basin.
  - koppenCode: Dfb
    description: Cooler continental conditions in the higher mountain valleys of the Hohe Tauern and Karawanken, with cold winters and substantial snow.
landmarks:
  - name: Lake Wörthersee (Wörthersee)
    description: The warm, blue-green lake near Klagenfurt, Austria's summer-lake icon, ringed by resorts and the Renaissance castle of Maria Lankowitz.
  - name: Klagenfurt Old Town and the Lindwurm
    description: The Carinthian capital's arcaded old town, centred on the Alter Platz with the city's legendary dragon (Lindwurm) fountain.
  - name: The Gurk Cathedral (Dom zu Gurk)
    description: A masterpiece of Romanesque architecture and frescoes, one of Austria's most sacred medieval sites.
  - name: Grossglockner and the Hohe Tauern National Park
    description: Austria's highest peak and its largest national park, shared with Salzburg and East Tyrol, accessible via the Grossglockner High Alpine Road.
  - name: Burg Landskron and the Ossiacher See
    description: The hilltop castle ruins and clear lakes of the central Carinthian basin.
culturalTraits:
  - The southernmost Austrian Land, home to the autochthonous Carinthian Slovenian minority (with officially protected Slovenian rights in its southern municipalities)
  - A strong alpine-lake and 'sunny south' identity, warmer and more Mediterranean in feel than the rest of Austria
  - Distinct rural and mountaineering traditions of the Hohe Tauern and Karawanken
  - Bilingual street signs and place names in the Slovenian-border areas reflect the region's mixed heritage
  - Warm, relaxed sociability ('Kärntner Gemütlichkeit')
prideOf:
  - Its lakes (Wörthersee, Ossiacher See, Millstätter See) and famously sunny climate
  - The high mountains, from the Grossglockner to the Karawanken
  - A rich history of copper, iron and Alpine farming
  - Its welcoming, unpretentious character and cultural diversity
animals:
  popular:
    - "The Alpine ibex and marmots in the Hohe Tauern National Park"
    - "The golden eagle in the high peaks"
    - "Otters and water birds around the lakes"
  unique:
    - "The Carinthian 'Kärntner' own grey cattle and the native Alpine salamander in the karst springs"
industries:
  - "Tourism — the summer lake resorts and winter ski areas"
  - "Hydroelectric power (Carinthia's rivers are major energy producers)"
  - "Machinery and metal engineering (parts of the Austrian industrial south)"
  - "Agriculture, forestry and Alpine dairy farming"
  - "Craft, food (charcuterie) and the wood sector"
sports:
  - "Summer: swimming, sailing and watersports on the lakes"
  - "Alpine skiing in winter (Ankogel, Nassfeld, the Katschberg)"
  - Hiking and mountaineering in the Hohe Tauern and Karawanken
  - Cycling and mountain biking
  - "Ice hockey and football (the Klagenfurt KAC is a historic ice-hockey club)"
