businessRhythm:
  restDays:
    - sunday
  notes: "Sunday closure standard except in lakeside tourist resorts. The business year is strongly seasonal: a lively summer lake season (May-September) and a winter ski season, with a slower shoulder in late autumn and early spring. Many small shops close for a midday break and on Saturday afternoons."
