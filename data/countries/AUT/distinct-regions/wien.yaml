code: AT-9
name:
  eng: Vienna
  local:
    - languageCode: deu
      value: Wien
climates:
  - koppenCode: Cfb
    description: Temperate transitional climate at the eastern edge of the Alps — relatively mild with warm summers, cool winters, and moderate year-round rainfall, and a noticeable urban heat-island effect in the city.
landmarks:
  - name: Historic Centre of Vienna
    description: The UNESCO-listed old town with St Stephen's Cathedral, the Hofburg palace complex and the elegant boulevards of the Ringstrasse.
    unescoWorldHeritage: true
  - name: Schönbrunn Palace and Gardens
    description: The vast baroque summer residence of the Habsburg dynasty, with its gardens, orangery and zoo — a UNESCO World Heritage site.
    unescoWorldHeritage: true
  - name: Vienna State Opera (Wiener Staatsoper)
    description: One of the world's leading opera houses on the Ringstrasse, home of the famous Vienna Philharmonic's New Year's Concert.
  - name: Museumsquartier and the Secession
    description: Vienna's art quarters, from the historic Museumsquartier to the art-nouveau Secession building (the 'Beethoven Frieze' and Klimt's 'Beethoven Frieze' adjoin it).
  - name: The Viennese Coffeehouses and the Danube
    description: The café culture recognised by UNESCO, and the Danube island and riverside leisure areas of the city.
culturalTraits:
  - World capital of classical music — Mozart, Beethoven, Brahms, Mahler and the Vienna Philharmonic
  - Refined coffeehouse and 'Kaffeehauskultur', a UNESCO-listed intangible heritage
  - Viennese humour and quick-witted irony, with a distinctive tone of gentle pessimism
  - Cosmopolitan, cultured and multilingual, shaped by its imperial past and immigrant communities
  - A love of the Kunst (art), Musik (music) and the celebrated 'Lebensart' (way of life)
prideOf:
  - Its status as a global capital of music, art and ideas
  - A famously high quality of life, consistently ranked among the world's most liveable cities
  - The grandeur and continuity of its imperial and cultural heritage
  - Its sophisticated café, culinary and festive traditions
animals:
  popular:
    - "Urban red foxes and hedgehogs in the parks and gardens"
    - "Grey squirrels and diverse songbirds in the Stadtpark and at the Danube"
    - "The famous Lipizzaner horses of the Spanish Riding School (housed in the Hofburg)"
  unique:
    - "The Lipizzaner: the world-renowned classical dressage lineage of the Spanish Riding School"
industries:
  - "Finance, insurance and professional services"
  - "Tourism and hospitality"
  - "The public sector and international organisations (UN, IAEA and EU agencies)"
  - "Media, publishing and the creative industries"
  - "Life sciences, pharma and research (universities and the Vienna Biocenter)"
sports:
  - Football (soccer)
  - "Ice hockey (the Vienna Capitals) and handball"
  - Cycling and a strong urban running culture
  - Tennis and field hockey
  - "The New Year's Concert and classical-music events (as cultural 'spectator' draw)"
