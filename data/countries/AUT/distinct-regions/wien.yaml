businessRhythm:
  restDays:
    - sunday
  notes: "Sunday closure is standard except in the tourist core, at stations/airports and for small food businesses. Working hours are roughly 08:30-17:00 with a lunch break around noon; many shops are open late on Thursday or operate long shopping days, though this varies. A lull in business is common in August as city residents take summer holidays."
