      - "Folk music, village festivals and the traditional 'Alm' culture"
      - "Innsbruck's cultural calendar: the Tyrolean State Theatre and concert halls"
  - season: summer
    items:
      - "Hiking, via ferratas and mountain-biking across the high Alps"
      - "Alpine lake swimming and the 'Alm' pasture season"
      - "Summer mountain festivals and the Swarovski Crystal Worlds near Innsbruck"
  - season: winter
    items:
      - "Skiing, snowboarding and 'après-ski' in the resorts"
      - "The Hahnenkamm Races in Kitzbühel (late January)"
      - "Christmas markets and Krampus Perchten runs"
traditionalDishes:
  - season: allYear
    items:
      - "Tyrolean 'Gröstl' (a skillet of potatoes, speck, onion and herbs)"
      - "Knödel in many forms (Speckknödel, cheese dumplings, fruit dumplings)"
      - "'Kasnocken' (cheese spaetzle) and Tyrolean bacon"
      - "Schlutzkrapfen (traditional filled pasta)"
      - "Strudel and apple doughnuts"
  - season: summer
    items:
      - "Fresh Alpine cheese and 'Brettljause' platters"
      - "Trout and mountain-stream fish"
      - "Mountain herb and berry dishes from the 'Alm' meadows"
  - season: winter
    items:
      - "Hearty mountain stews and roast game"
      - "Maroni, Glühwein and festive pastries at the markets"
traditionalClothing:
  - season: allYear
    items:
      - "The Tyrolean Tracht: the Dirndl and lederhosen with distinctive embroidered details, worn proudly at festivals, weddings and village Sundays"
