businessRhythm:
  restDays:
    - sunday
  notes: "Sunday closure except in tourist resorts, where shops may open for visitors. Mountain tourism has its own rhythm: the business year peaks around the winter ski season (December-April) and the summer holiday season (June-September), with a relative lull in late spring and autumn."
