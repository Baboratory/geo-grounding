code: AT-7
name:
  eng: Tyrol
  local:
    - languageCode: deu
      value: Tirol
climates:
  - koppenCode: Dfb
    description: Continental-Alpine climate of the inner Alps — cold, snowy winters and warm summers in the valleys, with long, harsh winters and heavy snow at high altitudes.
  - koppenCode: Dfc/ET
    description: High-Alpine climate above the timberline — short cool summers and very cold, snowy winters in the peaks of the Stubai, Zillertal and Ötztal.
landmarks:
  - name: Innsbruck's Old Town (Altstadt)
    description: The capital of Tyrol, ringed by the Alps, with the Golden Roof (Goldenes Dachl), the Hofburg and the Imperial Church.
  - name: The Nordkette and Bergisel
    description: The mountain range that rises directly behind Innsbruck, reached by the Hungerburgbahn cable car amid the 'Alpine metropolis'.
  - name: Schloss Ambras
    description: A Renaissance hilltop castle above Innsbruck, home of the Habsburg archduke Ferdinand II's collections.
    unescoWorldHeritage: true
  - name: Kitzbühel (the Hahnenkamm)
    description: The legendary resort whose Streif is one of the world's most demanding downhill ski races, part of the Hahnenkamm Races.
  - name: Stubai and Zillertal glaciers
    description: Permanent-glacier skiing areas in the high Tyrolean Alps, open most of the year.
culturalTraits:
  - The heart of Alpine Austria — the archetypal 'Alpenland' of villages, mountains and tradition
  - Strong local identity and distinctive Tyrolean dialect; warm, hospitable mountain culture
  - Winter-sports supremacy and a deep mountain-and-hiking heritage
  - "Festive folklore: the Tiroler folk music, the Christmas 'Christkindlmarkt' and Krampus customs"
  - A proud historical independence within the Habsburg lands (held off Napoleon and resisted both world wars)
prideOf:
  - Being the ultimate Alpine winter-sports destination (Innsbruck hosted the 1964 and 1976 Olympic Winter Games)
  - Its breathtaking high-mountain landscape and outdoor lifestyle
  - A distinctive, self-confident Tyrolean identity and heritage
  - Rural quality of life and the 'Tracht' culture
animals:
  popular:
    - "The Alpine chamois and ibex in the high mountain parks"
    - "Marmots and golden eagles above the valleys"
    - "Cattle and traditional Tyrolean grey cattle in the summer 'Alm' pastures"
  unique:
    - "The Tyrolean grey cattle (Grauvieh), an Alpine breed, and the cave-dwelling Alpine newt"
industries:
  - "Tourism and winter sports (the backbone of the Tyrolean economy, year-round but Alpine-season heavy)"
  - "Machinery and precision engineering (e.g. around Innsbruck and Schwaz)"
  - "Agriculture, forestry and Alpine dairy farming"
  - "Energy from Alpine hydroelectricity"
  - "Craft, food and the 'Alm' pastoral economy"
sports:
  - Alpine skiing and ski racing (Kitzbühel, St Anton, Ischgl)
  - Snowboarding and freestyle
  - Mountaineering and via ferratas
  - Mountain biking and cycling
  - Hiking and 'Bergsteigen' (alpinism) in summer
