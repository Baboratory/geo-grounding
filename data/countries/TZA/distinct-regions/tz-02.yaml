      value: Dar es Salaam
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry savanna climate on the Indian Ocean coast, hot and humid year-round with monsoon rains."
landmarks:
  - name: Dar es Salaam harbour
    description: "Tanzania's principal port and commercial gateway, the largest city and economic hub of the country."
  - name: National Museum and House of Culture
    description: "Museum presenting Tanzanian history, including the famous 1924 human-like 'Shifting Sands' excavation finds and colonial era."
  - name: Village Museum (Makumbusho)
    description: "An open-air museum of traditional Tanzanian houses and cultures from across the country."
  - name: Askari Monument
    description: "A bronze World War I memorial statue in the city centre commemorating African soldiers."
  - name: Coco Beach and Kawe beach
    description: "Popular weekend beaches on the Msasani peninsula and coast."
culturalTraits:
  - "Tanzania's largest city, principal seaport and commercial hub"
  - "The birthplace of bongo flava — Tanzania's hip-hop and r&b music wave"
  - "A bustling, cosmopolitan coastal mix of Swahili, Asian, Arab and cosmopolitan culture"
prideOf:
  - "Being the vibrant commercial and creative capital of Tanzania"
  - "A lively music scene from taarab and bongo flava to live rock and jazz"
  - "The friendly, laid-back 'Dar es Salaam hospitality'"
