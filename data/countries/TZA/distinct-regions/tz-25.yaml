      value: Tanga
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry savanna climate on the northern coast, hot and humid with monsoon rains."
landmarks:
  - name: Saadani National Park
    description: "Tanzania's only coastal national park, where the Indian Ocean meets savanna game country."
  - name: Amboni Caves
    description: "A vast limestone cave complex near Tanga town, the largest of its kind in East Africa, with stalactites and stalagmites."
  - name: Tanga Old Town
    description: "A historic Swahili and German-influenced coastal town, one of East Africa's oldest port settlements."
  - name: Maziwe Island Marine Reserve
    description: "A protected sand island offshore, important for sea-turtle nesting."
culturalTraits:
  - "A historic northern-coastal port city of Tanzania"
