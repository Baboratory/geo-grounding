    description: "Temperate highland climate in the south-western highlands, cool with reliable rainfall."
landmarks:
  - name: Mount Rungwe
    description: "An extinct volcanic peak (2,981m) in the Rungwe district, a biodiversity hotspot and part of the Eastern Arc."
  - name: Kitulo National Park
    description: "Known as the 'Serengeti of Flowers', an upland botanical paradise of wildflowers on the Kitulo plateau."
  - name: Ruaha National Park (via Iringa corridor)
    description: "South-western Tanzania's vast national park, reachable through the Mbeya region's landscapes."
  - name: Matema Beach (Lake Nyasa)
    description: "A lakeside resort on the eastern shore of Lake Nyasa (Lake Malawi) at the foot of the Livingstone Mountains."
