      value: Mjini Magharibi
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry climate on the Zanzibar archipelago, warm and humid with monsoon rains and a distinct dry season."
landmarks:
  - name: Stone Town
    description: "The historic Swahili trading town of Zanzibar City, a UNESCO World Heritage Site of coral-stone buildings and brass-studded doors."
    unescoWorldHeritage: true
  - name: House of Wonders and Palace Museum
    description: "Historic Sultanate-era buildings at the heart of the old town, now museums of Zanzibar's history."
  - name: Forodhani Gardens
    description: "An evenings food market and square on the seafront in Stone Town."
  - name: Prison Island (Changuu)
    description: "A small island offshore with giant Aldabra tortoises and historic quarantine buildings."
  - name: Mangapwani coral caves
    description: "Storied coral caves, part of the folklore of escaped slaves and the spice trade era."
culturalTraits:
  - "The heart of Zanzibar's Swahili, Arab, Indian and European heritage"
  - "World-famous as the 'Spice Island' for its cloves and spice plantations"
  - "A strong taarab music tradition and a distinctive Zanzibari identity"
prideOf:
  - "Stone Town, the UNESCO-listed cradle of Zanzibari culture"
  - "Being the spice capital of the old Indian Ocean world"
  - "The unique Swahili-Arab architecture and doors"
