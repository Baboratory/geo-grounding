alpha3: TZA
alpha2: TZ
name:
  eng: Tanzania, United Republic of
  local:
    - languageCode: swa
      value: Tanzania (Jamhuri ya Muungano wa Tanzania)
    - languageCode: eng
      value: United Republic of Tanzania
flagEmoji: "🇹🇿"
capital: Dodoma
isSovereign: true
# Classified unitary-large: Tanzania's population (~61.7M at the 2022 census,
# ~67-69M by 2024-25 estimates) is far above the small-state threshold, and the
# country has a genuine, widely recognised regional-cultural mosaic (the
# Sukuma/Nyamwezi-dominated north-west, the Swahili Coast around Dar es Salaam,
# the Zanzibar islands and the inland plateaus). It is a unitary republic (31
# regions) so NOT federal. Curated regions follow real ISO 3166-2 regions: Dar
# es Salaam (TZ-02), Dodoma (TZ-11, capital), Mbeya (TZ-14), Tanga (TZ-25) and
# Zanzibar West (TZ-15) + WHOLE as national fallback. Swahili is the national
# language and (with English) the de facto language of government and business.
governanceType: unitary-large
iso3166_2_prefix: TZ
hasSubdivisions: true
languageUsage:
  # Tanzania has no de jure official language statute; Swahili is the national
  # language and, with English, used in government, courts and business. Both
  # are treated as official in practice.
  - languageCode: swa
    domain: official
    speakersShare: 1.0
    sourceId: nbs-census
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: nbs-census
  # Swahili is nearly universal: ~95% speak it as first or second language.
  - languageCode: swa
    domain: locallySpoken
    speakersShare: 0.95
    sourceId: nbs-census
  - languageCode: suk
    domain: locallySpoken
    # The Sukuma are Tanzania's largest single ethnic group (~16%).
    speakersShare: 0.16
    sourceId: nbs-census
  - languageCode: nym
    domain: locallySpoken
    # The Nyamwezi are closely related to the Sukuma, centred south-east of
    # Lake Victoria.
    speakersShare: 0.06
    sourceId: nbs-census
  - languageCode: eng
    domain: locallySpoken
    # English is widely used in government, courts, higher education and
    # business as a second language, though usage figures are not officially
    # published.
    speakersShare: 0.15
    sourceId: cia-tz
ethnicGroups:
  # Composite from the 2022 Census and standard references; Tanzania has over
  # 120 ethnic groups, so only the largest are listed and the residual is large.
  - group: Sukuma
    percent: 16.0
    sourceId: nbs-census
  - group: Nyamwezi
    percent: 6.0
    sourceId: nbs-census
  - group: Chaga
    percent: 5.0
    sourceId: nbs-census
  - group: Haya
    percent: 4.0
    sourceId: nbs-census
  - group: Makonde
    percent: 3.0
    sourceId: nbs-census
  - group: Other (120+ additional ethnic groups)
    percent: 66.0
    sourceId: nbs-census
# Note: Tanzania is one of the most ethnically diverse countries in the world
# with more than 120 groups; only the largest are listed individually and the
# 'Other' residual dominates. Shares are composite estimates from census and
# standard references.
timezones:
  - name: Africa/Dar_es_Salaam
    standardUtcOffset: "UTC+3"
    observesDst: false
currency:
  code: TZS
  symbol: "TSh"
  name: Tanzanian shilling
legalConstraints:
  - topic: "official language"
    description: "Tanzania's Constitution does not designate a de jure official language; Swahili is the national language and, together with English, is used in government, courts, education and business (Constitution of the United Republic of Tanzania, 1977 with amendments)."
    sourceId: constitution-1977
  - topic: "data protection"
    description: "The Personal Data Protection Act (Cap 44 of 2022) regulates the collection and processing of personal data. The Personal Data Protection Commission (PDPC) launched on 3 April 2024 enforces the Act; controllers and processors must register, and processing must be lawful, fair, transparent and secure."
    sourceId: pdpa-2022
  - topic: "value added tax (VAT) price display"
    description: "VAT is 18% standard on most goods and services in Mainland Tanzania (Value Added Tax Act, Cap 139; Finance Acts; 2023/24 rates), with 0% on exports and certain capital goods; a 16% rate applies to consideration paid by non-registered individuals through approved electronic systems. Zanzibar maintains its own separate VAT regime."
    sourceId: tra-vat
  - topic: "consumer protection"
    description: "The Fair Competition Act, 2003 (Cap 265) and the Consumer Protection Regulations, 2005 protect consumers against unfair trading, misleading advertising and unsafe goods, administered by the Fair Competition Commission."
    sourceId: fcc-tz
paymentCulture:
  popularMethods:
    - "Mobile money — M-Pesa, T-Kash (Airtel) and Halotel Money; mobile money is pervasive, especially in rural areas"
    - "Cash — still dominant in informal and rural commerce"
    - "Bank cards (Visa/Mastercard) — accepted at larger retailers, hotels and online"
    - "Bank transfers via the Tanzania Interbank Payment System (TIPS)"
  tipping:
    expected: false
    typicalAmount: "Optional; ~10% at upscale restaurants and a small 'dashiki' for guides and safari staff is appreciated"
    autoIncludedInBill: false
    note: "Qualitative and customary. Mobile money often serves as a de facto bank account."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Polite, respectful and relationship-driven; age and titles matter. Swahili greeting culture (Habari / Bajani) is central."
  greetingNorms: "A warm handshake is standard; asking after your counterpart's wellbeing ('Habari') is expected before business."
  meetingEtiquette: "Meetings begin with introductions and small talk. Decisions are often consultative and consensus-oriented; patience is valued."
  topicsToAvoid:
    - "Sensitive tribal/ethnic politics"
    - "The union with Zanzibar, discussed with care"
  giftGivingNotes: "Not expected in business. A modest gift is warmly received when visiting a home."
