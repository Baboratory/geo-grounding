alpha3: MMR
alpha2: MM
name:
  eng: Myanmar
  local:
    - languageCode: mya
      value: မြန်မာ
flagEmoji: "🇲🇲"
capital: "Naypyidaw (official seat of government); Yangon (largest city and commercial capital)"
isSovereign: true
# Classified unitary-large: Myanmar meets 2 of the 3 DESIGN.md criteria easily.
# (1) Population ~51M (1983 census ~35M Bamar at 69%; far above the 20-25M
# small-state threshold); (2) a genuine, widely recognized cultural-historical
# regional divide between the Bamar (Burman) majority core and the ethnically
# distinct border states (Shan, Kachin, Kayin/Karen, Mon, Chin, Rakhine).
# Although the 2008 Constitution frames Myanmar as a 'Republic of the Union'
# comprising regions, states and a union territory under a central government
# (no residual state sovereignty), the real ISO 3166-2 subdivisions plus the
# recognized ethno-regional identities make it unitary-large. Curated regions
# use real ISO 3166-2 codes (MM-xx); WHOLE is the national fallback.
governanceType: unitary-large
iso3166_2_prefix: MM
hasSubdivisions: true
regionCoverage:
  # Count per ISO 3166-2 as of 2026-09. The uncurated units have NOT yet been
  # tested against DESIGN.md's five coverage triggers -- this declaration records
  # the gap so it is visible, not a finding that the gap is correct. Pending the
  # coverage re-audit (see TODO.md).
  tier: first-level
  totalUnits: 15
  status: partial
  gapReason: "5 of 15 first-level units curated. Which of the
    remaining units fire a coverage trigger has not been assessed yet -- the
    curated set predates the coverage floor and was chosen by size/capital,
    not by divergence. Queued for the coverage re-audit."
languageUsage:
  - languageCode: mya
    domain: official
    speakersShare: 1.0
    sourceId: constitution-mmr-2008
  - languageCode: mya
    domain: locallySpoken
    speakersShare: 0.68
    sourceId: census-mmr-2014
  - languageCode: kac
    domain: locallySpoken
    speakersShare: 0.04
    sourceId: ethnologue-mmr
  - languageCode: shn
    domain: locallySpoken
    speakersShare: 0.04
    sourceId: ethnologue-mmr
  - languageCode: eng
    domain: foreign
    speakersShare: 0.01
    sourceId: ethnologue-mmr
# Burmese (mya) is the sole official language of the Republic of the Union of
# Myanmar. It is also the first/native language of the majority Bamar ethnic
# group (~68%). No other language holds official status; minority languages
# (Kachin, Shan, Karen, Chin, Mon, Rakhine, etc.) are locally spoken in their
# respective states. English, the colonial-era administrative language, is now
# a foreign/second language used in business and government documents.
ethnicGroups:
  - group: Bamar (Burman)
    percent: 68.5
    sourceId: gad-mmr-township
  - group: Kayin (Karen)
    percent: 6.6
    sourceId: gad-mmr-township
  - group: Shan
    percent: 4.7
    sourceId: gad-mmr-township
  - group: Rakhine (Arakanese)
    percent: 4.3
    sourceId: gad-mmr-township
  - group: Mon
    percent: 2.1
    sourceId: gad-mmr-township
  - group: Chin
    percent: 2.1
    sourceId: gad-mmr-township
  - group: Pa-O (Kayin subgroup)
    percent: 2.1
    sourceId: gad-mmr-township
  - group: Kachin (Jingpho)
    percent: 1.5
    sourceId: gad-mmr-township
  - group: Ta'ang/Danu/Lahu/Kokang/Karenni and others
    percent: 8.1
    sourceId: gad-mmr-township
# Myanmar's 2014 census enumerated population data but detailed ethnicity was
# withheld indefinitely by the government. The shares shown are the widely-cited
# 2019 GAD township estimates: Bamar ~68.5%, with Kayin (Karen), Shan, Rakhine,
# Mon, Chin, Pa-O, Kachin the principal groups among the 135 officially
# recognised indigenous ethnic groups.
timezones:
  - name: Asia/Yangon
    standardUtcOffset: "UTC+6:30"
    observesDst: false
currency:
  code: MMK
  symbol: "K"
  name: Burmese kyat
legalConstraints:
  - topic: "official language"
    description: "Burmese is the sole official language; the 2008 Constitution (as amended) establishes the Republic of the Union of Myanmar with Burmese as the language of the Union."
    sourceId: constitution-mmr-2008
  - topic: "commercial tax"
    description: "There is no VAT; instead a 5% commercial tax on goods and services applies under the Union Taxation Law 2023 (as amended 2024), along with a Specific Goods Tax (5-80%) on a defined list of goods."
    sourceId: utl-mmr-2023
  - topic: "data protection"
    description: "There is no general data protection law; privacy and data security are addressed piecemeal, notably by the Law Protecting the Privacy and Security of Citizens (2017) and sectoral statutes (Telecommunications Law 2013, Cybersecurity Law)."
    sourceId: dlapiper-mmr-dp
  - topic: "consumer protection"
    description: "Consumer affairs are regulated through the Consumer Protection Law (2019), which addresses misleading claims and unsafe products."
    sourceId: dlapiper-mmr-dp
paymentCulture:
  popularMethods:
    - "Cash is dominant, especially outside Yangon"
    - "Mobile money and e-wallets (Wave Money, KBZ Pay) growing rapidly"
    - "Bank transfers and cards common in Yangon business circles"
  tipping:
    expected: false
    typicalAmount: "Not generally expected; a small tip or rounding-up appreciated in restaurants and for hotel porters, but not customary"
    autoIncludedInBill: false
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Respect for age and seniority is central; honorifics and a softer register are used for elders and superiors."
  greetingNorms: "A slight bow or nod with the phrase 'Mingalaba' (formal) or a simple 'Ne kaun la?' (How are you); the bow is typically lower toward elders or monks."
  meetingEtiquette: "Business cards exchanged with both hands; rank and older colleagues addressed first; meetings are consensus-driven and may take time; keeping face is important."
  topicsToAvoid:
    - "The Muslim-majority Rakhine/Rohingya situation and inter-ethnic conflict"
    - "The 2021 military takeover and ongoing political instability"
    - "Criticism of the armed forces or the constitution"
  giftGivingNotes: "Gifts are accepted and appreciated but should not be extravagant; small, thoughtful items are suitable. Avoid giving alcohol to devout customers or during religious fasts; no leather for observant consumers."
