sources:
  - id: census-mmr-2014
    name: "The 2014 Myanmar Population and Housing Census — Union Report"
    publisher: "Department of Population, Ministry of Labour, Immigration and Population / UNFPA"
    url: "http://hofinet.org/upload_docs/Myanmar%20Population%20and%20Housing%20Census%202014.pdf"
    year: 2015
    accessedDate: "2026-09-21"
    note: "Total population 51,486,253; official census counts by State/Region; religion shares (Buddhism ~88%, Christianity 6.2%, Islam 4.3%)."
  - id: constitution-mmr-2008
    name: "Constitution of the Republic of the Union of Myanmar (2008, as amended)"
    publisher: "Government of the Republic of the Union of Myanmar"
    url: "https://www.mlis.gov.mm/"
    year: 2008
    accessedDate: "2026-09-21"
    note: "Establishes the federal-style Republic of the Union structure (Article 49: seven States, seven Regions, one Union Territory) and Burmese as the official language."
  - id: gad-mmr-township
    name: "Ethnic composition by township (2019 GAD)"
    publisher: "Wikipedia (secondary compilation; underlying data is the General Administration Department's nationwide township reports, Oct 2018-Sep 2019, as tabulated by researchers in 2022 — no direct GAD publication of the tabulated shares was found)"
    url: "https://en.wikipedia.org/wiki/Ethnicity_in_Myanmar"
    year: 2019
    accessedDate: "2026-09-21"
    note: "Widely-cited township-level ethnic percentages: Bamar ~68.5%, Kayin 6.6%, Shan 4.7%, Rakhine 4.3%, Mon 2.1%, Chin 2.1%, Pa-O 2.1%, Kachin 1.5%, others ~8.1%."
  - id: utl-mmr-2023
    name: "Union Taxation Law 2023 (Law No. 18/2023, as amended 2024)"
    publisher: "State Administration Council, Republic of the Union of Myanmar"
    url: "https://www.myanmartradeportal.gov.mm/uploads/legals/2024/7/Union%20Taxation%20Law%202023%20Eng.pdf"
    year: 2023
    accessedDate: "2026-09-21"
    note: "5% commercial tax on most goods and services; Specific Goods Tax 5-80% on a defined list; no VAT."
  - id: dlapiper-mmr-dp
    name: "Data Protection Laws of the World — Myanmar"
    publisher: "DLA Piper"
    url: "https://www.dlapiperdataprotection.com/index.html?t=law&c=MM"
    year: 2024
    accessedDate: "2026-09-21"
    note: "No general data protection law; privacy governed by the Law Protecting the Privacy and Security of Citizens (2017) and sectoral statutes; consumer protection via the Consumer Protection Law (2019)."
  - id: ethnologue-mmr
    name: "Ethnologue: Languages of Myanmar"
    publisher: "SIL International (Ethnologue)"
    url: "https://www.ethnologue.com/country/MM/languages"
    year: 2024
    accessedDate: "2026-09-21"
    note: "Language vitality and speaker estimates for Burmese and minority languages of Myanmar."
  - id: iso-mya
    name: "ISO 639-3 entry: mya - Burmese"
    publisher: "SIL International (ISO 639-3 Registration Authority)"
    url: "https://iso639-3.sil.org/code/mya"
    year: 2026
    accessedDate: "2026-09-21"
    note: "Verifies ISO 639-3 code mya = Burmese (Individual, Living)."
  - id: iso-kac
    name: "ISO 639-3 entry: kac - Kachin Jingpho"
    publisher: "SIL International (ISO 639-3 Registration Authority)"
    url: "https://iso639-3.sil.org/code/kac"
    year: 2026
    accessedDate: "2026-09-21"
    note: "Verifies ISO 639-3 code kac = Kachin Jingpho (Individual, Living)."
  - id: iso-shn
