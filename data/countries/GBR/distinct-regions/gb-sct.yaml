climates:
  - koppenCode: Cfb
    description: Temperate oceanic climate with high rainfall; mild along the coasts, cooler and wetter in the Highlands.
  - koppenCode: Cfc
    description: Subpolar oceanic climate in the far north and the highest uplands; snow cover persists in winter on the Cairngorms.
landmarks:
  - name: Edinburgh Castle
  - name: "Loch Ness and the Highlands"
  - name: "The 'Old and New Towns' of Edinburgh"
    unescoWorldHeritage: true
  - name: "The Belted Galloway / St Kilda archipelago"
    unescoWorldHeritage: true
  - name: "Glenfinnan Viaduct (the 'Harry Potter' bridge)"
culturalTraits:
  - Distinct national identity and legal/education system within the UK
  - Clan heritage, tartan and Highland culture (including the kilt as formal dress)
  - Scottish Gaelic (Gàidhlig) as an official language, and Scots as a recognized minority language
  - "Hogmanay (New Year) as a major cultural celebration"
prideOf:
  - Scottish whisky and the distilling heritage
  - Enlightenment legacy (Edinburgh — the 'Athens of the North') and inventors
  - Golf's birthplace (St Andrews)
  - Highland scenery and a strong sense of nationhood
animals:
  popular:
    - Highland cow
    - Red deer
    - Red squirrel
  unique:
    - Scottish wildcat
    - Capercaillie (native gamebird)
    - "Orkney/Shetland pony; Northern Isles seabird colonies"
industries:
  - Whisky distilling (world-leading export)
  - Oil and gas extraction (North Sea, Aberdeen as the hub)
  - Renewable energy (offshore wind, hydro)
  - Financial services (Edinburgh is a major centre)
  - Salmon farming and seafood
  - Tourism (Highlands, islands, film locations)
sports:
  - "Football (Old Firm: Celtic & Rangers; Scottish Premiership)"
  - Rugby union (Murrayfield)
  - Golf (St Andrews, birthplace of the game)
  - Highland Games (caber toss, hammer throw)
  - Shinty (traditional team sport)
