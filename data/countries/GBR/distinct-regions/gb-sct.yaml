businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices in Scotland typically run 9:00am-5:00pm or 5:30pm; a professional and quite punctual culture, with a strong public-sector and finance presence in Edinburgh."
  lunchBreakTiming: "A moderate lunch break (~1 hour); the fast-paced working lunch is growing, though 'proper' midday breaks remain common in the public sector."
  notableShutdownPeriods:
    - period: Christmas/New Year (Hogmanay)
      description: "Christmas Day and Boxing Day (25-26 Dec) are public holidays, and 1 and 2 January (Hogmanay) are bank holidays in Scotland — the festive shutdown often extends from late December to 2-3 January."
  notes: "Scotland has no Sunday-trading restrictions like England & Wales; large shops can open as they choose on Sundays."
