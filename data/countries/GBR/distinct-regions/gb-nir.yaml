businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Broadly the same as the rest of the UK, 9:00am-5:00pm; a somewhat more relaxed pace than London is often noted by visitors."
  lunchBreakTiming: "A standard c. 1-hour lunch break is typical in offices."
  notableShutdownPeriods:
    - period: "The Twelfth of July fortnight"
      description: "Many workplaces close or run reduced hours around the Twelfth of July holiday and the school-summer changeover."
    - period: "Christmas/New Year"
      description: "Public holidays on Christmas Day and Boxing Day, as in the rest of the UK."
  notes: "Northern Ireland, like Scotland, has no statutory Sunday-trading-hours restriction of the kind that applies to large shops in England and Wales — large stores may open as they choose on Sundays (see the country-level 'Sunday trading' legalConstraints entry)."
  sourceIds:
    - uk-sunday-trading-act
