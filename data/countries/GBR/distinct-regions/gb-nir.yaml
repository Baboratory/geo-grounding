code: GB-NIR
name:
  eng: Northern Ireland
  local:
    - languageCode: gle
      value: Tuaisceart Éireann
    - languageCode: eng
      value: Northern Ireland
climates:
  - koppenCode: Cfb
    description: Temperate oceanic climate, mild and rainy year-round with cool summers, same broad zone as the rest of the UK.
landmarks:
  - name: Giant's Causeway
    description: Around 40,000 interlocking basalt columns on the Antrim coast, formed by volcanic activity some 60 million years ago; Northern Ireland's first UNESCO World Heritage Site (inscribed 1986).
    unescoWorldHeritage: true
  - name: Titanic Belfast
    description: A museum on the Belfast shipyard slipway where RMS Titanic was built and launched in 1911.
  - name: The Dark Hedges
    description: An avenue of gnarled beech trees near Armoy, planted in the 18th century, now a well-known filming location.
  - name: Mourne Mountains
    description: "A granite mountain range in County Down, the highest in Northern Ireland (Slieve Donard, 850m)."
  - name: "Stormont (Parliament Buildings)"
    description: Seat of the devolved Northern Ireland Assembly and Executive, on the Stormont Estate outside Belfast.
culturalTraits:
  - "Northern Ireland is a distinct legal jurisdiction within the UK, with its own courts, criminal justice system and devolved legislative Assembly, separate from both England & Wales and Scotland"
  - "Irish and Ulster Scots hold statutory recognition under the Identity and Language (Northern Ireland) Act 2022, with an Irish Language Commissioner established in 2025 — a status distinct from the rest of the UK"
  - "A post-conflict society shaped by the Troubles (c. 1968-1998) and the 1998 Good Friday/Belfast Agreement, with power-sharing government between unionist and nationalist traditions"
  - "Gaelic games (Gaelic football, hurling) are widely followed alongside association football and rugby, unlike the rest of the UK"
prideOf:
  - "The peace process and power-sharing government, achieved after decades of conflict"
  - "The Giant's Causeway and the Causeway Coast"
  - "Titanic heritage and Belfast's shipbuilding and engineering legacy"
  - "A strong literary and musical tradition (Seamus Heaney, C.S. Lewis, Van Morrison)"
animals:
  popular:
    - Irish hare
    - Red squirrel
  unique:
    - "Corncrake (rare breeding bird, most of its remaining UK range is on Rathlin Island)"
    - "Basking shark (seasonal visitor off the north Antrim coast)"
industries:
  - "Aerospace manufacturing (Spirit AeroSystems/former Bombardier, Belfast — a major UK aerospace hub)"
  - "Agri-food and dairy processing"
  - "Financial technology and professional services (Belfast fintech cluster)"
  - "Film and TV production (screen tourism, studio facilities around Belfast)"
  - "Tourism (Causeway Coast, Titanic Quarter, Mourne Mountains)"
sports:
  - "Gaelic football and hurling (GAA)"
  - "Association football (Irish League; Northern Ireland national team)"
  - "Rugby union (Ulster Rugby)"
  - "Boxing (a strong amateur and professional tradition)"
entertainment:
  - season: allYear
    items:
      - "Game of Thrones filming-location tourism (much of the series was shot in Northern Ireland)"
      - "Belfast's live-music and festival scene"
  - season: summer
    items:
      - "The Twelfth of July (Orangemen's Day) parades, a major unionist/loyalist cultural event"
      - "Féile an Phobail, Belfast's community arts festival (August)"
  - season: spring
    items:
      - "St Patrick's Day celebrations (17 March)"
traditionalDishes:
  - season: allYear
    items:
      - "Ulster fry (bacon, egg, sausage, soda bread, potato bread, black/white pudding)"
      - "Champ (mashed potato with spring onion and butter)"
      - "Yellowman (honeycomb toffee), traditionally sold at the Auld Lammas Fair"
traditionalClothing:
  - season: allYear
    items:
      - "Broadly shares British/Irish everyday dress; formal wear follows UK conventions"
