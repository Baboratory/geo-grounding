    name: "Hawker Culture in Singapore — UNESCO Intangible Cultural Heritage"
    publisher: "UNESCO Intangible Cultural Heritage List"
    url: "https://ich.unesco.org/en/RL/hawker-culture-in-singapore-community-dining-and-culinary-practices-in-a-multicultural-urban-context-01567"
    year: 2020
    accessedDate: "2026-09-18"
    note: "Hawker-centre food culture inscribed 2020 — basis for the heritage culturalTrait and prideOf references."
  - id: sgp-unesco-gardens
    name: "Singapore Botanic Gardens — UNESCO World Heritage Centre"
    publisher: "UNESCO World Heritage Centre"
    url: "https://whc.unesco.org/en/list/1583/"
    year: 2015
    accessedDate: "2026-09-18"
    note: "Inscribed 2015 as the only tropical botanic garden on the World Heritage list; basis for the landmark entry."
