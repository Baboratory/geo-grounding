    sourceId: sgp-religion-2020
  - name: Islam
    percent: 15.6
    sourceId: sgp-religion-2020
  - name: Taoism
    percent: 8.8
    sourceId: sgp-religion-2020
  - name: Hinduism
    percent: 5.0
    sourceId: sgp-religion-2020
entertainment:
  - season: allYear
    items:
      - "Hawker-centre food culture and kopitiam (coffee-shop) socialising"
      - "Concerts, festivals and the Formula 1 Singapore Grand Prix (night race)"
      - "Shopping malls and Orchard Road retail culture"
      - "Museums (National Museum, ArtScience Museum, Asian Civilisations Museum)"
      - "Indoor attractions (Gardens by the Bay domes, museums) during the wetter NE-monsoon spells (Nov-Jan)"
traditionalDishes:
  - season: allYear
    items:
      - "Hainanese Chicken Rice — poached chicken with fragrant rice; the national everyday dish"
      - "Chilli Crab — mud crab in a sweet-spicy tomato-chilli sauce"
      - "Laksa (Katong-style coconut curry noodle soup)"
      - "Kaya toast with soft-boiled eggs and kopi — the classic kopitiam breakfast"
      - "Char Kway Teow — stir-fried flat rice noodles"
      - "Satay, Hokkien mee and bak kwa (barbecued pork jerky, especially at Chinese New Year)"
traditionalClothing:
  - season: allYear
    items:
      - "Light, breathable cotton clothing suited to the hot humid climate"
      - "Formal business attire (suit and tie, or the Nehru-style 'national costume' for men at formal events, and the cheongsam/sari for community events)"
      - "Festival dress — cheongsam (Chinese), kurta (Indian), baju kurung (Malay) around respective festivals"
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Government and offices roughly 08:30/09:00-18:00 Mon-Fri; many private firms and retail operate Saturdays. Lunch break around 12:30-14:00."
  lunchBreakTiming: "A standard midday break (roughly 12:00-14:00) is the norm."
  notableShutdownPeriods:
    - period: "Chinese New Year (Jan/Feb)"
      description: "Major public holiday; most businesses close 1-3 days."
    - period: "Ramadan & Hari Raya Haji (Eid al-Fitr)"
      description: "Observed by the Muslim community; some food-centric businesses adjust hours."
    - period: "Deepavali (Oct/Nov)"
      description: "Public holiday; Indian community festival, some closures."
    - period: "Christmas and New Year"
      description: "Public holidays around late Dec-early Jan; retail stays busy."
  notes: "Sunday is the main rest day. The Formula 1 weekend (Sep) and year-end festive season drive peak visitor activity. Public holidays are frequent and reflect the multi-faith calendar."
sources:
  - id: sgp-religion-2020
    name: "Census of Population 2020 — Religion (residents aged 15+), Statistical Release 1"
