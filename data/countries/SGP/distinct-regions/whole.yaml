code: WHOLE
name:
  eng: Singapore
  local:
    - languageCode: eng
      value: Singapore
    - languageCode: msa
      value: Singapura
    - languageCode: cmn
      value: 新加坡
    - languageCode: tam
      value: சிங்கப்பூர்
# Generic country-wide fallback content for Singapore (unitary-small, single
# synthetic whole region). Used via the 'whole-country-fallback' path.
climates:
  - koppenCode: Af
    description: "Tropical rainforest climate — hot and humid year-round (typically 24-33°C, 70-90%+ humidity). No thermal seasons; heavy convective afternoon thunderstorms. Monsoon regimes (NE monsoon Nov-Mar wetter; SW monsoon Jun-Sep) rather than temperature seasons."
landmarks:
  - name: Marina Bay Sands and the Marina Bay skyline
    description: "Iconic waterfront integrated resort with the SkyPark observation deck overlooking the bay and the Esplanade."
  - name: Gardens by the Bay
    description: "Award-winning nature park known for the Supertree Grove and the cooled Cloud Forest dome."
  - name: Singapore Botanic Gardens
    description: "UNESCO World Heritage Site — the only tropical garden on the list, home of the National Orchid Garden."
  - name: Sentosa Island
    description: "Resort island with beaches, theme parks (Universal Studios Singapore) and the Merlion."
  - name: Chinatown, Little India and Kampong Glam
    description: "Vibrant ethnic heritage precincts reflecting the four main communities (Chinese, Indian, Malay, Eurasian)."
culturalTraits:
  - "Multiculturalism and racial harmony as a founding creed — four official languages and a national pledge to build a diverse but united society"
  - "Hawker-centre food culture (inscribed on UNESCO's Intangible Cultural Heritage list in 2020)"
  - "Meritocracy, pragmatism and the 'kiasu' (fear of missing out) drive for efficiency"
  - "Emphasis on orderliness, cleanliness and rule-following as enforced social norms"
  - "Respect for elders and Confucian-influenced family values"
  - "Cosmopolitan, outward-looking openness alongside a strong local identity"
  - "Bilingual/multilingual identity — effortless code-switching (colloquially 'Singlish') as an informal bond"
prideOf:
  - "Changi Airport, repeatedly ranked the world's best airport"
  - "Global status as a financial, trading and logistics hub (top-3 container port)"
  - "Multirace harmony and the UNESCO-listed hawker food culture"
  - "Efficiency, safety, world-class public transport (MRT) and urban greenery (City in a Garden)"
  - "National Service and a disciplined national identity"
animals:
  popular:
    - "Smooth-coated otter (the urban river-dwelling otters of the Singapore River)"
    - "Oriental pied hornbill (reintroduced to the island)"
    - "Long-tailed macaque"
    - "Monitor lizard and Javan myna (common urban wildlife)"
  unique:
    - "Merlion — the mythical lion-fish, Singapore's national symbol (a cultural icon, not a real animal)"
    - "Birdwing and other tropical butterflies in the rainforest-core reserves"
industries:
  - "Financial services and banking (a top global hub)"
  - "Electronics and semiconductors"
  - "Biomedical sciences and pharmaceuticals"
  - "Oil refining and petrochemicals (Jurong Island)"
  - "Global shipping, port and logistics; offshore/rig engineering"
  - "Info-communications and fintech"
  - "Tourism and MICE (meetings, incentives, conventions)"
sports:
  - "Association football (soccer)"
  - "Cricket (a pastime since colonial times)"
  - "Running and marathons (Standard Chartered Singapore Marathon)"
  - "Basketball, badminton and swimming"
  - "Rugby, sepak takraw and dragon-boat racing"
religions:
