    year: 2021
    accessedDate: "2026-09-18"
    note: "2020 census: resident population 4.18M; ethnic composition (Chinese 74.3%, Malay 13.5%, Indian 9.0%, others 3.2%); language most frequently spoken at home (English 48.3%, Mandarin 35.3% among residents 5+)."
  - id: sgp-population
    name: "Population in Brief 2024"
    publisher: "Department of Statistics Singapore / Strategy Group"
    url: "https://www.population.gov.sg"
    year: 2024
    accessedDate: "2026-09-18"
