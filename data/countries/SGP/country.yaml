    url: "https://www.mas.gov.sg/currency"
    year: 2024
    accessedDate: "2026-09-18"
    note: "Singapore dollar (SGD), symbol S$; circulated by the Board of Commissioners of Currency, Monetary Authority of Singapore."
  - id: sgp-timezone
    name: "Time in Singapore (Asia/Singapore) — IANA tz database"
    publisher: "IANA time zone database"
