alpha3: WSM
alpha2: WS
name:
  eng: Samoa
  local:
    - languageCode: eng
      value: Independent State of Samoa
    - languageCode: smo
      value: Malo Sa'oloto Tuto'atasi o Sāmoa
flagEmoji: "🇼🇸"
capital: Apia
isSovereign: true
# Classified unitary-small: Samoa does NOT meet the unitary-large criteria. It is
# a small South-Pacific island state (~200k, 2021 census) with no federal
# structure. Samoan and English are both official national languages (2017
# Constitution); the Upolu/Savai'i split is geographic, not a widely recognized
# cultural-historical regional identity meriting curation. One synthetic WHOLE
# region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: smo
    domain: official
    speakersShare: 1.0
    sourceId: constitution-2017
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: constitution-2017
  - languageCode: smo
    domain: locallySpoken
    speakersShare: 0.91
    sourceId: census-2021
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.35
    sourceId: eng-estimate
# Samoan (Gagana Sāmoa) and English are both official (2017 Constitution).
# Samoan is the everyday first language of ~91% of residents (2021 census);
# English proficiency is an ESTIMATE of ~35% (no official proficiency census),
# concentrated among the urban/younger population. Both official rows carry the
# 1.0 legal-status flag; actual usage is captured by the locallySpoken rows.
ethnicGroups:
  # 2021 census, via Wikipedia infobox.
  - group: Samoans
    percent: 92.6
    sourceId: census-2021
  - group: Euronesians (mixed Samoan-European)
    percent: 7.0
    sourceId: census-2021
  - group: Europeans
    percent: 0.3
    sourceId: census-2021
  - group: Other
    percent: 0.1
    sourceId: census-2021
timezones:
  - name: Pacific/Apia
    standardUtcOffset: "UTC+13"
    observesDst: false
# Samoa moved to UTC+13 on 29 Dec 2011 (International Date Line Act 2011),
# skipping 30 Dec 2011 to align trading days with Australia/NZ. A southern-summer
# DST (UTC+14) was observed 2010-2021 but ABOLISHED in Sept 2021; since 2022 the
# country is on constant UTC+13 year-round, so observesDst is false.
currency:
  code: WST
  symbol: "WS$"
  name: Samoan tālā
legalConstraints:
  - topic: "official languages"
    description: "Samoan and English are both official languages (Constitution of the Independent State of Samoa). Samoan is the language of daily life and cultural identity; English is used in government, law and business."
    sourceId: constitution-2017
  - topic: "customary land tenure"
    description: "Roughly 80% of land is held under customary tenure in the name of a matai (village titleholder). Constitution Art.102 prohibits alienation (sale or mortgage) of customary land; it is entrenched and can only be LEASED (up to ~30 years, renewable to ~60) with ministerial approval, or taken for public purpose. This significantly restricts foreign direct investment in land."
    sourceId: customary-land
  - topic: "Sunday observance"
    description: "Samoa is deeply Christian and Sunday is widely observed as a day of rest and worship; many businesses close on Sunday and church attendance is common."
    sourceId: constitution-2017
  - topic: "religion"
    description: "The 2017 Constitution declares that Samoa 'is a Christian nation founded on God the Father, the Son and the Holy Spirit'. Christianity is effectively the established religion (~98% of the population is Christian, 2021 census)."
    sourceId: constitution-2017
  - topic: "data protection"
    description: "Samoa has no GDPR-equivalent omnibus data-protection law; personal-data handling is governed by narrower provisions (e.g. census/statistics confidentiality under the Statistics Act, SBS)."
    sourceId: stats-act
paymentCulture:
  popularMethods:
    - "Cash — the everyday default for retail, markets and village transactions"
    - "Debit/credit cards (Visa/Mastercard) — accepted at larger hotels, resorts, restaurants and shops in Apia and main towns; smaller islands/villages are cash-only"
    - "Bank transfers and QR/digital payments (ANZ, BSP Samoa) in formal commerce"
    - "Mobile money / e-wallets — growing via the National Financial Inclusion Strategy"
  tipping:
    expected: false
    typicalAmount: "Not customary; rounding up or a small tip is appreciated for exceptional service in hotels/resorts/restaurants"
    autoIncludedInBill: false
    note: "Tipping is not traditionally expected in Samoa. A modest gratuity for exceptional service is appreciated but never required."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Polite and respectful; address people by first name once acquainted, but show deference to elders and titled chiefs (matai). Use polite Samoan greetings where possible. Communal, relationship-driven; rank and respect matter more than directness and open confrontation is avoided."
  greetingNorms: "Begin with 'Talofa' (hello) or 'Talofa lava' (respectful). Remove shoes before entering a Samoan home (fale); keep eye contact moderate and do not tower over seated elders. A short prayer may open formal meetings in Christian Samoa."
  meetingEtiquette: "Arrive on time for formal/business meetings but allow a relaxed ('island time') pace. Listen rather than dominate; let the host or a chief speak first. Build personal rapport before transacting. Dress modestly."
  topicsToAvoid:
    - "Criticizing the village or matai (chief) system, religion, or church donations"
    - "Sensitive family or customary-land matters"
    - "Touching a person's head, pointing feet at people, or sitting on tables"
  giftGivingNotes: "Gift-giving is central (fa'aaloaloga — formal ceremonial exchange at weddings, chiefly installations, funerals). Bring a small gift when visiting a home (food, fine mats, or money in an envelope at church/ceremony); it is a sign of respect and reciprocity rather than obligation."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
