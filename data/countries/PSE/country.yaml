    name: "The Amended Basic Law of the Palestinian National Authority (2003)"
    publisher: "Palestinian Legislative Council (PLC)"
    url: "https://security-legislation.ps/latest-laws/the-amended-basic-law-of-2003"
    accessedDate: "2026-09-21"
    note: "Article 4: Arabic is the official language of Palestine; the basis of the language-usage legal-status and religion framing."
  - id: pse-cia
    name: "CIA World Factbook — West Bank and Gaza (demo-linguistic context)"
    publisher: "CIA World Factbook"
    url: "https://www.cia.gov/the-world-factbook/countries/west-bank/"
    accessedDate: "2026-09-21"
    note: "Language situation (Arabic official and dominant, Hebrew and English present) and basis for qualitative locallySpoken estimates."
  - id: pse-cia-westbank
    name: "CIA World Factbook — West Bank (ethnic groups)"
    publisher: "CIA World Factbook"
    url: "https://www.cia.gov/the-world-factbook/countries/west-bank/"
    accessedDate: "2026-09-21"
    note: "West-Bank ethnic mix: Palestinian Arab 83%, Israeli Jewish and other 17% (the only published ethnic split; Gaza is ~99% Palestinian Arab)."
  - id: pse-lexlint
    name: "State of Palestine: AI, scraping, privacy, age-gating, and news-aggregation law"
    publisher: "LexLint"
    url: "https://lexlint.org/law/ps"
    accessedDate: "2026-09-21"
    note: "Confirms no comprehensive personal-data-protection law; privacy via Amended Basic Law arts. 17 & 32; Cybercrime Decree Laws 16/2017 and 10/2018; no AI disclosure duty."
  - id: pse-pal-law
    name: "Palestinian law (overview of the unsettled legal status)"
    publisher: "Wikipedia"
    url: "https://en.wikipedia.org/wiki/Palestinian_law"
    accessedDate: "2026-09-21"
    note: "Mixed Ottoman/British/Jordanian/Egyptian heritage plus PA legislation; West Bank-Gaza split administration informs the consumer/commercial legal-uncertainty framing."
  - id: pse-vat
    name: "Palestinian Ministry of Finance — General Sales Tax (VAT)"
    publisher: "Palestinian Ministry of Finance"
    url: "https://www.pmof.ps/"
    accessedDate: "2026-09-21"
    note: "PA general sales tax (VAT) currently 16%, administered by the Ministry of Finance; price-display context."
