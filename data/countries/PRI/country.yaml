# Language official-status basis: Spanish and English are the official languages
# of the executive branch of the Commonwealth government (Spanish predominates;
# ~94% of residents speak Spanish at home per the U.S. Census). Figures are
# composites of U.S. Census Bureau ACS data and are estimates.
languageUsage:
  - languageCode: spa
    domain: official
    speakersShare: 1.0
    sourceId: pri-constitution-lang
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: pri-constitution-lang
  # FLAGGED ESTIMATE: ~94% of the population over 5 years speak Spanish at home
  # (U.S. Census ACS); English is widely spoken in business, government and
  # tourism but is a home language for a small minority (~5%).
  - languageCode: spa
    domain: locallySpoken
    speakersShare: 0.94
    sourceId: pri-census-lang
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.35
    sourceId: pri-census-lang
