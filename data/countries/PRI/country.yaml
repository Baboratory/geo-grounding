    standardUtcOffset: "UTC-4"
    observesDst: false
# Uses the United States dollar (USD) as its sole official currency. As an
# unincorporated U.S. territory, the Federal Reserve's USD circulates freely.
currency:
  code: USD
  symbol: "$"
  name: United States dollar
legalConstraints:
  - topic: "official languages"
    description: "Spanish and English are the official languages of the executive branch of the Puerto Rico government. Spanish is the dominant language of daily life, education and the media; English is used alongside it in federal and business contexts. Government documents and services are routinely provided bilingually."
    sourceId: pri-constitution-lang
  - topic: "consumption tax (IVU / IVA)"
    description: "Puerto Rico levies a state sales and use tax ('Impuesto sobre Ventas y Uso', IVU) administered by the Departamento de Hacienda; the combined state and municipal sales tax rate was raised to 11.5% as of the late 2010s. Unlike most U.S. states, the price shown to consumers includes the IVU. There is no separate federal U.S. sales tax; there is also no general VAT of the European type on the island."
    sourceId: pri-tax-hacienda
  - topic: "data protection / privacy"
    description: "Puerto Rico enacted a data-breach notification statute tied to personal information, and there is no general GDPR-style omnibus national data-protection law on the island. As a U.S. territory, U.S. federal laws and certain U.S. state-law practices inform the privacy landscape; businesses handling personal data should confirm current local requirements."
    sourceId: pri-privacy
# paymentMethodShares intentionally omitted: no official island-wide consumer
# payment-method split (cash vs card vs mobile) is published by the Departmento
# de Hacienda or the U.S. to Puerto Rico; observed reality is heavy card and
# contactless use (U.S. EMV norms) with cash still common at small merchants and
# in informal markets. Described qualitatively below.
paymentCulture:
  popularMethods:
    - "Credit and debit cards (Visa/Mastercard/Amex widely accepted, chip+PIN/contactless)"
    - "Mobile payments (Apple Pay, Google Pay, and local ATH-PR / popular wallets)"
    - "Cash (U.S. dollar) — still used at small shops, kiosks, street vendors and informal markets"
    - "Some ATH (A Toda Hora) network ATM/debit use"
  tipping:
    expected: true
    typicalAmount: "15-20% in restaurants; ~10% for taxis and other personal services"
    autoIncludedInBill: true
    note: "As in the U.S. mainland, a service charge or gratuity is frequently auto-included for large parties or added as a line item; otherwise tipping 15-20% in sit-down restaurants and a few dollars to bellhops/housekeeping is standard."
communicationStyle:
  contextLevel: mixed
  formalityNorms: "Direct and warm; Puerto Ricans combine North American directness with a notably warm, expressive Latin American style. First names are common once acquainted; honorifics (Señor/Señora, Don/Doña) are used respectfully with elders and officials. Bilingualism (Spanish primary, English widely understood) means code-switching is common."
  greetingNorms: "A warm greeting is essential; 'Buenos días / Buenas tardes' (or English) upon entering a room, a handshake in formal settings, and cheek-kissing (often two) or a hug among friends/family. '¿Cómo estás?' / 'How are you?' is a real question, not rhetorical."
  meetingEtiquette: "Business meetings typically open with polite small talk before getting down to matters; relationships matter. Punctuality is valued in formal business, though a somewhat relaxed 'island time' may appear socially. Business casual is standard; formal attire at senior/govt functions."
  topicsToAvoid:
    - "The unresolved political status / relationship with the United States (a sensitive and charged topic)"
    - "Casual stereotyping of 'island time'"
  giftGivingNotes: "Gifts are welcome though not expected in business; a modest token (gourmet coffee, rum, artisanal craft) when hosted is appreciated. Offer with both hands; recipients typically open gifts privately."
