  - season: dry
    months: [6, 7, 8]
  - season: wet
    months: [1, 2, 3, 4, 5, 9, 10, 11, 12]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices and mining companies roughly 07:30-16:30 Monday to Friday; shift work is common in the mines."
  lunchBreakTiming: "A midday break, often at the site canteen or a local restaurant."
  notes: "The mining economy runs on shift schedules around the clock; many workers commute from town to site daily."
