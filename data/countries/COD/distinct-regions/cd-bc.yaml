code: CD-BC
name:
  eng: Kongo Central (Kongo-Central)
  local:
    - languageCode: fra
      value: Kongo Central
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry climate near the Atlantic-influenced west — hot and humid with a pronounced dry season in the mid-year months."
landmarks:
  - name: Boma (first colonial-era capital)
    description: "The historic town that served as the capital of the Congo Free State before Leopoldville, holding important colonial-era architecture."
  - name: Matadi port
    description: "The country's main deep-water Atlantic port at the mouth of the Congo, a key hub for DRC's import-export trade."
  - name: Chutes de Luebo (near Matadi)
    description: "Spectacular cataracts of the lower Congo river, a natural landmark of the region."
  - name: Kimpeze — waterfalls of the Kongo Central
    description: "Landscaped waterfall site, a popular retreat outside Matadi."
culturalTraits:
  - "The historic homeland of the Kongo people and the seat of the pre-colonial Kongo kingdom"
  - "Kikongo (Kikongo ya leta) is the everyday lingua franca; kinship and community ties run deep"
  - "A coastal, Atlantic-facing identity distinct from the rest of the country"
prideOf:
  - "Its role as the cradle of the Kongo kingdom and its royal and spiritual heritage"
  - "The port and its centuries of Atlantic connections"
animals:
  popular:
    - "Flamingos and waterfowl in the coastal wetlands"
    - "Manatees reported in the lower Congo estuary"
industries:
  - "Port and logistics at Matadi — the country's principal maritime gateway"
  - "Agriculture (cassava, bananas, plantains, groundnuts)"
  - "Oil production in offshore fields near the coast"
sports:
  - "Football and basketball"
  - "Water sports along the rivers and coast"
