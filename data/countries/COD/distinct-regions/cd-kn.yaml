    note: "This source only reports the DRC's national religious composition; no province-level breakdown for Kinshasa was found, so the figures here reflect the national pattern (2014 estimate: roughly 93% Christian (Catholic/Protestant/other Christian/Kimbanguist), small Muslim and other minorities) rather than a Kinshasa-specific survey."
