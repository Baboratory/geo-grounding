code: CD-NK
name:
  eng: Nord-Kivu (North Kivu)
  local:
    - languageCode: fra
      value: Nord-Kivu
climates:
  - koppenCode: Aw
    description: "Tropical highland climate in the eastern rift zone — warm days, cooler nights at altitude, with marked wet and drier seasons."
landmarks:
  - name: Goma and the Lake Kivu shoreline
    description: "The region's principal city on the shores of Lake Kivu, one of Africa's great Great Lakes, with dramatic views of the Nyiragongo volcano."
  - name: Virunga National Park
    description: "Africa's oldest national park, a UNESCO World Heritage Site and home to mountain gorillas, the Ruwenzori massif and active volcanoes — also one of the world's most conflict-affected protected areas."
    unescoWorldHeritage: true
  - name: Mount Nyiragongo
    description: "The active strato-volcano looming over Goma, whose lava lake is among the world's largest."
  - name: Ruwenzori Mountains
    description: "The 'Mountains of the Moon,' a glaciated massif within the park, a biodiversity hotspot."
culturalTraits:
  - "A region marked by extraordinary beauty and deep humanitarian challenge"
  - "Swahili is the everyday lingua franca of this eastern borderland with Rwanda and Uganda"
  - "Resilience and community solidarity forged through repeated crises"
prideOf:
  - "The mountain gorillas of Virunga and the region's pristine landscapes"
  - "The volcanic drama of Nyiragongo and the beauty of Lake Kivu"
animals:
  popular:
    - "Mountain gorillas (in Virunga)"
    - "Elephants, okapi and chimpanzees in the park forests"
  unique:
    - "Mountain gorilla (Gorilla beringei) — found in the Virunga highlands and nowhere else in such density"
    - "Ruwenzori sole and other endemics of the rift highlands"
industries:
  - "Agriculture (coffee, bananas, cassava) on the fertile volcanic soils"
  - "Fishing on Lake Kivu"
  - "Coltan and mineral extraction in the eastern highlands"
sports:
  - "Football and athletics"
  - "Basketball"
