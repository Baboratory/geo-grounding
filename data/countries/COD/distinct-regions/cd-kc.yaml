  - season: dry
    months: [6, 7, 8]
  - season: wet
    months: [1, 2, 3, 4, 5, 9, 10, 11, 12]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices and markets roughly 08:00-16:30 Monday to Friday; Saturday morning market trading is common."
  lunchBreakTiming: "A midday break, often at home or a local restaurant."
  notes: "Diamond trading has its own informal rhythm; much commerce happens in networks around Kananga and the river towns."
