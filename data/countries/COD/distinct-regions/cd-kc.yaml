code: CD-KC
name:
  eng: Kasaï Central (Central Kasaï)
  local:
    - languageCode: fra
      value: Kasaï Central
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry climate on the southern plateau — warm with a long rainy season and a distinct dry season in the mid-year."
landmarks:
  - name: Kananga (the diamond capital)
    description: "The region's principal city, long known for alluvial diamond mining and trade."
  - name: Kasaï river
    description: "The great tributary of the Congo that gives the region its name, vital to fishing and transport."
  - name: Chutes de la Lulonga / Kasaï waterfalls
    description: "River cataracts along the Kasaï, part of the region's watery landscape."
culturalTraits:
  - "The heartland of Tshiluba (Luba-Kasai) speakers, one of the Congo's four national languages"
  - "Rich traditions of mask carving, weaving and the Luba diaspora's cultural heritage"
  - "The Luba (Bena-Kasai) people's communal, agricultural way of life"
prideOf:
  - "Tshiluba as a living national language and a proud Luba identity"
  - "Its diamond legacy and the craftsmanship of local artisans"
animals:
  popular:
    - "Antelopes and monkeys in the forest-gallery savanna"
    - "Fish in the Kasaï river"
industries:
  - "Alluvial diamond mining and trade"
  - "Agriculture (cassava, maize, groundnuts, oil palm)"
  - "Fishing and river trade"
sports:
  - "Football and athletics"
  - "Wrestling and traditional dance"
religions:
  - name: Christianity (Catholic, Protestant, Kimbanguist)
    percent: 93.0
    sourceId: wfb-cd
  - name: Islam
    percent: 2.0
    sourceId: wfb-cd
  - name: Other (indigenous beliefs, none)
    percent: 5.0
    sourceId: wfb-cd
entertainment:
  - season: allYear
    items:
      - "Mask festivals and cultural performances celebrating Luba heritage"
      - "Church and community gatherings"
      - "River markets and fishing traditions along the Kasaï"
