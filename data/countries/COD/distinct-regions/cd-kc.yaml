  - season: allYear
    items:
      - "Moambe and fish stews from the Kasaï river"
      - "Fufu and chikwangue with saka-saka (cassava leaves)"
      - "Groundnut sauces accompanying maize and cassava"
traditionalClothing:
  - season: allYear
    items:
      - "Western dress is everyday wear"
      - "Wax-print and pagne fabrics at festivals and ceremonies"
