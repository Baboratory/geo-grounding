communicationStyle:
  contextLevel: low-context
  formalityNorms: "Conservative and formal in business settings; address by surname/title until invited to move to first names. Hierarchy and modesty are valued."
  greetingNorms: "Firm handshake, direct eye contact (seen as a sign of respect, not confrontation)."
  meetingEtiquette: "Punctuality is expected and valued — aim to arrive slightly early rather than exactly on time. Business cards are exchanged after the initial greeting. Decision-making authority sits with senior/top management, so involving them early speeds things up; decisions are often not rushed and may require approval through multiple organizational levels. Communication in meetings is direct and to the point, with little small talk once business starts."
  topicsToAvoid:
    - "Overly personal questions early in a relationship — Lithuanians tend not to share personal matters or uncertainty until trust has developed"
  giftGivingNotes: "Not expected at a first business meeting, but a small gift (e.g. a branded item, or something representative of your own country) is welcome once a relationship develops. If bringing flowers to someone's home, give an odd number — even numbers are associated with funerals — and avoid white flowers and chrysanthemums, which are used for funerals/mourning."
