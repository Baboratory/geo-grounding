    year: 2021
    accessedDate: "2026-09-02"
    note: "The ethnic composition percentages, and the share of the total population who speak Lithuanian as their native language (85.3%). The native-language shares for Russian and Polish speakers are derived, not directly published: each ethnic group's population share multiplied by that group's own native-language retention rate reported in the same census table (Russians 5.0% x 91.8% retention = 4.6%; Poles 6.5% x 78.7% retention = 5.1%)."
  - id: lt-foreign-languages-2021
    name: "2021 census: population's command of foreign languages"
    publisher: "Lietuvos statistikos departamentas (Statistics Lithuania), release reported via press coverage"
    url: "https://madeinvilnius.lt/en/news/Lithuanian-news/the-statistics-department-speaks-Russian-to-60%25-of-the-Lithuanian-population-in-English-every-third/"
    year: 2021
    accessedDate: "2026-09-02"
    note: "The share of the population who speak Russian and English as a foreign language (Russian 60.6%, English 31.1%). The primary osp.stat.gov.lt page for this specific table returned HTTP 403 on direct fetch during verification; figures are corroborated via this press report of the official statistics release and match figures independently cited by the Lithuanian embassy in India (in.mfa.lt)."
