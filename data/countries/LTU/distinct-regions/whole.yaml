businessRhythm:
  restDays: []
  notes: "No law currently restricts which days of the week retail may trade — unlike France's default Sunday-rest rule. Supermarkets and shopping centres commonly operate all 7 days, typically around 10:00am-9:00pm on weekdays/Saturday (some grocery stores open earlier and close later, roughly 8:00am-10:00pm or midnight) and slightly shorter hours on Sunday (often closing by 5:00-6:00pm). A ban on large retail chains trading on Sundays has been repeatedly proposed in the Seimas (Lithuania's parliament) since at least 2018 but has not been enacted as of 2026 — so restDays is deliberately empty here rather than omitted, reflecting a real 'no restriction' state rather than an unresearched gap."
  typicalWorkHours: "Standard office hours are typically around 8:00/9:00am-5:00/6:00pm, Monday-Friday."
