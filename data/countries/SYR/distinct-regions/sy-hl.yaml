  - season: winter
    months: [12, 1, 2]
businessRhythm:
  restDays:
    - friday
  typicalWorkHours: "Offices typically run Saturday-Thursday, roughly 8:00am-4:00pm, with Friday the rest day; the historic souks retain their long trading day."
  lunchBreakTiming: "A midday break around 1:00-2:00pm is common."
  notableShutdownPeriods:
    - period: Eid al-Fitr and Eid al-Adha
      description: "Most establishments close for the Eids."
    - period: Ramadan
      description: "Hours shorten and the day's rhythm shifts toward the evening."
  notes: "Aleppo is northern Syria's commercial and industrial heart. Friday is the rest day. Kitchen markets (souks) are central, cash dominates, and relationships underpin all trade. The city's ongoing reconstruction is reshaping its commercial life."
