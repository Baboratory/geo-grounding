      value: محافظة حلب
climates:
  - koppenCode: BSh
    description: Hot semi-arid climate on the northern plain — hot summers, cool winters, low rainfall.
landmarks:
  - name: The Citadel of Aleppo
    unescoWorldHeritage: true
  - name: The Ancient City of Aleppo and its historic souks
