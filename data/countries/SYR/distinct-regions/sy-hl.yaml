  - name: The Umayyad-era pilgrimage route caravanserais
culturalTraits:
  - "A great historic trading hub on the silk and spice routes — among Syria's most storied cities"
  - "A centre of the celebrated Levantine culinary and craft tradition (Aleppo soap, pistachios, kibbeh)"
  - "A deeply cosmopolitan, multi-confessional city (Muslim, Christian, Armenian communities)"
  - "Known for its people's prodigious hospitality and its musical and literary traditions"
prideOf:
  - "The Citadel and the Ancient City of Aleppo — a Unesco-listed treasure"
  - "Aleppo's proud mercantile and artisan heritage along its historic souks"
  - "The world-famous Aleppo cuisine and the city of the 'Aleppo kebab' and pistachio"
  - "The city's resilience as it rebuilds after the devastation of the recent conflict"
animals:
  popular:
    - Goat
    - Domestic sheep
    - Arabian camel (dromedary on the plateau)
  unique:
    - Golden eagle (winter visitor)
    - Syrian hamster (originally described from the surrounding steppe)
industries:
  - Trade and commerce (a historic source of northern Syria's economy)
  - Oil and gas in the surrounding east
  - Food processing and agro-industry (pistachios, olives, grains)
  - Craft industries (soap-making, textiles, metalwork)
  - Construction and reconstruction
sports:
  - Football (Aleppo clubs and the historic Aleppo International Stadium)
  - Basketball
  - Horse-riding
entertainment:
  - season: spring
    items:
      - "Outings to the countryside and cemeteries of the old city in the flowering season"
      - "Café life and souk evenings"
  - season: summer
    items:
      - "Evening socialising and cooler highland excursions"
  - season: autumn
    items:
      - "Pistachio- and olive-harvest season"
      - "Comfortable sightseeing in the old city"
  - season: winter
    items:
      - "Cool to cold winters — indoor gatherings, tea houses and the warmth of the old souks"
seasonCalendar:
  - season: spring
    months: [3, 4, 5]
  - season: summer
    months: [6, 7, 8]
  - season: autumn
