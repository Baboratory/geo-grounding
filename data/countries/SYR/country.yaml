# Classified unitary-large: population ~24M exceeds the threshold, and while Arabic is
# the sole official language, the country has a genuine, widely recognized
# cultural-historical regional identity (the Levantine heartland of Damascus and
# Aleppo, the coastal Alawite-mountain belt, and the Kurdish-influenced north-east).
# Real ISO 3166-2 governorate files are curated (a representative subset) alongside
# the WHOLE fallback.
governanceType: unitary-large
iso3166_2_prefix: SY
hasSubdivisions: true
