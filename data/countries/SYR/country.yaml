sources:
  - id: syr-constitution-art4
    name: "Constitutional Declaration of the Syrian Arab Republic (13 March 2025), Article 4"
    publisher: "ConstitutionNet (hosting the official English translation)"
    url: "https://constitutionnet.org/sites/default/files/2025-03/2025.03.13%20-%20Constitutional%20declaration%20(English).pdf"
    year: 2025
    accessedDate: "2026-09-20"
    note: "Article 4 ('Official language') establishes Arabic as the official language of the state. This is the current governing instrument -- the 2012 Ba'athist constitution previously cited here was repealed after the December 2024 transition."
  - id: syr-cia-people
    name: "CIA World Factbook — Syria (people and society)"
    publisher: "CIA World Factbook"
    url: "https://www.cia.gov/the-world-factbook/countries/syria/"
    year: 2025
    accessedDate: "2026-09-20"
    note: "Ethnic composition (Arab ~85%, Kurd ~9%, other ~6%) and language shares (Arabic ~92%, Kurdish Kurmanji ~9%)."
  - id: syr-data-protection
    name: "Syrian legal framework for privacy and data protection"
    publisher: "Government of the Syrian Arab Republic"
    url: "https://www.syria.gov.sy/"
    year: 2020
    accessedDate: "2026-09-20"
    note: "No standalone data-protection law; confidentiality governed by the penal code and sectoral (telecoms, banking) rules."
  - id: syr-cbs-inflation
    name: "Central Bureau of Statistics (CBS) — pricing and inflation"
    publisher: "Central Bureau of Statistics, Syria"
    url: "https://cbssyr.sy/"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Prices in Syrian pounds; high inflation and dollarisation affect price setting and exchange-rate practice."
  - id: syr-sanctions-payments
    name: "International sanctions and the Syrian financial system"
    publisher: "Ministry of Economy / Central Bank of Syria"
    url: "https://www.cb.gov.sy/"
    year: 2024
    accessedDate: "2026-09-20"
    note: "Comprehensive sanctions isolate Syria from international card and payment networks; cash and domestic channels dominate."
  - id: syr-ef-english-2023
    name: "EF English Proficiency Index 2023 — Syria"
    publisher: "EF Education First"
    url: "https://www.ef.com/wwen/epi/"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Approximate share of the population able to hold an English conversation (~8%, concentrated among the educated, younger and urban population)."
  - id: syr-payment-composite
    name: "Composite estimate of Syrian payment-method shares (2023-2024)"
    publisher: "Composite estimate"
    url: "https://www.cb.gov.sy/"
    year: 2024
    accessedDate: "2026-09-20"
    note: "Approximate shares: cash ~90%, domestic bank transfer/cards ~8%, other ~2%. Composite estimate; there is no published official paymentMethodShares split."
