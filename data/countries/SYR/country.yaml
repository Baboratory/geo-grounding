legalConstraints:
  - topic: "data protection regime"
    description: "Syria does not have a standalone comprehensive data-protection law. Privacy is addressed through the Constitution's protections and the penal code's provisions on the confidentiality of communications, and data handling is regulated sectorally (telecommunications, banking). Enforcement rests mainly with service-provider and state bodies rather than an independent data-protection authority."
    sourceId: syr-data-protection
  - topic: "price display and currency"
    description: "Prices are displayed in Syrian pounds; in practice the economy has seen high inflation and a strong reliance on foreign currencies (notably the US dollar) for large transactions, and the official and parallel-market exchange rates can diverge. Businesses commonly quote prices with adjustment for the prevailing rate."
    sourceId: syr-cbs-inflation
  - topic: "sanctions and cross-border payments"
    description: "Syria is subject to comprehensive international sanctions, so international card networks and most cross-border banking and payment channels are unavailable or heavily restricted. Payments rely on cash and domestic means; businesses and visitors must plan for a cash-heavy, internationally isolated financial environment."
    sourceId: syr-sanctions-payments
paymentMethodShares:
  - method: "cash (Syrian pounds and foreign currency)"
    percent: 90.0
    sourceId: syr-payment-composite
  - method: "domestic bank transfers and local cards"
    percent: 8.0
    sourceId: syr-payment-composite
  - method: "other (money transfers, mobile top-up credits, informal channels)"
    percent: 2.0
    sourceId: syr-payment-composite
paymentCulture:
  popularMethods:
    - "Cash — almost universally dominant, in Syrian pounds and, for large sums, foreign currency (especially US dollars)"
    - "Domestic banking through state and private banks, largely isolated from international networks"
    - "Money-transfer services for remittances and informal (hawala) channels"
    - "Prepaid mobile top-up used as a de facto small-value payment vehicle"
  tipping:
    expected: false
    typicalAmount: "5-10%"
    autoIncludedInBill: false
    note: "Tipping is appreciated but not expected. In restaurants and cafés a few percent to ~10% is common; a small tip for porters, guides and drivers is customary."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Communication is warm, hospitable and relationship-driven. Use titles and surnames, and show respect to elders. Trust built through personal relationships matters greatly, and negotiation is patient and indirect. Family, community and honour are deeply important."
  greetingNorms: "The greeting 'As-salamu alaykum' with the reply 'Wa alaykum as-salam' is standard, along with 'Ahlan' ('welcome') and inquiries after health and family. Men shake hands and may add a kiss on the cheek among close friends; greetings with women follow cultural norms (often verbal or a nod unless the woman offers her hand)."
  meetingEtiquette: "Meetings open with tea, coffee and pleasantries before business. Hospitality is generous and offers are often insisted upon. Decision-making is relationship-based and can be slow; face-to-face trust and loyalty to family and community are central. Punctuality is generally expected but meetings may run long."
  topicsToAvoid:
    - "The ongoing conflict, its politics and sectarian dimensions"
    - "Criticism of religion or of community honour"
    - "Sensitive regional politics and the role of foreign powers"
    - "Sensitive assertions about ethnic or religious groups"
  giftGivingNotes: "Gift-giving is appreciated once a relationship is established. Sweets, dried fruits, quality perfumes and tactful items are safe. Give and receive with the right hand. Gifts are often opened when received. Avoid alcohol- or pork-linked gifts and anything with religious or political overtones."
