entertainment:
  - season: dry
    items:
      - Pirates Week national festival (late October to mid-November) — parades including the George Town night parade, district days and live entertainment
      - Cayman Cookout (January) — the islands' signature food-and-wine festival hosted by world-renowned chefs
      - National Heroes Day (third Monday in January) and the Batabanoo national cultural-heritage festival season
      - Festive Christmas-New Year season (heavy cake, community celebrations)
  - season: wet
    items:
      - Summer beach and water-sports season — diving, sailing regattas, snorkelling, and seasonal lionfish-derby and conservation events
      - Quieter 'shoulder' tourism season between storms, with community events
  - season: allYear
    items:
      - Live calypso and reggae-style nightlife in George Town and Seven Mile Beach hotels
      - The Cayman Quadrille and traditional music at community and kitchen dances
traditionalDishes:
  - season: allYear
    items:
      - Stew Turtle (national dish) — turtle stew with vegetables, served at special occasions, using sustainably farmed green sea turtle
      - Conch fritters and conch soup
      - Rundown (fish and tomato/onion stew, often with coconut) and fresh fried fish and seafood
      - Pepperpot and Cayman-style seafood, cassava bread
  - season: dry
    items:
      - Caymanian Heavy Cake (national dessert) — a dense cassava/yam/sweet-potato cake, traditionally made around Christmas and New Year
  - season: wet
    items:
      - Swanky (national drink) — brown sugar, water and Seville/bitter orange, a refreshing cooler for the hot climate
traditionalClothing:
  - season: allYear
    items:
      - "Caymanian National Dress (designated a national symbol in 2024): women's gingham or light-coloured modest one-piece dress or blouse with long skirt and head-wrap; men's khaki or white trousers with white shirts and straw hats"
      - Modern everyday wear is standard tropical/Caribbean casual; modest dress expected off the beach and in town
seasonCalendar:
  - season: dry
    months: [11, 12, 1, 2, 3, 4]
  - season: wet
    months: [5, 6, 7, 8, 9, 10]
businessRhythm:
  lunchBreakTiming: "Roughly 12:00/12:30-14:00; a one-hour lunch break is standard in offices and shops."
  typicalWorkHours: "Offices and most businesses Monday-Friday roughly 08:30-17:00; many shops open Saturday until ~14:00. Banks Monday-Thursday 09:00-15:00, Friday 09:00-15:30. Supermarkets typically 06:30-22:00/23:00 Mon-Sat."
  restDays:
    - sunday
  notes: "Sunday is widely observed as a day of rest: the main supermarkets, most retail shops, banks, pharmacies and standalone bars are closed (Sunday Trading Act (2023 Revision); smaller shops under 4,000 sq ft may open). ATMs and cards work 24/7, and beaches, parks and sea/boat tours operate seven days. Alcohol sales in stores on Sunday run only ~13:00-19:00. The economy slows for hurricane season (roughly June-November, peak August-October)."
