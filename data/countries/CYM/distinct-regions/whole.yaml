code: WHOLE
name:
  eng: Cayman Islands
  local:
    - languageCode: eng
      value: Cayman Islands
climates:
  - koppenCode: Aw
    description: "Tropical marine (tropical savanna, Köppen Aw): warm, rainy summers May to October and cooler, relatively dry winters November to April. Low-lying limestone islands ringed by coral reefs; the natural hazard is hurricanes, July to November."
landmarks:
  - name: Seven Mile Beach
    description: The celebrated ~7-mile (11 km) stretch of white-sand beach on the west shore of Grand Cayman, fringed by tourist resorts and consistently ranked among the world's best beaches, with public access along the whole shore.
  - name: Stingray City
    description: A shallow sandbar in North Sound, Grand Cayman, where hundreds of tame southern stingrays gather — the islands' most famous water attraction, reached by boat tours.
  - name: Cayman Turtle Centre
    description: A conservation-and-education centre (and tourist attraction) in West Bay, Grand Cayman, for green sea turtles, balancing the cultural importance of the turtle in Caymanian cuisine with sustainability.
  - name: Queen Elizabeth II Botanic Park
    description: A 65-acre botanic garden and heritage park on the North Side of Grand Cayman conserving native flora (silver thatch palm, wild banana orchid) and habitat for the Grand Cayman parrot and the endemic Grand Cayman blue iguana.
culturalTraits:
  - British-Caribbean identity — a British Overseas Territory (Governor, English common law) fused with a deeply Caribbean culture, accents and lifestyle
  - Hospitality and community spirit — a strong local heritage reflected in the 'Caymankind' tourism brand and tight-knit island communities
  - Major offshore financial centre — one of the world's largest offshore banking and funds jurisdictions, shaping everyday business life and national pride
  - Pirates Week national festival (late October-mid November), the signature celebration of maritime heritage since 1977
  - Scuba-diving culture — Bloody Bay Wall (Little Cayman) is a premier deep wall dive and diving is a pillar of the tourism identity
  - Heritage symbols — the Cayman Quadrille dance (8-count), the national song 'Beloved Isle Cayman', and a seafaring and turtle legacy
prideOf:
  - Being a leading global offshore financial centre and a top hedge-fund and captive-insurance domicile
  - Cayman's national symbols and heritage — stew turtle, Swanky, heavy cake, Cayman Quadrille, national dress, parrots, silver thatch palm and wild banana orchid
  - Pirates Week, the islands' premier national festival celebrating maritime history and community
  - Environmental stewardship — conservation of the endemic Grand Cayman blue iguana, brought back from near-extinction, and marine life and reefs
  - Seafaring and turtle heritage — 'Las Tortugas', and the Cayman Turtle Centre's sustainable turtle culture
animals:
  popular:
    - Southern stingray (Stingray City — hundreds of tame rays at a Grand Cayman sandbar)
    - Green sea turtle (Cayman Turtle Centre; the islands were named 'Las Tortugas' by Columbus)
    - Grand Cayman parrot (Amazona leucocephala caymanensis) — the national bird
    - Red-footed booby (Little Cayman hosts one of the region's largest breeding colonies at Booby Pond Nature Reserve)
  unique:
    - Grand Cayman blue iguana (Cyclura lewisi) — endemic to Grand Cayman, the islands' largest native land animal, recovered from near-extinction (endangered)
    - Sister Islands rock iguana (Cyclura nubila caymanensis) — endemic subspecies found only on Cayman Brac and Little Cayman
    - "Cayman parrot (two endemic subspecies: Grand Cayman 'caymanensis' and Cayman Brac 'hesterna')"
industries:
  - Financial services / offshore banking & investment funds — the dominant industry; the services sector accounts for the large majority of economic activity, with the world-leading hedge-fund and captive-insurer domicile
  - Tourism — cruise passengers and stay-over visitors (Seven Mile Beach hotels, diving, Stingray City); the second-largest economic pillar
  - Re/insurance captives — one of the largest offshore captive-insurance domiciles in the world by licence numbers, and the largest for healthcare captives
  - Construction, real estate and construction materials; minor agriculture
sports:
  - Football (soccer) — the most popular / de facto national sport
  - Water sports and scuba diving — diving (Bloody Bay Wall), sailing, snorkelling, swimming; swimmers have won Pan American Games gold
  - Cricket — the national team is an ICC associate member
  - Athletics, track, rugby, netball, volleyball and basketball; the Cayman Islands have competed at the Summer Olympics since 1976
