# KYD (Cayman Islands dollar), official currency, pegged to the US dollar. The
# official fixed rate is CI$1 = US$1.20 (CIMA); the practical retail/cash rate is
# ~CI$1 = US$1.2-1.25, and US dollars circulate widely alongside KYD.
currency:
  code: KYD
  symbol: "CI$"
  name: Cayman Islands dollar
