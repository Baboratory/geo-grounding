# NOTE: figures are by country of birth (CIA/ESO note), not self-identified
# ethnicity; a large expatriate workforce (roughly half of residents are
# non-Caymanian) drives this.
legalConstraints:
  - topic: "data protection / privacy"
    description: "The Data Protection Act, 2017 (Law 33 of 2017; Data Protection Act (2021 Revision)) is the Cayman Islands' GDPR-style law. It applies to any data controller established in, operating from, or regularly carrying on business in the Islands, and imposes eight data-protection principles; controllers not established in Cayman must nominate a Cayman Islands representative. It is enforced by the Office of the Ombudsman."
    sourceId: cym-dpa-2017
  - topic: "tax regime — tax-neutral, no income/corporate/VAT"
    description: "The Cayman Islands levies no personal income tax, corporate income tax, capital gains tax, inheritance tax, or VAT/GST/sales tax (a 'tax-neutral' jurisdiction). Government revenue comes from import/customs duties, stamp duty on property transfers, work-permit fees, financial-services and company registration fees, and tourism levies including the 13% Tourist Accommodation Tax on lodging."
    sourceId: cym-tax-neutral
  - topic: "consumer protection / price display"
    description: "Cayman has no single comprehensive consumer-protection statute; consumers are protected under English common law and existing statutes (e.g. the Sale of Goods Law (1997 Revision)) plus the Price Gouging Control (Emergency Circumstances) Law, 2004. No price-display VAT rule applies because there is no VAT."
    sourceId: cym-lrc-consumer
# paymentMethodShares intentionally omitted: no official island-wide consumer
# payment-method split is published.
paymentCulture:
  popularMethods:
    - "Major international credit/debit cards (Visa, Mastercard) — readily accepted; contactless EMV terminals increasingly standard and mobile wallets (Apple Pay, Google Pay) work at any contactless terminal"
    - "Cash in Cayman Islands dollars (KYD) and US dollars — US dollars widely accepted in shops, hotels and restaurants (change given in CI$)"
    - "Bank debit cards and 24/7 ATMs (banks closed weekends but ATMs and cards work)"
  tipping:
    expected: true
    typicalAmount: "Restaurants ~15-20% (gratuity is commonly auto-added to the bill); hotels often include a service charge of ~6-12%; taxis 10-15%"
    autoIncludedInBill: true
    note: "Per the official Cayman Islands tourism FAQ, 'Most hotels and restaurants include gratuities between 15 and 20%'. Diners should check the bill before adding more; many outlets operate State-approved gratuity schemes."
communicationStyle:
  contextLevel: mixed
  formalityNorms: "Friendly and approachable with a strong sense of community, blending British colonial heritage with warm Caribbean informality. First names become common quickly once acquainted; courtesy and good manners are valued."
  greetingNorms: "A warm handshake and a smile are standard; 'Good morning/afternoon' with a genuine 'How are you?' is expected. Among friends, a hug or greeting on the cheek is common."
  meetingEtiquette: "Meetings typically open with polite small talk before getting to the point; relationships matter in business. Punctuality is appreciated. Business casual is standard, with formal attire at senior or government functions."
  topicsToAvoid:
    - "Overly aggressive or direct confrontation (a courteous, calm style is valued)"
    - "Presuming the visitor 'knows the local way' — a humble, respectful approach is appreciated"
  giftGivingNotes: "Gifts are welcome though not typically required in business; a modest token (local rum, Caymanian heavy cake, crafts) when hosted is appreciated."
