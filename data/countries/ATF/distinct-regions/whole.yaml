code: WHOLE
name:
  eng: French Southern and Antarctic Lands
  local:
    - languageCode: fra
      value: Terres australes et antarctiques françaises
climates:
  - koppenCode: ET
    description: Tundra climate on the sub-Antarctic islands (Crozet, Kerguelen, Amsterdam) — cool, windy and cloudy year-round with frequent precipitation.
  - koppenCode: EF
    description: Ice cap climate on Adélie Land in Antarctica, permanently below freezing.
landmarks:
  - name: Kerguelen Islands (Desolation Islands)
    description: The territory's largest sub-Antarctic archipelago, dominated by the glaciated Grand Tête volcano and the research station at Port-aux-Français.
  - name: Crozet Archipelago
    description: Two island groups home to large penguin and seabird colonies, with the Alfred Faure research station on Île de la Possession.
  - name: Île Amsterdam and Île Saint-Paul
    description: Two isolated volcanic islands with a temperate grassland/tree cover; Île Amsterdam hosts a research station.
  - name: Adélie Land (Terre Adélie)
    description: France's claim wedge on the Antarctic continent, hosting the Dumont d'Urville station.
culturalTraits:
  - "Sub-Antarctic scientific research outpost of France"
  - "French sealing and whaling-era history on the southern islands"
prideOf:
  - "Exceptional sub-Antarctic wildlife and near-pristine ecosystems"
  - "Endurance-era exploration heritage (Kerguelen, Adélie Land)"
animals:
  popular:
    - King penguin
    - Elephant seal
    - "Rockhopper penguin (Crozet and Kerguelen)"
    - Fur seal
  unique:
    - "Kerguelen cabbage (Brassicaceae Pringlea antiscorbutica) — an endemic sub-Antarctic plant"
industries:
  - Scientific research (seabird and marine-mammal ecology, climate)
  - Fisheries licensing in the French Southern Ocean exclusive economic zone
sports:
  - Hiking and mountaineering on Kerguelen
  - Wildlife observation
