code: SS-UY
name:
  eng: Unity
  local:
    - languageCode: eng
      value: Unity
# No separate native-language toponym is commonly used for the state (formerly
# Western Upper Nile); local entry given in English (official).
climates:
  - koppenCode: Aw
    description: "Tropical savanna climate; heavy rainfall concentrated in the wet season (roughly May-October), when the lowlands and Sudd fringes flood extensively; a strongly seasonal dry season November-April."
landmarks:
  - name: Bentiu
    description: "The state capital, near the junction of the Bahr el Ghazal with the White Nile system; a major town of the western Nuer."
  - name: Unity oilfield (Paloch)
    description: "The largest hydrocarbon accumulation in the Muglad rift basin, from which the Greater Nile Oil Pipeline runs north to Port Sudan; a strategic oil-producing centre."
  - name: Rubkona and the Sudd fringe
    description: "Floodplain towns on the edge of the great wetlands, chronically affected by flooding."
culturalTraits:
  - "Heartland of the (western) Nuer people — a major cattle-pastoralist Nilotic nation"
  - "Cattle-centred society with segmentary lineages and egalitarian politics"
  - "Oil wealth amid harsh environmental and conflict conditions: extraction and flooding shape the land"
prideOf:
  - "The Nuer pastoral heritage and cattle culture"
  - "Being the primary source of South Sudan's oil wealth"
  - "The resilience of communities from the Sudd floodplains"
animals:
  popular:
    - "Cattle — central to Nuer life"
    - "Antelope and waterbirds of the floodplains"
    - "Hippos in the river systems"
industries:
  - "Crude oil production and export (the backbone of national revenue)"
  - "Livestock herding (cattle)"
  - "Subsistence farming on the floodplain fringes"
  - "Wet-season fishing"
sports:
  - "Traditional wrestling (Nuer)"
  - "Football"
# religions intentionally omitted: no authoritative state-level breakdown found;
# the Nuer blend Christian adherence with strong traditional religion — see SSD
# WHOLE for the national figures.
