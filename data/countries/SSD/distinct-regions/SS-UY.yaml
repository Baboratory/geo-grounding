businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Oil-field and government work roughly 08:00-16:00; rural markets run daylight hours."
  lunchBreakTiming: "Midday."
  notableShutdownPeriods:
    - period: "Wet season flooding (approx. May-October)"
      description: "Flooding inundates low-lying settlements (e.g. Bentiu's dyke-protected town and the adjacent UNMISS protection-of-civilians area), disrupting markets."
  notes: "Unity's economy is split between large-scale oil operations and subsistence pastoralism; recurrent floods and past conflict (the state was among the worst hit in the 2013-2018 war) keep much of the population dependent on humanitarian support."
