isSovereign: true
# Classified unitary-small: the Republic of the Marshall Islands (~42k people,
# 2021 census) is a constitutional republic in free association with the
# United States (Compact of Free Association). The archipelago's 29 atolls and
# 5 islands are geographically split but do not constitute a widely recognized
# cultural-historical regional divide meriting curation. One synthetic WHOLE
# region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: mah
    domain: official
    speakersShare: 1.0
    sourceId: wp-lang
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: wp-lang
  - languageCode: mah
    domain: locallySpoken
    speakersShare: 0.981
    sourceId: wp-lang
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.087
    sourceId: wp-lang
# Marshallese and English are both official (Constitution art. I, sec. 1).
# Marshallese is the everyday language of ~98% of the population; English is
# widely used in government, education and business, and is spoken by a small
# native minority.
ethnicGroups:
  - group: Marshallese (Marshallese people of Micronesia)
    percent: 96.3
    sourceId: wp-ethnic
  - group: U.S. and other (incl. Japanese, Filipino)
    percent: 3.7
    sourceId: wp-ethnic
timezones:
  - name: Pacific/Majuro
    standardUtcOffset: "UTC+12"
    observesDst: false
# The Marshall Islands is on a single timezone UTC+12 year-round with no DST.
currency:
  code: USD
  symbol: "$"
  name: United States dollar
legalConstraints:
  - topic: "official languages"
    description: "Marshallese and English are both official languages (Constitution art. I, sec. 1)."
    sourceId: wp-lang
  - topic: "oil and tobacco import bans"
    description: "No petroleum-fueled vehicles were registered until 1989 (import of oil was banned until 1985); alcohol and tobacco imports were prohibited until the 1990s, reflecting the locally fought US missile-testing history and a strict public policy focus on health."
    sourceId: wp-politics
  - topic: "free association with the United States"
    description: "Under the Compact of Free Association (effective 1986) the US provides defence, social services (through grants to the RMI federal government) and considerable financial aid; the US Army Kwajalein Atoll Reagan Test Site operates on Kwajalein."
    sourceId: wp-politics
  - topic: "customary land tenure"
    description: "Under customary land law most land is held communally by lineage, clan (bwij) groups under chiefly management, and rights pass through mothers; outsiders cannot freely acquire land, which has been the focus of much island debate."
    sourceId: wp-culture
paymentCulture:
  popularMethods:
    - "Cash is used for most everyday transactions, especially on the outer atolls"
    - "The US dollar is the sole legal tender (US Compact arrangement)"
    - "Bank cards and ATMs are available in Majuro and Ebeye; banking is thin on outer islands"
    - "Remittances from Marshallese living in the US (large diaspora in Arkansas and Hawaii)"
  tipping:
    expected: false
    typicalAmount: "Not customary"
    autoIncludedInBill: false
    note: "Tipping is not generally expected."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Micronesian community culture centred on the bwij (clan/matri-lineage) and irooj (chiefs); respect for elders and traditional authority, with consensus and generosity (urbanmai) highly valued."
  greetingNorms: "Greet with a warm smile and handshake; the Marshallese greeting 'Yokwe' is common and polite."
  meetingEtiquette: "Meetings tend to start after a moment of levelling (opening remarks and small talk); decisions are reached through consensus and respect for rank. Take time for relationship before business."
  topicsToAvoid:
    - "Questioning chiefly (irooj) authority or lineage rights"
    - "Disrespecting the strong Christian culture and Sunday observance"
  giftGivingNotes: "Modest gifts and sharing food are customary; generosity is a core social value."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
