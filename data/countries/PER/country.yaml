      value: República del Perú
flagEmoji: "🇵🇪"
capital: Lima
isSovereign: true
# Classified unitary-large: Peru is a UNITARY presidential republic
# (Constitución Política del Perú 1993, Art. 43: 'El Estado es uno e
# indivisible. Su gobierno es unitario, representativo y descentralizado'),
# not federal. Decentralization since Ley 27867 (2002, Ley Orgánica de
# Gobiernos Regionales) established 25 elected Regional Governments over the
# former departments. Meets 2-of-3 DESIGN.md criteria: (1) population 31.2M
# (2017 census) / 34.2M (2025 estimate) well above the small-state threshold;
# (2) officially recognized regional/minority languages — Art. 48 makes
# Quechua, Aymara and other aboriginal languages official where they
# predominate; (3) widely recognized cultural-historical regional identities
# (Pacific coast incl. capital Lima, Andean highlands — the Quechua/Aymara
# heartland — and the Amazon basin), each with its own climate, cuisine and
# indigenous languages. Five curated regions sit alongside the generic WHOLE
# fallback.
governanceType: unitary-large
iso3166_2_prefix: "PE"
hasSubdivisions: true
regionCoverage:
  # Count per ISO 3166-2 as of 2026-09. The uncurated units have NOT yet been
  # tested against DESIGN.md's five coverage triggers -- this declaration records
  # the gap so it is visible, not a finding that the gap is correct. Pending the
  # coverage re-audit (see TODO.md).
  tier: first-level
  totalUnits: 26
  status: partial
  gapReason: "5 of 26 first-level units curated. Which of the
    remaining units fire a coverage trigger has not been assessed yet -- the
    curated set predates the coverage floor and was chosen by size/capital,
    not by divergence. Queued for the coverage re-audit."
