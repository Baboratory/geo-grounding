sources:
  - id: per-constitution
    name: "Constitución Política del Perú 1993 (Arts. 43, 48)"
    publisher: "Congreso de la República del Perú"
    url: "https://www.congreso.gob.pe/wp-content/uploads/2025/04/constitucion-12-2024-1.pdf"
    year: 1993
    accessedDate: "2026-09-19"
    note: "Basis for the unitary-decentralized classification (Art. 43) and for Spanish plus co-official Quechua/Aymara/other aboriginal languages where they predominate (Art. 48)."
  - id: per-inei-lang
    name: "INEI — Perfil Sociodemográfico del Perú, Censos Nacionales 2017 (lengua materna aprendida en la niñez)"
    publisher: "Instituto Nacional de Estadística e Informática (INEI)"
    url: "https://www.censos2017.pe/inei-difunde-base-de-datos-de-los-censos-nacionales-2017-y-el-perfil-sociodemografico-del-peru"
    year: 2017
    accessedDate: "2026-09-19"
    note: "Mother tongue learned in childhood, Censo 2017 (population aged 5+): Spanish 82.6% (22,209,686), Quechua 13.9% (3,735,682), Aymara 1.7% (444,389). Basis for the spa locallySpoken and the que/aym rows. Amazonian language shares are ESTIMATES from census self-identification of those pueblos."
  - id: per-inei-ethnic
    name: "INEI — La Autoidentificación Étnica: Población Indígena y Afroperuana (Censo Nacional 2017)"
    publisher: "Instituto Nacional de Estadística e Informática (INEI)"
    url: "https://www.inei.gob.pe/media/MenuRecursivo/publicaciones_digitales/Est/Lib1642/libro.pdf"
    year: 2017
    accessedDate: "2026-09-19"
    note: "Ethnic self-identification of the population aged 12+ (Censo 2017). The 'Other/No response' figure is an ESTIMATE computed as the residual remainder; the remaining rows use the citable table percentages."
  - id: per-gobiernos
    name: "Ley Nº 27867 — Ley Orgánica de Gobiernos Regionales (2002)"
    publisher: "Gobierno del Perú"
    url: "https://www.gob.pe/institucion/gsru-amazonas/informes-publicaciones/2075969-ley-n-27867-ley-organica-de-gobiernos-regionales"
    year: 2002
    accessedDate: "2026-09-19"
    note: "Establishes the 25 elected Regional Governments over the former departments, the basis for Peru's decentralized-but-unitary regional structure."
