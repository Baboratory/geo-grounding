legalConstraints:
  - topic: "state religion and religious freedom"
    description: "Islam is the state religion (Article 2 of the Constitution). Approximately 99% of the population is Sunni Muslim; non-Muslim minorities (Christians, Jews, Ibadi Muslims, and others) are a small fraction. The constitution guarantees freedom of belief, but in practice non-Muslim worship is tightly controlled and proselytizing by non-Muslims is restricted by law."
    sourceId: uscirf-algeria-2024
  - topic: "ethnicity and religion data collection"
    description: "The Algerian state does not collect or publish official statistics on ethnicity or religion in its censuses (national statistics present the population as a unified Arab–Berber, Muslim society). As a result the ethnic and religious figures in this file are external estimates, not official counts."
    sourceId: composite-ethnic-estimate
# paymentMethodShares intentionally omitted: Algeria has no officially
# published, citable percentage split of retail payment methods across the
# population. Sources describe the market as strongly cash-preferred (roughly
# 90% of e-commerce paid cash-on-delivery, credit-card penetration under 5%),
# but those are market reports without a single authoritative summary figure,
# so no reliable split is provided.
paymentCulture:
  popularMethods:
    - "Cash — still strongly dominant for everyday and e-commerce purchases (about 90% of online orders paid cash-on-delivery)"
    - "Edahabia (prepaid postal card of Algérie Poste; largest card base in the country)"
    - "CIB / Carte Interbancaire (debit card interoperable across Algerian banks, GIE Monétique network)"
    - "BaridiMob — Algérie Poste's mobile wallet"
    - "DZMobPay — national QR-code mobile-payment interoperability platform"
  tipping:
    expected: false
    typicalAmount: "Not generally expected; rounding up the bill or leaving small change for good service in restaurants is appreciated but neither expected nor automatic."
    autoIncludedInBill: false
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Titles and honorifics matter; address people by their title and last name until invited to use first names. Exchanges begin with ceremonial greetings and enquiries about health, family, and well-being before the substance of business."
  greetingNorms: "A firm handshake is standard among men; greetings are warm and prolonged — 'As-salamu alaykum' and the reply 'wa alaykum as-salam' open most encounters, followed by polite enquiries. Modesty in dress and manner is expected; physical contact between men and women in greeting follows conservative social norms."
  meetingEtiquette: "Punctuality is valued but flexibility is tolerated. Business moves through relationship-building first: expect tea and hospitality, and decisions are typically reached through negotiation and personal rapport rather than rapid, transactional closure. Fridays and religious holidays are generally not suited to scheduling meetings."
  topicsToAvoid:
    - "Direct criticism of Islam, the state, or the military"
    - "Sensitive foreign-policy issues, including the status of Western Sahara"
    - "France–Algeria colonial history in a way that could be read as sympathetic to the colonial period"
    - "Pressuring an observant host about alcohol or non-halal food"
  giftGivingNotes: "Gifts are welcomed once a relationship is established but not expected at first meetings; give and receive with the right hand only. Avoid gifts containing alcohol or pork; dates, fine pastries (makroud, baklava), or good-quality tea/coffee are safe and appreciated."
