sources:
  - id: dz-constitution-2016
    name: "Constitution of the People's Democratic Republic of Algeria (2016 revision)"
    publisher: "Comparative Constitutions Project (Constitute project), text of the Algerian Constitution"
    url: "https://www.constituteproject.org/constitution/Algeria_2016?lang=en"
    year: 2016
    accessedDate: "2026-09-19"
    note: "Legal basis for Arabic (Article 3) and Tamazight (Article 4) each being a national and official language — both official-domain entries carry speakersShare 1.0 as a legal-status flag, per the schema rule for official languages."
  - id: composite-language-estimate
    name: "Languages of Algeria — compiled speaker estimates"
    publisher: "Composite estimate"
    url: "https://en.wikipedia.org/wiki/Languages_of_Algeria"
    year: 2024
    accessedDate: "2026-09-19"
    note: "locallySpoken shares: Algerian Arabic (Darja) spoken/understood by roughly 85% and native to ~72% (used 0.85); Kabyle, the most widely spoken Berber language, by roughly 10-15% (used 0.13); Tachawit (Chaoui) by around 3% (used 0.03). Algeria publishes no official language-competence census, so these are synthesized estimates across academic and reference sources."
  - id: composite-ethnic-estimate
    name: "Ethnic composition estimates for Algeria (Arab ~75%, Berber ~25%)"
    publisher: "Composite estimate"
    url: "https://religiousfreedominstitute.org/wp-content/uploads/2023/01/Country-Overview-Algeria.pdf"
    year: 2023
    accessedDate: "2026-09-19"
    note: "The ethnic make-up of Algeria as estimated by outside sources: roughly 75% Arab and 25% Berber (Amazigh), with other groups under 1%. Algeria does not collect official ethnic data, so these are estimates — the same figures used for the legalConstraints note about ethnicity-data collection."
  - id: uscirf-algeria-2024
    name: "Algeria country report"
    publisher: "U.S. Commission on International Religious Freedom (USCIRF)"
    url: "https://www.uscirf.gov/sites/default/files/2024-05/Algeria.pdf"
    year: 2024
    accessedDate: "2026-09-19"
    note: "Religion figures: approximately 99% Sunni Muslim, with the remaining ~1% including Christians, Jews, and other minorities; also the basis for the 'state religion and religious freedom' legal-constraint entry."
  - id: oif-french-2025
    name: "OIF data on French-speaking population in Algeria"
    publisher: "Organisation internationale de la Francophonie (OIF), via national media reporting"
    url: "https://algerianewsgate.com/culture/french-speakers-algeria"
    year: 2025
    accessedDate: "2026-09-19"
    note: "The foreign-domain share for French: about 15.6 million Algerians (roughly 33%) speak French with varying proficiency per OIF data, reported by TV5 Monde and Algerian press. French has no official status in Algeria; it is treated here as a foreign/learned language."
