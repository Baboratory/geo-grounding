# English is the sole official language (the only South-American country with
# English official). Its status rests on being the language of the Constitution
# and law plus pervasive practice (no explicit official-language clause in the
# 1980 Constitution), cited via Ethnologue. Guyanese Creole (gyn) is the
# widespread national vernacular (~0.85). The Amerindian languages are officially
# recognized minority languages, captured as locallySpoken with small shares
# (Amerindians ~10.5% of the population, and only ~20% of Amerindian households
# fluent in their ancestral language per an IDB survey). All non-official shares
# are ESTIMATES. Note: hns (Caribbean Hindustani) is retained by a minority of
# Indo-Guyanese; ISO codes verified on iso639-3.sil.org (mbc=Macushi NOT mbz,
# pbc=Patamona NOT pam).
ethnicGroups:
