alpha2: GY
name:
  eng: Guyana
  local:
    - languageCode: eng
      value: Co-operative Republic of Guyana
flagEmoji: "🇬🇾"
capital: Georgetown
isSovereign: true
# Classified unitary-large: Guyana fails the population criterion (~747k, 2012
# census; ~800k recent estimate — far below the 20-25M threshold) but MEETS the
# other two DESIGN.md criteria: (2) nine Amerindian languages (Akawaio, Lokono/
# Arawak, Carib, Macushi, Patamona, Waiwai, Wapishana, Arekuna/Pemon, Warao) are
# officially recognized as regional/minority languages, and Guyanese Creole is
# the national vernacular; and (3) a widely recognized coast-vs-hinterland
# cultural divide (narrow populous coastal plain versus the vast Amerindian
# interior/Rupununi). Guyana is an indivisible unitary republic (Constitution
# Article 1), so NOT federal. Curated regions: Georgetown & Demerara coast
# (GY-GEO), Essequibo & west coast (GY-ESS), Hinterland & Rupununi
# (GY-HIN) + WHOLE.
governanceType: unitary-large
iso3166_2_prefix: "GY"
hasSubdivisions: true
