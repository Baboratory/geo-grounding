sources:
  - id: irn-constitution-art15
    name: "Constitution of the Islamic Republic of Iran, Article 15"
    publisher: "Wikisource (secondary source; primary: Constitution of the Islamic Republic of Iran)"
    url: "https://en.wikisource.org/wiki/Constitution_of_the_Islamic_Republic_of_Iran/Chapter_I"
    year: 1979
    accessedDate: "2026-09-20"
    note: "Persian is the official and common language of the country. Article 15 permits the use of regional languages (Azerbaijani, Kurdish, Arabic, Balochi and others) in the press, mass media, and schools alongside Persian."
  - id: irn-cia-people
    name: "CIA World Factbook — Iran (people and society)"
    publisher: "CIA World Factbook"
    url: "https://www.cia.gov/the-world-factbook/countries/iran/"
    year: 2025
    accessedDate: "2026-09-20"
    note: "Ethnic composition (Persian ~61%, Azerbaijani ~16%, Kurd ~10%, Lur ~6%) and language shares (Persian 82%, Turkic/Azerbaijani 16%, Kurdish 10%, Arabic 2%). Shares within a domain need not sum to 1 due to bilingualism."
  - id: irn-ef-english-2023
    name: "EF English Proficiency Index 2023 — Iran"
    publisher: "EF Education First"
    url: "https://www.ef.com/wwen/epi/"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Approximate share of the population able to hold an English conversation (~10%, concentrated among younger, educated and urban Iranians)."
  - id: irn-dpa-ec2004
    name: "Electronic Commerce Law (2004) and data-privacy framework"
    publisher: "Government of the Islamic Republic of Iran"
    url: "https://rc.majlis.ir/fa/law/show/93999"
    year: 2004
    accessedDate: "2026-09-20"
    note: "The Electronic Commerce Law (Articles 5-6 and 37-41) protects personal data in electronic transactions and consumers' right to privacy; a comprehensive standalone data-protection law has not replaced it."
  - id: irn-cbi-currency
    name: "Central Bank of Iran — currency and price display"
    publisher: "Central Bank of the Islamic Republic of Iran (CBI)"
    url: "https://www.cbi.ir/"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Official currency is the rial (IRR); the informal 'toman' (10 rials) is widely used in daily pricing. Price display must clarify the denomination."
  - id: irn-sanctions-payments
    name: "International sanctions and the domestic Shetab payment network"
    publisher: "Shaparak (Central Bank of Iran's payment-network operator)"
    url: "https://www.shaparak.ir/"
    year: 2024
    accessedDate: "2026-09-20"
    note: "Iran's payments are isolated from international card schemes by sanctions; the Shetab network underpins domestic debit/credit cards and POS terminals, and cash remains widely used."
  - id: irn-ec2004-vat
    name: "Electronic Commerce Law and consumer-protection rules"
    publisher: "Government of the Islamic Republic of Iran"
    url: "https://rc.majlis.ir/fa/law/show/93999"
    year: 2004
    accessedDate: "2026-09-20"
    note: "Right of remote/online buyers to withdraw and return goods, and obligations to disclose returns and refund terms."
  - id: irn-payment-composite
    name: "Composite estimate of Iranian payment-method shares (2023-2024)"
    publisher: "Composite estimate"
    url: "https://www.shaparak.ir/"
    year: 2024
    accessedDate: "2026-09-20"
    note: "Approximate shares derived from Shaparak e-payment transaction data and market reports: cash ~60%, Shetab domestic card ~35%, bank transfer/mobile banking ~4%, other ~1%. Composite estimate, not an official breakdown; there is no published official paymentMethodShares split."
