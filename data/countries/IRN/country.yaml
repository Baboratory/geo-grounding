legalConstraints:
  - topic: "data protection regime"
    description: "A comprehensive personal-data protection framework is not yet codified in a standalone national law. Data subjects are protected through the sui-generis regime of the Shargh/1943 Civil Code personality-rights provisions, the Electronic Commerce Law (2004) which addresses privacy of information in e-commerce, and sectoral rules (banking secrecy, medical confidentiality). Data localization and security obligations are enforced by the Article 10 of the Higher Council of Cyberspace conditions and by state bodies such as the Iranian Data Protection Agency, with enforcement tightening and cross-border transfers subject to significant restriction."
    sourceId: irn-dpa-ec2004
  - topic: "price display and currency denomination"
    description: "Prices are officially shown in rials, but most Iranians denominate everyday amounts in tomans (1 toman = 10 rials); a public price must state clearly whether it is in rial or toman to avoid confusion. Prices have historically been set with multiple exchange tiers, and shopkeepers display prices that can be renegotiated except in fixed-price modern retail."
    sourceId: irn-cbi-currency
  - topic: "international payment and sanctions constraints"
    description: "Iran is subject to comprehensive international sanctions, so SWIFT-linked international card networks (Visa, Mastercard, American Express) issued abroad generally do not work inside Iran, and domestic cards do not work abroad. Payments rely on the domestic Shetab network and cash; visitors typically need to carry cash or use local financial services."
    sourceId: irn-sanctions-payments
  - topic: "consumer withdrawal right"
    description: "The Electronic Commerce Law (2004) and Consumer Protection regulation give online-buyers a right to return goods ordered remotely within a withdrawal period and require disclosure of return and refund terms; consumers may complain to the Consumer and Producer Rights Protection Organization (organ of the Ministry of Industry, Mine and Trade)."
    sourceId: irn-ec2004-vat
