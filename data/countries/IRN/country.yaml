paymentCulture:
  popularMethods:
    - "Cash — still the dominant everyday medium, especially outside the big cities"
    - "Shetab — the national interbank network that links all domestic debit cards; used at nearly all POS terminals and online shops"
    - "Mobile banking and payment apps (Persen, Behpardakht Mellat, Shaparak e-payment) — very widely used"
    - "Domestic prepaid and loyalty cards issued by Iranian banks"
  tipping:
    expected: false
    typicalAmount: "5-10%"
    autoIncludedInBill: false
    note: "Tipping is not expected but is appreciated in restaurants and cafés (a few percent of the bill). A small tip is common for guides, porters and valets. Many services have fixed rates; it is customary to round up or leave a modest cash tip."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Communication is formal and status-aware. Use titles such as 'Aghaye' (Mr.) and 'Khanome' (Ms.) plus the surname, and professional titles (Doctor, Engineer) are widely used. People move to first names only after a relationship is established; elders and superiors are shown deference. The distinction between what is said and what is meant through politeness (taarof) is important."
  greetingNorms: "The greeting 'Salam' (hello) is standard, with 'Salam aleikom' used more formally. Men typically shake hands, and may add a light hug between close friends; greetings between men and women are often verbal or a handshake only if the woman offers her hand. The customary polite exchange of 'Hale shoma' (how are you) is expected."
  meetingEtiquette: "Punctuality is expected for appointments though a little lateness is tolerated. Meetings begin with pleasantries and tea before business — jumping straight to work is seen as rude. The practice of taarof (ritualized polite refusal and insistence) matters: offers of hospitality are often insisted upon and should be politely accepted. Decisions are relationship-based and patience is valued."
  topicsToAvoid:
    - "Politics, especially criticism of the leadership or government"
    - "The role of religion and sensitive sectarian topics"
    - "Iran's relationships with Western countries and sanctions"
    - "Sensitive regional conflicts in the Middle East"
    - "Personal questions about women in public life"
  giftGivingNotes: "Gift-giving is appreciated when a relationship is established. Good-quality gifts, sweets, fruit, saffron and Persian handicrafts are safe. Give and receive with the right hand. Gifts are usually opened when given. Avoid gifts linked to alcohol or pork, and beware that under taarof, a tentative offer may be refused once or twice before being accepted."
