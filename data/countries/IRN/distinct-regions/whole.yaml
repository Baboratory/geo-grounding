businessRhythm:
  restDays:
    - friday
  typicalWorkHours: "The working week runs Saturday to Wednesday (with Thursday a partial day in many offices); Friday is the main rest day. Offices commonly operate around 8:00am/9:00am to 4:00pm/5:00pm."
  lunchBreakTiming: "A lunch and prayer break around 12:30-1:30pm is common."
  notableShutdownPeriods:
    - period: Nowruz (Persian New Year)
      description: "Most businesses and government offices close for roughly two weeks around the spring equinox (usually late March)."
    - period: Muharram and religious holidays
      description: "Shops and offices close or shorten hours for Ashura and other religious observances; many public offices close on major Islamic holidays."
  notes: "Friday is the weekly rest day. Business slows sharply during Nowruz and around major Shia religious holidays. Working hours run Saturday-Thursday, so business continuity planning must account for a Friday-Saturday weekend for most local firms."
sources:
