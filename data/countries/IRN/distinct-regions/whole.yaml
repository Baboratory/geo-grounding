culturalTraits:
  - "A civilization with deep roots — the heir of the ancient Persian empires (Achaemenid, Parthian, Sasanian)"
  - "A strong literary tradition centred on Persian poetry (Hafez, Saadi, Rumi, Ferdowsi)"
  - "Taarof — the ritual of refined, formal politeness that shapes hospitality and negotiation"
  - "Persian New Year (Nowruz) celebrated at the spring equinox — Iran's most cherished festival"
  - "A proud Islamic identity woven with pre-Islamic Persian heritage"
prideOf:
  - "Persian literature, poetry and the Persian language"
  - "The ancient archaeological heritage — Persepolis, Pasargadae, the ruins of the first empires"
  - "Iranian hospitality and the art of taarof"
  - "Persian cuisine, carpets, miniatures and architecture"
  - "The resilience and cultural continuity of a 2,500-year civilization"
animals:
  popular:
    - Persian leopard
    - Asiatic cheetah (critically endangered)
    - Persian fallow deer
    - Onager (Persian wild ass)
    - Caspian horse
  unique:
    - Persian leopard
    - Asiatic cheetah
    - Persian Jird
    - Iranian fat-tailed gecko
industries:
  - Oil and natural-gas production and export (among the world's largest reserves)
  - Petrochemicals and refining
  - Agriculture (wheat, rice, pistachios, saffron, dates, cotton)
  - Textiles, carpets and traditional handicrafts
  - Automotive manufacturing (domestic brands)
  - Mining and steel
sports:
  - Football (association football is the national passion; the Persian Gulf Pro League)
  - Wrestling (both freestyle and Greco-Roman are deeply rooted)
  - Futsal
  - Volleyball
  - Weightlifting
  - Skiing (in the Alborz and Zagros mountains)
