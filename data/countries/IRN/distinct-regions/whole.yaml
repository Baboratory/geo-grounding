name:
  eng: Iran
  local:
    - languageCode: fas
      value: ایران
climates:
  - koppenCode: BWh
    description: Hot desert climate over much of the central plateau and interior — sweltering summers, modest winters, very low rainfall.
  - koppenCode: BSh
    description: Hot semi-arid climate in the interior margins and foothills.
  - koppenCode: Csa
    description: Hot-summer Mediterranean / temperate climate on parts of the Caspian plain and in the north-west highlands, with milder, wetter conditions.
  - koppenCode: BSk
    description: Cold semi-arid climate in the highlands of the north and north-west.
