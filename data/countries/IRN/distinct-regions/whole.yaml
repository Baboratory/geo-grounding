entertainment:
  - season: spring
    items:
      - "Nowruz celebrations and the fourteen-day holiday that marks the new year"
      - "Hafez and poetry reading; the traditional 'Sizdah Bedar' outdoor day (13th day of Nowruz)"
      - "Public parks and picnics as the weather warms"
  - season: summer
    items:
      - "City parks and gardens; evening promenades (the heat keeps days indoors)"
      - "Mountain and Caspian-coast getaways to escape the heat"
      - "Museums and cultural sites in the cooler evenings"
  - season: autumn
    items:
      - "Harvest festivals and seasonal produce (pomegranates, quince)"
      - "Visits to Isfahan, Shiraz and the historic cities"
      - "Cultural and poetry events"
  - season: winter
    items:
      - "Skiing in the Alborz (Dizin, Shemshak) and Zagros mountains"
      - "Tea houses and indoor socialising during the short cold days"
      - "Shopping and bazaars ahead of Nowruz"
