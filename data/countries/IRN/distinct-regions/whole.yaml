    note: "Religious composition: Muslim ~99.5% (overwhelmingly Shia, with a Sunni minority concentrated in Kurdistan, Sistan-Baluchistan and among ethnic minorities), other faiths (Baha'i, Christian, Zoroastrian, Jewish) under 1%."
