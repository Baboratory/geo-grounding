    publisher: "CIA World Factbook"
    url: "https://www.cia.gov/the-world-factbook/countries/comoros/"
    year: 2020
    accessedDate: "2026-09-18"
    note: "Religious-affiliation estimate (Sunni Islam 98.1%, ethnic religionist 1.1%, Christian 0.6%, other 0.3%). Geographic and cultural content is general knowledge, not a cited statistic."
