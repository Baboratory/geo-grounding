alpha3: ATG
alpha2: AG
name:
  eng: Antigua and Barbuda
  local:
    - languageCode: eng
      value: Antigua and Barbuda
flagEmoji: "🇦🇬"
capital: Saint John's
isSovereign: true
# Classified unitary-small: a unitary parliamentary monarchy (a Commonwealth
# realm) with a population of ~97,000-104,000, far below the unitary-large
# threshold. The country spans the islands of Antigua and Barbuda (plus the
# uninhabited Redonda), but that is a purely geographic/island split, not a
# recognized cultural-historical regional identity with distinct regional
# languages — consistent with how comparably-sized Caribbean sovereign states
# (BRB, BHS) are classified. One synthetic WHOLE region. The King of the United
# Kingdom is Head of State, represented by a Governor-General; the Prime
# Minister is Head of Government.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: atg-gov-demographics
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 1.0
    sourceId: atg-gov-demographics
  - languageCode: aig
    domain: locallySpoken
    speakersShare: 0.9
    sourceId: iso639-aig
# English is the sole official language (near-universally competent, so the
# local-spoken share is effectively 1.0 — qualitative). Antiguan and Barbudan
# Creole English (ISO 639-3 'aig', the Leeward Caribbean English Creole code
# shared with Saint Kitts and Nevis) is the widely spoken everyday vernacular;
# its ~0.9 locally-spoken share is an ESTIMATE, as no authoritative census
# figure is available.
ethnicGroups:
  # Government of Antigua and Barbuda (2011 census based).
  - group: African descent / Black
    percent: 87.3
    sourceId: atg-census-2011
  - group: Mixed
    percent: 3.8
    sourceId: atg-census-2011
  - group: White / European descent
    percent: 1.7
    sourceId: atg-census-2011
  - group: Other / Not stated
    percent: 7.2
    sourceId: atg-census-2011
timezones:
  - name: America/Antigua
    standardUtcOffset: "UTC-4"
    observesDst: false
currency:
  code: XCD
  symbol: "$"
  name: "Eastern Caribbean dollar (pegged US$1 = EC$2.70; issued by the Eastern Caribbean Central Bank)"
legalConstraints:
  - topic: "data protection / personal data"
    description: "The Data Protection Act, 2013 regulates the collection and processing of personal data: processing must be fair and lawful, data subjects have access/correction rights, and transfers of personal data are restricted in line with data-protection principles."
    sourceId: atg-data-protection-act
# Not an EU member, so no GDPR/EU consumer-directive constraints apply; a VAT
# price-display rule was not confirmed to a primary source, so it is
# deliberately omitted rather than guessed.
paymentCulture:
  popularMethods:
    - "Cash — still widely used, in EC dollars (XCD)"
    - "Visa and Mastercard — accepted at hotels, restaurants, supermarkets and most establishments"
    - "Contactless and mobile wallets (Apple Pay, Google Pay) at most card terminals; Amex at hotels/larger establishments"
    - "US dollars accepted for many tourist-facing transactions"
  tipping:
    expected: true
    typicalAmount: "A ~10% service charge is commonly auto-added in sit-down restaurants; if none, tip ~10-15%"
    autoIncludedInBill: true
    note: "Most sit-down restaurants automatically add a ~10% service charge (check the bill); otherwise 10-15% is standard. Round up at casual spots; ~10% for taxis. US dollars are commonly used for tips."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Warm and polite. Titles/surnames are used in business until a personal relationship develops, then first names quickly become normal. Antiguans and Barbudans value courtesy, friendliness and a relaxed manner; directness is softened with politeness."
  greetingNorms: "Warm and friendly — a firm handshake with eye contact in business; a nod, smile and 'good morning/afternoon' are expected etiquette when entering a shop, office or passing acquaintances."
  meetingEtiquette: "Punctuality is expected for formal business, though daily life runs on 'island time' so patience is valued. Communication is polite and often indirect; rapport and small talk precede the agenda; decisions are often relationship-driven."
  topicsToAvoid:
    - "The history of slavery and colonial-era legacies unless a local raises them first"
    - "Unfavourably comparing Antigua and Barbuda to another Caribbean island"
  giftGivingNotes: "Not expected at a first business meeting. When invited to a local home, a small gift — a bottle of local rum or wine, flowers, or a dessert — is appreciated."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
  - id: atg-gov-demographics
    name: "Antigua and Barbuda — Demographics (National Statistics)"
    publisher: "Statistics Division, Government of Antigua and Barbuda"
    url: "https://statistics.gov.ag/"
    accessedDate: "2026-09-18"
    note: "States English is the official language and provides official demographic figures. Basis for languageUsage (official)."
  - id: atg-census-2011
    name: "2011 Antigua and Barbuda Population and Housing Census — A Demographic Profile"
    publisher: "Statistics Division, Government of Antigua and Barbuda"
    url: "https://statistics.gov.ag/wp-content/uploads/2017/11/2011-Antigua-and-Barbuda-Population-and-Housing-Census-A-Demographic-Profile.pdf"
    year: 2011
    accessedDate: "2026-09-18"
    note: "Ethnic composition (Black/African descent 87.3%, Mixed 3.8%, White 1.7%, other/not stated 7.2%). Supports the unitary-small classification."
  - id: iso639-aig
    name: "ISO 639-3 — Antigua and Barbuda Creole English (aig)"
    publisher: "SIL International (ISO 639-3)"
    url: "https://iso639-3.sil.org/code/aig"
    accessedDate: "2026-09-18"
    note: "Confirms ISO 639-3 'aig' for Antiguan and Barbudan Creole English (the Leeward Caribbean English Creole code). Basis for the locallySpoken language row; the ~0.9 share is an ESTIMATE."
  - id: atg-data-protection-act
    name: "Data Protection Act, 2013"
    publisher: "Government of Antigua and Barbuda"
    url: "https://laws.gov.ag/acts/data-protection-act-2013/"
    year: 2013
    accessedDate: "2026-09-18"
    note: "Regulates the collection and processing of personal data; requires fair/lawful processing, grants data-subject rights, and restricts onward transfers. Basis of the data-protection legal constraint."
