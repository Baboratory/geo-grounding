  local:
    - languageCode: eng
      value: British Columbia
climates:
  - koppenCode: Cfb
    description: "Temperate oceanic climate along the coast (Vancouver, Victoria), mild and rainy year-round with cool, wet winters."
  - koppenCode: Dfb
    description: "Continental climate in the BC Interior (Okanagan, Prince George), with warmer, drier summers and cold winters."
landmarks:
  - name: Stanley Park and the Seawall
    description: "Vancouver's vast urban park, ringed by the famous Seawall promenade with views over the harbour."
  - name: Whistler Blackcomb
    description: "One of North America's largest ski resorts, host of the 2010 Winter Olympics alpine events."
  - name: Okanagan Valley
    description: "Canada's leading wine region, a sun-drenched valley of orchards, vineyards and lakes."
  - name: Butchart Gardens
    description: "The celebrated floral gardens near Victoria on Vancouver Island."
culturalTraits:
  - "Canada's Pacific gateway: a stunning mountain-and-ocean landscape with a relaxed, outdoorsy culture"
  - "A dynamic, tech-hub economy (Vancouver) and strong Asian-Pacific multicultural influence"
  - "Deep Indigenous heritage, especially on the coast (Haida Gwaii and the totem-pole cultures)"
prideOf:
  - "Mountains, ocean and an enviable outdoor lifestyle (surf-to-ski geography)"
  - "Vancouver, a world-class liveable city"
  - "Environmental stewardship and the province's natural beauty"
