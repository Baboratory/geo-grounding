climates:
  - koppenCode: Dfb
    description: "Continental climate across much of Alberta (Edmonton, Calgary), with cold, at times very cold winters and warm, sunny summers."
  - koppenCode: BSk
    description: "Semi-arid steppe climate in the southern Prairies and around the chinook country, drier with big temperature swings (occasional warm chinook winds)."
landmarks:
  - name: Banff National Park
    description: "Canada's first national park, in the Rocky Mountains — iconic peaks, glacial lakes (Lake Louise, Moraine Lake) and wildlife, a UNESCO World Heritage Site."
    unescoWorldHeritage: true
  - name: Jasper National Park
    description: "The largest Rocky Mountain national park, with the Icefields Parkway, glaciers and dark-sky stargazing, part of the Canadian Rocky Mountain Parks UNESCO site."
    unescoWorldHeritage: true
  - name: West Edmonton Mall
    description: "Once the world's largest shopping mall, with an indoor water park, ice rink and amusement parks."
  - name: Calgary Stampede
    description: "The world-famous annual rodeo and festival, 'The Greatest Outdoor Show on Earth'."
