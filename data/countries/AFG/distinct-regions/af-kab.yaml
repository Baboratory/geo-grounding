businessRhythm:
  restDays:
    - friday
  typicalWorkHours: "Public-sector offices roughly 08:00-16:00 Sunday to Thursday; shops and bazaars often open later and run into the evening. Friday is the weekly holiday, Thursday is a half-day in many offices."
  lunchBreakTiming: "A midday break is common; lunch is often the main meal of the day, frequently taken at home or at a friend's house."
  notes: "All official business shifts to the weekend on Friday; during Ramadan, working hours are shortened and daytime eating stops."
