code: AF-BAL
name:
  eng: Balkh (Balkh Province)
  local:
    - languageCode: prs
      value: بلخ
climates:
  - koppenCode: BSk
    description: "Cold semi-arid climate on the northern plains — hot summers, cold winters and low to moderate rainfall."
landmarks:
  - name: Blue Mosque (Shrine of Hazrat Ali, Mazar-i-Sharif)
    description: "The dazzling turquoise-tiled shrine in Mazar-i-Sharif, one of the most sacred and beautiful pilgrimage sites in Afghanistan."
  - name: Ancient city of Balkh (Bactria)
    description: "The ruins of one of the world's oldest cities, the ancient capital of Bactria and legendary birthplace of Zoroaster."
  - name: Green Mosque (Mazar-i-Sharif's other shrine complex)
    description: "A secondary shrine complex adding to Mazar-i-Sharif's sacred geography."
  - name: Qala-e Bost fort ruins (southern Balkh edge)
    description: "Ancient fortress ruins near the Helmand river, associated with the region's historical frontier."
culturalTraits:
  - "The historic 'Mother of Cities' — ancient Bactria, a crossroads of the Silk Road and Persian, Greek, Buddhist and Islamic civilisations"
  - "A majority ethnic Tajik and Uzbek region, culturally closer to the Turkic north and Central Asia"
  - "Religious tolerance historically marks the region, with Sufi traditions and diverse communities"
prideOf:
  - "Its claim as the birthplace of Zoroastrianism and one of the world's oldest continuous civilisations"
  - "The Blue Mosque and Mazar-i-Sharif as the region's spiritual beacon"
  - "Its Silk Road commercial heritage"
animals:
  popular:
    - "Karachi sheep and horses on the northern steppe"
    - "Bactrian camels"
industries:
  - "Agriculture on the Amu Darya floodplain (wheat, cotton, melons, olives)"
  - "Silk and carpet weaving"
  - "Cross-border trade with Uzbekistan through the Hairatan crossing"
sports:
  - "Buzkashi and horse riding"
  - "Football and cricket"
