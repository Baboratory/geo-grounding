  code: AFN
  symbol: "؋"
  name: Afghan afghani
legalConstraints:
  - topic: "official languages"
    description: "Article 16 of the 2004 Constitution designates Pashto and Dari as the two official languages of the State, and further provides that among the other languages (Uzbeki, Turkmani, Baluchi, Pashai, Nuristani, Pamiri and others), any language spoken by the majority in a given area may be used as a third official language in addition to Pashto and Dari in that area. Pashto and Dari are used in official documents and are the languages of state business."
    sourceId: constit-2004
  - topic: "business tax (no VAT)"
    description: "Afghanistan has no value-added tax. Domestic commerce is taxed through the Business Receipts Tax under the Income Tax Law 1388 (2009): a 2% rate on general gross receipts (including imports), 5% on restaurants/hotels above a threshold, and 10% on telecom and airline services. In early 2025 the Islamic Emirate reduced the fixed business tax to 0.3% for qualifying small traders. Prices are generally quoted without any single uniform national sales tax, reflecting this layered regime."
    sourceId: income-tax-2009
  - topic: "data protection"
    description: "Afghanistan has no comprehensive national data-protection or privacy law in force. The 2004 Constitution protects the right to privacy of personal correspondence and communications (Art. 24) but no dedicated GDPR-style statute or enforcement authority exists, leaving personal-data collection largely governed by sectoral and customary rules with minimal statutory safeguards."
    sourceId: constit-2004
  - topic: "consumer protection"
    description: "Consumer protection rests on the Consumer Protection Law (1385/2006) and the Ministry of Industry and Commerce's consumer affairs role. In practice enforcement is weak, particularly outside Kabul, and post-2021 institutional capacity is limited."
    sourceId: cp-law-2006
paymentCulture:
  popularMethods:
    - "Cash (afghani and to a lesser extent US dollar) is the near-universal payment method; banking penetration is very low"
    - "M-Paisa and other mobile-money wallets growing among the unbanked"
  tipping:
    expected: false
    typicalAmount: "Nothing expected; small rounding-up is common in restaurants"
    note: "Cash is king and there is no meaningful card/mobile POS infrastructure in most of the country; hawala networks handle much money movement."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Respect for elders and social rank is important; first names are rarely used in formal business until a relationship is established, and titles such as Dr. or Engineer are commonly used."
  greetingNorms: "A warm greeting with salaam and a handshake (right hand); a light hand-on-heart gesture accompanies it. Between men, prolonged greetings asking after family and health are customary."
  meetingEtiquette: "Business relationships matter more than speed; tea and small talk precede substantive discussion. Decisions often rest with the most senior figure present."
  topicsToAvoid:
    - "Politics and the security situation, which are sensitive"
    - "Family and tribal affiliations until the relationship is trusted"
  giftGivingNotes: "Small, respectful gifts are appreciated but are not expected; avoid anything with religious imagery that could be misread. Refuse politely if offered first as courtesy."
