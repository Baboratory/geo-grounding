alpha3: AFG
alpha2: AF
name:
  eng: Afghanistan
  local:
    - languageCode: prs
      value: افغانستان
    - languageCode: pus
      value: افغانستان
flagEmoji: "🇦🇫"
capital: Kabul
isSovereign: true
# Classified unitary-large: Afghanistan is a unitary state (2004 Constitution,
# Article 1 declares it "independent, unitary and indivisible"), has a
# population well above the ~20-25M small-state threshold (roughly 40-49M,
# with no reliable census since 1979 so all figures are estimates), and has a
# genuine, widely recognised cultural-historical regional mosaic — the Pashtun
# south/east, the Tajik-and-Hazara centre and north, and the Turkic Uzbek/Turkmen
# north — with several of these recognised as regional third-official languages
# (Constitution Art. 16). That meets 2 of the 3 DESIGN.md unitary-large criteria.
# Curated regions map to real ISO 3166-2 provinces: Kabul (AF-KAB), Herat
# (AF-HER), Kandahar (AF-KAN), Balkh (AF-BAL) and Nangarhar (AF-NAN), plus the
# generic WHOLE fallback.
governanceType: unitary-large
iso3166_2_prefix: AF
hasSubdivisions: true
languageUsage:
  # 2004 Constitution, Art. 16: "Pashto and Dari are the official languages of
  # the State." Both are de jure official -> legal-status flag = 1.0 each.
  - languageCode: pus
    domain: official
    speakersShare: 1.0
    sourceId: constit-2004
  - languageCode: prs
    domain: official
    speakersShare: 1.0
    sourceId: constit-2004
  # Actual usage is far from the 1.0 official flag — recorded separately as
  # locallySpoken estimates (there is no census since 1979; CIA World Factbook
  # 2020 estimates: Dari lingua franca ~77% first-or-second, Pashto ~48%
  # first language, Uzbek ~11%, Turkmen ~3%, Balochi ~2%).
  - languageCode: prs
    domain: locallySpoken
    speakersShare: 0.77
    sourceId: cia-wfb
  - languageCode: pus
    domain: locallySpoken
    speakersShare: 0.48
    sourceId: cia-wfb
  - languageCode: uzb
    domain: locallySpoken
    speakersShare: 0.11
    sourceId: cia-wfb
  - languageCode: tuk
    domain: locallySpoken
    speakersShare: 0.03
    sourceId: cia-wfb
  - languageCode: bal
    domain: locallySpoken
    speakersShare: 0.02
    sourceId: cia-wfb
  # English and Urdu are the principal foreign languages (English ~6-8%,
  # Urdu ~3-7% per World Factbook and academic surveys).
  - languageCode: eng
    domain: foreign
    speakersShare: 0.08
    sourceId: cia-wfb
ethnicGroups:
  # CIA World Factbook 2020 estimates (no national census since 1979; all
  # figures are widely-referenced estimates that vary by source).
  - group: Pashtun
    percent: 42
    sourceId: cia-wfb
  - group: Tajik
    percent: 27
    sourceId: cia-wfb
  - group: Hazara
    percent: 9
    sourceId: cia-wfb
  - group: Uzbek
    percent: 9
    sourceId: cia-wfb
  - group: Aimak
    percent: 4
    sourceId: cia-wfb
  - group: Turkmen
    percent: 3
    sourceId: cia-wfb
  - group: Baloch
    percent: 2
    sourceId: cia-wfb
  - group: Other (Pashayi, Nuristani, Arab, Brahui and other groups)
    percent: 4
    sourceId: cia-wfb
