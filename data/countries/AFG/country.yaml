sources:
  - id: constit-2004
    name: "Constitution of the Islamic Republic of Afghanistan (2004)"
    publisher: "WIPO Lex"
    url: "https://www.wipo.int/wipolex/en/legislation/details/10739"
    year: 2004
    accessedDate: "2026-09-21"
    note: "Official languages (Art. 16: Pashto and Dari; regional third-official languages), unitary state (Art. 1), privacy of communications (Art. 24), Da Afghanistan Bank as central bank (Art. 12)."
  - id: cia-wfb
    name: "Afghanistan — The World Factbook"
    publisher: "CIA World Factbook"
    url: "https://www.cia.gov/the-world-factbook/countries/afghanistan/"
    year: 2020
    accessedDate: "2026-09-21"
    note: "Ethnic composition and language-usage estimates (Pashtun 42%, Tajik 27%, Hazara 9%, Uzbek 9%; Dari lingua franca ~77%, Pashto ~48%). No census since 1979, so these are estimates."
  - id: income-tax-2009
    name: "Income Tax Law 1388 (2009) — Business Receipts Tax provisions"
    publisher: "Ministry of Finance, Islamic Emirate of Afghanistan"
    url: "https://mof.gov.af/en"
    year: 2009
    accessedDate: "2026-09-21"
    note: "Business Receipts Tax obligations (2% general, 5-10% for specific services); 2025 fixed-tax reduction to 0.3% per Islamic Emirate decree."
  - id: cp-law-2006
    name: "Consumer Protection Law (1385/2006)"
    publisher: "Islamic Emirate of Afghanistan, Ministry of Industry and Commerce"
    url: "https://mof.gov.af/en"
    year: 2006
    accessedDate: "2026-09-21"
    note: "Consumer protection framework and Ministry of Industry and Commerce enforcement role."
