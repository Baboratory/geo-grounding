  local:
    - languageCode: por
      value: Sul e Leste
climates:
  - koppenCode: BSh
    description: "Hot semi-arid (steppe) — the southern and south-eastern interior: arid, low and highly seasonal rainfall concentrated Dec-Mar."
  - koppenCode: BWh
    description: "Hot desert — along the Namibe coast and the extreme south-western desert fringe."
landmarks:
  - name: Namibe desert coast
    description: "Stark, iconic Atlantic desert with the ancient Welwitschia plant."
