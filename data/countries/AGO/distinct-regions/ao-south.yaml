    description: "Granite monolith and dramatic desert landscapes in the south-east."
  - name: Lunda plateau diamond fields
    description: "Historic diamond-mining regions of the east."
  - name: South Kunene wildlife corridor
    description: "Semi-arid savanna holding Angola's recovering elephant populations."
culturalTraits:
  - "The Ovambo/Chokwe and Nyemba-speaking south-east"
