sources:
  - id: ne-charte-refondation-2025
    name: "Charte de la Refondation, promulgee par Decret n 2025-160/P/CNSP du 26 mars 2025"
    publisher: "Presidence du Conseil National pour la Sauvegarde de la Patrie (CNSP), Republique du Niger - Journal Officiel"
    url: "https://www.lesahel.org/decret-n-2025-160-p-cnsp-du-26-mars-2025-portant-promulgation-de-la-charte-de-la-refondation/"
    year: 2025
    accessedDate: "2026-09-19"
    note: "Legal basis for Hausa becoming the national language and English/French the working languages, and for the nine other 'spoken languages of Niger'. Promulgated 26 March 2025 following the February 2025 national conference; published in a special edition of the Journal Officiel on 31 March 2025."
  - id: ne-const-2010-art8
    name: "Constitution de la Republique du Niger (2010, avec les amendements) - Articles 5 et 8"
    publisher: "Republique du Niger - WIPO Lex"
    url: "https://www.wipo.int/wipolex/en/legislation/details/22768"
    year: 2011
    accessedDate: "2026-09-19"
    note: "The 2010 Constitution recognised French as the official language and several languages (Hausa, Zarma-Songhai, Tamasheq, Fulfulde, Kanuri) as national languages (Art. 5), and defined Niger as a 'State of law' guaranteeing equality and religious freedom (Art. 8). Superseded in part by the 2025 Charte de la Refondation on the official-language question."
  - id: cia-factbook-2023
    name: "Niger - The World Factbook (2023 edition)"
    publisher: "worldfactbook.co (independent third-party aggregator, not the CIA itself)"
    url: "https://worldfactbook.co/country.php?slug=niger"
    accessedDate: "2026-09-19"
    note: "Ethnic composition only: Hausa ~53.1%, Zarma/Songhai ~21.2%, Tuareg ~11.0%, Fulani ~6.5%, Kanuri (Manga/Beriberi) ~5.9%, Gourma ~0.8%, Arab ~0.4%, Tubu ~0.4%, other/unavailable ~0.9%. Does not carry religion figures -- see ner-religion-2012 for those."
  - id: ner-religion-2012
    name: "Niger religious composition"
    publisher: "Composite estimate (Niger's 2012 census reported 99.3% Muslim; commonly cited secondary figure)"
    url: "https://en.wikipedia.org/wiki/Religion_in_Niger"
    accessedDate: "2026-09-19"
    note: "Niger's 2012 national census recorded 99.3% Muslim self-identification, the basis for the ~99% figure used throughout this file; the small Christian/animist remainder is a disclosed ESTIMATE."
  - id: globalvoices-2025
    name: "Hausa replaces French as the official language of Niger"
    publisher: "Global Voices"
    url: "https://globalvoices.org/2025/06/28/hausa-replaces-french-as-the-official-language-of-niger/"
    year: 2025
    accessedDate: "2026-09-19"
    note: "Hausa spoken by roughly 47% of Nigeriens; only about 13% speak French. Source for the official-language change and its reception."
  - id: oif-2025
    name: "Estimated Francophone shares (working-language French after the 2025 reform)"
    publisher: "Composite estimate (from Global Voices reporting and OIF contexts)"
    url: "https://globalvoices.org/2025/06/28/hausa-replaces-french-as-the-official-language-of-niger/"
    year: 2025
    accessedDate: "2026-09-19"
    note: "No official census figure post-2025; French is now a working language spoken by roughly an eighth of the population, almost all as a second language."
