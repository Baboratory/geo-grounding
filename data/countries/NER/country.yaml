legalConstraints:
  - topic: "Official language under the Charte de la Refondation (2025)"
    description: "The Charte de la Refondation, promulgated by Decret n 2025-160/P/CNSP of 26 March 2025 after the February 2025 national conference, declares that 'the national language is Hausa' and that 'the working languages are English and French.' This reverses the 2010 Constitution (Article 5), under which French was the official language with Hausa, Zarma-Songhai, Tamasheq, Fulfulde, Kanuri and other languages recognised as national languages. The 2025 charter also designates nine other languages (including Zarma-Songhay, Fula, Kanuri, Gourmanche and Arabic) as 'the spoken languages of Niger'."
    sourceId: ne-charte-refondation-2025
  - topic: "Secular state & religious freedom"
    description: "The Republic of Niger is a secular state; the constitutional order guarantees equality before the law without distinction of sex, social origin, race or religion, and protects all beliefs while providing that no religion may arrogate political power. Islam is practised by the overwhelming majority of Nigeriens (about 99%), almost all Sunni Muslim of the Maliki school, with Sufi brotherhoods (notably Tijaniyya) influential."
    sourceId: ne-const-2010-art8
  - topic: "Business law harmonised under OHADA"
    description: "Niger is a contracting party to the OHADA Treaty (Organisation pour l'harmonisation en Afrique du droit des affaires) within UEMOA/WAEMU. Company, commercial, securities, insolvency, arbitration and enforcement law is therefore harmonised across the OHADA member states and applied by the Common Court of Justice and Arbitration (CCJA) in Abidjan."
    sourceId: ohada-treaty
  - topic: "Data protection"
    description: "Niger has enacted a data-protection law (relative a la protection des personnes physiques a l'egard du traitement des donnees a caractere personnel) and established a data-protection authority, with privacy also grounded in the constitutional order."
    sourceId: dataprotection-africa
paymentCulture:
  popularMethods:
    - "Cash (West African CFA franc, XOF) - dominant across the informal and rural economy, roughly 70% of transactions"
    - "Mobile money (Orange Money, now Zamani Cash, and Moov Money) - the ubiquitous mobile-wallet rails for small transfers"
    - "Bank cards and bank transfers for formal and urban transactions"
    - "WAEMU regional interbank network GIM-UEMOA"
  tipping:
    expected: false
    autoIncludedInBill: false
    typicalAmount: "A service charge is sometimes added in urban restaurants; otherwise tipping is modest and appreciated but not obligatory. Rounding up taxi fares is customary."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Titles and honorifics matter: use Monsieur/Madame with a surname until invited to first names, and show respect to elders and people of standing; caste and community ties carry weight."
  greetingNorms: "Handshakes and extended polite exchanges about health, family and well-being open nearly every interaction; asking after someone's family is expected politeness rather than prying."
  meetingEtiquette: "Relationships and trust precede transactions; initial meetings are for getting to know a counterpart rather than closing a deal. Business often moves through community and family networks, decisions may involve elders, and a patient, flexible pace is normal. Friday midday prayers and Ramadan shape the weekly rhythm."
  topicsToAvoid:
    - "The July 2023 coup and the transition - politically sensitive"
    - "The security situation and the insurgency in the south-east and border areas"
    - "Over-simplifying ethnic or community relations"
    - "Religious or secular-critical commentary, tactlessly raised"
  giftGivingNotes: "Small, thoughtful gifts are appreciated and usually reciprocated; respect for elders and religious sensitivity matter (alcohol and pork as gifts can cause offence). If invited to a home, a modest gift is valued."
