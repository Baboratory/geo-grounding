  - name: Africa/Ndjamena
    standardUtcOffset: "UTC+1"
    observesDst: false
currency:
  code: XAF
  symbol: FCFA
  name: Central African CFA franc
legalConstraints:
  - topic: "official languages"
    description: "French and Arabic are the co-official languages of Chad (Constitution of 2023, Art 10)."
    sourceId: constitution-2023
  - topic: "secular unitary state"
    description: "Chad is a secular republic described as 'unitary with decentralization' (2023 Constitution); the State prohibits propaganda of an ethnic, tribal, regional or religious nature that undermines national unity or secularism."
    sourceId: state-dept-irf
  - topic: "Muslim personal-status influence"
    description: "The government-recognized High Islamic Council (HCIA) has jurisdiction over some personal-status matters (marriage, divorce, property between spouses, parentage) for those who consent, alongside civil law; a unified family code has remained in draft."
    sourceId: state-dept-irf
  - topic: "religious-group registration"
    description: "Religious groups (except indigenous) must register with the Ministry of the Interior; the State is secular but proscribes certain unsolicited proselytizing activity."
    sourceId: state-dept-irf
paymentCulture:
  popularMethods:
    - "Cash — overwhelmingly dominant, especially 'off the grid'; banking is weak and concentrated in N'Djamena"
    - "Mobile money — Airtel Money and Moov Money (formerly Tigo Cash), growing rapidly, USSD-based"
    - "Bank cards — limited, mainly in N'Djamena"
  tipping:
    expected: false
    typicalAmount: "Not a codified norm; a small gratuity for service in hotels/restaurants is appreciated"
    autoIncludedInBill: false
    note: "Qualitative and customary. The economy is heavily cash-based; mobile money (Airtel Money, Moov Money) is expanding most quickly in N'Djamena and regional capitals."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Hierarchical and status-conscious; respect for elders and authority is central. French is reserved for formal/administrative settings while Chadian Arabic is the lingua franca."
  greetingNorms: "Warm handshakes; in the Muslim north/east greetings open with 'As-salamu alaikum' and the right hand is used for handshakes and offers."
  meetingEtiquette: "Relationships and pleasantries precede business; decisions are consultative and slow; in the north, pause for Friday midday prayers is respected."
  topicsToAvoid:
    - "Ethnic and regional tensions, and the historic north-south divide"
    - "Sensitive religious classification and sectarian history"
    - "Contentious politics of the armed transition"
  giftGivingNotes: "In the north, use the right hand when offering or receiving; modest, respectful gifting is customary on visits."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
  - code: TD-SAHARANNORTH
    file: distinct-regions/td-sahara.yaml
    adminUnitCodes: [TD-BO, TD-EE, TD-EO, TD-TI]
  - code: TD-SAHEL
    file: distinct-regions/td-sahel.yaml
    adminUnitCodes: [TD-OD, TD-SI, TD-WF, TD-BA, TD-KA, TD-BG, TD-CB, TD-HL]
  - code: TD-SOUTH
    file: distinct-regions/td-south.yaml
    adminUnitCodes: [TD-LO, TD-LR, TD-MC, TD-MA, TD-TA, TD-ME, TD-MO]
