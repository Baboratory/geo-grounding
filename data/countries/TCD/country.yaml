alpha3: TCD
alpha2: TD
name:
  eng: Chad
  local:
    - languageCode: fra
      value: Tchad
    - languageCode: arb
      value: تشاد (Tshad)
flagEmoji: "🇹🇩"
capital: N'Djamena
isSovereign: true
# Classified unitary-large: Chad (~18.5M, 2023 est.) sits at the small/large
# boundary but has a genuine, widely-recognized cultural-historical regional
# divide — the Islamized Sahel/Saharan north and east (Arab, Fulani, Maba,
# Kanembu, Zaghawa, Tubu/Gorane) vs the Christian/animist Sara-dominated south
# — and officially recognized regional languages. The state is a unitary
# Republic with decentralization (2023 Constitution), so NOT federal. Curated
# regions: TD-SAHARANNORTH (Toubou/Gorane far north, Borkou-Ennedi-Tibesti),
# TD-SAHEL (Muslim Sahel & east), TD-SOUTH (Sara Christian/animist south) + WHOLE.
governanceType: unitary-large
iso3166_2_prefix: TD
hasSubdivisions: true
languageUsage:
  # French and Arabic are co-official (Constitution 2023, Art 10); official
  # domain is a legal-status flag = 1.0.
  - languageCode: fra
    domain: official
    speakersShare: 1.0
    sourceId: constitution-2023
  - languageCode: arb
    domain: official
    speakersShare: 1.0
    sourceId: constitution-2023
  # Locally-spoken shares are COMPOSITE ESTIMATES. Chadian Arabic (shu) is the
  # lingua franca of commerce; Sara (sre) dominates the south; the others anchor
  # specific regions.
  - languageCode: shu
    domain: locallySpoken
    speakersShare: 0.6
    sourceId: languages-estimate
  - languageCode: sre
    domain: locallySpoken
    speakersShare: 0.3
    sourceId: languages-estimate
  - languageCode: fuv
    domain: locallySpoken
    speakersShare: 0.08
    sourceId: languages-estimate
  - languageCode: kau
    domain: locallySpoken
    speakersShare: 0.06
    sourceId: languages-estimate
  - languageCode: mde
    domain: locallySpoken
    speakersShare: 0.04
    sourceId: languages-estimate
  - languageCode: zag
    domain: locallySpoken
    speakersShare: 0.02
    sourceId: languages-estimate
  - languageCode: dzg
    domain: locallySpoken
    speakersShare: 0.03
    sourceId: languages-estimate
  - languageCode: tuq
    domain: locallySpoken
    speakersShare: 0.01
    sourceId: languages-estimate
# Chad has more than 120 indigenous languages across some 200 ethnic groups.
# Chadian Arabic (shu) is the widest-spoken lingua franca (~60% functional);
# Sara (sre) or its dialects anchor the south; Nigerian Fulfulde (fuv) and the
# Fulah cluster the pastoralists; Kanuri (kau) the Lake Chad northwest; Maba
# (mde) the Ouaddaï/wadi; Zaghawa (zag) the far east; Dazaga (dzg) and Tedaga
# (tuq) the Gorane (Tubu/Teda) of the BET region.
