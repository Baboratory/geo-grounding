code: WHOLE
name:
  eng: New Zealand
  local:
    - languageCode: eng
      value: New Zealand
    - languageCode: mri
      value: Aotearoa
    - languageCode: nzs
      value: New Zealand Sign Language
# Generic country-wide fallback content for New Zealand (unitary-small, single
# synthetic whole region). The North Island / South Island / Stewart Island
# split is geographic rather than a curated regional identity, so it is folded
# here as the national character.
climates:
  - koppenCode: Cfb
    description: "Temperate oceanic — mild year-round, no dry season; the dominant climate of both main islands (largely absent of extremes)."
  - koppenCode: Cfc
    description: "Subpolar oceanic in the high Southern Alps / Fiordland and elevated inland areas, with cool temperatures year-round and strong precipitation."
  - koppenCode: BSk
    description: "Semi-arid in parts of Central Otago and the Mackenzie Basin (rain-shadow), the driest areas of the country."
landmarks:
  - name: Milford Sound
    description: "A fjord in Fiordland National Park (South Island) ringed by sheer cliffs and Mitre Peak; part of Te Wahipounamu, a UNESCO World Heritage Site."
    unescoWorldHeritage: true
  - name: Tongariro Alpine Crossing
    description: "A famous one-day tramping route across the volcanic Tongariro National Park (Central North Island), past emerald lakes and craters."
  - name: Waitangi Treaty Grounds
    description: "The historic site (Bay of Islands) where the Treaty of Waitangi was signed in 1840; contains Te Whare Runanga, the carved meeting house."
  - name: Sky Tower (Auckland)
    description: "Auckland's iconic 328 m observation tower offering 360-degree views over the 'City of Sails' and its harbours."
  - name: Rotorua geothermal area
    description: "Active geysers, boiling mud pools and hot springs along the Pacific Ring of Fire."
  - name: Franz Josef Glacier (Westland Tai Poutini)
    description: "A glacier in the Southern Alps that flows into rainforest — a rare glacier-to-temperate-rainforest junction."
    unescoWorldHeritage: true
# Tongariro, Westland Tai Poutini and Te Wahipounamu (Fiordland) are all
# inscribed UNESCO World Heritage Sites; the Waitangi Treaty Grounds host the
# historic signing site.
culturalTraits:
  - "Manaaki (warm, genuine hospitality and care — a core New Zealand value)"
  - "A strong 'no. 8 wire' DIY / practical ingenuity culture and egalitarian mateship"
  - "Deep respect for te ao Māori (the natural environment) and outdoor life"
  - "Bicultural heritage — Māori (Te Ao Māori) and Pākehā (European-New Zealander) — underpin national identity"
  - "The haka and an understated, laconic Kiwi humour"
prideOf:
  - "Being the first country to give women the vote (1893) and to introduce a minimum wage (1894)"
  - "The All Blacks and the haka, plus world-class rugby and the 1981/1995 Americas Cup legacy"
  - "Te Reo Maori and the country's indigenous cultural revival"
  - "The 'clean, green' landscape — from fjords to volcanoes to Southern Alps"
animals:
  popular:
    - "Kiwi (national bird)"
    - "Sheep (New Zealand has far more sheep than people)"
    - "Kea (mountain parrot) and kaka"
    - "Seals and penguins (yellow-eyed, little blue, Fiordland crested)"
  unique:
    - "Katipo (endemic venomous spider)"
    - "Tuatara (endemic reptile, a living fossil of the Sphenodon genus)"
    - "Weta (giant cave weta and tree weta — large endemic insects)"
    - "Kakapo (flightless, nocturnal endemic parrot)"
industries:
  - "Dairy and meat exports (Fonterra; Australia/China/UK lead markets)"
  - "Tourism — international visitors drawn to Fiordland, Rotorua, Queenstown and the wineries"
  - "Dairy, horticulture (kiwifruit, apples) and wine (Sauvignon Blanc, Pinot Noir)"
  - "Technology and film (Weta Workshop, film production support)"
  - "Forestry and fishing"
sports:
  - "Rugby union (de facto national sport — the All Blacks)"
  - "Cricket"
  - "Netball (popular among women)"
  - "Sailing (Auckland hosted the Americas Cup)"
  - "Rugby league and basketball"
