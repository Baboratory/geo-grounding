# 2023 census religion shares: a majority (51.6%) now declare no religion,
# reflecting a marked secular trend; Christianity is the largest religion
# (32.3%), followed by smaller Hindu, Muslim and Buddhist communities.
entertainment:
  - season: allYear
    items:
      - "Tramping and national-park walks (Tongariro, Abel Tasman, Fiordland)"
      - "Beach, harbour and sailing days"
      - "Live rugby, cricket and netball matches"
      - "Craft beer, coffee culture and wine tasting"
  - season: summer
    items:
      - "Beach trips, BBQs and long daylight hours (Dec-Feb)"
      - "Boating and the Americas Cup / coastal-race season"
  - season: winter
    items:
      - "Skiing and snowboarding at Queenstown, Cardrona and Mt Ruapehu (Jun-Sep)"
      - "Geothermal soaks at Rotorua and Hanmer Springs"
traditionalDishes:
  - season: allYear
    items:
      - "Hangi — a traditional Maori earth-oven feast of meat and vegetables"
      - "Fish and chips, and meat pies"
      - "Lamb roast and the Sunday roast"
      - "Pavlova dessert (often claimed as a Kiwi invention)"
  - season: summer
    items:
      - "BBQ lamb and fresh seafood (green-lipped mussels, Bluff oysters)"
  - season: winter
    items:
      - "Wholesome roasts, kumara (sweet potato), and hot pudding"
traditionalClothing:
  - season: allYear
    items:
      - "Casual, practical outdoor wear; merino and possum-wool knitwear"
      - "Jandals (flip-flops) and shorts as everyday summer staples"
      - "The Swanndri bush shirt in farming culture"
seasonCalendar:
  - season: summer
    months: [12, 1, 2]
  - season: autumn
    months: [3, 4, 5]
  - season: winter
    months: [6, 7, 8]
  - season: spring
    months: [9, 10, 11]
# Southern-Hemisphere seasons: summer is Dec-Feb and winter is Jun-Aug.
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Mon-Fri 08:30/09:00-17:00/17:30; many offices open Mon-Fri only."
  lunchBreakTiming: "Typically 12:00-13:00."
  notableShutdownPeriods:
    - period: "Christmas - New Year (late Dec to early Jan)"
      description: "The main summer shutdown; many businesses close for a week or two and the country goes on holiday."
    - period: "Public holidays"
      description: "Waitangi Day (6 Feb), Good Friday/Easter, ANZAC Day (25 Apr), King's Birthday (1st Mon of Jun), Labour Day (4th Mon of Oct)."
  notes: "Informal, egalitarian and friendly; first names are common even in business. Punctuality is valued. Many retail shops open on weekends."
