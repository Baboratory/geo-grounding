alpha3: NZL
alpha2: NZ
name:
  eng: New Zealand
  local:
    - languageCode: eng
      value: New Zealand
    - languageCode: mri
      value: Aotearoa
flagEmoji: "🇳🇿"
capital: Wellington
isSovereign: true
# Classified unitary-small: New Zealand (~5.4M, 2026 est.) sits well under the
# ~20-25M threshold for unitary-large and has no federal structure — it is a
# unitary parliamentary constitutional monarchy. Its three official languages
# (English, Maori, and New Zealand Sign Language) are national in scope, not
# regionally distinct. The North Island / South Island / Stewart Island split is
# geographic rather than a widely-recognized cultural-historical regional
# identity meriting curation. One synthetic WHOLE region. Note: English was
# formally granted de jure official status by legislation passed in 2026,
# joining Maori (1987) and NZSL (2006).
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: nzl-official-lang
  - languageCode: mri
    domain: official
    speakersShare: 1.0
    sourceId: nzl-official-lang
  - languageCode: nzs
    domain: official
    speakersShare: 1.0
    sourceId: nzs-act-2006
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.954
    sourceId: census-2018-lang
  - languageCode: mri
    domain: locallySpoken
    speakersShare: 0.037
    sourceId: census-2018-lang
# English is spoken by ~95% of New Zealanders and is the dominant de facto
# language; it received de jure official status via the 2026 English Language
# legislation (after Maori in 1987 and NZ Sign Language in 2006). Maori
# (te reo Maori) is spoken by an estimated ~3.7% of the population (2018
# census). NZSL is the primary language of a small Deaf community. Official
# rows carry the 1.0 legal-status flag for all three; actual usage is captured
# by the locallySpoken rows.
ethnicGroups:
  # 2023 census (multiple response, so shares may not sum to 100).
  - group: European (Paketha)
    percent: 67.8
    sourceId: census-2023-ethnic
  - group: Maori
    percent: 19.6
    sourceId: census-2023-ethnic
  - group: Asian
    percent: 17.3
    sourceId: census-2023-ethnic
  - group: Pacific peoples
    percent: 8.9
    sourceId: census-2023-ethnic
  - group: Middle Eastern / Latin American / African
    percent: 1.9
    sourceId: census-2023-ethnic
  - group: Other
    percent: 1.1
    sourceId: census-2023-ethnic
timezones:
  - name: Pacific/Auckland
    standardUtcOffset: "UTC+12"
    observesDst: true
    dstUtcOffset: "UTC+13"
    dstPeriod: "Last Sunday of September to the first Sunday of April (Southern Hemisphere summer), per the Time Act 1974."
currency:
  code: NZD
  symbol: "$"
  name: New Zealand dollar
legalConstraints:
  - topic: "official languages"
    description: "New Zealand has three official languages: English (de facto, formally recognized by the 2026 English Language legislation), Maori (official since 1987 under the Maori Language Act 1987) and New Zealand Sign Language (official since 2006 under the NZSL Act 2006). English remains the primary language of government, law, courts and education."
    sourceId: nzl-official-lang
  - topic: "maori language revitalization"
    description: "Te reo Maori is an indigenous language protected and promoted by the Maori Language Act 1987 and the Maori Language Strategy; a Waitangi Tribunal recommendation designated 2019-2040 as the Maori Language Decade with the aim of a million speakers by 2040."
    sourceId: census-2018-lang
  - topic: "data protection"
    description: "The Privacy Act 2020 (replacing the 1993 Act) is New Zealand's GDPR-equivalent comprehensive data-protection law, governing how personal information is collected, used and disclosed; the Office of the Privacy Commissioner enforces it."
    sourceId: nzl-privacy-act
paymentMethodShares:
  - method: "Debit card / EFTPOS"
    percent: 27.0
    sourceId: nzl-payments-2023
  - method: "Credit card"
    percent: 26.0
    sourceId: nzl-payments-2023
  - method: "Cash"
    percent: 20.0
    sourceId: nzl-payments-2023
  - method: "Other electronic (mobile wallets, etc.)"
    percent: 27.0
    sourceId: nzl-payments-2023
# Payment-method shares are Composite estimates derived from RBNZ retail
# payments data (2023); no single official split of 'in-person consumer cash
# vs card vs mobile' is published, so these are indicative approximations.
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
