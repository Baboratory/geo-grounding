sources:
  - id: nlda-2019
    name: "National Languages Development Act (2019)"
    publisher: "The Legislative Yuan, Republic of China (Taiwan)"
    url: "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0170143"
    year: 2019
    accessedDate: "2026-09-21"
    note: "Defines 'national language' broadly (Art. 3) rather than naming specific languages, and does not confer statutory official status on any single language; used here as the basis for recognition of nan/hak/ami as national languages. Mandarin's official-domain flag is a de facto status marker (as for Japanese in JPN), not a claim this Act makes it official."
  - id: wfb-twn
    name: "CIA World Factbook — Taiwan (languages, ethnic groups, population)"
    publisher: "Central Intelligence Agency (US)"
    url: "https://www.cia.gov/the-world-factbook/countries/taiwan/"
    year: 2024
    accessedDate: "2026-09-21"
    note: "Language and ethnic shares: Han Chinese (Hoklo ~70%, Hakka ~14%, other ~14%) >95%, indigenous ~2.3%; Mandarin official, Hokkien/Hakka/16 indigenous languages. Shares are composite estimates informed by census and linguistic surveys."
  - id: pdpa-tw
    name: "Personal Data Protection Act (Taiwan), as amended 2025"
    publisher: "DLA Piper (law-firm data-protection law tracker; not the Legislative Yuan directly)"
    url: "https://www.dlapiperdataprotection.com/index.html?t=law&c=TW"
    year: 2025
    accessedDate: "2026-09-21"
    note: "Taiwan's consolidated data-protection law; 2025 amendments strengthen penalties and cross-border transfer rules."
  - id: bta-tw
    name: "Value-added and Non-value-added Business Tax Act (Tax Rate 5%)"
    publisher: "Ministry of Finance, Republic of China (Taiwan)"
    url: "https://investtaiwan.nat.gov.tw/showPage?lang=eng&search=60"
    year: 2024
    accessedDate: "2026-09-21"
    note: "Standard VAT/business-tax rate is 5%; uniform-invoice system for VAT-inclusive retail pricing."
  - id: cpa-tw
    name: "Consumer Protection Act (Taiwan)"
    publisher: "The Legislative Yuan, Republic of China (Taiwan)"
    url: "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0140001"
    year: 2015
    accessedDate: "2026-09-21"
    note: "Consumer-rights framework, product liability and the cooling-off period for distance sales."
  - id: ef-eng
    name: "EF English Proficiency Index — Taiwan"
    publisher: "EF Education First"
    url: "https://www.ef.com/wwen/epi/"
    accessedDate: "2026-09-21"
    note: "The EPI publishes a proficiency score/ranking, not a population share; the 0.30 foreign-speaker figure is a constructive estimate informed by (not directly reported in) this index, concentrated among younger/urban populations as the languageUsage comment notes."
