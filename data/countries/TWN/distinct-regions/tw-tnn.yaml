code: TW-TNN
name:
  eng: Tainan City
  local:
    - languageCode: cmn
      value: 臺南市
climates:
  - koppenCode: Cwa
    description: "Humid subtropical with a pronounced wet summer; hot and humid, with a mild, relatively dry winter."
landmarks:
  - name: Chihkan Tower (Fort Provintia)
    description: "A 17th-century Dutch-built fortress and later Qing administrative site, one of Tainan's oldest landmarks."
  - name: Anping Old Fort (Fort Zeelandia)
    description: "The remains of the Dutch East India Company's 17th-century fortress at Anping."
  - name: Anping Tree House
    description: "An old warehouse overgrown with banyan roots, a striking photographic landmark."
  - name: Tainan Confucius Temple
    description: "Taiwan's oldest Confucius temple (1665), in the heart of the old city."
  - name: Afulu (yacht-building pier at Anping)
    description: "The Anping yacht marina and harborfront of Taiwan's historic port."
culturalTraits:
  - "Taiwan's oldest city and its historic capital, famed as the 'city of 100 temples' and the former seat of government"
  - "The cradle of Taiwan's cuisine — danzai noodles, coffin bread, and milkfish dishes"
  - "Deeply traditional, with a strong food, temple and festival culture"
prideOf:
  - "Being Taiwan's oldest and most historic city"
  - "A legendary local food scene recognized across Taiwan"
  - "Preserving its Dutch, Ming and Qing heritage and more than 100 temples"
animals:
  popular:
    - "Osprey (winter visitor to Taijiang wetlands)"
    - "Black-faced spoonbill (Taijiang National Park, winter)"
  unique:
    - "Black-faced spoonbill — the Taijiang coastal wetlands host significant wintering flocks"
industries:
  - "Manufacturing and industrial parks (the Southern Taiwan Science Park, a semiconductor hub)"
  - "Agriculture and aquaculture (milkfish farming)"
  - "Tourism and the food industry"
  - "Shipbuilding and port activities at Anping"
