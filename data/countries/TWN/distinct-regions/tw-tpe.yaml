    description: "Humid subtropical climate with hot, humid summers and mild, damp winters; the wettest months are May–September (typhoon season)."
landmarks:
  - name: Taipei 101
    description: "The city's iconic supertall skyscraper, with an outdoor observatory and the famous Lunar New Year fireworks."
  - name: National Palace Museum
    description: "One of the world's greatest collections of Chinese art and antiquities."
  - name: Chiang Kai-shek Memorial Hall and Liberty Square
    description: "A grand monument complex and civic square in central Taipei."
  - name: Longshan Temple
    description: "A historic Mazu/Wenshu temple in Wanhua, one of Taipei's oldest and most venerated."
  - name: Beitou Hot Springs
    description: "A famous geothermal hot-spring district at the city's northern edge."
