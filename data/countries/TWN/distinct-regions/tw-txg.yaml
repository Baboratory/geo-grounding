code: TW-TXG
name:
  eng: Taichung City
  local:
    - languageCode: cmn
      value: 臺中市
climates:
  - koppenCode: Cwa
    description: "Humid subtropical with a dry-winter tendency; mild pleasant winters and hot, humid summers, with typhoons bringing rain in summer."
landmarks:
  - name: Taichung National Theater and Opera House
    description: "A celebrated contemporary building by architect Toyo Ito in the city's cultural district."
  - name: Rainbow Village
    description: "A colorful painted village, a beloved Instagram landmark in the city's Nantun district."
  - name: Gaomei Wetlands
    description: "A scenic coastal wetland famous for its windmills and spectacular sunsets."
  - name: Lavender Forest (and the 'Sun-Moon-Lake-adjacent' mountain tea districts)
    description: "A tourist farm and the surrounding mountain tea country of central Taiwan."
  - name: Fengjia Night Market
    description: "One of Taiwan's largest and most famous night markets."
culturalTraits:
  - "Taiwan's second city and the commercial heart of the central region"
  - "A relaxed, livable metropolis with parks, universities and a celebrated food scene"
  - "Known for its sun cakes, bakeries and Fengjia night market"
prideOf:
  - "Being central Taiwan's economic and cultural hub"
  - "Its renowned night market and food culture"
  - "A green, grid-planned city with excellent weather and livability"
animals:
  popular:
    - "Formosan sambar deer (mountain districts)"
    - "Formosan black bear (forested foothills)"
  unique:
    - "Black-faced spoonbill — winter visitor to the Gaomei/coastal wetlands"
industries:
  - "Machinery and precision tools — Taichung is Taiwan's machine-tool manufacturing center"
  - "Manufacturing and optics/electronics"
  - "Logistics and trade (central distribution hub)"
  - "Tourism and a growing arts/design scene"
sports:
  - "Baseball"
  - "Basketball"
  - "Cycling"
