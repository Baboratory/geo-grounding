      value: اسلام آباد
climates:
  - koppenCode: Cwa
    description: "Humid subtropical climate in the Potohar foothills, with hot summers, a monsoon season and cool dry winters."
landmarks:
  - name: Faisal Mosque
    description: "The striking modern national mosque shaped like a desert tent, against the Margalla Hills."
  - name: Pakistan Monument
    description: "The petal-shaped national monument and museum celebrating Pakistani identity."
  - name: Margalla Hills National Park
    description: "The forested hills above the city, laced with hiking trails and viewpoints."
  - name: Daman-e-Koh viewpoint
    description: "The famous hilltop viewpoint over Rawalpindi-Islamabad in the Margalla Hills, a favourite evening spot."
culturalTraits:
  - "Pakistan's purpose-built federal capital, a planned, leafy and modern city"
  - "A political, diplomatic and administrative hub at the foothills of the Margallas"
  - "Cleaner, calmer and more orderly than the historic cities, with a strong expatriate/diplomatic community"
prideOf:
  - "Being the national capital and seat of government"
  - "A planned, green and safe urban environment"
  - "The Faisal Mosque and the modern skyline against the hills"
