businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Karachi's business sector runs 09:00-17:30 Monday-Friday with a shorter Friday; port and industrial work often runs shifts."
  lunchBreakTiming: "A lunch break around 13:00-14:00 is common."
  notableShutdownPeriods:
    - period: "Eid holidays"
      description: "Both Eids bring multi-day closures."
