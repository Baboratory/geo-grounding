alpha3: KOR
alpha2: KR
name:
  eng: South Korea (Republic of Korea)
  local:
    - languageCode: kor
      value: 대한민국 (Daehan Minguk)
flagEmoji: "🇰🇷"
capital: Seoul
isSovereign: true
# Classified unitary-large: South Korea meets 2 of the 3 DESIGN.md criteria.
# (1) the population (~51.7M in 2025) is far above the ~20-25M small-state
# threshold; (2) there is a genuine, widely recognized cultural-historical
# regional identity (the Seoul Capital Area, the Gyeongsang/Yeongnam southeast,
# the Jeolla/Honam southwest, the Chungcheong region, Gangwon and Jeju), even
# though the provinces/metropolitan cities are first-tier local authorities
# with no residual sovereignty (so NOT federal). Curated regions follow real
# ISO 3166-2 subdivisions (KR-11 Seoul, KR-41 Gyeonggi, KR-26 Busan, KR-29
# Gwangju, KR-49 Jeju, KR-42 Gangwon); WHOLE is the national fallback. Korean is
# the sole official language per the Framework Act on the Korean Language
# (Article 14) and the Constitution.
governanceType: unitary-large
iso3166_2_prefix: KR
hasSubdivisions: true
languageUsage:
  - languageCode: kor
    domain: official
    speakersShare: 1.0
    sourceId: kr-constitution
  - languageCode: kor
    domain: locallySpoken
    # Korean is the mother tongue of the overwhelming majority (over 95% of
    # South Koreans); the small remainder are foreign residents and the
    # Jeju-language community. A qualitative ~0.96 figure since the census
    # does not publish a single "primary home language" share.
    speakersShare: 0.96
    sourceId: cia-kor
  - languageCode: eng
    domain: foreign
    # English is widely taught and increasingly used in business and among the
    # young; a moderate qualitative locally-spoken share with no single
    # authoritative published fluency figure.
    speakersShare: 0.3
    sourceId: cia-kor
ethnicGroups:
  - group: Korean
    percent: 95.1
    sourceId: cia-kor
  - group: Other (mainly foreign workers and residents; no official census ethnic breakdown)
    percent: 4.9
    sourceId: cia-kor
timezones:
  - name: Asia/Seoul
    standardUtcOffset: "UTC+9"
    observesDst: false
currency:
  code: KRW
  symbol: "₩"
  name: South Korean won
legalConstraints:
  - topic: "official language"
    description: "Korean is the official language of the Republic of Korea. The Framework Act on the Korean Language (enacted 2005) establishes Korean as the national and official language and governs its use in public administration, education and the media."
    sourceId: kr-falk
  - topic: "consumer protection"
    description: "The Framework Act on Consumers (Consumer Basic Act) sets out consumer rights and duties; the Korea Consumer Agency handles disputes, and the Fair Trade Commission enforces the Act on Fair Labeling and Advertising and the E-Commerce Transactions Act (e-commerce consumer protection, cooling-off periods)."
    sourceId: kr-fairtrade
  - topic: "data protection"
    description: "The Personal Information Protection Act (PIPA) is Korea's comprehensive data-protection law, substantially amended in 2023 (in force 15 September 2023) to align with the GDPR (online-offline parity, cross-border transfer rules, expanded data-subject rights); it is enforced by the Personal Information Protection Commission (PIPC)."
    sourceId: pipc-kor
  - topic: "VAT"
    description: "A value-added tax of 10% is levied on most goods and services under the Value-Added Tax Act; it is a single flat rate with no reduced rate."
    sourceId: nts-kor-vat
paymentCulture:
  popularMethods:
    - "Card payments dominate — credit and debit cards are used even for very small transactions"
    - "Mobile/QR payments (Kakao Pay, Naver Pay, Toss) are near-universal"
    - "Cash is accepted but increasingly uncommon in daily retail"
    - "Bank transfers (account-to-account, often via mobile banking) are standard for larger payments"
  tipping:
    expected: false
    typicalAmount: "None — tipping is not customary in South Korea and may be politely declined"
    autoIncludedInBill: true
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Polite and hierarchy-aware. Honorifics and status-relative speech (jondaenmal vs. banmal) pervade; age and seniority govern address. Business attire is formal and professional."
  greetingNorms: "A light bow with eye contact is standard; handshakes (often with two hands or a slight bow) are used in business. Address people by title plus surname or honorific."
  meetingEtiquette: "Punctuality matters. Meetings open with formal introductions (exchanging business cards with both hands), may include group dining and drinking afterward (hoesik), and decisions are often made through seniority and close relationships."
  topicsToAvoid:
    - "Criticism of the nation or political sensitivity around North Korea"
    - "Direct negative feedback in front of a group"
    - "Personal questions about family, income or marital status with new acquaintances"
  giftGivingNotes: "Gift-giving is customary in hospitality and business contexts; present with both hands. Tipping is not expected. Giving gifts in sets of four is unlucky."
