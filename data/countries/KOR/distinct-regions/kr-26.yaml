landmarks:
  - name: Haedong Yonggungsa Temple
    description: "A scenic seaside temple on the cliffs of the east coast, one of Korea's few temples overlooking the sea."
  - name: Gamcheon Culture Village
    description: "The 'Santorini of the East', a hillside mosaic of brightly coloured houses and artworks."
  - name: Jagalchi Fish Market
    description: "South Korea's largest fish market, at the base of Nampo-dong."
