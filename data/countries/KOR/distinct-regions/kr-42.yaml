    - languageCode: kor
      value: 강원특별자치도 (Gangwon Teukbyeoljachido)
climates:
  - koppenCode: Dwa
    description: "Humid continental climate across the mountainous province, with cold snowy winters and cool, wettish summers in the Taebaek mountains."
  - koppenCode: Cwa
    description: "Humid subtropical/monsoonal climate in the lower eastern coastal plain, moderated by the sea."
landmarks:
  - name: Seoraksan National Park
    description: "A national park known for dramatic peaks, temple lakes and the Seoraksan ski resort."
  - name: Pyeongchang and Yongpyong Ski Resorts
    description: "Major winter-sports resorts; Pyeongchang hosted the 2018 Winter Olympics."
  - name: Gangneung and the 2018 Olympics venues
    description: "Coastal venues and the Alpensia and Gangneung ice venues from the 2018 Pyeongchang Winter Games."
  - name: Woljeongsa and mountaintop temples
    description: "Serene Buddhist temples set in the green mountain valleys of the province."
culturalTraits:
  - "South Korea's rugged, mountainous alpine province in the north-east"
  - "The country's winter-sports heartland, home of the 2018 Pyeongchang Winter Olympics"
  - "A nature-first identity of peaks, rivers, pine forests, hot springs and fresh air"
prideOf:
  - "Hosting the 2018 Pyeongchang Winter Olympics"
  - "World-class skiing and snowboarding (Yongpyong, Alpensia, Seoraksan)"
  - "Pristine mountain nature, clean rivers and traditional temple heritage"
