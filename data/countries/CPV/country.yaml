alpha3: CPV
alpha2: CV
name:
  eng: Cape Verde
  local:
    - languageCode: por
      value: Cabo Verde
    - languageCode: kea
      value: Kabu Verdi
flagEmoji: "🇨🇻"
capital: Praia
isSovereign: true
# Classified unitary-small, not unitary-large: population ~480,000 is far below
# the unitary-large threshold. Although both Portuguese and Cape Verdean
# Creole (Kriolu) are official at the NATIONAL level per the 1992 Constitution
# (revised 2010, art. 9), neither is a recognized regional/minority language
# confined to a subnational territory, and the island split is geographic and
# administrative (22 concelhos), not a widely recognized cultural-historical
# regional identity. Matches the unitary-small pattern (like Fiji/Vanuatu).
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: por
    domain: official
    speakersShare: 1.0
    sourceId: constitution-art9
  - languageCode: kea
    domain: official
    speakersShare: 1.0
    sourceId: constitution-art9
  - languageCode: kea
    domain: locallySpoken
    speakersShare: 0.7
    sourceId: composite-estimate
  - languageCode: por
    domain: locallySpoken
    speakersShare: 0.5
    sourceId: composite-estimate
# The official-domain rows are legal-status flags (both 1.0); actual usage is
# captured by the locallySpoken rows above. These usage shares are ESTIMATES:
# Cape Verde's INE does not publish disaggregated language-at-home percentages
# in a machine-readable breakdown, so the figures are a composite estimate
# (Kriolu is the everyday lingua franca; Portuguese dominates government,
# education and writing).
ethnicGroups:
  - group: "Creole (mestiço/mestiça de Cabo Verde)"
    percent: 71.0
    sourceId: composite-estimate
  - group: "African (predominantly Wolof, Fulani and other mainland-origin)"
    percent: 28.0
    sourceId: composite-estimate
  - group: "European (Branco)"
    percent: 1.0
    sourceId: composite-estimate
timezones:
  - name: Atlantic/Cape_Verde
    standardUtcOffset: "UTC-1"
    observesDst: false
currency:
  code: CVE
  symbol: ""
  name: Cape Verdean escudo
legalConstraints:
  - topic: "Official languages"
    description: "Article 9 of the Constitution establishes Portuguese and Cape Verdean Creole as the official languages and requires the State to promote conditions for their development and use, including translation of official acts as needed."
    sourceId: constitution-art9
paymentCulture:
  popularMethods:
    - "Cash (Cape Verdean escudo, CVE)"
    - "Debit/credit cards (Visa/Multicaixa network)"
    - "Mobile money / bank transfer (Multicaixa Express and mobile services)"
  tipping:
    expected: false
    typicalAmount: "A small gratuity of roughly 5-10% in restaurants; appreciated for personal services"
    autoIncludedInBill: false
    note: "Tipping is not mandatory but a modest gratuity in restaurants and for personal services is appreciated."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Warm and courteous; Portuguese is used in formal/official writing, Kriolu in everyday speech. Greetings and polite small talk are expected before business."
  greetingNorms: "A handshake and warm greeting are standard; asking how someone is is a normal part of the exchange."
  meetingEtiquette: "Relationship-driven; establish rapport and social small talk before the agenda. Decisions tend to be taken by senior people, often at a relaxed pace."
  topicsToAvoid: []
  giftGivingNotes: "Not expected at a first meeting; a small token is appreciated when hospitality is extended."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
  - id: constitution-art9
    name: "Constitution of the Republic of Cabo Verde (1992, revised 2010), Article 9"
    publisher: "Official Gazette of the Republic of Cabo Verde, via WIPO Lex"
    url: "https://www.wipo.int/wipolex/en/legislation/details/21062"
    year: 2010
    accessedDate: "2026-09-18"
    note: "Establishes Portuguese and Cape Verdean Creole as the official languages and the unitary republican framework."
  - id: composite-estimate
    name: "Composite estimate"
    publisher: "Composite estimate"
    url: "https://ine.cv/"
    accessedDate: "2026-09-18"
    note: "ESTIMATE — locallySpoken language shares and ethnic composition are estimates (Kriolu ~70% everyday lingua franca, Portuguese ~50% for formal use/education and as first language of a minority), because INE does not publish disaggregated language-at-home percentages. Ethnic composition (mestiço ~71%, African ~28%, European ~1%) is a widely cited generalization."
