  - name: Salta de la Plaza (Catedral and Cabildo)
    description: "The colonial heart of Salta, an Andean city known as 'Salta la Linda'."
  - name: Tren a las Nubes
    description: "The famed 'Train to the Clouds' railway climbing into the high Andes."
  - name: Cafayate and Quebrada de Cafayate
    description: "Wine country and a dramatic red-rock canyon landscape."
