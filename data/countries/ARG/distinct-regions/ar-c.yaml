businessRhythm:
  restDays:
    - saturday
    - sunday
  typicalWorkHours: "Offices roughly 09:00-18:00; lunches are late (~13:00-14:00) and dinners often start after 21:00."
  lunchBreakTiming: "A long midday break, though shorter than in the interior; many offices take a working lunch."
  notableShutdownPeriods:
    - period: "January"
      description: "Austral summer; parts of the city's culture/business run on a summer schedule, and many diners/bars stay open late for the holiday season."
  notes: "Porteños (residents of Buenos Aires) are the classic busy, fast-talking, cosmopolitan stereotype of the country; most business, government and finance is concentrated here."
