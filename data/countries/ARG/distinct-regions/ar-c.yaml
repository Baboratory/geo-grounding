entertainment:
  - season: allYear
    items:
      - "Tango shows, milongas and live jazz/blues venues"
      - "Theatre and cinema — Buenos Aires has one of the world's densest theatre scenes"
      - "Street-art tours (La Boca, Villa Crespo, Palermo)"
      - "Nightlife that starts late and runs into the early hours"
