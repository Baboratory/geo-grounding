code: AR-C
name:
  eng: City of Buenos Aires
  local:
    - languageCode: spa
      value: Ciudad de Buenos Aires
climates:
  - koppenCode: Cfa
    description: "Humid subtropical: hot humid summers, mild winters, rain year-round."
landmarks:
  - name: Casa Rosada and Plaza de Mayo
    description: "The presidential palace and the historic square at the founding heart of the city."
  - name: Obelisco de Buenos Aires
    description: "The iconic 67.5-m obelisk on Avenida 9 de Julio."
  - name: Teatro Colón
    description: "One of the world's great opera houses, renowned for its acoustics."
  - name: La Boca / Caminito
    description: "The colorful working-class barrio that gave birth to tango."
  - name: Palermo neighborhoods
    description: "Trendy parks, restaurants and street-art districts; also the Buenos Aires Botanical Garden."
  - name: Recoleta Cemetery
    description: "Historic cemetery and the resting place of Eva Perón."
culturalTraits:
  - "The cradle of tango and the milonga culture"
  - "Cosmopolitan with strong Italian/Spanish immigrant heritage"
  - "Late-night dining and the 'porteño' fast pace and sharp humor"
  - "Passion for football (Boca Juniors and River Plate derby) and literature"
prideOf:
  - "Tango heritage and the Teatro Colón"
  - "World-class steak (asado) and the mate ritual"
  - "Cosmopolitan art, architecture and café culture"
  - "Football's superclásico between Boca and River"
animals:
  popular:
    - "Rufous hornero in parks and streets"
    - "Pigeons and parrots in green spaces"
    - "Coatis occasionally around the Botanical Garden"
  unique:
    - "The woolly red-furred coati of nearby ecosystems"
industries:
  - "Finance, services and the national government"
  - "Technology and startup hub ('Argentina's Silicon Valley' around Palermo/San Telmo)"
  - "Tourism — cultural, gastronomic and tango-focused"
  - "Publishing, media and the creative industries"
sports:
  - "Football — home of Boca Juniors and River Plate"
  - "Polo at the Palermo polo fields"
  - "Rugby, tennis and basketball clubs"
