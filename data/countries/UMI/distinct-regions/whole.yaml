code: WHOLE
name:
  eng: United States Minor Outlying Islands
  local:
    - languageCode: eng
      value: United States Minor Outlying Islands
climates:
  - koppenCode: Af
    description: Tropical climates across the Pacific isles — warm year-round; Wake, Midway and the Pacific atolls are hot and humid with low rainfall on some islands.
landmarks:
  - name: Wake Island
    description: The largest of the Pacific UMI isles, a former military airfield and now a wildlife refuge.
  - name: Midway Atoll
    description: Historic WWII battle site, now a National Wildlife Refuge and home to huge seabird colonies.
  - name: Palmyra Atoll
    description: The only incorporated UMI area, part of the Pacific Remote Islands Marine National Monument.
culturalTraits:
  - WWII and early-aviation history (Wake, Midway)
  - Pristine tropical-island wildlife-refuge heritage
prideOf:
  - Untouched coral reef ecosystems
  - Historic naval and aviation significance
animals:
  popular:
    - Green sea turtle
    - Loggerhead and hawksbill turtles
    - Albatross (Laysan and black-footed)
  unique:
    - Laysan albatross colonies
    - Wake Island rail (endemic, extinct in wild)
industries:
  - Wildlife conservation and scientific research
  - Fish and Wildlife Service refuge management
sports:
  - Diving and marine research among posted staff
