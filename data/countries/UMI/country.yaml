# English is the working/official language of the US administration. UMI is a
# statistical grouping of nine mostly uninhabited US insular areas (Baker,
# Howland, Jarvis, Johnston Atoll, Kingman Reef, Midway, Palmyra, Wake, and
# Navassa). There is no permanent civilian population; only transitory Fish
# and Wildlife Service, military and scientific personnel are posted there.
timezones:
  - name: Etc/GMT+12
    standardUtcOffset: "UTC-12"
    observesDst: false
  - name: Pacific/Midway
    standardUtcOffset: "UTC-11"
    observesDst: false
  - name: Pacific/Johnston
    standardUtcOffset: "UTC-10"
    observesDst: false
  - name: Pacific/Wake
    standardUtcOffset: "UTC+12"
    observesDst: false
currency:
  code: USD
  symbol: "$"
  name: "United States dollar"
legalConstraints:
  - topic: "Uninhabited islands — diversity of US territorial status"
    description: "UMI is a statistical grouping of nine US insular areas that are unincorporated (except Palmyra), with Navassa in the Caribbean and the rest in the Pacific. None has permanent residents; personnel are posted for wildlife, military and scientific purposes. Most Pacific islands fall within a large marine national monument, and they sit outside the US customs territory."
    sourceId: umi-wikipedia
# paymentMethodShares and paymentCulture intentionally omitted: there is no
