  - name: Pacific/Saipan
    standardUtcOffset: "UTC+10"
    observesDst: false
# The Northern Mariana Islands are on a single timezone UTC+10 year-round with
# no DST.
currency:
  code: USD
  symbol: "$"
  name: United States dollar
legalConstraints:
  - topic: "official languages"
    description: "English, Chamorro and Carolinian are the official languages (CNMI Constitution art. XXII)."
    sourceId: wp-lang
  - topic: "US commonwealth status"
    description: "The CNMI is an unincorporated US territory with a self-governing constitution; its residents are US nationals (not citizens) who cannot vote in US presidential elections, and most immigration and labour rules differ from the mainland."
    sourceId: wp-politics
  - topic: "labour migration and gambling"
    description: "The economy relies heavily on guest workers (chiefly from the Philippines and South Asia); the CNMI long had no casino gambling and a high minimum-wage carve-out from US labour law, both points of recurring debate."
    sourceId: wp-politics
  - topic: "Battle of Saipan heritage"
    description: "Saipan and Tinian were the sites of major Pacific War battles (1944) and the taking-off point for the nuclear bombers; war memorials and the deep Catholic faith of the native Chamorro population remain defining."
    sourceId: wp-culture
paymentCulture:
  popularMethods:
    - "US dollar cash and cards are standard, as in the US mainland"
    - "Credit cards accepted in Saipan's hotels, restaurants and malls"
    - "ATMs on Saipan, Tinian and Rota; banking via regional branches"
    - "Remittances in both directions between the CNMI and the Philippines/Asia"
  tipping:
    expected: true
    typicalAmount: "10-20% at sit-down restaurants, following US customs"
    autoIncludedInBill: false
    note: "Tipping follows US conventions: 15-20% in restaurants and for service staff."
communicationStyle:
  contextLevel: mixed
  formalityNorms: "US-influenced informality blended with Chamorro and Carolinian respect for elders and generous hospitality; family and church are central."
  greetingNorms: "A warm 'Håfa Adai' (Chamorro hello) or handshake; first names with a respectful tone."
  meetingEtiquette: "Meetings value politeness, relationship-building and consensus; avoid direct confrontation, and acknowledge the importance of the family and the Catholic Church."
  topicsToAvoid:
    - "Disrespecting Chamorro or Carolinian custom or the Catholic faith"
    - "Treating the military/WWII history or guest-worker labour topics dismissively"
  giftGivingNotes: "Modest gifts and sharing food are valued; generosity and hospitality are highly regarded."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
