# English, Chamorro and Carolinian are the official languages (CNMI Constitution
# art. XXII). English dominates government and business; Chamorro is the
# indigenous language of the southern islands and Carolinian of the Carolinian
# community on Saipan. Tagalog and other migrant languages are widely spoken.
# LocallySpoken shares are estimates.
