# Classified dependent-territory: the Commonwealth of the Northern Mariana
# Islands is an unincorporated US territory with its own constitution. The 14
# inhabited islands of the Marianas chain (Saipan, Tinian, Rota and the
# northern islands) form a compact archipelago without a widely recognized
# cultural-historical regional divide meriting curation. One synthetic WHOLE
# region.
governanceType: dependent-territory
