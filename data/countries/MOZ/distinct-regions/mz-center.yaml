code: MZ-CENTER
name:
  eng: Central Mozambique (Centro)
  local:
    - languageCode: por
      value: Centro de Moçambique
# Covers Zambézia, Sofala, Manica and Tete provinces: the Sena/Chuwabo/Ndau
# belt around the Zambezi valley, Gorongosa and the dry high plateau.
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry (savanna) — hot with a rainy season Nov-Apr and a dry season May-Oct."
  - koppenCode: BSh
    description: "Hot semi-arid — along the dry lower Zambezi valley (Tete)."
  - koppenCode: Cwa
    description: "Humid subtropical highland — the cooler high plateau and Mount Gorongosa area."
landmarks:
  - name: Gorongosa National Park
    description: "Central Mozambique's flagship restoration park at the southern end of the Great Rift Valley."
  - name: Cahora Bassa Dam & Lake
    description: "One of Africa's largest hydroelectric dams on the lower Zambezi."
  - name: Mount Gorongosa
    description: "Iconic forested massif overlooking the Zambezi-valley lowlands."
culturalTraits:
  - "Zambezi-valley Sena and Ndau heritage"
  - "The wartime heartland of the RENAMO opposition and post-war reconciliation"
  - "Gorongosa's celebrated conservation-restoration story"
  - "Miombo-savanna and riverine agricultural life along the Zambezi"
prideOf:
  - "Gorongosa's restoration as 'Africa's greatest conservation story'"
  - "The mighty Zambezi and Cahora Bassa"
  - "Sena/Ndau cultural traditions and Gorongosa's wildlife"
animals:
