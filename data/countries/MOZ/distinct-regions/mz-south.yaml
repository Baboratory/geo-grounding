    months: [5, 6, 7, 8, 9, 10]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Government/offices roughly 07:30-16:30 Mon-Fri; private sector 08:00-17:00."
  lunchBreakTiming: "Midday break commonly 12:00-14:00."
  notes: "Maputo is the financial heart; cards, mobile money (M-Pesa, e-Mola) and bank transfers are most used here."
