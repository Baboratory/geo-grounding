alpha3: MOZ
alpha2: MZ
name:
  eng: Mozambique
  local:
    - languageCode: por
      value: República de Moçambique
flagEmoji: "🇲🇿"
capital: Maputo
isSovereign: true
# Classified unitary-large: Mozambique meets all 3 DESIGN.md unitary-large
# criteria. (1) Population ~34.2M (2025 CIA est.) — far above the 20-25M
# threshold. (2) Officially recognized regional/minority languages — the
# Constitution (Art. 9) formally esteems and promotes the national Bantu
# languages (Makhuwa, Tsonga, Sena, Lomwe, Chuwabu, Ndau, Tswa, etc.) as
# cultural/educational heritage with regional speech communities, while Art.
# 10 makes Portuguese the sole official language. (3) Widely recognized
# cultural-historical regional divide — a well-documented threefold identity
# delimited by the Zambezi River (north/center) and the Save River
# (center/south): a Makhuwa-majority, Muslim-influenced northern coast
# (Cabo Delgado/Nampula); a Sena/Ndau belt around the Zambezi valley and
# Gorongosa; and a Tsonga/Ronga southern cluster tied to Maputo and South
# Africa. This is a genuine cultural-historical divide, not an ecological
# artifact. 3 of 3 met -> three curated regions + WHOLE.
governanceType: unitary-large
iso3166_2_prefix: MZ
hasSubdivisions: true
regionCoverage:
  # Count per ISO 3166-2 as of 2026-09. The uncurated units have NOT yet been
  # tested against DESIGN.md's five coverage triggers -- this declaration records
  # the gap so it is visible, not a finding that the gap is correct. Pending the
  # coverage re-audit (see TODO.md).
  tier: first-level
  totalUnits: 11
  status: partial
  gapReason: "3 of 11 first-level units curated. Which of the
    remaining units fire a coverage trigger has not been assessed yet -- the
    curated set predates the coverage floor and was chosen by size/capital,
    not by divergence. Queued for the coverage re-audit."
