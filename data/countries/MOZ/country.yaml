# Portuguese is the sole official language (Constitution Art. 10, official
# domain shares of 1.0 are the legal-status flag). Mother-tongue shares are
# 2017 Census-derived estimates as reported by the CIA World Factbook;
# Ronga's is an Ethnologue-derived estimate. This is an ESTIMATE of first
# language shares, not an official per-language proficiency census.
ethnicGroups:
  - group: Makhuwa (Macua)
    percent: 26.1
    sourceId: cia-wfb
  - group: Tsonga (Shangaan)
    percent: 8.6
    sourceId: cia-wfb
  - group: Chichewa (Nyanja)
    percent: 8.1
    sourceId: cia-wfb
  - group: Sena
    percent: 7.1
    sourceId: cia-wfb
  - group: Other Mozambican Bantu peoples and coastal/mixed ancestry
    percent: 50.1
    sourceId: cia-wfb
# Figures are estimates; Mozambique collects no comprehensive ethnic census
# (INAMAR/INE publish mother-tongue and religious data instead).
timezones:
  - name: Africa/Maputo
    standardUtcOffset: "UTC+2"
    observesDst: false
# Central Africa Time (CAT), UTC+2 year-round; Mozambique does not observe DST.
currency:
  code: MZN
  symbol: "MT"
  name: Mozambican metical
# The metical (MZN, 100 centavos) is issued by the Banco de Moçambique; 'MT'
# is the common symbol. The name derives from the Arabic 'mithqal'.
legalConstraints:
  - topic: "official language"
    description: "Portuguese is the sole official language of the state, legislation, courts and public administration (Constitution, Art. 10). National Bantu languages have heritage and educational status but no official-legal standing."
    sourceId: constitution-wipo
  - topic: "recognition of national languages"
    description: "Article 9 of the Constitution obliges the State to esteem and promote the national (Bantu) languages as cultural and educational heritage, guiding language-in-education policy."
    sourceId: constitution-wipo
  - topic: "security-restricted north"
    description: "Parts of Cabo Delgado province and surrounding areas are subject to official travel restrictions/advisories due to an ongoing Islamist insurgency (attacks since 2017, concentrated near the LNG zones)."
    sourceId: state-travel-advisory
paymentCulture:
  popularMethods:
    - "Cash (metical) — dominant, especially outside Maputo"
    - "Mobile money — M-Pesa (Vodacom), e-Mola (Movitel), Mkesh — very widely used"
    - "Bank transfer and mobile banking"
    - "Debit/credit cards (Visa/Mastercard) — mainly Maputo hotels, supermarkets and larger retailers"
    - "US dollars — commonly accepted at lodges, upscale tourism and for large transactions"
  tipping:
    expected: false
    typicalAmount: "~10% in upscale restaurants when no service charge is added; small-change tips for hotel staff, porters, guides and safari staff"
    autoIncludedInBill: false
    note: "Tipping is not mandatory; a ~10% service charge is often added to hotel/restaurant bills."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Deferential to elders and officials; titles and ranks are used; respect for hierarchy matters."
  greetingNorms: "Warm greeting with a handshake (often the left hand holding the right elbow); always greet before transacting and ask after health/family."
  meetingEtiquette: "Punctuality is appreciated but tolerated flexibly; an opening pleasantry and greeting precede business."
  topicsToAvoid:
    - "Sensitive politics and civil-war history"
    - "Ethnic stereotypes and negative ethnic generalizations"
    - "Direct public criticism of individuals or the state"
    - "Discussing someone's salary"
  giftGivingNotes: "Gifts are well received at family/hospitality occasions and when visiting homes; modest, sincere gifts; defer to local elder norms."
