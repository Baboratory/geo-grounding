alpha3: LBR
alpha2: LR
name:
  eng: Liberia
  local:
    - languageCode: eng
      value: Liberia
flagEmoji: "🇱🇷"
capital: Monrovia
isSovereign: true
# Classified unitary-small: Liberia meets NONE of the 3 DESIGN.md unitary-large
# criteria. (1) Population ~5.4M — far below the 20-25M threshold. (2) English is
# the sole official language; Kpelle and ~16 indigenous languages are locally
# spoken but NOT official. (3) No strongly marked federal or multi-region identity
# curated beyond a single whole. One synthetic WHOLE region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: lbr-cia
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.2
    sourceId: lbr-language-estimate
  - languageCode: kpe
    domain: locallySpoken
    speakersShare: 0.2
    sourceId: lbr-language-estimate
# English is the sole de jure official language; in practice Liberian English
# variants are widely used by roughly 20% of the population. Kpelle is the most
# widely spoken indigenous language, with the Kpelle group forming ~20.2% of the
# population — the kpe locallySpoken 0.2 share is an ESTIMATE tied to ethnic share,
# since the CIA gives no direct language-percentage breakdown. The eng locallySpoken
# 0.2 follows the CIA's 'English 20% official' figure.
