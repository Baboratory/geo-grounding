sources:
  - id: ml-const-2023-art31
    name: "Constitution de la Republique du Mali (2023), Article 31 - promulguee par decret n 2023-0401/PT-RM du 22 juillet 2023"
    publisher: "Republique du Mali - Secretariat general du Gouvernement (Journal Officiel n 2023-13 SP-2); text also republished by AXL, Universite Laval"
    url: "https://sgg-mali.ml/JO/2023/mali-jo-2023-13-sp-2.pdf"
    year: 2023
    accessedDate: "2026-09-19"
    note: "Legal basis for the national languages becoming the official languages of Mali and for French being demoted to working language. Article 31: 'Les langues nationales sont les langues officielles du Mali'; 'Le francais est la langue de travail.' Cross-checked via AXL Univ. Laval and the Constitute Project transcripts."
  - id: instat-rgph5-2022
    name: "Recensement General de la Population et de l'Habitat (RGPH-5), 2022 - published results"
    publisher: "Institut National de la Statistique (INSTAT), Mali"
    url: "https://www.instat-mali.org/"
    year: 2022
    accessedDate: "2026-09-19"
    note: "Ethnic composition and religion breakdown (Bambara ~35.9%, Fula ~12.8%, Senufo ~9.4%, Malinke ~8.4%, Soninke ~8.2%, Dogon ~6.1%, Songhai ~4.8%, Tuareg ~3.9%, Bobo/Bwa ~2.2%; Muslim ~96.4%, Christian ~2.3%, traditional ~0.7%). Based on the 2022 national compilation; individual RGPH-5 tabulations should be consulted where high precision is required."
  - id: ethnologue-bam
    name: "Ethnologue - Bambara (bam) language entry"
    publisher: "SIL International / Ethnologue"
    url: "https://www.ethnologue.com/language/bam"
    accessedDate: "2026-09-19"
    note: "Bambara (Bamanankan) is the most widely spoken Malian language and the de facto national lingua franca, spoken by roughly 80% of the population as a first or second language."
  - id: oif-francophonie-2024
    name: "La langue francaise dans le monde - Francophone population estimates"
    publisher: "Organisation internationale de la Francophonie (OIF)"
    url: "https://www.francophonie.org/"
    year: 2024
    accessedDate: "2026-09-19"
    note: "Roughly a fifth of Malians (about 4.9 million of roughly 22 million) are Francophone, almost all as a second language - supporting the French 'foreign' domain share and its working-language role."
  - id: ohada-treaty
    name: "Traite relatif a l'harmonisation du droit des affaires en Afrique (OHADA)"
    publisher: "OHADA (Organisation pour l'harmonisation en Afrique du droit des affaires)"
    url: "https://www.ohada.com/"
    accessedDate: "2026-09-19"
    note: "Legal basis for harmonised company, commercial, securities, insolvency, arbitration and enforcement law across the OHADA member states (including Mali), applied by the Common Court of Justice and Arbitration (CCJA)."
