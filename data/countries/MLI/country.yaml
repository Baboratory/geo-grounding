legalConstraints:
  - topic: "Official languages & working language under the 2023 Constitution (Article 31)"
    description: "Since the 2023 Constitution came into force (promulgated by decree No. 2023-0401/PT-RM of 22 July 2023, after the 18 June 2023 referendum), the national languages of Mali are the official languages, most notably Bambara, Fula, Soninke, Songhai (Koyraboro Senni) and Tamasheq among the thirteen national languages recognised since Loi 96-049 (1996). French, once the sole official language, is now only the working language (langue de travail); the State may adopt any other language as a working language. An organic law is to determine the conditions and modalities of use of the official national languages."
    sourceId: ml-const-2023-art31
  - topic: "Secular state & religious freedom"
    description: "Mali is a secular republic. Article 1 of the 2023 Constitution prohibits discrimination on grounds including religion, ethnicity, or language, and the constitution guarantees freedom of conscience and worship. In practice many Malians combine Islam (over 90% of the population) with traditional African beliefs, and much personal-status law (family, marriage, inheritance) is administered under Islamic and customary rules alongside statutory law."
    sourceId: ml-const-2023-art31
  - topic: "Business law harmonised under OHADA"
    description: "Mali is a contracting party to the OHADA Treaty (Organisation pour l'harmonisation en Afrique du droit des affaires) as a member of UEMOA/WAEMU. Company, commercial, securities, insolvency, arbitration and enforcement law is therefore harmonised across the OHADA member states and applied by the Common Court of Justice and Arbitration (CCJA) in Abidjan. Business agreements and transactions should be assessed under the OHADA uniform acts, not solely under Mali's national codes."
    sourceId: ohada-treaty
paymentCulture:
  popularMethods:
    - "Cash (West African CFA franc, XOF) - still the dominant everyday payment across most of the country"
    - "Mobile money (Orange Money and Moov Money Africa) - the ubiquitous mobile-wallet rails that carry most small retail transfers"
    - "Bank cards (Visa / Mastercard) - increasingly accepted in Bamako and larger urban merchants and ATMs"
    - "WAEMU regional interbank network GIM-UEMOA, and bank transfers for larger and formal transactions"
  tipping:
    expected: false
    autoIncludedInBill: false
    typicalAmount: "In urban restaurants a service charge of roughly 5-10% is often added; otherwise tipping is modest and appreciated but not obligatory. Rounding up fares for taxis is customary."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Use a title plus surname (Monsieur / Madame) until invited to first names; age and social standing command respect, and honorifics matter more than in many Western business settings."
  greetingNorms: "Handshakes and polite exchanges about health and family open nearly every interaction; the everyday Bambara greetings 'I ni ce' and 'I ni sogoma' are widely used even across language groups. Asking after someone's family is expected politeness, not prying."
  meetingEtiquette: "Relationships and trust come before transactions: initial meetings are for getting to know a counterpart rather than closing a deal. Business often moves through established family or community networks, decisions may involve elders, and a flexible, patient pace is normal. The Friday midday prayer and break is widely observed."
  topicsToAvoid:
    - "The 2012-2015 civil war and the 2021 coup and transition politics - deeply sensitive"
    - "Over-simplifying the north-south or Tuareg versus Mande divide - a painful, political topic"
    - "Religious or secular-critical commentary; the large majority of Malians are Muslim and faith is taken seriously"
  giftGivingNotes: "Small, thoughtful gifts are appreciated and usually reciprocated; respect for elders and religious sensitivity matter (alcohol and pork as gifts can cause offence). If invited to a home, a modest gift is valued."
