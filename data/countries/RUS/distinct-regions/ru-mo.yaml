code: RU-MO
name:
  eng: Republic of Mordovia
  local:
    - languageCode: mdf
      value: Мордовия Республикась
    - languageCode: myv
      value: Мордовия Республикась
    - languageCode: rus
      value: Республика Мордовия
climates:
  - koppenCode: Dfb
    description: "Warm-summer humid continental, the dominant class — a moderate continental climate with warm summers and cold snowy winters on the East European Plain."
landmarks:
  - name: Saransk
    description: "Capital of the republic; one of Russia's host cities of the 2018 FIFA World Cup, with the Mordovia Arena at its heart."
  - name: Mordovia Arena
    description: "The 45,000-seat football stadium built in Saransk for the 2018 FIFA World Cup; a reference point of the city's modern skyline."
  - name: St. Theodore Ushakov Memorial Cathedral
    description: "A large Orthodox cathedral in central Saransk, named after the Russian naval commander and saint Admiral Fyodor Ushakov."
  - name: M. E. Evsevyev National Museum
    description: "The principal regional museum of Mordovia (Revival of Mordovian Regional Studies), with ethnographic collections on the Moksha and Erzya peoples."
  - name: The Sura River
    description: "The republic straddles the middle course of the Sura and its tributary the Moksha in the Volga basin."
  - name: Mordovia TV and radio tower
    description: "A tall lattice transmission tower in Saransk, among the tallest freestanding structures built in Russia, a distinctive city landmark."
culturalTraits:
  - "The Mordvins are two closely related Finno-Ugric peoples — the Moksha and the Erzya — whose languages (Moksha mdf, Erzya myv) are both co-official with Russian."
  - "Mordovia was one of only two republics that did not proclaim sovereignty during the late-Soviet 'parade of sovereignties'."
  - "The republic has a strong Orthodox identity with many monasteries, alongside preserved indigenous traditions; Saransk hosted the 2018 FIFA World Cup."
  - "Mordovia is a major Russian agricultural and meat-producing region, repeatedly among Russia's top poultry and pork producers."
prideOf:
  - "Moksha and Erzya heritage and the survival of two co-official Finno-Ugric languages."
  - "Hosting the 2018 FIFA World Cup at the Mordovia Arena."
  - "The Ushakov cathedral and monastic tradition."
  - "The republic's leading role in Russian agriculture."
animals:
  popular:
    - Brown bear
    - Moose (European elk)
    - European beaver
    - Wild boar
  unique:
    - "Black grouse (in the forest-meadow landscapes of the republic)"
    - "Rivers' zander (pike-perch) in the Sura and Moksha"
industries:
  - "Agriculture — grain, sugar beet, dairy and one of Russia's largest poultry and pork sectors"
  - "Food processing"
  - "Fiber-optics and electronics cluster in Saransk"
  - "Cement (Mordovcement) and building materials"
  - "Light engineering"
sports:
  - "Football (Mordovia Arena, built for the 2018 FIFA World Cup)"
  - "Sambo and freestyle wrestling"
  - "Athletics / long-distance running"
  - "Ice hockey"
