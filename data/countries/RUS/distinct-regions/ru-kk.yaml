code: RU-KK
name:
  eng: Republic of Khakassia
  local:
    - languageCode: kjh
      value: Хакас Республиказы
    - languageCode: rus
      value: Республика Хакасия
# A Turkic republic in southern Siberia on the Yenisei, in the Minusinsk hollow.
# Its constitution names Khakas (kjh) as co-official with Russian; Article 68(2)
# of the federal Constitution gives every republic the right to a state language.
climates:
  - koppenCode: Dfb
    description: "Humid continental — the climate of the Minusinsk basin and valleys around Abakan and Sayanogorsk, with warm short summers and long cold winters."
  - koppenCode: Dfc
    description: "Subarctic / taiga variants in the surrounding Sayan and Kuznetsk Alatau ranges."
  - koppenCode: BSk
    description: "Cold semi-arid steppe in the driest parts of the Khakas-Minusinsk steppe."
landmarks:
  - name: Abakan
    description: "The capital, a city on the Yenisei (Abakan river mouth), the republic's main economic and cultural centre."
  - name: Sayanogorsk
    description: "The republic's industrial and energy hub on the Yenisei near the Sayano-Shushenskaya reservoir, Russia's main aluminium-smelting town."
  - name: Sunduki ('Chests') near Shira
    description: "A line of sandstone ridges with Bronze Age petroglyphs and an open-air observatory, an iconic Khakas sacred site."
  - name: Oglakhty petroglyphs
    description: "Rock-art gallery on the left bank of the Yenisei with thousands of Bronze and Iron Age petroglyphs."
  - name: Khakassky State Nature Reserve
    description: "A reserve of scattered steppe and forest-steppe sites preserving Khakas steppe wildlife."
  - name: Mount Borus
    description: "The highest peak of the Western Sayan on the republic's southern edge (over 2,000 m), sacred in Khakas tradition."
entertainment:
  - season: summer
    items:
      - "The Kazanovka ethnographic complex's summer festivals of Khakas song, throat singing and horse sports"
      - "Sunduki steppe excursions and the open-air ethnographic museum at Kazanovka"
  - season: winter
    items:
      - "New Year holiday season"
  - season: spring
    items:
      - "Khakas spring herding and household rites, and Maya (Khakas sacred-pole) observances"
  - season: autumn
    items:
      - "Regional festivals of Khakas culture and tameer (folk theatre) events"
culturalTraits:
  - "A Turkic republic of the Khakas people (with a large ethnic-Russian majority) on the steppes of the Minusinsk hollow"
  - "Khakas is co-official with Russian and taught in schools, though fewer than a fifth of Khakas speak it natively"
  - "Long-converted to Russian Orthodoxy, with a resilient layer of Khakas shamanism (Tengrism) and revived native-faith movements"
  - "A pastoral-steppe identity — horse herding, eşkes; and the sacred stone (obaa) tradition"
  - "Khakas throat singing and the epic tales recited in the khay rhythm are a distinctive local art"
prideOf:
  - "The steppe and Sayan landscapes of the Minusinsk basin"
  - "Khakas language, culture and the Sunduki/Oglakhty rock art"
  - "Sayanogorsk and the hydro and aluminium industry of the Yenisei"
  - "Khakas horse culture and the hardiness of its herding tradition"
animals:
  popular:
    - "Steppe marmot"
    - "Golden eagle"
    - "Altai red deer"
    - "Siberian ibex"
  unique:
    - "Khakas horse — a hardy native steppe-breed adapted to the continental climate"
    - "Pallas's cat (manul) — a rare steppe wildcat of the Khakas steppe"
industries:
  - "Aluminium smelting and non-ferrous metallurgy at Sayanogorsk"
  - "Coal mining (the Beysky and Chernogorsky basins)"
  - "Hydroelectric power — the Sayano-Shushenskaya and Main Sayan plants on the Yenisei"
  - "Agriculture and livestock — grain, dairy, and sheep-and-horse herding in the Minusinsk basin"
  - "Timber from the surrounding Sayan and Alatau forests"
sports:
  - "Khakas national wrestling (khuresh-style)"
  - "Horse racing and equestrian sports"
  - "Football"
  - "Freestyle wrestling and sambo"
religions:
  - name: Russian Orthodox Christianity
    percent: 31.6
    sourceId: arena-2012
  - name: Other Christian (unaffiliated)
    percent: 6.0
    sourceId: arena-2012
  - name: Other Orthodox
    percent: 1.4
    sourceId: arena-2012
  - name: Protestantism
    percent: 0.8
    sourceId: arena-2012
  - name: Tengrism / Khakas native faith (incl. Rodnovery)
    percent: 2.0
    sourceId: arena-2012
  - name: Islam
    percent: 0.6
    sourceId: arena-2012
  - name: Spiritual but not religious
    percent: 37.6
    sourceId: arena-2012
  - name: Atheism / irreligion
    percent: 15.8
    sourceId: arena-2012
  - name: Other / undeclared
    percent: 4.2
    sourceId: arena-2012
# Plurality finding (2012 Arena/Sreda survey): the single largest category is
# 'spiritual but not religious' (37.6%), but taken together the Christian rows
# (Orthodox 31.6% + other Christian 6% + other Orthodox 1.4% + Protestant 0.8%
# = ~39.8%) form the plurality confession, matching the country's Orthodox-leaning
# profile. So trigger 2 (differing plurality religion) does NOT fire cleanly for
# Khakassia; it is curated on trigger 1 (Khakas state language) and trigger 5
# (BSk steppe differs from the country's dominant Dfb/Dfc classes). This is an
# honest negative finding, not an assumed divergence.
traditionalDishes:
  - season: allYear
    items:
      - "Potkhy — the signature Khakas porridge of sour cream cooked with flour"
      - "Talgan — roasted and ground barley, a base for soups, porridges and sweets"
      - "Oreme — milk skin (cream layer from heated milk), often with crushed berries"
      - "Khansol — festive Khakas blood sausage boiled and served in slices"
  - season: winter
    items:
      - "Meat in winter — mutton and horsemeat broths and soups as the cold-season staple"
traditionalClothing:
  - season: allYear
    items:
      - "Modern dress; traditional felt, sheepskin and embroidered garments at festivals"
  - season: winter
    items:
      - "Sheepskin coats, felt boots and fur hats for the severe Khakas winter"
seasonCalendar:
  - season: winter
    months: [12, 1, 2]
  - season: spring
    months: [3, 4, 5]
  - season: summer
    months: [6, 7, 8]
  - season: autumn
    months: [9, 10, 11]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices typically run 09:00-18:00 Mon-Fri (Krasnoyarsk time, UTC+7)."
  lunchBreakTiming: "A ~1-hour lunch break around 13:00-14:00 is typical."
  notableShutdownPeriods:
    - period: "early January (1-8)"
      description: "New Year and Orthodox Christmas holidays — near-total shutdown, as across Russia."
    - period: "Day of the Republic of Khakassia (first Monday of July)"
      description: "The republic's main regional public holiday, marked in Abakan and across the region."
  notes: "Sunday is the standard rest day. The republic observes Russian federal holidays plus its own (Day of the Republic of Khakassia). Note the UTC+7 time zone (Krasnoyarsk time, MSK+4)."
sources:
  - id: arena-2012
    name: "ARENA Atlas: Religion in the federal subjects of Russia (Sreda / Public Opinion Foundation survey)"
    publisher: "Sreda (non-profit research service)"
    url: "https://sreda.org/en/opros/arena-reliz"
    year: 2012
    accessedDate: "2026-09-24"
    note: "Khakassia 2012: Russian Orthodoxy 31.6%; other Christian 6%; other Orthodox 1.4%; Protestant 0.8%; Tengrism/native faith 2%; Islam 0.6%; spiritual-but-not-religious 37.6%; atheist 15.8%; other/undeclared 4.2%. Basis for the religions rows; the combined Christian plurality vs. the country's profile means trigger 2 does not fire."
  - id: iso-kjh
    name: "ISO 639-3 entry: kjh — Khakas"
    publisher: "SIL International (ISO 639-3 Registration Authority)"
    url: "https://iso639-3.sil.org/code/kjh"
    year: 2026
    accessedDate: "2026-09-24"
    note: "Verifies kjh = Khakas, Individual, Living. Basis for the name.local kjh entry and Khakas's co-official status."
  - id: khakas-cuisine
    name: "Khakassian cuisine"
    publisher: "World Dishes (eng.world-dishes.com)"
    url: "https://eng.world-dishes.com/khakassian-cuisine"
    accessedDate: "2026-09-24"
    note: "Describes Khakassian dishes potkhy (sour-cream porridge), oramys, oreme, talgan (roasted barley), tamakh and blood sausage; basis for the traditionalDishes rows."
