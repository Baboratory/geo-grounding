culturalTraits:
  - "Russia's political, economic and cultural capital — the centre of finance, media and government"
  - "Fast-paced, professional and international business culture"
  - "World-class theatre, ballet and gallery scene (Bolshoi, Tretyakov, Garage)"
  - "Metro system famous for ornate 1930s-1950s stations (a city landmark in itself)"
prideOf:
  - "Metro architecture and scale (one of the world's most used rail systems)"
  - "Kremlin and Red Square as national symbols"
  - "Ballet, theatre and the arts"
  - "Economic dynamism and modern skylines (Moscow City business district)"
