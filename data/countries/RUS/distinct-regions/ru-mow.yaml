businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices typically run 9:00am-6:00pm; Moscow's business culture is bustling, with many people commuting via metro from across the metropolitan region."
  lunchBreakTiming: "A ~1-hour lunch around 1:00pm; business lunches are very common and often used for networking."
  notableShutdownPeriods:
    - period: early January
      description: "The New Year holiday window (1-8 January) sees most offices closed; much of the city rests, though retail and entertainment stay partly open."
  notes: "Sunday is the standard rest day for offices; shops, malls and eateries open daily, often late into the evening. City Day is celebrated in early September."
