legalConstraints:
  - topic: "personal data localization"
    description: "Operators collecting personal data of Russian citizens must store and process that data on servers physically located in the Russian Federation (the data-localization rule, Federal Law No. 242-FZ amending the Personal Data Law No. 152-FZ)."
    sourceId: ru-fz-242-2014
  - topic: "data protection regime"
    description: "Personal data processing requires a legal basis and registration; the Federal Service for Supervision of Communications, IT and Mass Media (Roskomnadzor) oversees compliance. Cross-border transfer of personal data is restricted to countries on an approved adequacy list."
    sourceId: ru-fz-152-2006
  - topic: "cash receipt obligation"
    description: "Online cash registers transmit every sale to the tax authority in real time; customers must be issued a paper or e-receipt for cash and card sales."
    sourceId: ru-fz-54-2003
  - topic: "consumer withdrawal right"
    description: "Consumers may return goods of adequate quality bought in a physical store within 14 days if not suitable in shape, size, colour or configuration (Russian Consumer Protection Law), and online/remote purchases under separate distance-selling rules."
    sourceId: ru-consumer-protection-law
  - topic: "price display"
    description: "Prices for goods and services must be displayed in Russian roubles, inclusive of VAT, and clearly visible; state-regulated prices apply to certain goods and services."
    sourceId: ru-consumer-protection-law
paymentMethodShares:
  - method: "cash"
    percent: 13.0
    sourceId: cb-russia-payments-2023
  - method: "bank card (incl. Mir, Visa, Mastercard)"
    percent: 68.0
    sourceId: cb-russia-payments-2023
  - method: "mobile payment / SBP (Fast Payments System)"
    percent: 15.0
    sourceId: cb-russia-payments-2023
  - method: "other (transfers, e-wallets)"
    percent: 4.0
    sourceId: cb-russia-payments-2023
paymentCulture:
  popularMethods:
    - "Mir card (national payment system, widely used domestically)"
    - "SBP / Fast Payments System (СБП) — QR and phone-number transfers, very common"
    - "Sberbank Online and other bank apps (~90%+ of card volume runs through Sberbank)"
  tipping:
    expected: false
    typicalAmount: "5-10%"
    autoIncludedInBill: false
    note: "Not compulsory; a discretionary 5-10% tip in restaurants and cafés is appreciated, and worth adding for good service. Some venues add a service charge for large groups."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Use the polite 'Вы' form with strangers, officials and in business; first names and the informal 'ты' are reserved for friends and colleagues once a relationship is established. Patronymics (name + father's given name) are commonly used with colleagues and acquaintances."
  greetingNorms: "Firm handshake on meeting and parting in business — often a single pump, direct eye contact. Among friends, men often shake hands (sometimes both hands), women greet with words or an embrace more than a kiss."
  meetingEtiquette: "Punctuality is expected, especially in business. Meetings begin with small talk and a degree of formality before business is discussed; hierarchy matters and the senior person typically leads. Decision-making can be slower and centralised, and direct eye contact signals sincerity."
  topicsToAvoid:
    - "Recent geopolitics and the war in Ukraine — sensitive and divisive; avoid unless the counterpart raises it"
    - "Domestic politics and criticism of the government"
    - "Ethnic and inter-republic tensions"
    - "Personal income, wealth and the cost of purchases"

    - "Religion, unless raised respectfully in context"
  giftGivingNotes: "A modest, good-quality gift is appreciated when a business relationship is established (not at a first meeting). Flowers are welcome but only in odd numbers (even numbers are for funerals); avoid yellow flowers as a romantic connotation is often read into them."
