# Classified federal: Russia is a federal state (Constitution Article 1) whose
# 83 ISO 3166-2 federal subjects (republics, krai, oblast, federal cities,
# autonomous okrug and autonomous oblast) vary enormously across ~11 time zones
# and dozens of official minority languages. Real ISO 3166-2 region files are
# curated (a representative subset) alongside the WHOLE fallback.
