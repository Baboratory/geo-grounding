sources:
  - id: rus-constitution-art68
    name: "Constitution of the Russian Federation, Article 68"
    publisher: "Government of the Russian Federation"
    url: "http://constitution.kremlin.ru/"
    year: 1993
    accessedDate: "2026-09-20"
    note: "Legal basis for Russian as the state language (Article 68.1) and for republics' right to establish their own state languages alongside Russian."
  - id: rus-census-2021
    name: "2021 All-Russian Population Census (Всероссийская перепись населения 2020/2021)"
    publisher: "Rosstat (Federal State Statistics Service)"
    url: "https://rosstat.gov.ru/vpn/2020"
    year: 2021
    accessedDate: "2026-09-20"
    note: "Ethnic composition (Russian 80.9%, Tatar 3.9%, Chechen 1.0%, Bashkir 1.1%, and other groups) and native-language shares. Percentages reflect the voluntary self-identification census; sums are approximate."
  - id: git-gallup-english
    name: "GFK-Gallup survey of English proficiency worldwide"
    publisher: "GfK / Gallup (global English index)"
    url: "https://www.ef.com/wwen/epi/"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Rough estimate of the share of Russians able to hold a conversation in English (~5%); English levels in Russia are moderate-to-low relative to northern Europe."
  - id: ru-fz-242-2014
    name: "Federal Law No. 242-FZ of 21 July 2014 (personal data localization)"
    publisher: "Government of the Russian Federation"
    url: "http://kremlin.ru/acts/bank/38759"
    year: 2014
    accessedDate: "2026-09-20"
    note: "Requires personal data of Russian citizens to be stored on servers physically located in Russia."
  - id: ru-fz-152-2006
    name: "Federal Law No. 152-FZ on Personal Data (as amended)"
    publisher: "Government of the Russian Federation"
    url: "http://kremlin.ru/acts/bank/24154"
    year: 2006
    accessedDate: "2026-09-20"
    note: "Core data-protection law; operator obligations, consent requirements, Roskomnadzor oversight and rules on cross-border transfer."
  - id: ru-fz-54-2003
    name: "Federal Law No. 54-FZ on the use of cash registers"
    publisher: "Government of the Russian Federation"
    url: "http://kremlin.ru/acts/bank/20085"
    year: 2003
    accessedDate: "2026-09-20"
    note: "Online cash-register (KKA) obligation and electronic receipt requirements for cash and card sales."
  - id: ru-consumer-protection-law
    name: "Law of the Russian Federation on Protection of Consumer Rights (as amended)"
    publisher: "Government of the Russian Federation"
    url: "https://rospotrebnadzor.ru/"
    year: 1992
    accessedDate: "2026-09-20"
    note: "Consumer guarantees, 14-day return right for goods of adequate quality, price-display (roubles, VAT-inclusive) and withdrawal rights."
  - id: cb-russia-payments-2023
    name: "Bank of Russia payment-infrastructure statistics (point-of-sale transaction shares, 2023)"
    publisher: "Bank of Russia (Центральный банк Российской Федерации)"
    url: "https://cbr.ru/statistics/psrf/"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Share of retail payments at the point of sale by method: bank cards ~68%, cash ~13%, SBP/mobile ~15%, other ~4%. Approximate national figures from central-bank payment statistics."
