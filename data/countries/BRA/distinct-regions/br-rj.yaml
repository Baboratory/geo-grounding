businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Roughly 09:00-18:00 Monday-Friday; beach culture spills into life and some meetings happen over lunch or coffee."
  lunchBreakTiming: "A long lunch is a Carioca institution; business over a feijoada or rodízio is common."
  notes: "Rio has the most relaxed, festive business culture of Brazil's big cities — warmth and relationships trump rigid punctuality. Public holidays and Carnaval (which happens here at its grandest) pause activity significantly."
