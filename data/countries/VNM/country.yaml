legalConstraints:
  - topic: "official language"
    description: "Article 5(3) of the Constitution of the Socialist Republic of Viet Nam (2013) states that the national language is Vietnamese, and that every ethnic group has the right to use its own spoken and written language, preserve its identity and promote its fine customs and traditions."
    sourceId: vn-constitution
  - topic: "data protection"
    description: "Vietnam's Personal Data Protection Decree (Decree No. 13/2023/ND-CP, effective 1 July 2023) is the country's first comprehensive personal-data-protection regulation, GDPR-inspired. It governs processing of personal data, requires consent, grants data-subject rights, and is overseen by the Ministry of Public Security, with administrative fines for violations."
    sourceId: pdpa-vn
  - topic: "value added tax (VAT) price display"
    description: "The VAT Law (Law No. 48/2024/QH15, in force 1 July 2025) sets rates of 0% (exports), 5% (essential goods) and a 10% standard rate; a temporary 2-point reduction to 8% applies to many goods and services through 31 December 2026 (Resolution 204/2025/QH15). Retail prices are generally displayed VAT-inclusive."
    sourceId: vat-vn
  - topic: "consumer protection"
    description: "Vietnam's Consumer Rights Protection Law (2010, amended 2023) protects consumers in transactions, covering product quality, information, contracts, return/redress rights, and is enforced by the Vietnam Competition and Consumer Authority."
    sourceId: crl-vn
paymentCulture:
  popularMethods:
    - "Bank transfers via NAPAS 247 — the national real-time interbank rail, the most common digital payment method"
    - "E-wallets — MoMo, ZaloPay, VNPay and ViettelPay are the dominant consumer wallets"
    - "Cash — still widely used, especially for small purchases and in rural areas"
    - "QR payments (VietQR) — accepted across banks and wallets at merchants nationwide"
  tipping:
    expected: false
    typicalAmount: "Not expected; tipping is uncommon in Vietnam, though a small gratuity is appreciated at upscale restaurants or for tour guides."
    autoIncludedInBill: false
    note: "Qualitative and customary. QR and e-wallet payments dominate in the cities."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Polite, indirect and relationship-driven. Respect for elders, seniority and titles is important, and direct confrontation or blunt criticism is avoided to preserve harmony (and 'face')."
  greetingNorms: "A soft handshake or a nod with a smile is standard; address people by their title plus given name, with age determining polite forms."
  meetingEtiquette: "Meetings open with introductions and small talk before business. Decisions are often consensus-based and hierarchical; defer to the most senior person present."
  topicsToAvoid:
    - "The Vietnam War / 'the American War' and contested recent political history"
    - "Chinese-Vietnamese relations and the South China Sea disputes"
    - "Domestic politics, religion and the party leadership"
  giftGivingNotes: "Small, thoughtful gifts are well received and often reciprocated; give and receive with both hands. Avoid clocks, white flowers and sharp objects as gifts."
