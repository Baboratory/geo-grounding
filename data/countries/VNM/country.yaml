alpha3: VNM
alpha2: VN
name:
  eng: Vietnam
  local:
    - languageCode: vie
      value: Việt Nam
flagEmoji: "🇻🇳"
capital: Hanoi
isSovereign: true
# Classified unitary-large: Vietnam's population (~96-100M, 2019 census 96.2M)
# is far above the small-state threshold, and although it is a unitary
# socialist republic with strong central control (per the 2013 Constitution),
# it has a genuine, widely recognised cultural-regional identity — the Red
# River Delta/North around Hanoi, the industrial South around Ho Chi Minh City
# and the Mekong Delta, and the central region around the former imperial
# capital of Huế — meeting 2 of the 3 DESIGN.md criteria. Curated regions map
# to real ISO 3166-2 subdivisions: Hanoi (VN-HN), Ho Chi Minh City (VN-SG),
# Da Nang (VN-DN, central), Huế/Thừa Thiên-Huế (VN-26) and Cần Thơ (VN-CT,
# Mekong Delta), plus the generic WHOLE fallback.
governanceType: unitary-large
iso3166_2_prefix: VN
hasSubdivisions: true
languageUsage:
  # Vietnamese is the official national language under Article 5 of the 2013
  # Constitution; the State ensures ethnic-minority languages are respected.
  # Official domain is a legal-status flag = 1.0.
  - languageCode: vie
    domain: official
    speakersShare: 1.0
    sourceId: vn-constitution
  # Vietnamese is the first/national language of essentially the whole
  # population (spoken by the ~86% Kinh majority and widely as a lingua
  # franca across minority groups).
  - languageCode: vie
    domain: locallySpoken
    speakersShare: 0.95
    sourceId: vn-census-2019
  # Khmer is spoken by the Khmer Krom minority in the Mekong Delta (~1.4M).
  - languageCode: khm
    domain: locallySpoken
    speakersShare: 0.01
    sourceId: vn-census-2019
  # English is the leading foreign language (education and business), though
  # fluency is concentrated in urban areas.
  - languageCode: eng
    domain: foreign
    speakersShare: 0.10
    sourceId: ef-vn
