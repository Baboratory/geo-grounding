code: VN-DN
name:
  eng: Da Nang (Central Coast)
  local:
    - languageCode: vie
      value: Đà Nẵng
climates:
  - koppenCode: Am
    description: "Tropical monsoon — warm and humid year-round; the central region receives heavy rainfall, especially September-November, with a drier period from January to August."
landmarks:
  - name: Marble Mountains
    description: "The cluster of five marble-and-limestone hills with caves, temples and pagodas south of the city."
  - name: Bà Nà Hills and the Golden Bridge
    description: "The mountaintop resort and its famed giant-hand Golden Bridge."
  - name: My Khe Beach
    description: "The long, sandy beach known for its gentle surf."
  - name: Museum of Cham Sculpture
    description: "The world's foremost collection of Champa sculpture."
culturalTraits:
  - "Vietnam's fast-growing central coastal hub, linking north and south"
  - "A modern, well-planned city famed for its bridges (the Dragon Bridge) and beachfront development"
  - "The gateway to Hội An, Huế and My Son Cham heritage"
prideOf:
  - "Its modern infrastructure, clean beaches and rapid urban development"
  - "Serving as the cultural bridge between the ancient Cham, Huế and Hội An heritage"
animals:
  popular:
    - "Marine life off the coast"
    - "Birds and monkeys in the nearby hills"
industries:
  - "Tourism and hospitality — a leading resort and conference destination"
  - "Logistics and the central port"
  - "High-tech and software parks"
sports:
  - "Beach sports and water activities on My Khe and Non Nuoc beaches"
  - "Football and a growing marathon culture"
religions:
