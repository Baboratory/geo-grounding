  local:
    - languageCode: vie
      value: Hà Nội
climates:
  - koppenCode: Cwa
    description: "Humid subtropical — four distinct seasons with cool winters (occasionally chilly, damp), hot humid summers, and pleasant spring and autumn."
landmarks:
  - name: Hoan Kiem Lake and Ngoc Son Temple
    description: "The historic heart of Hanoi, the legendary lake and its island temple."
  - name: Imperial Citadel of Thang Long
    description: "The royal citadel of successive dynasties, a UNESCO World Heritage Site in central Hanoi."
    unescoWorldHeritage: true
  - name: Ho Chi Minh Mausoleum
    description: "The memorial of Vietnam's founding leader on Ba Dinh Square."
  - name: Old Quarter
    description: "The 36 ancient streets of Hanoi's historic trading quarter."
culturalTraits:
  - "Vietnam's capital and political-cultural centre of the north"
  - "An elegant, older, more tradition-minded city than Ho Chi Minh City, famed for its lakes and French-colonial architecture"
  - "Home to the national universities, museums and the heart of Vietnamese literary pride"
prideOf:
  - "A thousand years of history (a millennial capital)"
  - "Its intellectual and political leadership role in Vietnam"
