code: VN-SG
name:
  eng: Ho Chi Minh City (South / Southeast)
  local:
    - languageCode: vie
      value: Thành phố Hồ Chí Minh
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry — hot and humid year-round with a distinct dry season (Dec-Apr) and heavy wet season (May-Nov)."
landmarks:
  - name: Notre-Dame Cathedral Basilica and Central Post Office
    description: "The iconic French-colonial landmarks on the city's central square."
  - name: Bến Thành Market
    description: "The bustling central market and symbol of the city."
  - name: Reunification Palace (Independence Palace)
    description: "The former presidential palace at the centre of the city's 1975 history."
  - name: Bitexco Financial Tower
    description: "The soaring skyscraper piercing the city skyline."
culturalTraits:
  - "Vietnam's economic engine — the largest city and commercial centre of the south"
  - "A young, fast-paced, entrepreneurial metropolis, formerly Saigon"
  - "Cosmopolitan, with a booming business scene and a dynamic food and nightlife culture"
prideOf:
  - "Being Vietnam's leading economic and financial hub"
  - "Its boundless energy, entrepreneurship and the resilience captured in its modern growth"
animals:
  popular:
    - "Monitor lizards and birds in the city's riverside parks"
    - "The many street dogs and city cats"
industries:
  - "Finance, banking and corporate headquarters"
  - "Manufacturing, electronics and apparel in the surrounding industrial zones"
  - "Trade, logistics, real estate and a fast-growing technology scene"
sports:
  - "Football — home to major clubs and the city's passionate fans"
  - "Fitness culture, basketball and the growing e-sports scene"
