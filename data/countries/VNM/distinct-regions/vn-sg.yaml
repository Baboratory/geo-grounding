  restDays:
    - sunday
  typicalWorkHours: "Roughly 08:00-17:30 Monday-Friday; many services open Saturday; a midday break is common."
  lunchBreakTiming: "A lunch break around 11:30-13:00; cơm tấm and street food at noon."
  notes: "The country's most dynamic business city. E-wallets, QR and bank transfers dominate; Tết still brings an annual two-week shutdown."
