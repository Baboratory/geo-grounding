  - season: allYear
    items:
      - "Cơm tấm (broken rice with grilled pork) — the Saigon specialty"
      - "Phở and bánh mì, plus the southern-style bún riêu and hủ tiếu"
      - "Chè (sweet desserts) and iced milk coffee"
traditionalClothing:
  - season: allYear
    items:
