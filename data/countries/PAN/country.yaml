  # Spanish is the sole de jure official national language and is spoken by the
  # vast majority. The indigenous languages below correspond to Panama's seven
  # officially recognised indigenous peoples (2023 census: 698,114 people,
  # 17.2% of the population); their share figures are approximate first-language
  # shares derived from census self-identification by language group. Ngäbere
  # (Ngäbe) is by far the largest (~64% of indigenous people), followed by
  # Guna, Emberá, Buglere, Woun Meu and Teribe. English is widely spoken as a
  # foreign language in the metropolitan / Canal / tourism zone (a legacy of
  # the US Canal era) and is deliberately listed as foreign rather than
  # official.
  - languageCode: eng
    domain: foreign
    speakersShare: 0.1
    sourceId: pan-inec-english
