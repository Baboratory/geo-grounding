sources:
  - id: pan-constitution
    name: "Constitución Política de la República de Panamá (Art. 123 comarcas indígenas; official language provisions)"
    publisher: "Asamblea Nacional de Panamá / Gobierno Nacional"
    url: "https://www.asamblea.gob.pa/assets/tmp/constitucion-politica-de-la-republica-de-panama-2020.pdf"
    year: 1972
    accessedDate: "2026-09-19"
    note: "Article 123 grounds the comarcas indígenas and indigenous self-governance; establishes Spanish as the national language and the bilingual-education mandate for indigenous languages. Basis for the unitary-large classification and the spa official row."
  - id: pan-inec-census
    name: "Censo Nacional de Población y Vivienda 2023 — identificación indígena, lengua, origen étnico"
    publisher: "Instituto Nacional de Estadística y Censo (INEC), Contraloría General de Panamá"
    url: "https://www.inec.gob.pa/"
    year: 2023
    accessedDate: "2026-09-19"
    note: "2023 census results: 698,114 indigenous people (17.2% of ~4.5M population) across seven recognised peoples; Ngäbe ~444,878, Guna ~112,319, Emberá ~51,657, Bugle ~24,488, Woun Meu ~10,634, Teribe/Naso ~6,899, Bribri ~799. Basis for ethnicGroups percentages and the approximate indigenous first-language locallySpoken shares."
  - id: pan-inec-english
    name: "English / bilingual usage in the metropolitan and canal zone (estimate)"
    publisher: "Composite estimate"
    url: "https://www.inec.gob.pa/"
    year: 2023
    accessedDate: "2026-09-19"
    note: "Panama does not publish a precise national English-fluency figure. English is widely spoken as a second/foreign language in Panama City, the Canal area and tourism centres (legacy of the US Canal era), so a directional ~10% foreign-domain estimate is asserted with no official census basis."
  - id: pan-currency-law
    name: "Decreto-Ley 9 de 1998 (Moneda y Banca) — prohíbe la emisión de papel moneda por un banco central; balboa at parity with the US dollar"
    publisher: "Superintendencia de Bancos de Panamá"
    url: "https://www.superbancos.gob.pa/en/laws/banking-law"
    year: 1998
    accessedDate: "2026-09-19"
    note: "Establishes the US-dollar-pegged monetary system: the balboa exists at 1:1 with the US dollar and no central bank or issuing institution may print local paper currency (US bills circulate as legal tender alongside balboa coins). Basis for the dollarization legal constraint and currency note."
  - id: pan-consumer-law
    name: "Ley 45 de 2007 (protección al consumidor) and Ley 56 de 2007 / ITBMS 7%"
    publisher: "Asamblea Nacional de Panamá; ACODECO"
    url: "https://www.sijusa.com/wp-content/uploads/2022/05/L_45_2007.pdf"
    year: 2007
    accessedDate: "2026-09-19"
    note: "Autoridad de Protección al Consumidor (ACODECO) law; ITBMS (Impuesto de Transferencia de Bienes y Servicios) standard rate is 7% in force since 1 July 2010. Basis for the consumer-protection/price-display legal constraint."
