name:
  eng: Panama
  local:
    - languageCode: spa
      value: República de Panamá
flagEmoji: "🇵🇦"
capital: Panama City (Ciudad de Panamá)
isSovereign: true
# Classified unitary-large: Panama is a unitary republic of ~4.5M (2023 census)
# that is nonetheless clearly region-bearing under the DESIGN.md 2-of-3 test.
# (1) Its constitution (Constitución Política, Art. 123) and organic comarca
# laws formally recognise indigenous self-governing territories — six comarcas
# indígenas (Guna Yala 1938, Emberá-Wounaan 1983, Guna de Madugandí 1996,
# Ngäbe-Buglé 1997, Guna de Wargandí 2000, Naso Tjër Di 2020) covering
# ~1.7M hectares — with their own congresses and customary governance, and the
# constitutional bilingual-education mandate for their languages. (2) Those
# territories hold officially recognised regional indigenous languages (Guna,
# Ngäbere, Buglere, Emberá, Woun Meu, Teribe). (3) There is a genuine, widely
# recognised cultural divide between the metropolitan transit corridor
# (Panama City + the Canal, modern, Spanish-speaking, dollarized) and the
# indigenous comarcas and the rural interior (agricultural, indigenous and
# campesino culture). ~17.2% of the population self-identified as indigenous in
# the 2023 census. Curated regions (metropolitan Canal corridor, Ngäbe-Buglé,
# Guna Yala, eastern indigenous Emberá-Wounaan / Darién) sit alongside the
# generic WHOLE fallback.
governanceType: unitary-large
iso3166_2_prefix: "PA"
hasSubdivisions: true
