# Self-identification in the 2023 national census (INEC): ~65% mestizo, ~17.2%
# indigenous (698,114 people across seven recognised peoples), ~9.2% Black /
# Afro-Panamanian, ~6.7% white, remainder other. Figures are approximate
# self-identification results and do not sum exactly.
timezones:
  - name: America/Panama
    standardUtcOffset: "UTC-5"
    observesDst: false
currency:
  code: PAB
  symbol: "B/."
  name: Panamanian balboa (PAB; US dollar circulates as legal tender at parity)
legalConstraints:
  - topic: "US-dollarized economy (no central bank issuing local currency)"
    description: "The Panamanian balboa exists at parity 1:1 with the US dollar; Panama has no central bank that issues its own paper currency, and US banknotes circulate as legal tender alongside balboa coins (Constitution and Monetary and Banking Law Decree-Law 9 of 1998, which also prohibits the creation of a central issuing bank). Dollarized prices, US-currency transactions and US-regulated dollar rails dominate."
    sourceId: pan-currency-law
  - topic: "consumer protection and price display"
    description: "Ley 45 de 2007 (Decreto 9) protects consumers; the ITBMS sales/transfer tax is 7% (Ley 56 de 2007 established the 7% rate in force since 1 July 2010). Displayed prices may or may not include ITBMS — verify at point of sale. ACODECO (Autoridad de Protección al Consumidor y Defensa de la Competencia) enforces consumer rights."
    sourceId: pan-consumer-law
  - topic: "national official language: Spanish"
    description: "Spanish is the official national language of Panama; state and public activity is conducted in Spanish. Indigenous comarcas additionally recognise their own languages within their territories under the constitutional bilingual-education mandate (Constitución Política Art. 123)."
    sourceId: pan-constitution
paymentCulture:
  popularMethods:
    - "Cash and US-dollar bills — dominant in everyday retail, especially outside the metropolitan area"
    - "Debit and credit cards (Visa/Mastercard) — widely accepted in modern urban retail, tourism and the Canal/service economy"
    - "Mobile / QR app payments — Yappy (BAC's mobile wallet), Sinpe Móvil-style bank transfers and other neobank apps growing quickly"
    - "ACH / electronic transfers ('Transferencias') — standard for larger-value and institutional payments"
  tipping:
    expected: true
    typicalAmount: "Around 10% in restaurants when no service charge is added; small change for bars and taxis"
    autoIncludedInBill: false
    note: "Panama's economy is fully dollarized (balboa coins + US bills, no central bank issuing local paper), so cash is US dollars and prices are set in dollars. A ~10% restaurant tip is customary and appreciated, and a small tip for luggage/guides is common; many bills do not auto-include a service charge. Digital payments (bank 'Transferencias', the Yappy mobile wallet, cards) are expanding quickly, but cash remains the everyday norm outside the metropolitan corridor."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Polite and warm; use the formal 'usted' at first contact and address people by title where relevant, warming to first names once the relationship is established."
  greetingNorms: "A handshake on meeting, a friendly '¿Cómo está?'; among friends a light hug or cheek kiss on greeting is common. A greeting in Spanish is expected; a brief phrase in Guna, Ngäbere or Emberá is warmly received in the comarcas."
  meetingEtiquette: "Punctuality is more relaxed than in northern Europe; building personal trust and rapport matters. Meetings often begin with social talk. Be mindful of the strong metropolitan-vs-interior and comarca cultural differences, and of the canal/transit identity."
  topicsToAvoid:
    - "Casual dismissal of indigenous peoples or the comarca autonomy"
    - "Treating Panama as merely 'the canal' or US territory rather than an independent, sovereign republic"
  giftGivingNotes: "Gifts are not expected at business meetings; when invited to a home, a small gift (wine, sweets, flowers) is appreciated. In indigenous comarca contexts, respect, reciprocity and cultural courtesy matter more than material gifts."
