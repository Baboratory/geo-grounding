code: WHOLE
name:
  eng: Israel
  local:
    - languageCode: heb
      value: ישראל
climates:
  - koppenCode: Csa
    description: Hot-summer Mediterranean climate along the coastal plain and in central/northern regions — long dry hot summers and mild, wet winters (the rainy season runs roughly November to March).
  - koppenCode: BWh
    description: Hot desert (arid) climate in the Negev desert and around the Dead Sea/Eilat region — very hot dry summers, mild winters, minimal rainfall.
landmarks:
  - name: Old City of Jerusalem and its Walls
    description: UNESCO World Heritage Site (1981) holy to Judaism, Christianity and Islam, containing the Western Wall, the Dome of the Rock and the Church of the Holy Sepulchre among some 220 historic monuments.
    unescoWorldHeritage: true
  - name: Masada
    description: Rugged natural fortress above the Dead Sea where Jewish rebels made their last stand against the Romans in 73 CE; retains the most complete Roman siege works surviving today; inscribed 2001.
    unescoWorldHeritage: true
  - name: White City of Tel Aviv
    description: The Modern Movement urban ensemble of Tel Aviv (Bauhaus architecture, 1930s-1950s), inscribed 2003 and one of the world's largest concentrations of International Style buildings.
    unescoWorldHeritage: true
culturalTraits:
  - "Directness and candor ('dugri' culture)"
  - "Informality and egalitarianism (first names, casual dress)"
  - "Strong family and community orientation"
  - "Entrepreneurial, innovation-driven 'Start-Up Nation' ethos"
  - "Prominent food and cafe culture (hummus, shakshuka, shawarma, fresh markets)"
  - "Religious and cultural pluralism and diversity"
  - "Resilience and resourcefulness ('chutzpah')"
prideOf:
  - "Hi-tech and cybersecurity leadership (the 'Start-Up Nation')"
  - "The city of Jerusalem and Jewish heritage"
  - "The Israel Defense Forces (IDF)"
  - "Agricultural innovation and 'making the desert bloom'"
  - "The Dead Sea and natural landmarks"
  - "Olympic and international sporting achievements"
  - "Israeli cuisine and food culture"
animals:
  popular:
    - Dogs (very popular household pets)
    - Cats (large feral cat population in cities)
    - Hoopoe (national bird of Israel)
    - Nubian ibex (iconic desert mountain goat)
    - Goats and sheep (pastoral heritage)
  unique:
    - Nubian ibex (Dead Sea/Judean desert)
    - Dorcas gazelle
    - Caracal (desert lynx)
    - Rock hyrax
    - Hoopoe (state bird)
    - Palestine sunbird and other desert-adapted species
industries:
  - High-tech, software and startups
  - Cybersecurity
  - Advanced agriculture and drip-irrigation technology
  - Pharmaceuticals and life sciences
  - Defense and aerospace
  - Diamond cutting and polishing
  - Tourism
  - Renewable energy and innovation
sports:
  - Association football (soccer)
  - Basketball (notably Maccabi Tel Aviv in European competitions)
  - Tennis
  - Olympic sports (sailing, judo, gymnastics, taekwondo)
  - Marathon and endurance running
  - Skiing/ice sports via the Canada Centre (recreational)
