businessRhythm:
  restDays:
    - saturday
  notes: "The Israeli working week runs Sunday through Thursday (Sunday is a full workday). Friday is typically a short day, and much of the country closes from Friday afternoon through Saturday night for Shabbat, when most public transport stops. The autumn High Holiday cluster (Rosh Hashanah, Yom Kippur, Sukkot) produces many short weeks. Payments and most businesses resume on Saturday night/Sunday."
  typicalWorkHours: "About 08:00/09:00 to 17:00/18:00, Sunday-Thursday; the statutory week is 42 hours and many salaried workers log closer to 45."
sources:
