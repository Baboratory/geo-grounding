  name: Ghanaian cedi
legalConstraints:
  - topic: "official language"
    description: "The Constitution of Ghana (1992) sets English as the de jure official language of the State and the language of law and administration. Article 39 commits the State to fostering the development of Ghanaian languages and culture; the Bureau of Ghana Languages (BGL) sponsors nine government languages (Akan/Twi-Fante, Ewe, Ga, Dagbani, Nzema, Gonja, Kasem, Dagaare, plus English) used in media, education and national communication."
    sourceId: constitution-1992
  - topic: "national currency / legal tender"
    description: "The Ghana cedi (GHS, symbol '₵', divided into 100 pesewas) is the national currency and legal tender. It was redenominated on 1 July 2007, replacing the old cedi (GHC) at a ratio of 1 new cedi = 10,000 old cedis. The Bank of Ghana (BoG) is the sole issuer of banknotes and coins."
    sourceId: bank-of-ghana
  - topic: "religion data collection"
    description: "Ghana is one of the most religiously observant countries in the world. Religion is recorded in the national census (the 2021 PHC recorded Christian ~71.2%, Muslim ~19.9%, traditionalist ~3.2%, no religion ~5.2%). Religion figures here are census-based shares, not survey estimates, but like all self-reported identity data should be treated as approximate."
    sourceId: gss-census-2021
paymentCulture:
  popularMethods:
    - "Cash — still widely used across market stalls and the informal/mass economy"
    - "Mobile Money (MTN MoMo, Telecel Cash, AirtelTigo Money) — the dominant digital payment rail; Ghana is one of Africa's leading mobile-money markets, widely used even for small retail transactions"
    - "Visa and Mastercard debit/credit cards — no domestic card scheme of its own"
    - "Bank transfers / interbank electronic funds transfer (including the national e-zwich and GhIPSS interbank rails)"
  tipping:
    expected: false
    typicalAmount: "Not strongly expected; a modest tip (rounding up, or 5-10%) is appreciated in nicer restaurants and for hotel staff, but there is no entrenched percentage norm."
    autoIncludedInBill: false
    note: "Customary and informal. Tipping is not obligatory in Ghana; service charges or 10% are sometimes added in upscale hotels/restaurants. Mobile-money 'zap' transfers are ubiquitous for peer payments."
communicationStyle:
  contextLevel: mixed
  formalityNorms: "Warm, respectful and communal. Elders are addressed with deference and titles (Mr/Mrs/Madam, or chiefly/religious titles); in English-medium business use professional courtesy. First names arrive quickly with goodwill, but always acknowledge age and seniority first."
  greetingNorms: "A warm handshake and inquiry after the other's wellbeing is the norm; the Akan greeting 'Akwaaba' (welcome) reflects deep hospitality. In the north a subtle bow or respect for elders is common. Greetings are unhurried — never rush past pleasantries."
  meetingEtiquette: "Meetings open with small talk and pleasantries before business; decisions often flow through relationships and respect for elders/senior figures. Punctuality is valued in formal business but 'Ghana time' (relaxed timing) is common socially — arrive on time, be patient with hosts."
  topicsToAvoid:
    - "Religion and politics — both deeply felt; avoid casual stereotyping or criticism"
    - "Ethnic/tribal tensions and stereotyping — sensitive"
    - "Direct public criticism of traditional authorities (chiefs) or the government"
    - "Corruption and personal wealth display"
  giftGivingNotes: "Not required at first business meetings. When visiting a home, a modest gift (fruit, biscuits, soft drinks) is warmly appreciated. Gifts of cloth are culturally meaningful; avoid anything that could be read as a bribe in a public-sector context."
