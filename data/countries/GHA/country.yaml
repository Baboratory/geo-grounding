sources:
  - id: gss-census-2021
    name: "Ghana 2021 Population and Housing Census (PHC) — General Report"
    publisher: "Ghana Statistical Service (GSS)"
    url: "https://census2021.statsghana.gov.gh/"
    year: 2021
    accessedDate: "2026-09-19"
    note: "Population ~30.8 million at the 2021 census. Religion shares (Christian ~71.2%, Muslim ~19.9%, traditionalist ~3.2%, no religion ~5.2%) and the ethnic-composition base relayed in the CIA World Factbook."
  - id: cia-wfb-ghana
    name: "Ghana — The World Factbook"
    publisher: "Central Intelligence Agency (CIA)"
    url: "https://www.cia.gov/the-world-factbook/countries/ghana/"
    year: 2024
    accessedDate: "2026-09-19"
    note: "2024 population estimate ~34.4 million. 2021-census ethnic composition: Akan 45.7%, Mole-Dagbani 18.5%, Ewe 12.8%, Ga-Dangme 7.1%, Gurma 6.4%, Guan 3.2%, Grusi 2.6%, Mande 2.0%, other 1.7%. Basis of ethnicGroups rows."
  - id: constitution-1992
    name: "Constitution of the Republic of Ghana, 1992 (Ch. 1 Arts. 11, 39)"
    publisher: "Government of Ghana"
    url: "https://www.wipo.int/wipolex/en/legislation/details/21218"
    year: 1992
    accessedDate: "2026-09-19"
    note: "Establishes English as the official language of the State; Article 39 directs the State to foster the development of Ghanaian languages and cultural values. Basis of the 'official language' legal constraint and the English official row."
  - id: bureau-ghana-languages
    name: "Bureau of Ghana Languages — Sponsored Government Languages"
    publisher: "Government of Ghana, Bureau of Ghana Languages"
    url: "https://www.bgl.gov.gh/"
    year: 2021
    accessedDate: "2026-09-19"
    note: "BGL sponsors English plus nine Ghanaian government languages (Akan/Twi-Fante aka, Ewe, Ga-Dangme, Dagbani, Nzema, Gonja, Kasem, Dagaare and others) as national languages of publicity, media and culture. Basis of the official-domain rows for aka/ewe/gaa/dag/nzi/gjn/xsm/dga."
  - id: composite-estimate
    name: "Composite estimate — Ghanaian language usage shares"
    publisher: "Composite estimate"
    url: "https://www.ethnologue.com/country/GH/"
    year: 2025
    accessedDate: "2026-09-19"
    note: "FLAGGED as estimates. Mother-tongue/L1 shares approximated from the 2021 census and Ethnologue (Ghana): Akan ~45%, Ewe ~13%, Ga ~4%, Dagbani ~4%, Nzema ~2%, Dagaare ~1%, Kasem ~1%, Gonja ~1%; English is spoken as a first or second language by a large share (here ~55%). Approximate, not census-precise."
  - id: bank-of-ghana
    name: "Bank of Ghana — Ghana Cedi (GHS) legal tender and redenomination"
    publisher: "Bank of Ghana"
    url: "https://www.bog.gov.gh/"
    year: 2017
    accessedDate: "2026-09-19"
    note: "The Ghana cedi (GHS, symbol '₵', 100 pesewas) is legal tender; redenominated 1 July 2007 (1 new = 10,000 old cedis). Basis of the currency object and the legal-tender constraint."
  - id: iana-ghana-time
    name: "IANA Time Zone Database — Africa/Accra"
    publisher: "Internet Assigned Numbers Authority (IANA)"
    url: "https://www.iana.org/time-zones"
    year: 2024
    accessedDate: "2026-09-19"
    note: "Africa/Accra = UTC+0, no daylight saving time observed; the sole timezone for Ghana."
