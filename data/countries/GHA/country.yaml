isSovereign: true
# Classified unitary-large: Ghana satisfies all three DESIGN.md criteria for a
# large-than-small unitary state. (1) Population ~30.8M (2021 census) to ~34M
# (2024 UN/CIA estimate) — comfortably above the >20-25M threshold. (2) Beyond
# de jure official English, the Constitution of 1992 (Article 39) commits the
# State to fostering Ghanaian languages, and the Bureau of Ghana Languages
# (BGL) sponsors nine government languages as national vehicles of
# communication/culture (Akan/Twi-Fante aka, Ewe ewe, Ga-Dangme gaa, Dagbani
# dag, Nzema nzi, Gonja gjn, Kasem xsm, Dagaare dga, plus English) — an
# officially recognized national-language regime. (3) A widely recognized
# cultural-historical regional divide: the Ashanti/Asante kingdom (forest
# south), the Northern territories (Sahel savanna, Dagbon kingdom) and the
# Volta/Ewe belt (former German/British Togoland trust territory, joined
# Ghana by the 1956 plebiscite). The state is constitutionally unitary (16
# regions, 261 districts) so NOT federal.
# Curated regions: Ashanti (GH-AH, Akan Asante heartland/Kumasi), Northern
# (GH-NP, Dagbani savanna/Tamale), Volta (GH-TV, Ewe/Togoland heritage/Ho) +
# the mandatory generic WHOLE fallback.
governanceType: unitary-large
iso3166_2_prefix: "GH"
hasSubdivisions: true
languageUsage:
  # English is the sole de jure official language (Const. 1992, Art. 11 /
  # Ch.1); Akan, Ewe, Ga, Dagbani, Nzema, Gonja, Kasem and Dagaare are
  # constitutionally fostered / government-sponsored national languages
  # (Bureau of Ghana Languages) -- promoted, not legally official, so they
  # are captured below via their locallySpoken shares only, not an
  # 'official' row (matching the dataset's FRA precedent for
  # recognized-but-not-official regional languages).
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: constitution-1992
  # Actual L1 (mother-tongue) usage shares — approximate, composite estimates
  # drawn from the 2021 census and Ethnologue. They need not sum to 1.
  - languageCode: aka
    domain: locallySpoken
    speakersShare: 0.45
    sourceId: composite-estimate
  - languageCode: ewe
    domain: locallySpoken
    speakersShare: 0.13
    sourceId: composite-estimate
  - languageCode: gaa
    domain: locallySpoken
    speakersShare: 0.04
    sourceId: composite-estimate
  - languageCode: dag
    domain: locallySpoken
    speakersShare: 0.04
    sourceId: composite-estimate
  - languageCode: nzi
    domain: locallySpoken
    speakersShare: 0.02
    sourceId: composite-estimate
  - languageCode: dga
    domain: locallySpoken
    speakersShare: 0.01
    sourceId: composite-estimate
  - languageCode: xsm
    domain: locallySpoken
    speakersShare: 0.01
    sourceId: composite-estimate
  - languageCode: gjn
    domain: locallySpoken
    speakersShare: 0.01
    sourceId: composite-estimate
  # English, while official, is also the de facto national working language
  # spoken by a large share of the population as a second language.
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.55
    sourceId: composite-estimate
