code: TH-83
name:
  eng: Phuket (Andaman South)
  local:
    - languageCode: sou
      value: ภูเก็ต
climates:
  - koppenCode: Am
    description: "Tropical monsoon — warm year-round with very heavy rains in the wet season (May-Oct); the southwest monsoon brings the strongest storms."
landmarks:
  - name: Patong Beach
    description: "Phuket's most famous beach and the centre of its beach-nightlife tourism."
  - name: Big Buddha Phuket
    description: "The towering white marble Buddha statue on Nakkerd Hill, with panoramic island views."
  - name: Old Phuket Town
    description: "Sino-Portuguese shophouses and heritage quarter reflecting the tin-mining past."
  - name: James Bond Island (Phang Nga Bay)
    description: "The famous limestone karst islet made iconic by the 1974 Bond film."
culturalTraits:
  - "Thailand's premier beach-and-island resort destination"
  - "A culturally mixed history — Chinese, Malay and Portuguese influences from the tin-trade era"
  - "Southern Thai character with a devout Buddhist-majority population and a coastal, seafaring way of life"
prideOf:
  - "Its world-famous beaches and the Andaman Sea"
  - "The Sino-Portuguese heritage of Old Phuket Town"
animals:
  popular:
    - "Asian elephants at ethical sanctuaries"
    - "Sea turtles nesting on the Andaman beaches"
  unique:
    - "Dugong and Irrawaddy dolphins in the surrounding seas"
industries:
  - "Tourism — the economic backbone, from beach resorts to diving and yachting"
  - "Fisheries and seafood processing"
  - "Real estate and hospitality development"
sports:
  - "Diving and snorkelling in the Similan and Phi Phi waters"
  - "Muay Thai camps and fitness tourism"
  - "Sailing and island-hopping"
