  - season: wet
    months: [5, 6, 7, 8, 9, 10]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Roughly 09:00-18:00 Monday-Friday; the central business district runs on western hours but many services open Saturday."
  lunchBreakTiming: "A lunch break around noon; food courts and street food dominate."
  notes: "Traffic is notoriously heavy — the BTS Skytrain and MRT are the practical ways to move. PromptPay and cards dominate."
