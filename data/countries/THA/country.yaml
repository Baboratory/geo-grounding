    adminUnitCodes: [TH-94]
sources:
  - id: th-constitution
    name: "Thailand's National Language Policy (approved 2010, drafted by the Royal Institute of Thailand)"
    publisher: "The Nation Thailand (news coverage of the policy; corrected from the PR's original citation, which misattributed Section 43 of the 2017 Constitution — a community-rights clause, not a language provision)"
    url: "https://www.nationthailand.com/perspective/30219853"
    year: 2010
    accessedDate: "2026-09-21"
    note: "Thai as the official national language; support for local languages."
  - id: nso-2010
    name: "The 2010 Population and Housing Census (National Statistical Office of Thailand)"
    publisher: "National Statistical Office of Thailand (NSO)"
    url: "https://www.nso.go.th/nsoweb/index?set_lang=en"
    year: 2010
    accessedDate: "2026-09-21"
    note: "Ethnicity classified as ~95.9% Thai; language spoken at home figures (Central Thai ~34%, Isan/Lao ~25%, Northern Thai ~10%, Southern Thai ~7.5%, Pattani Malay ~2%)."
  - id: ef-eng
