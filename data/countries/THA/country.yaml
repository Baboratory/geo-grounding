alpha3: THA
alpha2: TH
name:
  eng: Thailand
  local:
    - languageCode: tha
      value: ประเทศไทย
flagEmoji: "🇹🇭"
capital: Bangkok
isSovereign: true
# Classified unitary-large: Thailand's population (~65-70M, 2010 census ~66.0M)
# is far above the ~20-25M small-state threshold, it is a unitary state (a
# constitutional monarchy with strong central government under the 2017
# Constitution), and it has a genuine, widely recognised regional cultural
# mosaic — Central/Siamese plain, Northern Lanna, the Northeastern Isan
# region (with its Lao-dialect speech), and the Malay-Muslim Deep South —
# meeting 2 of the 3 DESIGN.md criteria. Curated regions map to real ISO
# 3166-2 provinces: Bangkok (TH-10), Chiang Mai (TH-50, Lanna north),
# Khon Kaen (TH-40, Isan northeast), Phuket (TH-83, Andaman south) and
# Pattani (TH-94, Malay-Muslim Deep South), plus the generic WHOLE fallback.
governanceType: unitary-large
iso3166_2_prefix: TH
hasSubdivisions: true
languageUsage:
  # Thai is the de facto national/official language. No provision of the 2017
  # Constitution establishes an official language; the basis is the National
  # Language Policy (approved 2010, drafted by the Royal Institute of
  # Thailand). Official domain is a legal-status flag = 1.0.
  - languageCode: tha
    domain: official
    speakersShare: 1.0
    sourceId: th-constitution
  # Regional/local spoken languages (census-based estimate, shares as first
  # language). Central Thai ~34%, Thai Isan/Lao ~25%, Northern Thai ~10%,
  # Southern Thai ~7.5%, Pattani Malay ~2% — recognised Tai and Malay languages
  # commonly spoken in their respective regions.
  - languageCode: tha
    domain: locallySpoken
    speakersShare: 0.34
    sourceId: nso-2010
  - languageCode: tts
    domain: locallySpoken
    speakersShare: 0.25
    sourceId: nso-2010
  - languageCode: nod
    domain: locallySpoken
    speakersShare: 0.10
    sourceId: nso-2010
  - languageCode: sou
    domain: locallySpoken
    speakersShare: 0.075
    sourceId: nso-2010
  - languageCode: mfa
    domain: locallySpoken
    speakersShare: 0.02
    sourceId: nso-2010
  # English is the principal foreign language (widely used in tourism,
  # business and education, though fluency is concentrated in urban areas).
  - languageCode: eng
    domain: foreign
    speakersShare: 0.20
    sourceId: ef-eng
ethnicGroups:
  # 2010 population census classified ~95% of the population as "Thai" by
  # ethnicity; the census records ethnicity as one category, so sub-Thai
  # divisions (Sino-Thai, regional Thai) are estimates from academic sources.
  - group: Thai (including regional Thai and Sino-Thai)
    percent: 95.9
    sourceId: nso-2010
  - group: Burmese and other migrant communities
    percent: 2.0
    sourceId: nso-2010
  - group: Other (including Malay-Muslim, Khmer, Karen, Hmong and other highland groups)
    percent: 2.1
    sourceId: nso-2010
# religions intentionally left in the WHOLE region file (percent figures with
# source) rather than repeated here, per dataset convention of keeping
# regional religious composition in the region files.
timezones:
  - name: Asia/Bangkok
    standardUtcOffset: "UTC+7"
    observesDst: false
currency:
  code: THB
  symbol: "฿"
  name: Thai baht
legalConstraints:
  - topic: "official language"
    description: "Thailand has no constitutional official-language clause; Section 43 of the 2017 Constitution is a community-rights provision, not a language provision. Thai's status as the national/official language rests on the National Language Policy approved by the Cabinet in 2010, drafted by the Royal Institute of Thailand, which reaffirms Thai as the national language while the State supports local languages."
    sourceId: th-constitution
  - topic: "data protection"
    description: "The Personal Data Protection Act B.E. 2562 (2019), fully in force since June 2022, is Thailand's first consolidated data-protection law. Modeled on the EU GDPR, it governs collection, use and disclosure of personal data, grants data-subject rights (access, correction, erasure), requires consent for most processing, has extraterritorial reach, and imposes administrative fines of up to THB 5 million plus criminal penalties for non-compliance."
    sourceId: pdpa-2019
  - topic: "value added tax (VAT) price display"
    description: "VAT is 7% (a Royal Decree has maintained this reduced rate effective since October 2017, most recently extended; the statutory headline rate is 10%). Standard goods and services carry 7%; exports and certain international services are zero-rated. Retail prices are customarily displayed VAT-inclusive."
    sourceId: rd-vat
  - topic: "consumer protection"
    description: "Consumer protection is governed by the Consumer Protection Act B.E. 2522 (1979), amended by B.E. 2541 (1998) and later revisions, administered by the Office of the Consumer Protection Board. It covers quality of goods and services, contract terms, labelling and redress."
    sourceId: ocpb-act
paymentCulture:
  popularMethods:
    - "PromptPay — the national account-to-account real-time transfer rail (Bank of Thailand) used for instant payments via QR, phone number or national ID; the single most common digital payment method"
    - "Cash — still widely used, especially for small daily purchases (Thai consumers historically among APAC's highest cash users)"
    - "Bank cards (Visa/Mastercard) — accepted in larger retailers, hotels and online"
    - "E-wallets (e.g. TrueMoney) and mobile banking apps — widely used for transfers and in-app payments"
  tipping:
    expected: false
    typicalAmount: "Not expected. Small change left at upscale restaurants or a tip for hotel staff and guides is appreciated but optional."
    autoIncludedInBill: false
    note: "Qualitative and customary. PromptPay QR is ubiquitous at shops, markets and street stalls."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Very polite, hierarchy-conscious and non-confrontational. Respect for seniority, titles and the monarchy matters deeply, and public criticism of the royal family is legally restricted."
  greetingNorms: "The wai (palms pressed together) is the traditional greeting; a light wai or a smile is expected. Physical contact and public confrontation are avoided."
  meetingEtiquette: "Meetings open with the wai and friendly small talk; business is conducted calmly and never by confrontation. Saving face is paramount, so problems are raised indirectly."
  topicsToAvoid:
    - "The royal family and criticism of the monarchy"
    - "Thai politics and the deep-South conflict"
    - "Anything that could cause loss of face to your counterpart"
  giftGivingNotes: "Small thoughtful gifts are well received; avoid giving with the left hand and present/receive with both hands."
