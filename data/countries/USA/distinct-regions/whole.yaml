# Generic country-wide fallback content for the United States (federal with a
# curated subset of states). National-level coverage not specific to any one
# state or the user's detected subdivision.
climates:
  - koppenCode: Dfa
    description: "Hot-summer humid continental climate across the Midwest and Northeast, with warm humid summers and cold winters."
  - koppenCode: Cfa
    description: "Humid subtropical climate across the Southeast and Gulf coast, hot humid summers and mild winters."
  - koppenCode: BSk
    description: "Semi-arid steppe climate across the Great Plains and parts of the Southwest, hot dry summers and cold winters."
  - koppenCode: Csa/Csb
    description: "Mediterranean climates along the California coast, dry mild winters and warm dry summers."
  - koppenCode: Dfc
    description: "Subarctic climate across Alaska, short cool summers and long cold winters."
landmarks:
  - name: Statue of Liberty
    description: "The iconic liberty figure on Liberty Island in New York Harbor, a UNESCO World Heritage Site and global symbol of freedom."
    unescoWorldHeritage: true
  - name: Grand Canyon National Park
    description: "The vast canyon carved by the Colorado River in Arizona, a UNESCO World Heritage Site and one of the wonders of the world."
    unescoWorldHeritage: true
  - name: Yellowstone National Park
    description: "The world's first national park, spanning Wyoming-Montana-Idaho, famed for geysers (Old Faithful) and wildlife, a UNESCO World Heritage Site."
    unescoWorldHeritage: true
  - name: Golden Gate Bridge
    description: "The famous art-deco suspension bridge spanning San Francisco Bay."
  - name: National Mall and the Lincoln Memorial (Washington, D.C.)
    description: "The capital's monumental core, site of memorials, museums and the Smithsonian."
  - name: Mount Rushmore
    description: "The sculpted faces of four presidents in the Black Hills of South Dakota."
