climates:
  - koppenCode: Cfb
    description: "Maritime/temperate climate west of the Cascades (Seattle), mild, cloudy and rainy, with cool summers."
  - koppenCode: BSk
    description: "Semi-arid steppe climate east of the Cascades, with hot summers, cold winters and low rain."
landmarks:
  - name: Space Needle and Seattle Center
    description: "The 1962 World's Fair tower, Seattle's skyline icon."
  - name: Pike Place Market
    description: "Seattle's historic public market and the original Starbucks, famous for its fish-tossing vendors."
  - name: Olympic National Park
    description: "The rainforests, mountains and coast of the Olympic Peninsula, a UNESCO World Heritage Site."
    unescoWorldHeritage: true
  - name: Mount Rainier
    description: "The towering snow-capped stratovolcano of the Cascades, the state's most iconic peak."
  - name: Mount St. Helens
    description: "The volcano that erupted in 1980, now a national volcanic monument."
culturalTraits:
  - "The Pacific Northwest's technology and coffee capital (Seattle is home to Amazon and Microsoft)"
  - "A green, outdoorsy, progressive culture set among mountains, forests and water"
  - "Known for coffee shops, grunge music and the great outdoors"
prideOf:
  - "Tech innovation, coffee culture and the laid-back Seattle vibe"
  - "The unmatched natural beauty of the Pacific Northwest"
  - "A sustainability- and outdoors-focused way of life"
animals:
  popular:
    - "Orca (killer whale, in Puget Sound)"
    - "Bald eagle"
  unique:
    - "Pacific salmon (chinook, coho and sockeye, which return to Northwest rivers in seasonal runs to spawn)"
    - "The Olympic marmot (endemic to Olympic National Park)"
industries:
