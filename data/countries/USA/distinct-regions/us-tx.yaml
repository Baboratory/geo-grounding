climates:
  - koppenCode: Cfa
    description: "Humid subtropical climate across most of the state (Houston, Dallas), with hot humid summers and mild winters."
  - koppenCode: BSh
    description: "Hot semi-arid steppe climate in the west (El Paso, the Panhandle), hot and dry."
  - koppenCode: Aw
    description: "Tropical savanna warmth along the Gulf coast and the Rio Grande valley."
landmarks:
  - name: The Alamo (San Antonio)
    description: "The 1836 battle site and mission, the 'shrine of Texas liberty'."
  - name: Space Center Houston
    description: "NASA's official visitor center, home to mission control and astronaut exhibits."
  - name: Big Bend National Park
    description: "The vast Chihuahuan Desert national park on the Rio Grande, a UNESCO Biosphere Reserve."
  - name: Texas State Capitol (Austin)
    description: "The grand pink-granite capitol of the 'Lone Star State'."
  - name: River Walk (San Antonio)
    description: "The picturesque canal-lined walkway through downtown San Antonio, lined with restaurants."
culturalTraits:
  - "A fiercely proud independent 'Lone Star' identity with a strong cowboy/Western heritage"
  - "World-famous barbecue, Tex-Mex cuisine and country music"
  - "A booming economy and state pride in big everything (and college football)"
  - "The Gulf coast's Indigenous Karankawa heritage, part of Texas's long multicultural history alongside Spanish, Mexican and cowboy frontier influences"
prideOf:
  - "Its distinctive Texan identity and legendary history"
  - "Barbecue, Tex-Mex and the cowboy/cattle-ranch culture"
  - "Economic dynamism and college football"
animals:
  popular:
    - "Longhorn cattle (the state symbol)"
    - "Armadillo"
  unique:
    - "Whooping crane, which winters in the coastal marshes near Aransas National Wildlife Refuge"
    - "Alligator gar, an ancient armored fish native to the Gulf coast marshes and rivers"
industries:
  - "Energy: oil, gas and petrochemicals"
