  - "Aerospace (NASA Houston, SpaceX Boca Chica)"
  - "Agriculture and ranching (cattle)"
  - "Finance and healthcare"
sports:
  - "American football (Cowboys, Texans; Texas is college-football crazy)"
  - "Basketball (Mavericks, Spurs, Rockets)"
  - "Baseball (Rangers, Astros)"
  - "Rodeo"
