    url: "https://www.one.gob.do/"
    accessedDate: "2026-09-17"
    note: "Placeholder sourceId for values that are estimates or could not be verified against a primary fetchable source: the hat and eng language shares. These fields ARE flagged as estimates in their YAML notes."