legalConstraints:
  - topic: "Official language & languages of the National Assembly"
    description: "Under Section 55 of the 1999 Constitution, the business of the National Assembly is conducted in English, and in Hausa, Igbo and Yoruba when adequate arrangements have been made for interpretation. English functions as the de facto national language of government, law, education and business, while English, Hausa, Igbo and Yoruba serve as the principal languages for legislative and public purposes."
    sourceId: nga-const1999-sec55
  - topic: "Freedom of religion & secular federal structure"
    description: "Section 38 of the 1999 Constitution guarantees every person freedom to adopt, practise and propagate any religion, and forbids discrimination on religious grounds. Nigeria is a multi-faith federation of roughly half Muslim and half Christian; twelve northern states have incorporated elements of sharia into their personal-status and penal legislation (beginning with Zamfara in 2000), while federal criminal and commercial law remains statutory."
    sourceId: nga-const1999-sec38
  - topic: "Data protection (NDPR)"
    description: "The Nigeria Data Protection Regulation 2019, issued by NITDA under the NITDA Act, establishes a data-protection regime for personal data collected, processed or stored in Nigeria, requiring lawful bases for processing and breach-notification duties."
    sourceId: nitda-ndpr2019
  - topic: "Business law (federal & state)"
    description: "Company, commercial and contract law is governed by federal statutes applied uniformly across the 36 states and the Federal Capital Territory, with the Companies and Allied Matters Act (CAMA) the principal corporate statute; sector regulators include the Central Bank of Nigeria (CBN) for banks and the NIPC for investment."
    sourceId: cbn
paymentCulture:
  popularMethods:
    - "Cash (naira) - still dominant across markets and the informal/mass economy"
    - "NIBSS Instant Payment (NIP) - the ubiquitous interbank transfer rail for business and person-to-person payments"
    - "USSD mobile banking (*737# and bank codes) - widely used on feature phones"
    - "PoS terminal cards and QR-based transfers (eNaira and bank apps)"
  tipping:
    expected: false
    autoIncludedInBill: false
    typicalAmount: "Tipping is not obligatory; a small service appreciation at upscale restaurants and hotels is appreciated, and rounding up for taxi and ride-hailing fares is common. Some restaurants add a service charge."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Age, title and status command respect; use titles (Mr/Mrs/Dr/Chief) with surnames until invited to first names. 'African time' and a relation-first pace are normal in much of business."
  greetingNorms: "Warm, prolonged greetings asking after family and wellbeing are expected and open nearly every interaction; firm handshakes are standard."
  meetingEtiquette: "Relationships and trust precede transactions. Meetings often begin with pleasantries and small talk, decisions may be taken after the room convenes, and negotiation with room for friendly haggling is customary in markets. Friday midday prayers are observed in the Muslim north, and Sunday worship in the Christian south."
  topicsToAvoid:
    - "Ethnic-religious identity in a politically sensitive way"
    - "The security situation in the north-east (Boko Haram) and the south-east (Niger Delta militancy)"
    - "Corruption and its casual mention"
    - "Over-generalising about the north-south or ethnic divides"
  giftGivingNotes: "Gift-giving is common and appreciated, often reciprocated; be mindful of religious sensitivities (alcohol and pork in Muslim areas) and of appearing improper in public-sector contexts where anti-corruption rules apply."
