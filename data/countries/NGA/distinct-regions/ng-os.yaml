    accessedDate: "2026-10-02"
    note: "Official backdrop for Osun as the Yoruba heartland state, its capital Osogbo, the ancient kingdom of Ile-Ife, and the state's rivers, forests and festivals."
  - id: unesco-osun-grove
    name: "Osun-Osogbo Sacred Grove — UNESCO World Heritage Centre"
    publisher: "UNESCO World Heritage Centre"
    url: "https://whc.unesco.org/en/list/1118/"
    year: 2005
    accessedDate: "2026-10-02"
    note: "Basis for the Osun-Osogbo Sacred Grove UNESCO flag and description of the grove, its shrines, the Osun river and the annual twelve-day festival in July-August."
  - id: usstate-irf-osun
    name: "International Religious Freedom Report — Nigeria (Osun)"
    publisher: "US Department of State"
    url: "https://www.state.gov/report/custom/c02a814b6c"
    year: 2019
    accessedDate: "2026-10-02"
    note: "Osun is a mixed south-west state broadly balanced between Christianity and Islam with a traditional-religion heritage; the split is a survey estimate since Nigeria's census has not collected religion since 1963."
