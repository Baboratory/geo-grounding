code: NG-YO
name:
  eng: Yobe
  local:
    - languageCode: kau
      value: Yobe
climates:
  - koppenCode: BSh
    description: "Hot semi-arid (Sahel steppe) climate on the desert edge of the far north-east — a short wet season roughly June-September and a long, very dry season with the dusty harmattan the rest of the year, with severe seasonal drought."
landmarks:
  - name: Damaturu
    description: "The state capital, a growing administrative and market town at the centre of the North-East."
  - name: Nguru
    description: "A historic town in the south, an old railhead and the gateway to the Hadejia-Nguru wetlands — long a trading and farming centre on the semi-arid plains."
  - name: Hadejia-Nguru Wetlands (southern fringe)
    description: "The internationally important floodplain wetlands (Ramsar-listed) straddling the Yobe-Jigawa border, vital for wetland agriculture, fishing and migratory birds."
  - name: Bade and its emirate heritage
    description: "The historic town and emirate of Bade in the north of the state, a centre of the indigenous Bade people (distinct from the related Bolewa, also present in the state)."
  - name: The desert-edge 'green areas' of the north
    description: "The drought-prone Sahelian landscapes of the far north, where farming, wells and seasonal grazing mark the country's edge against the Sahara."
culturalTraits:
  - "A North-East state carved out of Borno in 1991, with a mixed Kanuri and Hausa-Fulani population and a strong rural, pastoral character"
  - "A semi-arid, drought-prone state on Nigeria's desert edge, surfaced by severe drought and, more recently, the Boko Haram insurgency"
  - "A predominantly Muslim state where the emirate cultures of the Kanuri and Hausa peoples shape civic life"
prideOf:
  - "Surviving and farming on the desert edge, with a history of resilience against drought"
  - "The Hadejia-Nguru wetlands and their wildlife"
  - "The traditional emirates (like Bade) and the state's rural heritage"
animals:
  popular:
    - "Cattle, goats, sheep and camels of the Sahelian pastoral economy"
    - "Donkeys for rural transport"
  unique:
    - "Migratory waterbirds of the Hadejia-Nguru wetlands"
    - "Sahelian antelope and desert-edge fauna of the northern plains"
industries:
  - "Agriculture (millet, sorghum, maize, beans, groundnuts, cowpea) and livestock"
  - "Fishing in the wetland fringe"
  - "Camel and cattle herding"
  - "Trade in the towns of Damaturu and Nguru"
sports:
  - "Football"
  - "Traditional wrestling"
  - "Horse riding"
religions:
  # Yobe is one of the overwhelmingly Muslim northern states. Nigeria has not asked a
  # religion question in its census since 1963, so this split is a survey estimate.
  - name: Muslim
    percent: 96.0
    sourceId: usstate-irf-yobe
  - name: Christian
    percent: 4.0
    sourceId: usstate-irf-yobe
entertainment:
  - season: dry
    items:
      - "Eid celebrations and the festive Durbar of the emirates in the cooler, drier months"
  - season: wet
    items:
      - "Wetland farming and fishing cycles and community gatherings in the rains"
  - season: allYear
    items:
      - "The markets of Damaturu and Nguru and the traditional life of the emirate towns year-round"
traditionalDishes:
  - season: allYear
    items:
      - "Tuwo shinkafa and tuwon masara with rich soups (miyan kuka, miyan taushe)"
      - "Suya and kilishi (dried spiced meat)"
      - "Fura da nono and groundnut soup"
      - "Fresh fish from the Hadejia-Nguru wetlands"
traditionalClothing:
  - season: allYear
    items:
      - "Men wear the flowing babban riga gown with an embroidered cap (hula) and often a turban; women wear wrappers, blouses and the hijab common in the Muslim north"
  - season: dry
    items:
      - "Festive white or richly embroidered gowns and turbans for Eid and celebrations"
seasonCalendar:
  - season: dry
    months: [11, 12, 1, 2, 3, 4]
  - season: wet
    months: [5, 6, 7, 8, 9, 10]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Government and offices typically run 08:00-17:00 Monday-Friday; markets trade daily but with a Friday midday break for congregational prayers."
  lunchBreakTiming: "A midday break around 13:00-14:00, often with prayer; on Fridays the midday prayer break is longer."
  notableShutdownPeriods:
    - period: "Eid al-Fitr and Eid al-Kabir"
      description: "Major Islamic holidays — most businesses close for the festivities."
  notes: "Yobe is one of twelve northern states to have adopted a Sharia penal code (in 2001); alcohol is restricted and Friday midday prayer is widely observed. The state has also been severely affected by drought and the Boko Haram insurgency."
  sourceIds:
    - usstate-irf-yobe
sources:
  - id: yobe-state
    name: "Yobe State Government — about the state"
    publisher: "Yobe State Government"
    url: "https://yobestate.gov.ng/"
    year: 2026
    accessedDate: "2026-10-02"
    note: "Official backdrop for Yobe as a North-East state carved from Borno in 1991, its capital Damaturu, and its Kanuri and Hausa character on the desert edge."
  - id: usstate-irf-yobe
    name: "International Religious Freedom Report — Nigeria (Yobe)"
    publisher: "US Department of State"
    url: "https://www.state.gov/reports/2023-report-on-international-religious-freedom/nigeria/"
    year: 2023
    accessedDate: "2026-10-02"
    note: "Yobe is an overwhelmingly Muslim state (survey estimate — Nigeria's census has not collected religion since 1963) and is one of the twelve states that adopted a Sharia penal code. The cited report gives only a national estimate (~50% Muslim / 48% Christian, Pew) plus qualitative zone-level description, not a state-specific percentage table; the figure above is accordingly an approximate, cross-referenced estimate rather than one read directly off this source."
