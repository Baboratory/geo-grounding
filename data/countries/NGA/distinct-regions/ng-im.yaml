code: NG-IM
name:
  eng: Imo
  local:
    - languageCode: ibo
      value: Imo
climates:
  - koppenCode: Am
    description: "Tropical monsoon climate — a long, heavy wet season roughly April-October and a shorter, harmattan-tinged dry season roughly November-March, hot and humid year-round."
landmarks:
  - name: "Mbari houses, Owerri"
    description: "The traditional open-sided art-and-architecture shelters of the Owerri Igbo — 'houses of gods' built with life-sized painted figures and clay sculptures; the Mbari Cultural Centre keeps the tradition alive."
  - name: "Oguta Lake"
    description: "The largest natural lake in south-eastern Nigeria, where the Njaba and Urashi rivers meet — a blue-water lake with boat trips, beaches and holiday resorts."
  - name: "Assumpta Cathedral, Owerri"
    description: "The huge Maria Assumpta Catholic Cathedral in the state capital — a striking modern landmark and symbol of Owerri's deeply Catholic culture."
  - name: "Owerri — capital"
    description: "The state capital, a busy Igbo city nicknamed the 'entertainment capital of Nigeria' for its nightlife and social scene."
culturalTraits:
  - "Igbo state at the cultural heart of Owerri Igboland — famed for Mbari art, ceremony and the proverb-rich Igbo worldview"
  - "A warmly sociable, church-going society (Catholicism is especially strong here)"
  - "Owerri's tag as Nigeria's entertainment capital reflects a lively music, nightlife and social culture"
  - "Farming and palm-oil country, with a strong diaspora remittance economy"
prideOf:
  - "Mbari art and the Owerri Igbo cultural heritage"
  - "Oguta Lake and the state's natural beauty"
  - "Being the entertainment and social capital of the south-east"
animals:
  popular:
    - "Domestic goats, poultry and dogs in towns and villages"
    - "Olive baboon and crested porcupine in forest patches"
    - "Grey duikers and red river hog in the countryside"
  unique:
    - "Sclater's guenon — an endangered monkey of south-east Nigeria's forests"
industries:
  - "Agriculture — oil palm, cassava, yam, maize and food crops"
  - "Palm-oil and palm-kernel processing"
  - "Trade, services and the Owerri entertainment/leisure economy"
  - "Small-scale manufacturing and a significant diaspora remittance economy"
sports:
  - "Football"
  - "Basketball"
  - "Traditional wrestling"
  - "Athletics"
religions:
  # Nigeria has run no census religion question since 1963, so the south-east
  # split is a survey estimate. The US State Dept IRF report describes the
  # Igbo-dominant South East and South states as majority Christian
  # (Catholic, Anglican and Methodist), with a small traditional-religion
  # (Omenala) and tiny Muslim minority. Catholicism is especially strong in
  # Imo/Owerri.
  - name: Christian
    percent: 96.0
    sourceId: usstate-irf
  - name: Traditional (Omenala/other & none)
    percent: 3.5
    sourceId: usstate-irf
  - name: Muslim
    percent: 0.5
    sourceId: usstate-irf
entertainment:
  - season: allYear
    items:
      - "Owerri's nightlife, bars and social scene — the 'entertainment capital' reputation"
      - "Igbo masquerade and masked-festival culture (Mmanwu)"
      - "Church musical life, choirs and gospel events"
  - season: dry
    items:
      - "End-of-year and Christmas celebrations in the drier, cooler months (Dec-Feb)"
      - "Weddings, community festivals and music events in the dry season"
  - season: wet
    items:
      - "The New Yam festival (Iri Ji, Aug-Sep) — the great wet-season harvest celebration"
      - "Oguta Lake boat trips and holiday weekends"
traditionalDishes:
  - season: allYear
    items:
      - "Pounded yam with ofe egusi or ofe ogbono soup"
      - "Ofe nsala (peppery white soup) with fresh fish"
      - "Abacha ('African salad') with ugba and fish"
      - "Akara (bean fritters) and moi moi"
  - season: dry
    items:
      - "Festive jollof rice, pepper soups and roast meats for Christmas, weddings and festivals"
  - season: wet
    items:
      - "New Yam dishes — pounded new yam with fresh, rainy-season soups"
traditionalClothing:
  - season: allYear
    items:
      - "Men wear the isiagu (lion-head patterned) top with a wrapper and often the red Igbo chieftaincy cap (okpu); women the wrapper and blouse with an ichafu headwrap"
      - "Colourful ankara and George wrappers are everyday and festive wear"
  - season: dry
    items:
      - "Festive lace, coral beads and ceremonial wrappers for Christmas, weddings and festivals in the dry months"
seasonCalendar:
  - season: dry
    months: [11, 12, 1, 2, 3, 4]
  - season: wet
    months: [5, 6, 7, 8, 9, 10]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices and banks typically run 08:00-17:00 Monday-Friday; markets and small businesses trade long hours six days a week."
  lunchBreakTiming: "A mid-afternoon break roughly 13:00-14:00, often with a quick meal."
  notableShutdownPeriods:
    - period: "Christmas and New Year"
      description: "Business across the largely Christian state slows sharply over the Christmas-New Year week, with many firms closing from Christmas to early January as people travel home."
  notes: "Sunday is the main rest day, with widespread church attendance; Owerri's nightlife runs late at weekends. Since August 2021 a weekly Monday \"sit-at-home\" called by separatist groups has intermittently shut markets, schools and offices across the South East; compliance has eased since a February 2026 cancellation announcement but remains uneven."
sources:
  - id: usstate-irf
    name: "International Religious Freedom Report — Nigeria (South East / Igbo states)"
    publisher: "US Department of State"
    url: "https://www.state.gov/reports/2023-report-on-international-religious-freedom/nigeria/"
    year: 2023
    accessedDate: "2026-10-02"
    note: "Describes the Igbo-dominant South East and South states as majority Christian (Catholic, Anglican, Methodist) with small traditional-religion and Muslim minorities; used as the survey-estimate basis for the state's religion split, since Nigeria's census has not asked a religion question since 1963. The cited report gives only a national estimate (~50% Muslim / 48% Christian, Pew) plus qualitative zone-level description, not a state-specific percentage table; the figure above is accordingly an approximate, cross-referenced estimate rather than one read directly off this source."
  - id: mbari-study
    name: "Insights from the Mbari Houses of Imo State, Nigeria"
    publisher: "ISVS e-journal (academic study of vernacular architecture)"
    url: "https://isvshome.com/pdf/ISVS_12-03/ISVSej_12.03.07.pdf"
    year: 2025
    accessedDate: "2026-10-02"
    note: "Documents Mbari houses of the Owerri Igbo as Imo's distinctive traditional art-and-architecture heritage."
