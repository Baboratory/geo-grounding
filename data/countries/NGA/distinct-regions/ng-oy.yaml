    name: "Oyo State Government — about the state"
    publisher: "Oyo State Government"
    url: "https://oyostate.gov.ng/"
    year: 2026
    accessedDate: "2026-10-01"
    note: "Official backdrop for Oyo as a Yoruba heartland seat of the Oyo Empire, its capital Ibadan, and landmarks including the Alaafin's Palace and Old Oyo National Park."
  - id: usstate-irf-oyo
    name: "International Religious Freedom Report — Nigeria (Oyo)"
    publisher: "US Department of State"
    url: "https://www.state.gov/reports/2023-report-on-international-religious-freedom/nigeria/"
    year: 2023
    accessedDate: "2026-10-01"
    note: "Oyo is a mixed south-west state broadly balanced between Christianity and Islam with a traditional-religion presence; the split is a survey estimate since Nigeria's census has not collected religion since 1963. The cited report gives only a national estimate (~50% Muslim / 48% Christian, Pew) plus qualitative zone-level description, not a state-specific percentage table; the figure above is accordingly an approximate, cross-referenced estimate rather than one read directly off this source."
