    accessedDate: "2026-10-02"
    note: "Ogun is a mixed south-west state with a Christian majority and a substantial Muslim minority alongside a traditional-religion presence; the split is a survey estimate since Nigeria's census has not collected religion since 1963. The cited report gives only a national estimate (~50% Muslim / 48% Christian, Pew) plus qualitative zone-level description, not a state-specific percentage table; the figure above is accordingly an approximate, cross-referenced estimate rather than one read directly off this source."
