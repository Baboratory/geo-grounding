code: NG-OG
name:
  eng: Ogun
  local:
    - languageCode: yor
      value: Ìpínlẹ̀ Ògùn
climates:
  - koppenCode: Aw
    description: "Tropical savanna climate of the south-western forest belt — a heavy wet season roughly April-October and a drier, harmattan-influenced dry season roughly November-March, with hot, humid conditions through much of the year."
landmarks:
  - name: Olumo Rock, Abeokuta
    description: "The great granite outcrop at the heart of Abeokuta, a natural fortress that sheltered the Egba during the internecine wars of the 19th century; its name means 'rock of refuge' and it offers panoramic views over the city."
  - name: Sungbo's Eredo
    description: "One of the largest pre-colonial earthworks in Africa — a great system of ancient ditches and ramparts around the Ijebu kingdom, now a candidate for UNESCO World Heritage listing."
  - name: Adire (tie-dye) textile craft of Egbaland
    description: "Abeokuta is the historic capital of the Nigerian adire indigo resist-dyeing trade, whose Itoku market remains the hub of this celebrated Yoruba craft."
  - name: Ake Palace, Abeokuta
    description: "The palace of the Alake of Egbaland, seat of the Egba traditional ruler in the old hilltop town of Ake."
  - name: Olusegun Obasanjo Presidential Library
    description: "A presidential library and museum complex in Abeokuta honouring Nigeria's former president, with exhibits on Nigerian history and art."
  - name: Ogun river and Oyan dam
    description: "The river that gives the state its name and feeds the Oyan reservoir, a major source of water and a scenic inland stretch of the south-west."
culturalTraits:
  - "The 'Gateway State' of the Yoruba south-west, home to the Egba, Ijebu, Remo, Awori and Yewa peoples and the capital-adjacent link between Lagos and the rest of Nigeria"
  - "The historic heart of the adire indigo-dyeing craft and a land of rich chieftaincy and festival traditions"
  - "A major manufacturing and educational hub of the south-west, lying along Nigeria's industrial axis between Lagos and Ibadan"
prideOf:
  - "Olumo Rock and the Egba spirit of refuge and resilience"
  - "The adire textile tradition and Itoku market in Abeokuta"
  - "Being the gateway between Lagos and the wider south-west, and a centre of manufacturing and learning"
animals:
  popular:
    - "Goats, sheep and poultry of the rural economy"
    - "Fish and crabs of the Ogun river and coastal lagoons"
  unique:
    - "Manatees in the coastal rivers and lagoons near the Bight of Benin"
    - "Forest and savanna fauna of the state's reserves, including the Omo Forest Reserve"
industries:
  - "Manufacturing and industry (cement at Ewekoro and Sagamu, and a growing factory belt along the Lagos-Ibadan corridor)"
  - "Agriculture (cocoa, palm produce, cassava, maize, rice and market gardening)"
  - "Commercial fishing and river trading"
  - "The adire textile and artisan crafts of Abeokuta"
sports:
  - "Football"
  - "Basketball"
  - "Athletics"
  - "Traditional Yoruba wrestling and festival dance competitions"
religions:
  # Ogun is a mixed Yoruba state with a Christian majority and a substantial Muslim
  # minority alongside a traditional-religion presence; this is a survey estimate, not a
  # census figure (Nigeria has not collected religion in its census since 1963).
  - name: Christian
    percent: 62.0
    sourceId: usstate-irf-ogun
  - name: Muslim
    percent: 33.0
    sourceId: usstate-irf-ogun
  - name: Traditional
    percent: 5.0
    sourceId: usstate-irf-ogun
entertainment:
  - season: allYear
    items:
      - "Yoruba festivals, drumming, theatre and traditional arts throughout the year"
      - "The adire craft tour and the markets and galleries of Abeokuta"
  - season: dry
    items:
      - "Outdoor festivals, celebrations and weddings in the drier, cooler months (Nov-Mar)"
  - season: wet
    items:
      - "The rainy months favour indoor cultural events and the region's many places of worship"
traditionalDishes:
  - season: allYear
    items:
      - "Amala (yam flour) with ewedu and gbegiri — the staple Yoruba meal shared across the south-west"
      - "Ijebu garri (soaked, spicy cassava flakes with sugar and groundnut) and ikokore (a water-yam porridge) of the Ijebu country"
      - "Pounded yam with rich soups, jollof rice, moin moin, akara and suya"
traditionalClothing:
  - season: allYear
    items:
      - "Yoruba dress — men's agbada gown and fila cap; women's iro (wrapper), buba (blouse) and gele headwrap"
      - "Adire indigo-dyed cloth, for which Abeokuta and the Egba are world-famous, alongside ankara prints"
  - season: dry
    items:
      - "Festive lace, agbada and gele for Christmas, Eid and the dry-season celebration season"
seasonCalendar:
  - season: dry
    months: [11, 12, 1, 2, 3, 4]
  - season: wet
    months: [5, 6, 7, 8, 9, 10]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices and factories typically run 08:00-17:00 Monday-Friday; the bustling markets of Abeokuta and the Ijebu towns trade daily including Saturdays."
  lunchBreakTiming: "A midday break around 13:00-14:00."
  notableShutdownPeriods:
    - period: "Christmas and New Year"
      description: "Business in Abeokuta and across the state slows over the Christmas-New Year week."
  notes: "As a largely Yoruba and agricultural state, weekly market days and the planting calendar shape much of the business rhythm in the rural areas, while the corridor towns feed off the busy Lagos-Ibadan traffic."
