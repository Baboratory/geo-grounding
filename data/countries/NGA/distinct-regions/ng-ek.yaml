code: NG-EK
name:
  eng: Ekiti
  local:
    - languageCode: yor
      value: Ìpínlẹ̀ Èkìtì
climates:
  - koppenCode: Aw
    description: "Tropical wet-dry climate in the hilly Yoruba east, at moderate elevation — a rainy season roughly April-October and a drier, harmattan-influenced dry season roughly November-March, with mild temperatures and high humidity."
landmarks:
  - name: Ikogosi Warm Springs
    description: "A celebrated natural spring at Ikogosi where a warm spring and a cold spring flow side by side and meet, each keeping its own temperature — one of Nigeria's most famous eco-tourism sites."
  - name: The Ekiti highland hills
    description: "The landmark granite inselbergs and rolling hills -- including those around Ikere-Ekiti, Efon-Alaaye and Ado-Ekiti -- that give the Ekiti highland its distinctive skyscape, dotted with historic towns."
  - name: Arinta Waterfall
    description: "A scenic waterfall at Ipole-Iloro, one of several natural falls of the Ekiti highlands."
  - name: Ado-Ekiti
    description: "The state capital, a hill-country city and seat of the Ewi of Ado and of a university town with a lively educational character."
  - name: Fajuyi Memorial Park, Ado-Ekiti
    description: "A park honouring Colonel Adekunle Fajuyi, the first military governor of the old Western Region, who was assassinated in the 1966 coup."
culturalTraits:
  - "The Yoruba highland homeland of the Ekiti people, carved out of Ondo State in 1996"
  - "A largely Christian, agrarian and educated state famed for its hills, waterfalls and warm springs"
  - "A land of many historic kingdoms and obaships, from the Ewi of Ado to the Elesun of Esun-Ekiti, with a strong festival culture"
prideOf:
  - "The Ikogosi warm-cold springs and the striking Ekiti hillscapes"
  - "Being one of Nigeria's most education-focused states, the 'Fountain of Knowledge'"
  - "The Ekiti people's history and the many obaships and towns of the highlands"
animals:
  popular:
    - "Goats, sheep and poultry of the smallholder economy"
    - "Fish of the rivers and streams"
  unique:
    - "Forest and wooded-savanna fauna of the Ekiti highlands"
    - "Birdlife around the springs and waterfalls"
industries:
  - "Agriculture (cocoa, yam, cassava, maize, rice and kolanut — a leading food-producing state)"
  - "Education and services (Ado-Ekiti's universities and the state's strong schooling tradition)"
  - "Tourism (the warm springs, waterfalls and hills)"
  - "Commerce and administration"
sports:
  - "Football"
  - "Basketball"
  - "Athletics"
  - "Traditional Yoruba wrestling and festival dance competitions"
religions:
  # Ekiti is a predominantly Christian highland Yoruba state; this is a survey estimate,
  # not a census figure (Nigeria has not collected religion in its census since 1963).
  - name: Christian
    percent: 78.0
    sourceId: usstate-irf-ekiti
  - name: Muslim
    percent: 17.0
    sourceId: usstate-irf-ekiti
  - name: Traditional
    percent: 5.0
    sourceId: usstate-irf-ekiti
entertainment:
  - season: allYear
    items:
      - "Yoruba festivals, drumming and the palace traditions of the many Ekiti kingdoms"
      - "University-town cultural life and gatherings around Ado-Ekiti"
  - season: dry
    items:
      - "Outdoor festivals, celebrations and weddings in the drier, cooler months (Nov-Mar)"
  - season: wet
    items:
      - "The rainy months favour the springs, waterfalls and indoor cultural events, especially around the state capital"
traditionalDishes:
  - season: allYear
    items:
      - "Iyan (pounded yam) and amala with rich vegetable and melon (egusi) soups — the regional staple"
      - "Yam-based dishes, moin moin, akara and jollof rice"
      - "Local river fish and smoked produce of the highlands"
traditionalClothing:
  - season: allYear
    items:
      - "Yoruba dress — men's agbada gown and fila cap; women's iro (wrapper), buba (blouse) and gele headwrap"
      - "Colourful ankara and woven aso-oke cloth with ceremonial beadwork"
  - season: dry
    items:
      - "Festive lace, agbada and gele for Christmas and the dry-season celebration season"
seasonCalendar:
  - season: dry
    months: [11, 12, 1, 2, 3, 4]
  - season: wet
    months: [5, 6, 7, 8, 9, 10]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices and schools typically run 08:00-17:00 Monday-Friday; markets and farm produce trading follow the daily and weekly rhythms of the local economy."
  lunchBreakTiming: "A midday break around 13:00-14:00."
  notableShutdownPeriods:
    - period: "Christmas and New Year"
      description: "Business in the largely Christian state slows over the Christmas-New Year week."
  notes: "As one of Nigeria's most agrarian and education-focused states, the farming calendar, weekly market days and the rhythms of the state capital Ado-Ekiti shape much of the business cycle."
sources:
