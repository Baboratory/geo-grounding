code: NG-EB
name:
  eng: Ebonyi
  local:
    - languageCode: ibo
      value: Ebonyi
climates:
  - koppenCode: Aw
    description: "Tropical savanna climate — a single heavy wet season roughly April-October and a drier, harmattan-tinged season roughly November-March, hot and humid year-round."
landmarks:
  - name: "Uburu Salt Lake"
    description: "A natural salt lake at Uburu, Ohaozara, whose brine has been boiled into salt for millennia — part of the heritage that earned Ebonyi the slogan 'Salt of the Nation'."
  - name: "Okposi Salt Lake"
    description: "A companion natural salt lake at Okposi whose brine is still worked by traditional, largely women-led salt-making to this day."
  - name: "Abakaliki — capital"
    description: "The state capital and a major rice-growing and trading centre in the south-east."
  - name: "Abakaliki rice belt"
    description: "The state's signature rice-producing plains — Ebonyi is one of Nigeria's leading rice states, with a famous rice mill and growing processing industry."
culturalTraits:
  - "One of Nigeria's youngest states (created in 1996, tied with five others), carved from old Abia and Enugu — an Izzi and south-eastern Igbo heartland"
  - "The 'Salt of the Nation' heritage — a deep tradition of salt-making from the natural brine lakes"
  - "A farming state where rice, yam and cassava are central to life and identity"
  - "A deeply Christian society, like the rest of the south-east"
prideOf:
  - "The Uburu and Okposi salt lakes and the 'Salt of the Nation' tag"
  - "Being Nigeria's rice capital and a pioneer of local rice production"
  - "The resilience and youth of the state, the newest in the federation"
animals:
  popular:
    - "Domestic goats, poultry and dogs in towns and villages"
    - "Olive baboon and crested porcupine in forest patches"
    - "Grey duikers and red river hog in the countryside"
  unique:
    - "Sclater's guenon — an endangered monkey of south-east Nigeria's forests"
industries:
  - "Rice farming and milling (Abakaliki rice — a leading national producer)"
  - "Traditional salt-making from the Uburu and Okposi brine lakes"
  - "Agriculture — yam, cassava, maize and food crops"
  - "Trade along the Cross River headwaters"
sports:
  - "Football"
  - "Basketball"
  - "Traditional wrestling"
  - "Athletics"
religions:
  # Nigeria has run no census religion question since 1963, so the south-east
  # split is a survey estimate. The US State Dept IRF report describes the
  # Igbo-dominant South East and South states as majority Christian
  # (Catholic, Anglican and Methodist), with a small traditional-religion
  # (Omenala) and tiny Muslim minority.
  - name: Christian
    percent: 95.0
    sourceId: usstate-irf
  - name: Traditional (Omenala/other & none)
    percent: 4.0
    sourceId: usstate-irf
  - name: Muslim
    percent: 1.0
    sourceId: usstate-irf
entertainment:
  - season: allYear
    items:
      - "Igbo masquerade and masked-festival culture (Mmanwu) across the state"
      - "Church musical life, choirs and gospel events"
      - "Nollywood and the region's film-and-entertainment scene"
  - season: dry
    items:
      - "End-of-year and Christmas celebrations in the drier, cooler months (Dec-Feb)"
      - "Rice-harvest and community festivals in the dry season"
  - season: wet
    items:
      - "The New Yam festival (Iri Ji, Aug-Sep) — the great wet-season harvest celebration"
      - "Salt-making and farming-cycle community gatherings in the rains"
traditionalDishes:
  - season: allYear
    items:
      - "Abakaliki rice — the state's celebrated local rice, served with rich soups"
      - "Pounded yam with ofe egusi or ofe ogbono soup"
      - "Ofe nsala (peppery white soup) with fresh fish"
      - "Akara (bean fritters) and moi moi"
  - season: dry
    items:
      - "Festive jollof rice and pepper soups for Christmas and weddings"
  - season: wet
    items:
      - "New Yam dishes — pounded new yam with fresh, rainy-season soups"
traditionalClothing:
  - season: allYear
    items:
      - "Men wear the isiagu (lion-head patterned) top with a wrapper and often the red Igbo chieftaincy cap (okpu); women the wrapper and blouse with an ichafu headwrap"
      - "Colourful ankara and George wrappers are everyday and festive wear"
  - season: dry
    items:
      - "Festive lace, coral beads and ceremonial wrappers for Christmas, weddings and festivals in the dry months"
seasonCalendar:
  - season: dry
    months: [11, 12, 1, 2, 3, 4]
  - season: wet
    months: [5, 6, 7, 8, 9, 10]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices, banks and the rice-processing businesses typically run 08:00-17:00 Monday-Friday; markets trade long hours six days a week."
  lunchBreakTiming: "A mid-afternoon break roughly 13:00-14:00, often with a quick meal."
  notableShutdownPeriods:
    - period: "Christmas and New Year"
      description: "Business across the largely Christian state slows sharply over the Christmas-New Year week, when many firms close as people travel home."
  notes: "Sunday is the main rest day, with widespread church attendance; the rice harvest in the wet season is a major commercial moment for the state. Since August 2021 a weekly Monday \"sit-at-home\" called by separatist groups has intermittently shut markets, schools and offices across the South East; compliance has eased since a February 2026 cancellation announcement but remains uneven."
sources:
  - id: usstate-irf
    name: "International Religious Freedom Report — Nigeria (South East / Igbo states)"
    publisher: "US Department of State"
    url: "https://www.state.gov/reports/2023-report-on-international-religious-freedom/nigeria/"
    year: 2023
    accessedDate: "2026-10-02"
    note: "Describes the Igbo-dominant South East and South states as majority Christian (Catholic, Anglican, Methodist) with small traditional-religion and Muslim minorities; used as the survey-estimate basis for the state's religion split, since Nigeria's census has not asked a religion question since 1963. The cited report gives only a national estimate (~50% Muslim / 48% Christian, Pew) plus qualitative zone-level description, not a state-specific percentage table; the figure above is accordingly an approximate, cross-referenced estimate rather than one read directly off this source."
  - id: ohaozara-salt
    name: "Geology, water types and facie evolution of the Ohaozara saline lake areas of Ebonyi State"
    publisher: "International Journal of Scientific and Research Publications (IJSRP)"
    url: "https://ijsrp.org/research-paper-0915/ijsrp-p4591.pdf"
    year: 2015
    accessedDate: "2026-10-02"
    note: "Confirms the location and geology of the Okposi and Uburu salt lakes in Ohaozara, Ebonyi — the basis of the state's 'Salt of the Nation' identity."
