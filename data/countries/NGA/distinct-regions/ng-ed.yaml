code: NG-ED
name:
  eng: Edo
  local:
    - languageCode: eng
      value: Edo
    - languageCode: bin
      value: Edo
climates:
  - koppenCode: Aw
    description: "Tropical wet-dry (savanna) climate across most of the state — a rainy season roughly April-October and a drier, harmattan-influenced season roughly November-March, warm and humid throughout the year."
landmarks:
  - name: Benin City
    description: "The state capital and one of Nigeria's great historic cities — home of the Benin Kingdom, famed for its royal palace, moat earthworks and world-renowned bronze and ivory art."
  - name: Palace of the Oba of Benin
    description: "The royal palace of the Oba of Benin, seat of the city's centuries-old divine kingship and its celebrated court arts."
  - name: Igun Street Bronze Casters
    description: "The historic quarter of Benin City where the hereditary Igun brass/bronze-casting guild has cast its celebrated Benin bronzes for centuries."
  - name: Benin Moat (Iya)
    description: "The great pre-colonial earthwork ramparts surrounding old Benin City, among the world's largest such fortification systems."
  - name: National Museum, Benin City
    description: "The national museum holding the artistic heritage and antiquities of the Benin Kingdom."
  - name: Ososo Hills
    description: "A scenic sandstone hill resort in Edo North famed for cool weather and panoramic views."
culturalTraits:
  - "The heartland of the Edo (Bini) people and successor to the great Benin Kingdom, whose court art — the Benin bronzes, ivories and plaques — is world-renowned"
  - "A state of profound artistic and craft heritage, from the Igun bronze casters to ceremonial masquerades"
  - "The 'Heartbeat of the Nation' — a diverse South-South state of the Edo/es, Esan, Owan, Etsako and Afemai peoples"
prideOf:
  - "The Benin Kingdom heritage, its palace, moats and the Benin bronzes"
  - "The Igun bronze-casting tradition"
  - "Benin City's history as a great pre-colonial African civilisation"
animals:
  popular:
    - "Goats, sheep and poultry of the smallholder economy"
    - "Fish of the rivers and streams"
  unique:
    - "Forest fauna of the Okomu and other tropical-forest reserves of the south"
    - "Birdlife of the Ososo and interior hills"
industries:
  - "Rubber (Edo is the centre of Nigeria's rubber industry) and oil palm"
  - "Agriculture (yam, cassava, maize, rice, plantain, maize) and fishing"
  - "Crafts and the historic bronze-casting trade"
  - "Commerce and services around Benin City"
sports:
  - "Football"
  - "Basketball"
  - "Athletics"
  - "Traditional Edo wrestling and masquerade-game competitions"
religions:
  # Edo is religiously mixed — Christianity dominant in Edo South, Islam strong in Edo
  # North, with indigenous religions also practised. This split is a survey estimate,
  # not a census figure (Nigeria has not collected religion since 1963).
  - name: Christian
    percent: 60.0
    sourceId: usstate-irf
  - name: Muslim
    percent: 35.0
    sourceId: usstate-irf
  - name: Traditional
    percent: 5.0
    sourceId: usstate-irf
entertainment:
  - season: allYear
    items:
      - "Edo music, the palace traditions of Benin City and traditional masquerade and dance"
      - "Cultural festivals of the Esan, Owan, Etsako and Afemai peoples"
  - season: dry
    items:
      - "Outdoor festivals, Igue (Benin royal festival) and masquerade celebrations in the drier months"
  - season: wet
    items:
      - "The rainforest reserves and waterfall/hill-country excursions favoured in the rainy season"
traditionalDishes:
  - season: allYear
    items:
      - "Io-iyan (pounded yam) and banga soup, the iconic Edo palm-nut soup"
      - "Black soup (ogwo/omwo) and egusi and vegetable soups"
      - "Roasted yam, plantain and the region's rice dishes"
  - season: dry
    items:
      - "Festive Edo dishes and palm-wine-season celebrations around the harvest and festivals"
traditionalClothing:
  - season: allYear
    items:
      - "Women wear wrappers, blouses and head-ties; men wear the wrapper and agbada-style gowns"
      - "Lovely coral-beaded regalia worn at Edo and Benin traditional weddings and ceremonies"
  - season: dry
    items:
      - "Festive attire for the Igue festival and dry-season celebrations"
seasonCalendar:
  - season: dry
    months: [11, 12, 1, 2, 3, 4]
  - season: wet
    months: [5, 6, 7, 8, 9, 10]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Government and offices typically run 08:00-17:00 Monday-Friday; markets and trade around Benin City follow daily and weekly rhythms."
  lunchBreakTiming: "A midday break around 13:00-14:00."
  notableShutdownPeriods:
    - period: "Christmas and New Year"
      description: "Business slows over the Christmas-New Year week in this largely Christian state."
  notes: "As a South-South state spanning Christian Edo South and Muslim-leaning Edo North, business rhythms blend a Sunday-observance week (in the south) with Friday-midday-prayer observance in northern areas, around the commercial and administrative hub of Benin City. Note: Edo State's capital is Benin City — not to be confused with the country of Benin."
