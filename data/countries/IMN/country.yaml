legalConstraints:
  - topic: "Crown dependency, not part of the UK"
    description: "The Isle of Man is a British Crown dependency: a self-governing possession of the Crown that is not part of the United Kingdom. The UK Government is responsible for its external affairs and defence, while the island's Tynwald legislates locally; there is no UK political party system on the island."
    sourceId: cia-factbook-isle-of-man
