businessRhythm:
  restDays:
    - friday
    - saturday
  typicalWorkHours: "Trade and offices broadly Sun-Thu, roughly 08:00-16:00, with Tripoli the national business centre."
  lunchBreakTiming: "Long afternoon breaks (2+ hours) common, with shops often re-opening in the evening when it is cooler."
  notes: "Tripoli is the commercial and financial hub with the country's busiest port; Friday-Saturday weekend with a long customary mid-day break. Business often pauses around prayer times and Islamic holidays. Supply-chain and some banking friction has persisted through the post-2011 instability."
