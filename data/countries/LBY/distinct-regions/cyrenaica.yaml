  - season: allYear
    items:
      - "Couscous and bazeen (Cyrenaican versions include a distinctive fish/chicken bazeen)"
      - "Fresh seafood in Benghazi"
      - "Green Mountain olives, figs, honey and citrus"
  - season: summer
    items:
      - "Fresh fish and salads; fruit from the mountain orchards"
  - season: winter
    items:
      - "Hearty meat stews, soups (shorba) and slow-cooked couscous"
