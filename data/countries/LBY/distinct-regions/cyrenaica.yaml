businessRhythm:
  restDays:
    - friday
    - saturday
  typicalWorkHours: "Public offices and many businesses Sun-Thu, roughly 08:00-16:00; Benghazi is the largest commercial node after Tripoli."
  lunchBreakTiming: "A long mid-day break (2+ hours) is common, with resumption in the evening."
  notes: "Friday-Saturday weekend; hours shorten during Ramadan and businesses close for Eid. Benghazi's port and the Brega area serve the eastern oil sector. Security unrest has at times disrupted services more in the east than elsewhere."
