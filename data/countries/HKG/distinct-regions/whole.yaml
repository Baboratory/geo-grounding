# Generic country-wide fallback content for Hong Kong (dependent-territory, single
# synthetic whole region). A mountainous, dense subtropical city and territory of
# ~7.5 million people, comprising Hong Kong Island, Kowloon and the New Territories,
# fronting the Pearl River estuary.
climates:
  - koppenCode: Cwa
    description: "Humid subtropical monsoon climate — hot, humid summers with heavy rain; mild, drier winters; influenced by typhoons and cold fronts near the southern coast."
landmarks:
  - name: Victoria Harbour and the Hong Kong skyline
    description: "The iconic deep-water harbour between Hong Kong Island and Kowloon, framed by a world-famous skyline and the nightly Symphony of Lights."
  - name: The Peak (Victoria Peak)
    description: "The highest point on Hong Kong Island, reached by the historic Peak Tram, offering sweeping views over the harbour and city."
  - name: The Big Buddha and Po Lin Monastery
    description: "A huge bronze Buddha statue on Lantau Island, one of the territory's most visited landmarks."
  - name: Temple Street Night Market and the Star Ferry
    description: "The lively street-market and the historic cross-harbour ferry that still connects Kowloon and the island — enduring symbols of everyday Hong Kong life."
culturalTraits:
  - "A vibrant Cantonese urban culture blended with a British colonial inheritance"
  - "A food-obsessed culture famous for dim sum, roast goose and world-class street food"
  - "Shop-till-you-drop consumer energy and a world-leading financial-hub dynamism"
  - "The lai see (red packet) tradition and deep-rooted festivals such as Lunar New Year, the Mid-Autumn Festival and the Dragon Boat Festival"
prideOf:
  - "Its global financial role and skyline"
  - "Cantonese cuisine and the city's culinary reputation"
  - "A resilient, international and fast-moving character"
animals:
  popular:
    - "Barking deer (muntjac) and East Asian porcupines in the country parks"
    - "Pink Indo-Pacific humpback dolphins (in the Pearl River estuary)"
    - "Rhesus macaques and white-bellied sea eagles"
  unique:
    - "Hong Kong's surprisingly wild country parks cover about 40% of the territory, home to leopard cats and rare migratory birds"
industries:
  - "Financial and business services — a top global banking and wealth-management hub"
  - "Trade, logistics and the container port"
  - "Tourism and hospitality"
  - "Property, professional services and technology"
sports:
  - "Football (soccer) and the Hong Kong Premier League"
  - "Basketball and badminton"
  - "Swimming, hiking and water sports — plus the famous Dragon Boat races"
  - "Table tennis and snooker"
