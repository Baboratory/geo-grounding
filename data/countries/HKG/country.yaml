flagEmoji: "🇭🇰"
capital: "Hong Kong (no separate capital; the city and territory form one 'city-state')"
isSovereign: false
# Classified dependent-territory: Hong Kong is a Special Administrative Region (SAR)
# of the People's Republic of China, not a sovereign state. A high-density,
# subtropical metropolis of ~7.5 million on the Pearl River estuary. A single
# synthetic WHOLE region per the governance rule for non-sovereign ISO 3166-1
# entries (despite its Kowloon / Hong Kong Island / New Territories split, which are
# geographic and administrative rather than culturally distinct curated regions).
governanceType: dependent-territory
iso3166_2_prefix: null
hasSubdivisions: false
