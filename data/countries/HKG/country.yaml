# Chinese and English are the official languages of Hong Kong (Basic Law). Cantonese
# (yue) is the dominant everyday language (~85%); Mandarin (within the zho
# macrolanguage) and English are also widely used. LocallySpoken shares are estimates.
ethnicGroups:
  - group: Han Chinese (including Cantonese, and mainland-origin Han)
    percent: 92.0
    sourceId: wp-ethnic
  - group: Other Asian (Filipino, Indonesian, Indian, Nepali and other Asian)
    percent: 7.0
    sourceId: wp-ethnic
  - group: Other (European and other)
    percent: 1.0
    sourceId: wp-ethnic
timezones:
  - name: Asia/Hong_Kong
    standardUtcOffset: "UTC+8"
    observesDst: false
# Hong Kong is on Hong Kong Time, UTC+8 all year, with no DST (same standard time
# as mainland China, which sits entirely in UTC+8).
currency:
  code: HKD
  symbol: "$"
  name: Hong Kong dollar
legalConstraints:
  - topic: "official language"
    description: "Chinese and English are the official languages of Hong Kong, per the Basic Law (Art. 9) and the Official Languages Ordinance; Cantonese is the dominant spoken Chinese variety."
    sourceId: wp-lang
  - topic: "Special Administrative Region status"
    description: "Hong Kong is a Special Administrative Region of the People's Republic of China under the 'one country, two systems' principle, with its own Basic Law (1997) granting the HKSAR executive, legislature and judiciary a high degree of autonomy; the Chief Executive heads a government whose Basic Law arrangement was amended by Beijing in 2025."
    sourceId: wp-politics
  - topic: "common law legal system"
    description: "Hong Kong retains a common-law legal system largely inherited from its British colonial period (1842–1997), distinct from mainland China's civil-law tradition; English remains a language of law and official documents."
    sourceId: wp-politics
  - topic: "national security and autonomy tightening"
    description: "Since 2020 the National Security Law for Hong Kong (and the 2023 and 2025 Basic Law amendments) have shifted authority over security and appointments toward Beijing, a live topic in assessments of the SAR's autonomy."
    sourceId: wp-culture
paymentCulture:
  popularMethods:
    - "Octopus card — the ubiquitous stored-value smart card for transit, shops and restaurants"
    - "MOBILE payments (AlipayHK, WeChat Pay HK, Apple Pay and Google Pay contactless)"
    - "Credit and debit cards accepted virtually everywhere"
  tipping:
    expected: false
    typicalAmount: "A small discretionary tip in high-end restaurants is appreciated but not required"
    autoIncludedInBill: false
    note: "Tipping is not generally expected; a 10% service charge is often already added in restaurants."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "A fast-paced, transactional urban culture with a blend of Cantonese warmth and British-influenced formalities. Politeness matters, and saving face is respected in business."
  greetingNorms: "Greet with a smile and a handshake; 'Nei hou' (你好) in Cantonese or 'hello' in English. Given names are used after initial acquaintance."
  meetingEtiquette: "Meetings are businesslike and efficient; punctuality is expected; business cards are exchanged with two hands and a moment's respect."
  topicsToAvoid:
    - "The political status of Hong Kong, Taiwan or the China relationship in sensitive contexts"
    - "Assuming an individual's stance on mainland-China politics"
  giftGivingNotes: "Gift-giving is common and generous during Chinese New Year (red packets, lai see); quality brand goods and food are well received."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
