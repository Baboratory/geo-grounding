businessRhythm:
  restDays: []
  notes: "Retail trading is not restricted by law to specific days. Shops and markets typically open around 8:00-9:00am and close 8:00-9:00pm on weekdays and Saturday, with shorter Sunday hours. Banks and offices run Monday-Friday, roughly 8:00am-5:00pm."
  typicalWorkHours: "Standard office hours are typically around 8:00am-5:00pm, Monday-Friday."
sources:
