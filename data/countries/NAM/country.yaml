timezones:
  - name: Africa/Windhoek
    standardUtcOffset: "UTC+2"
    observesDst: false
# Central Africa Time (CAT), UTC+2 year-round; Namibia abolished DST in 2017.
currency:
  code: NAD
  symbol: "N$"
  name: Namibian dollar
# The Namibian dollar (NAD, 100 cents) is issued by the Bank of Namibia since
# 1993; it is pegged at par to the South African Rand, which is also accepted.
legalConstraints:
  - topic: "official language"
    description: "English is the sole official language of Namibia (Constitution, Art. 3(1)). Other national languages may be used for legislative, administrative and judicial purposes in regions where substantial populations speak them (Art. 3(3))."
    sourceId: const-1990
  - topic: "wildlife trade"
    description: "Trade in controlled wildlife products (ivory, rhino horn, trophies) is regulated and restricted under the Controlled Wildlife Products and Trade Act 9 of 2008; hunting requires permits and poaching is a serious criminal matter."
    sourceId: law-wildlife
  - topic: "psychoactive substances"
    description: "Cannabis possession, use and dealing are criminalized under the Abuse of Dependence-Producing Substances and Rehabilitation Centres Act 41 of 1971 (as in force in Namibia)."
    sourceId: law-substances
paymentCulture:
  popularMethods:
    - "Cash (Namibian dollar) — common"
    - "Debit/credit cards (Visa/Mastercard) — widely accepted in towns"
    - "Bank transfer and mobile banking"
    - "South African Rand (ZAR) also accepted for payment (change given in NAD)"
  tipping:
    expected: false
    typicalAmount: "Restaurants 10-15% of the bill for good service (10% standard); safari guides ~US$10-20/guest/day; lodge staff tip-box; porters ~US$2/bag"
    autoIncludedInBill: false
    note: "Tipping is customary but not compulsory and generally not auto-included."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Formal titles and Mr/Ms/Mrs used in professional dealings; respect toward elders is paramount."
  greetingNorms: "Friendly handshake is customary; time is taken to ask after family and wellbeing before business ('Hello'/'Goeie dag'/'Hallo')."
  meetingEtiquette: "Appointments kept but may start mildly late; punctuality valued in business; build personal rapport first; decisions often top-down in hierarchical institutions."
  topicsToAvoid:
    - "Colonial-era land and ethnic sensitivities"
    - "Apartheid-era politics"
    - "Recent same-sex/marriage law debates"
  giftGivingNotes: "Gifts are uncommon in formal business (gratitude usually expressed verbally); small tokens may accompany personal hospitality; modesty expected."
