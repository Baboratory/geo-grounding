isSovereign: true
# Classified unitary-large: Namibia meets 2 of 3 DESIGN.md unitary-large
# criteria. (1) Population ~3.02M (2023 NSA census) — WELL BELOW the 20-25M
# threshold (FAIL). (2) Officially recognized regional/minority languages —
# Namibia formally recognizes 13 'national languages' with standardized
# orthography/literacy attached to specific regional speech communities:
# Khoekhoegowab, Oshikwanyama, Oshindonga, Otjiherero, Rukwangali,
# Rukwangali/Rumanyo, Thimbukushu, Silozi, Ju|'hoan, Setswana, plus
# Afrikaans, English and German. English is the sole de jure official
# language (Const. Art. 3(1)); the others are recognized regional/minority
# languages — this is the Guyana/Norway/Finland regional-language pattern,
# NOT the FJI/VUT 'multiple co-official national languages' pattern (PASS).
# (3) Widely recognized cultural-historical regional divide — a genuine,
# historically institutionalized divide: the Ovambo/Okavango north (~half the
# population, mahangu-based agrarian, Bantu languages), the central highlands
# (Herero + Windhoek), the sparse Nama/Damara south (Khoisan languages), and
# the Zambezi panhandle (Silozi-speaking riverine wetlands). This divide was
# literally institutionalized under the colonial homeland system (PASS).
# 2 of 3 met -> four curated regions + WHOLE.
governanceType: unitary-large
iso3166_2_prefix: NA
hasSubdivisions: true
