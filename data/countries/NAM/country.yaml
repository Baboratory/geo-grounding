# English is the sole official language (Const. Art. 3(1)); its official
# speakersShare of 1.0 is the legal-status flag, not a population share.
# Household-language shares are from the 2011 Population & Housing Census as
# compiled in the SSHOA multilingualism record (the NSA 2023 census language
# breakdown was not yet published at access). Oshiwambo is covered by its two
# literary codes kua (Oshikwanyama) + ndo (Oshindonga); figures are the
# household-language ESTIMATES.
