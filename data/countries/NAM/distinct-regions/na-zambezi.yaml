  restDays:
    - sunday
  typicalWorkHours: "Offices roughly 08:00-17:00 Mon-Fri; retail Mon-Sat."
  lunchBreakTiming: "Midday break commonly 12:00-14:00."
  notes: "Cash dominant; Katima Mulilo is the regional centre."
