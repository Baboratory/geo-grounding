businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices roughly 09:00-18:00/19:00; lunch is often taken around 13:00-14:00."
  lunchBreakTiming: "A moderate lunch break; a working lunch is common in the professional district."
  notableShutdownPeriods:
    - period: "Fiestas Patrias (September 18-19)"
      description: "The whole country (and capital) celebrates; activity pauses."
    - period: "February"
      description: "Austral summer; much of the capital empties for holidays and business slows."
  notes: "Santiago's winter brings the highest pollution/photo-chemical smog in the country; many people escape to the Andes or the coast at weekends."
