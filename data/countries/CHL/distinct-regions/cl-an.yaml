code: CL-AN
name:
  eng: Antofagasta Region
  local:
    - languageCode: spa
      value: Región de Antofagasta
climates:
  - koppenCode: BWh
    description: "Hyper-arid desert — one of the driest inhabited regions on Earth, with rainfall measured in millimeters and coastal fog (camanchaca)."
landmarks:
  - name: San Pedro de Atacama and Valle de la Luna
    description: "Gateway to the Atacama Desert's salt flats, dunes and Moon-valley landscape."
  - name: Salar de Atacama
    description: "The world's largest active lithium brine source and a flamingo- and salt-flat ecosystem."
  - name: Chuquicamata
    description: "One of the world's largest open-pit copper mines (near Calama)."
  - name: El Tatio Geysers
    description: "A high-altitude geyser field at over 4,300 m."
  - name: Humberstone and Santa Laura Saltpeter Works
    description: "UNESCO-listed ghost towns of the nitrate (salitre) boom era."
    unescoWorldHeritage: true
culturalTraits:
  - "The mining and desert heart of Chile — copper, lithium and the legacy of the nitrate era"
  - "Atacameño (Lickanantay) indigenous heritage around San Pedro"
  - "A frontier, desert-basin identity shaped by mining camps and the Atacama emptiness"
  - "World-class astronomy — the region hosts many of the planet's largest telescopes"
prideOf:
  - "Being the world's copper and lithium powerhouse"
  - "The surreal landscapes of the Atacama Desert"
  - "Hosting the European Southern Observatory (Paranal) and ALMA"
  - "The UNESCO-listed nitrate-era pampas towns"
