entertainment:
  - season: allYear
    items:
      - "Live Seychellois Creole music — sega and moutya dance performances at hotels, resorts and cultural evenings"
      - "Diving, snorkelling, kayaking and fishing in the marine national parks (e.g. Sainte Anne Marine National Park off Mahé)"
      - "Beach leisure on Mahé, Praslin and La Digue — the islands' core leisure offering"
      - "Football, volleyball and athletics"
      - "Cultural festivals and events, e.g. the Carnaval International de Victoria (spring) and Festival Kreol (October/November)"
      - "Local nightlife in Victoria and the resort areas, and cooking/garden excursions"
traditionalDishes:
  - season: allYear
    items:
      - "Grilled fish (e.g. red snapper) and fish curry cooked in coconut milk — the staples of Seychellois cuisine"
      - "Ladob — a sweet dessert of fruit (coconut or plantain) simmered in coconut milk until creamy"
      - "Satini (chutney) — fresh fruit/vegetable relishes served with grilled fish; and rougaille, a rich tomato-based creole stew"
      - "Shark chutney and kari gato — coconut-based sides reflecting the African-creole heritage"
      - "Breadfruit, cassava and plantain dishes, plus fresh tropical fruit (mango, papaya, banana, starfruit)"
      - "Fruit bat curry (a traditional dish on Mahé) and cari zourite (octopus curry)"
      - "Seychellois teas/coffees and local rums and wines, often enjoyed at relaxed seaside meals"
traditionalClothing:
  - season: allYear
    items:
      - "Light, breathable, bright-coloured clothing suited to the tropical climate (loose cottons, sandals)"
      - "Kanga/madras-influenced print fabrics and colourful dresses worn on festive occasions"
      - "Modest, relaxed resort wear on beaches; slightly dressier, modest attire at churches, offices and formal functions"
      - "Sarong-style wraps and casual shirts for men in beach settings"
businessRhythm:
  restDays:
    - saturday
    - sunday
  typicalWorkHours: "The standard working week runs Monday to Friday, roughly 08:30-16:30 for most offices and shops, with many shops closing early on Saturday and most businesses closed on Sunday. Banking hours are commonly 08:30-12:30, Monday to Friday. Under the Employment Act (Chapter 69) the standard working week is around 45 hours, with premium overtime rates for Saturday/Sunday and public-holiday work."
  lunchBreakTiming: "A standard midday meal break is customary, most commonly around 12:00-13:00, often taken as a full hour in offices. Many shops and offices pause or close briefly for lunch."
  notableShutdownPeriods:
    - period: "Public holidays (New Year, Good Friday & Easter Monday, Labour Day 1 May, Constitution Day 18 June, Independence Day 29 June, Assumption 15 August, All Saints 1 November, Christmas 25 December)"
      description: "Offices and most businesses close on these national public holidays; retail and the tourism sector tend to stay partly open around Christmas/New Year and Easter."
    - period: "Christmas-New Year and Easter holiday weeks"
      description: "Peak holiday periods; government offices and many businesses run on reduced staff while the tourism sector is at its busiest."
  notes: "The Monday-Friday working week with the Saturday-Sunday weekend shapes the business year. The Seychelles is predominantly Christian, so the Christian public-holiday calendar (Good Friday, Assumption, Christmas) drives closures. Tourism, the dominant sector, operates year-round and is at its busiest in the drier seasons and around Christmas/New Year."
  sourceIds:
    - syc-employment
