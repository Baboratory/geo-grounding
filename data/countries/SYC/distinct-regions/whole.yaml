# Generic country-wide fallback content for the Seychelles (unitary-small, single
# synthetic whole-country region). Used via the 'whole-country-fallback' path.
climates:
  - koppenCode: Af
    description: "Tropical rainforest (Af) — dominant across the granitic and coralline islands. A warm, near-equatorial maritime climate with little seasonal temperature variation (typical 24-31°C year-round) and high, fairly evenly distributed rainfall. The wetter season runs with the northwest monsoon (roughly December-March); a drier, windier spell comes with the southeast trade winds (roughly May-October), yet no month is truly dry. Because rainfall is high and year-round, the generally assigned Köppen class is tropical rainforest (Af)."
  - koppenCode: Am
    description: "Tropical monsoon (Am) — applied in some classifications to the same islands, emphasising the pronounced northwest-monsoon wet period (roughly December-March) versus the markedly drier southeast-trade-wind season (roughly May/June-October). Coastal/leeward sites that dry more in the SE-trade season can sit at the Af/Am boundary."
landmarks:
  - name: Morne Seychellois (Morne Seychellois National Park)
    description: "The highest peak in the Seychelles (~905 m) on Mahé, within the Morne Seychellois National Park that protects the island's forested granite mountains, waterfalls and rare endemic flora and fauna; popular hiking destination."
  - name: Vallée de Mai, Praslin (UNESCO World Heritage)
    description: "A primeval palm forest on Praslin, designated a UNESCO World Heritage Site in 1983 — the natural stronghold of the endemic coco de mer palm and home of the rare Seychelles black parrot."
    unescoWorldHeritage: true
  - name: Anse Source d'Argent, La Digue
    description: "One of the world's most photographed beaches, on La Digue, famous for its giant pink-granite boulders, shallow turquoise lagoon and white sand."
  - name: Beau Vallon, Mahé
    description: "Mahé's best-known and longest stretch of beach, on the island's north-west coast; the island's main public beach with gentle swimming, watersports and sundown atmosphere."
  - name: Victoria Clock Tower
    description: "The Victorian cast-iron clock tower erected in 1903 in central Victoria, Mahe — a miniature replica of London's 'Little Ben' and the capital's most iconic landmark."
culturalTraits:
  - "A rich Seychellois Creole culture blending African, European (French and British) and Asian (Indian, Chinese) influences"
  - "Traditional music and dance — moutya, sega, kanmtole (a costumed dance) — rooted in slave-era and colonial expression"
  - "A nation with no indigenous population, descended from the French settlers, African and South Indian labourers who arrived from 1770"
  - "Predominantly Roman Catholic observance with festive public holidays (Good Friday, Assumption, Christmas, New Year)"
  - "A welcoming, laid-back island ethos built around family, community and hospitality"
  - "French-based Seychellois Creole (Kreol Seselwa) as the language of everyday life"
prideOf:
  - "Pristine granite and coral beaches, clear turquoise seas and one of the world's most protected marine environments"
  - "Africa's smallest and one of its highest-income countries — a model of tourism-led prosperity"
  - "Extraordinary endemic wildlife — the Aldabra giant tortoise, the Seychelles black parrot and the coco de mer"
  - "Their distinctive Creole culture, music and warm hospitality"
  - "A reputation as the world's premier luxury eco-tourism island destination"
animals:
  popular:
    - "Whale sharks — reliable sightings year-round off Mahé, especially in the north-west monsoon season"
    - "Spinner and other dolphins"
    - "Green and hawksbill sea turtles (nesting beaches across the islands)"
    - "Large fruit bats 'flying foxes' (endemic Pteropus seychellensis) roosting over the capitals at dusk"
    - "Colourful coral reef fish and parrotfish"
  unique:
    - "Aldabra giant tortoise (Aldabrachelys gigantea) — among the world's largest tortoises, endemic to the Aldabra Atoll (UNESCO World Heritage Site)"
    - "Seychelles black parrot (Coracopsis barklyi) — endemic to the Vallée de Mai on Praslin"
    - "Coco de mer (Lodoicea maldivica) — the endemic coco-de-mer palm of Praslin and Curieuse producing the world's largest seed (the 'love nut')"
    - "Seychelles magpie-robin and Seychelles warbler — endemic songbirds rescued from near-extinction on small islands"
    - "Seychelles sunbird and Seychelles white-eye — endemic birds"
industries:
  - "Tourism — the dominant sector, roughly a quarter of GDP and the largest employer, built on beach, diving and eco-tourism"
  - "Tuna fishing and canning — the Seychelles hosts some of the world's largest canned-tuna processing plants and is a major Indian Ocean tuna exporter"
  - "Offshore financial services — an established international financial centre (International Business Companies Act 1994; licenced by FSA/IFSA)"
  - "Fisheries, small-scale manufacturing (brewery, cigarettes, tuna canning) and construction"
  - "Petroleum re-export/storage and port services"
sports:
  - "Football (soccer) — the most popular sport, with a vibrant local league and a strong national-team following"
  - "Athletics and boxing — long-standing strength with consistent international success"
  - "Basketball and volleyball"
  - "Sailing, fishing and diving — both pastime and tourism mainstays"
  - "Esports and beach sports growing among the youth"
