code: PG-MBA
name:
  eng: Milne Bay Province
  local:
    - languageCode: tpi
      value: Milne Be Provins
climates:
  - koppenCode: Af
    description: Tropical rainforest climate across the easternmost islands and the Milne Bay coast, with a strong wet season.
landmarks:
  - name: Alotau
    description: The provincial capital and seat of the famous Milne Bay (Battle of Milne Bay, 1942) region.
  - name: The kula ring and ancient trading networks
    description: The famed prehistoric kula ring (shell-currency) trade that connected the islands of Milne Bay.
  - name: The D'Entrecasteaux Islands
    description: A volcanic island group (Fergusson, Goodenough and Normanby) northeast of the mainland, known for hot springs, birdwatching and surrounding coral reefs.
  - name: The Trobriand Islands
    description: Remote coral atolls and islands, including Kiriwina of the Trobriand group, with a renowned dance culture.
culturalTraits:
  - "An island province of some 600+ islands with a deep-seafaring heritage and the historic kula ring shell-currency trade"
  - "Known for the famous Trobriand and Bougainville-rainbow clamp-dancing cultures and cultural exchange"
prideOf:
  - "The kula ring and the great maritime trading history"
  - "The world-class reefs and the resilient climate-vulnerable island communities"
animals:
  popular:
    - Green and hawksbill turtles
    - Dugong (protected)
    - Sharks and rays of the reefs
  unique:
    - Victoria crowned pigeon
industries:
  - Fisheries and aquaculture (beche-de-mer, trochus, tuna)
  - Copra and coconut oil production
  - Tourism and dive tourism
  - Small-scale agriculture (yam, taro, banana)
sports:
  - Canoeing and sailing
  - Rugby league
  - Association football
  - Traditional canoe regattas
entertainment:
  - season: allYear
    items:
