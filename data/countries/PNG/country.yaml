alpha3: PNG
alpha2: PG
name:
  eng: Papua New Guinea
  local:
    - languageCode: tpi
      value: Papua Niugini
    - languageCode: eng
      value: Papua New Guinea
    - languageCode: hmo
      value: "Gau Hedinarai ai Papua-Matamata Guinea"
flagEmoji: "🇵🇬"
capital: Port Moresby
isSovereign: true
# Classified unitary-large: although Papua New Guinea's official population
# estimate (~11.78M, 2021) sits around the small-state boundary, it meets the
# DESIGN.md criteria for real subdivision on the other two legs decisively:
# (1) an extraordinary, formally recognized cultural-linguistic divide — over
# 800 living indigenous languages across 22 provinces, with Tok Pisin, English
# and Hiri Motu recognized by the Constitution and PNG Sign Language added in
# 2015; and (2) recognized region-level political identities (provincial
# governments with elected governors, plus the Autonomous Region of
# Bougainville with its own constitution and autonomy). Real ISO 3166-2
# province codes (PG-xx) are used; WHOLE is the national fallback.
governanceType: unitary-large
iso3166_2_prefix: PG
hasSubdivisions: true
regionCoverage:
  # Count per ISO 3166-2 as of 2026-09. The uncurated units have NOT yet been
  # tested against DESIGN.md's five coverage triggers -- this declaration records
  # the gap so it is visible, not a finding that the gap is correct. Pending the
  # coverage re-audit (see TODO.md).
  tier: first-level
  totalUnits: 22
  status: partial
  gapReason: "5 of 22 first-level units curated. Which of the
    remaining units fire a coverage trigger has not been assessed yet -- the
    curated set predates the coverage floor and was chosen by size/capital,
    not by divergence. Queued for the coverage re-audit."
