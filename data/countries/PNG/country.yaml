    speakersShare: 0.02
    sourceId: ethnologue-png
# Papua New Guinea's Constitution (1975) recognizes Tok Pisin, English and Hiri
# Motu as the country's official languages; Papua New Guinean Sign Language was
# added as a fourth recognized language in 2015. Tok Pisin is the most widely
# spoken, serving as the national lingua franca across many of the country's
# 800+ indigenous languages. The 2011 census reported ~68% literacy in Tok
# Pisin; Hiri Motu is mainly spoken in the Port Moresby / Papuan coastal area,
# and English is used in government, education and commerce. The remaining
# hundreds of indigenous languages are locally spoken in their provinces.
ethnicGroups:
  - group: Melanesian (Papuan and Austronesian-speaking peoples)
    percent: 96.0
    sourceId: dfat-png
  - group: Micronesian and Polynesian (small island minorities)
    percent: 3.0
    sourceId: dfat-png
  - group: Non-indigenous (expatriate citizens and residents)
    percent: 1.0
    sourceId: dfat-png
timezones:
  - name: Pacific/Port_Moresby
    standardUtcOffset: "UTC+10"
    observesDst: false
currency:
  code: PGK
  symbol: "K"
  name: Papua New Guinean kina
legalConstraints:
  - topic: "goods and services tax"
    description: "A Goods and Services Tax (GST) of 10% applies to the sale of goods and services in Papua New Guinea and to imports, collected by the Internal Revenue Commission under the Goods and Services Tax Act."
    sourceId: gst-png
  - topic: "consumer protection and competition"
    description: "The Independent Consumer and Competition Commission Act 2002 establishes the ICCC to promote competition and fair trading, regulate the prices of certain goods and services, and protect consumers' interests."
    sourceId: iccc-act-png
  - topic: "data protection"
    description: "There is currently no comprehensive personal-data-protection statute; a National Data Governance and Data Protection Policy 2024 (DICT) and a draft Data Governance and Data Protection Bill (2026) have been published for consultation to establish a coherent national framework."
    sourceId: dikph-png
paymentCulture:
  popularMethods:
    - "Cash is very widely used, particularly in rural and informal markets (the informal sector is large)"
    - "Mobile money and e-wallets (notably Bank South Pacific's bmobile and Digicel/MiCash-style services) are spreading in urban areas"
    - "Bank transfers and cards are common in business and in Port Moresby"
    - "The kina is the sole legal tender"
  tipping:
    expected: false
    autoIncludedInBill: false
    typicalAmount: "Tipping is not customary; service is generally included and gratuities are uncommon outside tourist-facing hotels in Port Moresby."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Respect for elders, chiefs and authority is central; use titles and clan/social standing with deference. Non-verbal cues and relationship-building matter more than directness."
  greetingNorms: "A smile with a nod or light handshake is standard; in Tok Pisin, 'Gude?' (Hello) is a common opener. In many communities greeting includes exchange of pleasantries about clan and home."
  meetingEtiquette: "Meetings open with relationship-building and community protocols; decisions are often consensus-based and involve clan/community consultation. Silence and patience are respected, and open confrontation is avoided."
  topicsToAvoid:
    - "Recent electoral violence and perceptions of government corruption (politically sensitive)"
    - "Tensions around the Autonomous Region of Bougainville and historical conflicts"
    - "Asking directly about a person's clan or sensitive tribal affiliations early in acquaintance"
  giftGivingNotes: "Gifts and reciprocity (the 'wantok' system) matter; modest, useful gifts are appreciated, and gifting is part of maintaining relationships. Avoid extravagant gifts that create obligation."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
  - code: PG-NCD
