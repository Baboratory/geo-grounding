  - code: PG-EHG
    file: distinct-regions/pg-ehg.yaml
    adminUnitCodes: [PG-EHG]
  - code: PG-NSB
    file: distinct-regions/pg-nsb.yaml
    adminUnitCodes: [PG-NSB]
  - code: PG-MPM
