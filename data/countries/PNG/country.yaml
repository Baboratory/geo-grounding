sources:
  - id: constitution-png-1975
    name: "Constitution of the Independent State of Papua New Guinea (1975)"
    publisher: "Independent State of Papua New Guinea"
    url: "https://www.paclii.org/pg/legis/consol_act/cotisopng534/"
    year: 1975
    accessedDate: "2026-09-21"
    note: "Recognizes Tok Pisin, English and Hiri Motu as official languages (preamble s.2(11) on literacy in Pisin/Hiri Motu/English, and ss.67-68 on citizenship language requirements); PNG Sign Language recognized in 2015."
  - id: census-png-2011
    name: "2011 National Population and Housing Census (language literacy)"
    publisher: "National Statistical Office of Papua New Guinea"
    url: "https://www.nso.gov.pg/"
    year: 2011
    accessedDate: "2026-09-21"
    note: "~68% of the population aged 10+ reported literacy in Tok Pisin; overall literacy ~67.6%."
  - id: ethnologue-png
    name: "Ethnologue: Languages of Papua New Guinea"
    publisher: "SIL International (Ethnologue)"
    url: "https://www.ethnologue.com/country/PG/languages"
    year: 2024
    accessedDate: "2026-09-21"
    note: "Speaker estimates for Tok Pisin (majority, lingua franca), Hiri Motu (~100,000 L2) and English (small L1 minority; used as second language in government/business)."
  - id: dfat-png
    name: "Papua New Guinea country brief"
    publisher: "Australian Government, Department of Foreign Affairs and Trade"
    url: "https://www.dfat.gov.au/geo/papua-new-guinea/papua-new-guinea-country-brief"
    year: 2025
    accessedDate: "2026-09-21"
    note: "Population ~11.78M (2021); mostly Melanesian, divided into 22 provinces plus the Autonomous Region of Bougainville and the National Capital District; over 800 known languages."
  - id: gst-png
    name: "Goods & Services Tax (10%)"
    publisher: "Internal Revenue Commission of Papua New Guinea"
    url: "https://irc.gov.pg/tax-information/goods-services-tax"
    year: 2024
    accessedDate: "2026-09-21"
    note: "GST at 10% on goods and services sold or imported into PNG."
  - id: iccc-act-png
    name: "Independent Consumer and Competition Commission Act 2002"
    publisher: "Independent State of Papua New Guinea"
    url: "https://iccc.gov.pg/"
    year: 2002
    accessedDate: "2026-09-21"
    note: "Establishes the ICCC to promote competition and fair trading, regulate prices and protect consumers."
  - id: dikph-png
    name: "National Data Governance and Data Protection Policy 2024 and draft Data Governance and Data Protection Bill 2026"
    publisher: "Department of Information and Communications Technology, Government of Papua New Guinea"
    url: "https://www.ict.gov.pg/ndgdpp"
    year: 2024
    accessedDate: "2026-09-21"
    note: "No comprehensive data-protection statute yet; policy and draft Bill published for consultation to establish a national framework."
  - id: iso-tpi
    name: "ISO 639-3 entry: tpi - Tok Pisin"
    publisher: "SIL International (ISO 639-3 Registration Authority)"
    url: "https://iso639-3.sil.org/code/tpi"
    year: 2026
    accessedDate: "2026-09-21"
    note: "Verifies ISO 639-3 code tpi = Tok Pisin (Individual, Living)."
  - id: iso-hmo
    name: "ISO 639-3 entry: hmo - Hiri Motu"
    publisher: "SIL International (ISO 639-3 Registration Authority)"
    url: "https://iso639-3.sil.org/code/hmo"
    year: 2026
    accessedDate: "2026-09-21"
    note: "Verifies ISO 639-3 code hmo = Hiri Motu (Individual, Living). Note the ISO 639-1 code is 'ho' but the 639-3 code is 'hmo'."
