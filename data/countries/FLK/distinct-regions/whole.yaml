code: WHOLE
name:
  eng: Falkland Islands
  local:
    - languageCode: eng
      value: Falkland Islands
climates:
  - koppenCode: ET
    description: Tundra/maritime subpolar climate, cool and windy year-round with frequent cloud and rainfall; summers are short and cool.
landmarks:
  - name: Christ Church Cathedral (Stanley)
    description: The southernmost Anglican cathedral in the world, famously framed by whale-bone arches.
  - name: Mount Pleasant and the Falklands' battle sites
    description: RAF Mount Pleasant is the main base; the territory's historical sites from the 1982 conflict are a focus for visitors.
  - name: West Falkland wilderness
    description: Vast, largely unpopulated moorland and coastline home to abundant seabirds and wildlife.
culturalTraits:
  - A small, close-knit British-heritage island community
  - A strong sheep-farming (wool) tradition historically central to island life
  - Defence of remote-island sovereignty and a distinctly self-reliant culture
prideOf:
  - The islands' untamed wildlife and unspoilt environment
  - A dignified and resilient community history through the 1982 conflict
  - The southernmost cathedral and the islands' unique identity
animals:
  popular:
    - Rockhopper and Gentoo penguins
    - Southern sea lions
    - Kelp goose
  unique:
    - Falkland steamer duck (non-flying endemic)
    - Black-browed albatross (large breeding colonies)
industries:
  - Fishing (patagonian squid and finfish under licence)
  - Tourism (cruise visits and wildlife-watching)
  - Sheep farming (wool)
  - Hydrocarbon exploration in surrounding waters
sports:
  - Football
  - Rugby
  - Fishing and sea-angling
  - Golf
