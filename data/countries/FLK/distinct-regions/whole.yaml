  - season: allYear
    items:
      - Squid and other locally caught seafood
      - Lamb and mutton (reflecting the islands' sheep-farming heritage)
      - Fish pie
traditionalClothing:
  - season: allYear
    items:
      - Warm, windproof outdoor clothing (fleece, waterproofs) suited to the cool maritime climate
      - Knitted jumpers (fisherman/guernsey-style) from the sheep-farming tradition
