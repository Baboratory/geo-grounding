businessRhythm:
  lunchBreakTiming: "Businesses in Stanley typically observe a short midday break; many smaller shops keep informal hours, and opening is often seasonal around the cruise-ship calendar."
  typicalWorkHours: "Monday-Friday around 8:30am-12:30pm and 1:00/1:30pm-5:00pm, with most offices and shops closed on weekends."
  restDays:
    - saturday
    - sunday
  notes: "The very small population and dependence on shipping and air links mean services can be irregular; many tourist-facing businesses operate mainly during the October-March cruise season."
