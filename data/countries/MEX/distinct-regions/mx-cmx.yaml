code: MX-CMX
name:
  eng: Mexico City (Ciudad de México)
  local:
    - languageCode: spa
      value: Ciudad de México
climates:
  - koppenCode: Cwb
    description: "Subtropical highland climate on the central plateau, mild year-round with a distinct dry season and a wetter summer."
landmarks:
  - name: Zócalo and the Metropolitan Cathedral
    description: "The vast central square of Mexico City, flanked by the Cathedral and the National Palace."
  - name: Templo Mayor
    description: "The ruins of the Aztec Great Temple, excavated in the historic centre, a UNESCO World Heritage site complex."
  - name: Palacio de Bellas Artes
    description: "The ornate arts palace, home to murals by Diego Rivera and Mexico's great cultural stage."
  - name: Chapultepec Castle
    description: "The 19th-century hilltop castle now housing the National Museum of History."
  - name: Xochimilco
    description: "The ancient canal and floating-garden district, a UNESCO World Heritage Site of chinampa agriculture."
    unescoWorldHeritage: true
culturalTraits:
  - "Mexico's capital and one of the largest cities on Earth, at the heart of national life"
  - "A world cultural capital of museums, murals, food and the arts"
  - "A layered city of Aztec, colonial and modern histories"
prideOf:
  - "Being the political, cultural and economic capital of Mexico"
  - "World-class museums, gastronomy and artistic heritage"
  - "Resilience and vibrancy despite its scale"
