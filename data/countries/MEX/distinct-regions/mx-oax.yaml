climates:
  - koppenCode: Cwb
    description: "Mild highland climate in the Oaxaca Valley and city, warm days and cool nights with a distinct dry and wet season."
  - koppenCode: Aw
    description: "Tropical savanna climate on the Pacific coast (Puerto Escondido, Huatulco), warm year-round with a strong wet season."
landmarks:
  - name: Monte Albán
    description: "The ancient Zapotec hilltop city above the Oaxaca Valley, a UNESCO World Heritage Site."
    unescoWorldHeritage: true
  - name: Santo Domingo church and botanical garden
    description: "The baroque 16th-century church and its adjoining gardens in the heart of Oaxaca city."
  - name: Hierve el Agua
    description: "The cliff-side petrified 'scalding water' waterfalls and natural pools in the Mixes highlands."
  - name: Puerto Escondido
    description: "The surf and beach town on the Pacific coast, famed for its waves and relaxed vibe."
culturalTraits:
  - "The most culturally and linguistically diverse state in Mexico, with 16 recognized indigenous peoples (Zapotec, Mixtec, etc.)"
  - "A world-famous culinary capital of Mexico (the 'seven moles', mezcal, tlayudas)"
  - "A living tradition of Indigenous arts, crafts and community life (Guelaguetza festival)"
prideOf:
  - "Extraordinary indigenous diversity and heritage"
  - "Being Mexico's culinary capital"
  - "The warmth of community festivals (Guelaguetza, Day of the Dead)"
animals:
  popular:
