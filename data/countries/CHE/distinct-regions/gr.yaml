code: CH-GR
name:
  eng: Grisons
  local:
    - languageCode: deu
      value: Graubünden
    - languageCode: roh
      value: Grischun
    - languageCode: ita
      value: Grigioni
climates:
  - koppenCode: Cfb
    description: Temperate climate in the populated valleys (Chur, Prättigau, the lower Engadine) — but Switzerland's most elevation-extreme canton by far (roughly 260m to 4,049m), so this single code covers only the inhabited valley floor; high-alpine areas stay snow-covered year-round while the southern valleys are mild enough for vineyards and even olives.
landmarks:
  - name: Swiss National Park
    description: Switzerland's only national park, established 1914, in the canton's southeast.
  - name: Rhaetian Railway (Albula/Bernina lines)
    description: UNESCO World Heritage-listed scenic railway, including the Bernina line's crossing of the Alps without a rack system.
  - name: Tarasp Castle
    description: Medieval hilltop castle in the Engadine.
  - name: St. Moritz and Davos
    description: World-famous winter-sports resorts; St. Moritz hosted the Winter Olympics in 1928 and 1948.
culturalTraits:
  - Switzerland's only trilingual canton (German, Romansh, Italian) and home to most of the country's remaining Romansh speakers
  - World-famous alpine winter-sports tourism (St. Moritz, Davos) alongside a working mountain-agriculture and dairy/alpine-cheese tradition
  - Romansh folk culture (wood carving, embroidery, its own literature and folk music) actively maintained as a living minority language, not treated as historical/heritage-only
prideOf:
  - Being home to Switzerland's only national park and the country's Romansh-language heartland
  - St. Moritz's Winter Olympics legacy (1928, 1948) and the resort's continued international prestige
  - The UNESCO-listed Rhaetian Railway's Alpine crossings
industries:
  - Tourism (winter sports and wellness/spa resorts)
  - Mountain agriculture and alpine dairy/cheese production
  - Hydroelectric power
  - Viticulture in the Bündner Herrschaft (chiefly Pinot Noir)
sports:
  - Alpine skiing and winter sports (St. Moritz, Davos)
  - Ice hockey (HC Davos)
