businessRhythm:
  restDays:
    - sunday
  notes: "Unlike CH-ZH/CH-GE/CH-TI, Graubünden has no single canton-wide shop-hours schedule of its own — the canton's Gesetz über die öffentlichen Ruhetage (BR 520.100) sets which days count as public rest days, but concrete opening windows are fixed municipality by municipality. Chur, the cantonal capital and largest town, is a representative example: shops may open Mon-Fri 6:00am-8:00pm and Saturday 6:00am-6:00pm under the city's own Gesetz über die Ladenöffnungszeiten, closed by default on Sundays and public holidays — with up to 4 exceptional Sunday-opening days a year permitted (Chur designated 13 and 20 December 2026), the same federal-baseline ceiling as CH-ZH/CH-GE/CH-TI. The cantonal government has publicly backed a pending federal bill (LadÖG) to raise that ceiling to 12 Sundays nationwide; not yet in force as of the access date below."
  sourceIds: [gr-chur-ladenoeffnungszeiten, gr-sonntagsverkauf-liberalisierung]
sources:
  - id: gr-chur-ladenoeffnungszeiten
    name: "Ladenöffnungszeiten (Shop opening hours)"
    publisher: "Stadt Chur"
    url: "https://www.chur.ch/gewerbeinchur/331"
    accessedDate: "2026-09-14"
    note: "Chur's weekday (6:00am-8:00pm) and Saturday (6:00am-6:00pm) shop-hours window, the default Sunday/holiday closure, and the two designated 2026 shopping Sundays (13 and 20 December)."
  - id: gr-sonntagsverkauf-liberalisierung
    name: "Sonntagsverkauf, Sonntagsbrötchen und mehr: Die Regierung nimmt Stellung zu flexibleren Ladenöffnungszeiten"
    publisher: "Südostschweiz"
    url: "https://www.suedostschweiz.ch/graubuenden/sonntagsverkauf-sonntagsbroetchen-und-mehr-die-regierung-nimmt-stellung-zu-flexibleren-ladenoeffnungszeiten"
    accessedDate: "2026-09-14"
    note: "The canton currently permits up to 4 exceptional Sunday-opening days a year (same federal-baseline number as CH-ZH/CH-GE/CH-TI); the cantonal government's public support for a pending federal bill (LadÖG) to raise that ceiling to 12, with final say resting with the federal Parliament."
