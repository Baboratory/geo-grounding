entertainment:
  - season: spring
    items:
      - "Sechseläuten (April): guild parade and the burning of the Böögg"
  - season: summer
    items:
      - Zürich Openair (music festival)
      - Street Parade (techno/electronic music parade, August)
  - season: winter
    items:
      - Christmas markets (e.g. at the main railway station)
traditionalDishes:
  - season: allYear
    items:
      - Zürcher Geschnetzeltes (veal in cream sauce, typically served with Rösti)
  - season: winter
    items:
      - Tirggel (thin, spiced honey biscuit, traditionally made around Christmas)
traditionalClothing:
  - season: allYear
    items:
      - Zunft (guild) costumes worn during Sechseläuten
seasonCalendar:
  - season: spring
    months: [3, 4, 5]
  - season: summer
    months: [6, 7, 8]
  - season: autumn
    months: [9, 10, 11]
  - season: winter
    months: [12, 1, 2]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Retail hours in the canton are generally within a legal window of roughly 6am-10pm on weekdays/Saturday; specific store hours vary by municipality within that window."
  notes: "Shops must generally stay closed on Sundays/public rest days (§5 Abs. 1 RLG), with cantonal exceptions for public-transport hubs, pharmacies, dairy/milk shops, bakeries, flower shops, kiosks, and small shops (§5 Abs. 2 RLG, §3 VRLG). Municipalities may additionally designate up to 4 'shopping Sundays' a year on which staff can work without a special permit (§5 Abs. 3 RLG) — the canton has repeatedly debated raising that to 12, but as of verification this remained a proposal without a majority, not enacted law."
sources:
  - id: zh-ladenoeffnung-ruhetage
    name: "Ladenöffnungszeiten & Ruhetage (Shop opening hours & rest days)"
    publisher: "Kanton Zürich, Amt für Wirtschaft und Arbeit"
    url: "https://www.zh.ch/de/wirtschaft-arbeit/arbeitsbedingungen/arbeitsssicherheit-gesundheitsschutz/arbeits-ruhezeiten/ladenoeffnung-ruhetage.html"
    accessedDate: "2026-09-11"
    note: "The Sunday-closure default, its cantonal-law exceptions, and the 4-shopping-Sundays-per-year rule referenced in businessRhythm.notes above."
