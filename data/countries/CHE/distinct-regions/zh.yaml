code: CH-ZH
name:
  eng: Zurich
  local:
    - languageCode: deu
      value: Zürich
climates:
  - koppenCode: Cfb
    description: Oceanic/temperate climate, moderated somewhat by Lake Zurich.
landmarks:
  - name: Grossmünster
    description: Twin-towered church where Huldrych Zwingli launched the Swiss Reformation in the 1520s.
  - name: Bahnhofstrasse
    description: One of the world's most expensive shopping streets, and a symbol of Zurich's banking district nearby.
  - name: Lake Zurich (Zürichsee)
culturalTraits:
  - Switzerland's largest city and its main financial/banking center
  - Birthplace of the Dada art movement (Cabaret Voltaire, 1916)
  - Sechseläuten spring guild festival, including the burning of the Böögg snowman effigy
prideOf:
  - Status as a leading global financial center
  - Dada's art-historical legacy
animals:
  popular:
    - Waterfowl on Lake Zurich (swans, various duck species)
industries:
  - Banking, finance, and insurance
  - Technology and startups
  - Life sciences
sports:
  - Ice hockey (ZSC Lions)
  - Football (FC Zürich, Grasshopper Club)
# religions intentionally omitted: no canton-level official religion
