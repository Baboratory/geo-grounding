  - name: Europe/Zurich
    standardUtcOffset: "UTC+1"
    observesDst: true
    dstUtcOffset: "UTC+2"
    dstPeriod: "Last Sunday of March to last Sunday of October — Switzerland is not an EU member but aligns its clock changes with the EU-wide schedule by long-standing practice."
currency:
  code: CHF
  symbol: "CHF"
  name: Swiss franc
legalConstraints:
  - topic: "data protection (FADP/nDSG)"
    description: "Collecting or processing personal data requires a lawful basis, must be limited to a stated purpose, and grants individuals rights including access, correction, and deletion — Switzerland's own Federal Act on Data Protection (revised version in force since 1 September 2023), broadly aligned with but legally distinct from the EU's GDPR (Switzerland is not an EU member)."
    sourceId: che-ndsg
  - topic: "VAT price display"
    description: "Consumer-facing prices must be shown inclusive of VAT and other mandatory surcharges, in Swiss francs."
    sourceId: che-pbv
  - topic: "consumer withdrawal right"
    description: "Unlike the EU's blanket 14-day distance-selling withdrawal right, Switzerland has no general statutory right to return non-defective goods bought online. A narrower 7-day withdrawal right (Art. 40a ff. of the Code of Obligations) exists only for door-to-door/canvassing sales and similar off-premises or telephone contracts over CHF 100 — it does not, by default, cover an ordinary online purchase. Many Swiss online retailers offer a voluntary return policy, but it is a business choice, not a legal requirement."
    sourceId: che-or-40a-withdrawal
  - topic: "consumer guarantee"
    description: "Goods sold to consumers carry a 2-year limitation period for defect claims from delivery (Art. 210 of the Code of Obligations) — similar in length to the EU's minimum guarantee, but governed by Swiss law's own (and, as of a partial revision entered into force 1 January 2026, recently updated) rules on remedies, not the EU consumer-guarantee directive."
    sourceId: che-or-210-warranty
  - topic: "Sunday trading"
    description: "Employing retail staff between Saturday 11pm and Sunday 11pm is prohibited by default under the federal Labour Act (Art. 18); cantons may each designate up to 4 exceptional Sundays per year (Art. 19a) on which shops may open without a special permit. Beyond that federal baseline, actual shop opening hours (including further Sunday/holiday exceptions for e.g. train-station shops, bakeries, or kiosks) are set by each canton's own law — see the FR-ZH/FR-GE/FR-TI region files for concrete examples of how this plays out differently canton by canton."
    sourceId: che-arg-18-19a
paymentMethodShares:
  - method: "debit card, not via a mobile wallet (share of in-person/face-to-face payment transactions)"
    percent: 30.1
    sourceId: swiss-payment-monitor-2024
  - method: "cash (share of in-person/face-to-face payment transactions)"
    percent: 29.2
    sourceId: swiss-payment-monitor-2024
  - method: "TWINT linked directly to a bank account (share of in-person/face-to-face payment transactions)"
    percent: 7.2
    sourceId: swiss-payment-monitor-2024
paymentCulture:
  popularMethods:
    - "TWINT (Swiss mobile-payment app, widely used and accepted even at small/independent merchants and market stalls)"
    - "Debit cards (Maestro/Debit Mastercard/Visa Debit, commonly tied to a Swiss bank/PostFinance account)"
    - Visa and Mastercard credit cards
    - "Cash — still culturally significant and widely used/accepted, unlike some more strongly cashless neighboring countries"
  tipping:
    expected: false
    autoIncludedInBill: true
    typicalAmount: "Service has been legally/contractually included in the bill since a 1974 hospitality-sector collective labor agreement still in force today — additional tipping is a polite gesture, not an obligation; rounding up or leaving 5-10% for good service is common but never expected."
communicationStyle:
  contextLevel: mixed
  formalityNorms: "Formal and reserved until explicitly invited to be otherwise; use titles/surnames, dress conservatively, avoid humor with people you don't know well. German-speaking Switzerland (the majority) tends to be the most formal/direct/structured; French-speaking Switzerland (Romandie) is somewhat more relaxed and relationship-oriented; Italian-speaking Ticino has a warmer, more expressive style closer to Italy's — hence 'mixed' rather than a single national label."
  greetingNorms: "A firm, brief handshake with eye contact is standard in business; among people who know each other socially in the French/Italian-speaking regions, cheek kisses are common (as in France/Italy), which is much less the case in the German-speaking regions."
  meetingEtiquette: "Punctuality is taken very seriously — arriving even a few minutes late without prior notice is a real breach of etiquette; aim to arrive 5-10 minutes early. Meetings are well-prepared, structured, and fact-based, with decisions generally following careful deliberation rather than being made on the spot."
  topicsToAvoid:
    - "Personal wealth, salary, age, or family details, especially before a personal relationship has developed"
    - "Casual/uninformed remarks about Swiss neutrality, the World Wars, or the Swiss militia army — these carry more weight locally than outsiders often expect"
  giftGivingNotes: "Not expected at a first business meeting; when given, gifts are modest (quality chocolate, wine, flowers, or something representative of your home country) rather than expensive, since an overly lavish gift can feel inappropriate. Avoid knives/scissors (symbolically 'cutting' the relationship) and, when giving flowers, avoid red roses/carnations (romantic connotations) and white lilies/chrysanthemums (funerals)."
