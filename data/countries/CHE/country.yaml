sources:
  - id: che-constitution-art4-70
    name: "Federal Constitution of the Swiss Confederation, Art. 4 (National Languages) and Art. 70 (Languages)"
    publisher: "Fedlex (Swiss Confederation)"
    url: "https://www.fedlex.admin.ch/eli/cc/1999/404/en"
    year: 1999
    accessedDate: "2026-09-11"
    note: "The legal basis for German, French, Italian, and Romansh all being official languages. Art. 4 names all four as national languages; Art. 70 para. 1 names German/French/Italian as 'official languages of the Confederation' and adds that 'Romansh is an official language for communicating with persons who speak Romansh' — the narrower scope reflected in the languageUsage roh entry's comment above."
  - id: bfs-languages-2021
    name: "Languages (main language of the permanent resident population, by structural survey)"
    publisher: "Federal Statistical Office (FSO/BFS/OFS/UST)"
    url: "https://www.bfs.admin.ch/bfs/en/home/statistics/population/languages-religions/languages.html"
    year: 2021
    accessedDate: "2026-09-11"
    note: "The locallySpoken main-language shares (German 62.0%, French 22.8%, Italian 7.9%, Romansh 0.5%). Respondents could name more than one main language, so shares reflect that rather than a strict 100%-partition."
  - id: che-religion-2019-2021
    name: "2023 Report on International Religious Freedom: Switzerland (citing Federal Statistical Office structural-survey data)"
    publisher: "U.S. Department of State, Bureau of Democracy, Human Rights, and Labor — citing the Swiss Federal Statistical Office (BFS/OFS/UST)"
    url: "https://www.state.gov/reports/2023-report-on-international-religious-freedom/switzerland/"
    year: 2021
    accessedDate: "2026-09-11"
    note: "The religious-affiliation percentages used in distinct-regions/whole.yaml (Roman Catholic 33.7%, Reformed Protestant 21.8%, Muslim 5.5%, other religious groups 7.2%, no affiliation 30.9%, unknown 0.9%), pooled over the BFS structural survey's 2019-2021 period. Accessed via this secondary report rather than a directly-fetchable BFS breakdown page/PDF, which returned unreadable/truncated content during verification."
  - id: che-ndsg
    name: "Bundesgesetz über den Datenschutz (Federal Act on Data Protection, revised version, SR 235.1)"
    publisher: "Fedlex (Swiss Confederation)"
    url: "https://www.fedlex.admin.ch/eli/cc/2022/491/de"
    year: 2020
    accessedDate: "2026-09-11"
    note: "The legal basis for Switzerland's own data-protection regime, in force since 1 September 2023."
  - id: che-pbv
    name: "Verordnung über die Bekanntgabe von Preisen (Price Indication Ordinance, PBV, SR 942.211)"
    publisher: "Fedlex (Swiss Confederation)"
    url: "https://www.fedlex.admin.ch/eli/cc/1978/2081_2081_2081/en"
    year: 1978
    accessedDate: "2026-09-11"
    note: "The legal basis for consumer prices needing to be shown inclusive of VAT and other mandatory charges."
  - id: che-or-40a-withdrawal
    name: "Federal Act on the Amendment of the Swiss Civil Code (Code of Obligations), Art. 40a-40f (Right of withdrawal for door-to-door and similar contracts, SR 220)"
    publisher: "Fedlex (Swiss Confederation)"
    url: "https://www.fedlex.admin.ch/eli/cc/27/317_321_377/en"
    accessedDate: "2026-09-11"
    note: "The legal basis for the narrower, 7-day, CHF-100-threshold withdrawal right that applies to door-to-door/telephone sales — and the reason a general EU-style 14-day online-purchase withdrawal right does not exist in Swiss law."
  - id: che-or-210-warranty
    name: "Federal Act on the Amendment of the Swiss Civil Code (Code of Obligations), Art. 210 (Limitation of warranty claims for defects, SR 220)"
    publisher: "Fedlex (Swiss Confederation)"
    url: "https://www.fedlex.admin.ch/eli/cc/27/317_321_377/en"
    accessedDate: "2026-09-11"
    note: "The legal basis for the 2-year limitation period on defect/warranty claims from delivery."
  - id: che-arg-18-19a
    name: "Bundesgesetz über die Arbeit in Industrie, Gewerbe und Handel (Labour Act, ArG, SR 822.11), Art. 18 and Art. 19a"
    publisher: "Fedlex (Swiss Confederation)"
    url: "https://www.fedlex.admin.ch/eli/cc/1966/57_57_57/en"
    year: 1964
    accessedDate: "2026-09-11"
    note: "The federal baseline prohibiting Sunday retail work (Art. 18) and letting cantons designate up to 4 exception Sundays/year without a special permit (Art. 19a) — the starting point that each canton's own shop-opening law then builds on."
  - id: srf-english-main-language-2023
    name: "Nicht-Landessprachen auf dem Vormarsch"
    publisher: "SRF (Schweizer Radio und Fernsehen), citing the Federal Statistical Office (BFS)"
    url: "https://www.srf.ch/news/schweiz/englisch-als-arbeitssprache-nicht-landessprachen-auf-dem-vormarsch"
    year: 2023
    accessedDate: "2026-09-14"
    note: "6% of the permanent resident population reported English as their main language in 2023 (up from 4% in 2010) -- the locallySpoken share used above. Also reports 23% of the employed population usually speaking English at work in 2023, not separately modeled here."
  - id: bfs-esrk-english-2024
    name: "Vielsprachige Schweiz: Die Mehrheit der Bevölkerung verwendet regelmässig mehrere Sprachen"
    publisher: "SRF (Schweizer Radio und Fernsehen), citing the Federal Statistical Office's Erhebung zur Sprache, Religion und Kultur (ESRK) 2024"
    url: "https://www.srf.ch/news/schweiz/vielsprachige-schweiz-mehrheit-der-bevoelkerung-verwendet-regelmaessig-mehrere-sprachen"
    year: 2024
    accessedDate: "2026-09-14"
    note: "52% of 15-64-year-olds without English as their main language rate their own active English skills as good or very good, per BFS's ESRK 2024 survey (published 2025) -- the foreign-domain share used above. Also names English 'die am meisten verbreitete Nicht-Landessprache' (the most widespread non-national language) in Switzerland."
  - id: swiss-payment-monitor-2024
    name: "Swiss Payment Monitor 2024 (Issue 2024-1)"
    publisher: "ZHAW School of Management and Law, in cooperation with the University of St. Gallen"
    url: "https://www.zhaw.ch/storage/hochschule/medien/news/2024/Bericht_Swiss_Payment_Monitor_2024-1.pdf"
    year: 2024
    accessedDate: "2026-09-11"
    note: "The in-person/face-to-face payment method shares (non-mobile debit card 30.1%, cash 29.2%, TWINT linked to a bank account 7.2%). Not a government statistic (no equivalent to Banque de France's payment-statistics releases was found for Switzerland) — the recurring academic Swiss Payment Monitor survey is the standard, most-cited source for this kind of data."
