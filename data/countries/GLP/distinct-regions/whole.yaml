climates:
  - koppenCode: Af
    description: Tropical rainforest climate on the two main islands (Basse-Terre) and tropical monsoon on the low-lying Grande-Terre, warm and humid year-round.
landmarks:
  - name: La Soufrière volcano
    description: Active stratovolcano and the highest point of Guadeloupe, on Basse-Terre.
  - name: Les Saintes archipelago
    description: Group of small islands off the southern coast, known for their harbour and heritage.
culturalTraits:
  - Gwoka drum music and dance (a Guadeloupean emblem)
  - Carnival season leading up to Lent
prideOf:
  - Gwoka music and the drum tradition
  - Rum production heritage
animals:
  popular:
    - Green sea turtle
    - Frigatebird
  unique:
    - Guadeloupe racer (Alsophis antillensis, a non-venomous snake)
industries:
  - Tourism
  - Agriculture (bananas, sugarcane)
  - Rum distilling
sports:
  - Football
  - Yole (traditional creole canoe racing)
  - Cycling
religions:
