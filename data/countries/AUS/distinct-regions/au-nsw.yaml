    description: "A UNESCO World Heritage Site of dramatic sandstone cliffs, eucalyptus forests and the Three Sisters formation west of Sydney."
    unescoWorldHeritage: true
  - name: Bondi Beach
    description: "Sydney's most famous surf beach, a symbol of Australian beach culture."
