    note: "Verifies Australia's UNESCO World Heritage properties, including the Great Barrier Reef, Sydney Opera House and Kakadu National Park."

# Religions and ethnicity are not enumerated at country level: the Australian
# Census reports religion (2021: ~44% Christian, ~39% no religion, remainder
# Muslim/Hindu/Buddhist/other) and ancestry granularly, but there is no single
# official 'ethnic group' share that a religions[]/ethnicGroups[] summing
# cleanly would represent, so the fields are omitted with national figures
# described instead in the country.yaml notes.
