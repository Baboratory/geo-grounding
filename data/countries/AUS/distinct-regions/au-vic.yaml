code: AU-VIC
name:
  eng: Victoria
  local:
    - languageCode: eng
      value: Victoria
climates:
  - koppenCode: Cfb
    description: "Temperate oceanic climate across Melbourne and much of Victoria, with changeable weather, warm summers and cool, occasionally foggy winters."
  - koppenCode: Cfa
    description: "Humid subtropical warmth in the far northeast, with mild, wetter winters."
landmarks:
  - name: Flinders Street Station and Federation Square
    description: "Melbourne's grand 19th-century railway terminus and the adjacent riverside civic plaza, hearts of the city."
  - name: Melbourne Cricket Ground (MCG)
    description: "Australia's largest sports stadium, hosting cricket and AFL, a pilgrimage site for sports fans."
  - name: The Great Ocean Road and the Twelve Apostles
    description: "A scenic coastal drive past dramatic limestone sea stacks along the southwest coast."
  - name: Royal Botanic Gardens Melbourne
    description: "One of the world's finest botanic gardens, on the banks of the Yarra River."
culturalTraits:
  - "Australia's cultural and sporting capital, famous for its café culture and laneway art"
  - "A multicultural, food-obsessed city with a strong arts scene"
  - "A passion for sport, especially Australian rules football (AFL)"
prideOf:
  - "Coffee culture and world-class food and dining"
  - "The AFL and major sporting events"
  - "A vibrant, liveable city (regularly ranked among the world's most liveable)"
animals:
  popular:
    - "Eastern grey kangaroo"
  unique:
    - "Mountain pygmy-possum (a small marsupial in the Victorian Alps)"
industries:
  - "Advanced manufacturing and engineering"
  - "Financial services, health and professional services"
  - "Education (major universities)"
  - "Agriculture and premium food/wine (Yarra Valley, Mornington Peninsula)"
  - "Tourism"
sports:
  - "Australian rules football (AFL headquarters and the traditional home)"
  - "Cricket"
  - "Soccer"
  - "Tennis (the Australian Open is held in Melbourne)"
  - "Horse racing (the Melbourne Cup)"
