      value: Western Australia
climates:
  - koppenCode: Csa
    description: "Mediterranean climate in the southwest corner (Perth), with hot dry summers and mild wet winters."
  - koppenCode: BWh
    description: "Hot desert climate across the vast interior and the Pilbara/Kimberley, extremely hot and arid."
  - koppenCode: Aw
    description: "Tropical savanna climate in the far-north Kimberley, with a distinct wet and dry season."
landmarks:
  - name: Rottnest Island
    description: "A car-free island off Perth famous for its serene beaches and the quokka, a small endemic marsupial."
  - name: The Pinnacles Desert
    description: "Thousands of limestone spires rising from the sand in Nambung National Park."
  - name: Kimberley and Ningaloo Reef
    description: "Remote outback gorges and one of the largest fringing coral reefs (Ningaloo), a UNESCO World Heritage Site, on the northwest coast."
    unescoWorldHeritage: true
  - name: Cable Beach
    description: "A 22km stretch of white sand in Broome in the Kimberley, famous for its sunset camel rides."
