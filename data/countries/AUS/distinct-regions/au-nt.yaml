code: AU-NT
name:
  eng: Northern Territory
  local:
    - languageCode: eng
      value: Northern Territory
climates:
  - koppenCode: BWh
    description: "Hot desert climate across the central 'red centre' (Alice Springs region), with very hot days and cool nights."
  - koppenCode: Aw
    description: "Tropical savanna climate in the 'Top End' around Darwin, with a hot wet season (November-April) and a dry season (May-October)."
landmarks:
  - name: Uluru (Ayers Rock)
    description: "The vast sandstone monolith in the red centre, sacred to the Anangu people and iconic to the world."
  - name: Kata Tjuta (the Olgas)
    description: "A striking group of domed rock formations near Uluru in Uluru-Kata Tjuta National Park."
  - name: Kakadu National Park
    description: "A UNESCO World Heritage Site of wetlands, escarpment and ancient Aboriginal rock art."
    unescoWorldHeritage: true
  - name: Nitmiluk (Katherine) Gorge
    description: "A dramatic series of sandstone gorges cut by the Katherine River."
culturalTraits:
  - "The heart of Australia with a strong and proud Aboriginal heritage (a large share of the population is Indigenous)"
  - "A frontier, outdoors culture built around the red centre and the tropical Top End"
  - "Wide open spaces, small remote communities and a strong sense of place"
prideOf:
  - "Uluru and the sacred landscapes of the centre"
  - "Aboriginal cultural continuity, one of the oldest living cultures on Earth"
  - "The vastness and beauty of the outback"
animals:
  popular:
    - "Red kangaroo"
    - "Wedge-tailed eagle"
  unique:
    - "Thorny devil (a spiny desert lizard)"
    - "Saltwater crocodile (in the Top End wetlands and rivers)"
industries:
  - "Mining (gold, manganese, bauxite, gas)"
  - "Tourism (Uluru, Kakadu, outback travel)"
  - "Defence and government services (Darwin)"
  - "Pastoral agriculture (cattle)"
sports:
  - "Australian rules football (popular across the NT)"
  - "Cricket"
  - "Fishing and boating"
