  - id: oaic-privacy-act
    name: "The Privacy Act 1988 and Australian Privacy Principles"
    publisher: "Office of the Australian Information Commissioner (OAIC)"
    url: "https://www.oaic.gov.au/privacy/the-privacy-act"
    year: 2026
    accessedDate: "2026-09-21"
    note: "Privacy Act 1988 and APPs govern collection, use, disclosure, security and cross-border transfer of personal information; OAIC supervises."
  - id: ato-gst
