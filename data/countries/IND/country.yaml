sources:
  - id: gol-art343
    name: "Constitution of India — Part XVII, Article 343 (Official Language of the Union)"
    publisher: "Government of India (Legislative Department, Ministry of Law and Justice)"
    url: "https://legislative.gov.in/sites/default/files/coi-4March2016.pdf"
    year: 1950
    accessedDate: "2026-09-21"
    note: "Designates Hindi in Devanagari as the official language of the Union with English continuing as an associate official language."
  - id: gol-ola1963
    name: "Official Languages Act, 1963 (as amended 1967)"
    publisher: "Government of India — Department of Official Language, Ministry of Home Affairs"
    url: "https://dol.gov.in/en/act"
    year: 1963
    accessedDate: "2026-09-21"
    note: "Provides for the continued, indefinite use of English in addition to Hindi for official purposes of the Union."
  - id: census-2011
    name: "Census of India 2011 — Language and religion tables"
    publisher: "Registrar General and Census Commissioner of India, Ministry of Home Affairs"
    url: "https://censusindia.gov.in/"
    year: 2011
    accessedDate: "2026-09-21"
    note: "Language-at-home shares (Hindi plurality ~43.6%) and religion distribution, from the mother-tongue tables; the Census's separate bilingualism/trilingualism table (C-16 series) records ~10.6% of the population reporting English as a second or third language, the basis for the English locallySpoken row (self-reported usage, not a certified fluency test)."
  - id: gol-cpa2019
    name: "Consumer Protection Act, 2019"
    publisher: "Government of India — Ministry of Consumer Affairs, Food and Public Distribution"
    url: "https://consumeraffairs.nic.in/"
    year: 2019
    accessedDate: "2026-09-21"
    note: "Three-tier consumer-dispute framework, Central Consumer Protection Authority, e-commerce and misleading-advertising regulation."
  - id: gol-dpdp2023
    name: "Digital Personal Data Protection Act, 2023"
    publisher: "Ministry of Electronics & Information Technology (MeitY), Government of India"
    url: "https://www.meity.gov.in/"
    year: 2023
    accessedDate: "2026-09-21"
    note: "India's first comprehensive personal-data law: consent-based processing obligations on data fiduciaries, Data Protection Board supervision."
  - id: cbic-gst
    name: "GST — Goods and Services Tax (gst.gov.in)"
    publisher: "Central Board of Indirect Taxes and Customs (CBIC), Government of India"
    url: "https://gst.gov.in/"
    year: 2026
    accessedDate: "2026-09-21"
    note: "Unified GST in slabs 5/12/18/28%; the 18% band covers most services and many consumer goods."
