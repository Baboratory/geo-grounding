legalConstraints:
  - topic: "official language"
    description: "Article 343 designates Hindi in the Devanagari script as the official language of the Union; the Official Languages Act 1963 (amended 1967) provides that English continues indefinitely as the co-official/associate official language. The Constitution recognizes 22 Eighth-Schedule languages, which have official status in their respective states. India has no constitutionally designated 'national language'."
    sourceId: gol-art343
  - topic: "consumer protection"
    description: "The Consumer Protection Act 2019 establishes a three-tier adjudicatory framework (District/State/National Consumer Disputes Redressal Commissions), regulates e-commerce, prohibits unfair trade practices and misleading advertisements, and creates a Central Consumer Protection Authority (CCPA). Its predecessor (the Consumer Protection Act 1986) founded the consumer-complaint system."
    sourceId: gol-cpa2019
  - topic: "data protection"
    description: "The Digital Personal Data Protection Act 2023 (DPDP Act) is India's first comprehensive personal-data law; it obliges 'data fiduciaries' to obtain notice-and-consent before processing 'digital personal data' of a 'data principal', with the Data Protection Board supervising. Implementation rules were being phased in through 2024-25. (The earlier IT Act and its rules governed data before the DPDP Act's framework.)"
    sourceId: gol-dpdp2023
  - topic: "GST (VAT)"
    description: "A unified Goods and Services Tax (GST, introduced 1 July 2017 under the Constitution (101st Amendment) Act) replaced most central and state indirect taxes. It applies in graduated slabs — 5%, 12%, 18% and the top 28% slab — plus a 0.25% on rough diamonds and 3% on gold; essential goods are exempt or in the lowest slabs. The 18% band covers most services and many consumer goods."
    sourceId: cbic-gst
paymentCulture:
  popularMethods:
    - "UPI (Unified Payments Interface) QR-code payments dominate — India is the world's largest real-time payment system by volume (over 13 billion monthly UPI transactions in 2024)"
    - "Mobile wallets and apps (PhonePe, Google Pay, Paytm, CRED) are ubiquitous for person-to-person and merchant payments"
    - "Cash remains common for small daily purchases, especially in rural and informal settings"
    - "RuPay debit/credit cards and NEFT/IMPS bank transfers are widely used"
  tipping:
    expected: false
    typicalAmount: "Tipping is not expected in most settings; a small service charge (often 10% at restaurants) may be added, and tips are modest where given"
    autoIncludedInBill: false
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Respectful and relation-centric. Hierarchy, age and titles matter; formal greetings and deference to elders or seniors are valued. Communication is often indirect and polite, placing relationships and harmony above blunt directness."
  greetingNorms: "The folded-hands 'Namaste/Namaskar' with a slight bow is the traditional greeting; handshakes are common in business, though many women prefer the namaste. Address people by title or honorific (ji/ji-suffix as a respectful marker)."
  meetingEtiquette: "Punctuality is appreciated though business meetings often run on flexible time. Meetings typically open with pleasantries and relationship-building before business. Decisions often rest with the most senior person present; negotiation can be relationship-driven and indirect."
  topicsToAvoid:
    - "Direct criticism of a senior, or confrontational disagreement in public"
    - "Sensitive discussions of religion, caste or regional politics unless the other party raises them"
    - "Using the left hand or pointing with the foot (cultural sensitivity)"
  giftGivingNotes: "Gift-giving is appreciated on festivals and social occasions; modest, well-wrapped gifts are preferred and it is respectful to offer/accept with the right hand. Avoid leather items for some religious households and always consider the recipient's religious context."
