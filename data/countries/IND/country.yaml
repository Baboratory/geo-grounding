isSovereign: true
# Classified federal: India is a federal parliamentary republic with 28 states
# and 8 union territories as first-order units, each with substantial
# legislative autonomy under a three-list division of powers in the
# Constitution (Union list, State list, Concurrent list). Federations always
# carry real ISO 3166-2 subdivisions: IN-MH Maharashtra, IN-DL Delhi (NCT),
# IN-KA Karnataka, IN-TN Tamil Nadu, IN-GJ Gujarat, IN-WB West Bengal, etc.
# Curated subset + WHOLE below. Hindi (Devanagari script) is the official
# language of the Union; English is the co-official/associate official
# language (Constitution Art. 343; Official Languages Act 1963). There is NO
# constitutionally designated 'national language'. The 22 Eighth-Schedule
# languages are regionally official. Both official-domain rows are flagged 1.0
# (legal status, not population share).
governanceType: federal
iso3166_2_prefix: IN
hasSubdivisions: true
regionCoverage:
  # Assessed 2026-09-28 (coverage-floor re-audit, TODO.md). India is the most
  # trigger-dense country checked so far: of the 30 uncurated first-level
  # units, ~20 fire at least one trigger. Findings:
  #
  # Trigger 1 (own official language, via Constitution Art. 345 -- states may
  # legislate their own official language(s) beyond/instead of Hindi) --
  # CONFIRMED for: AP (Telugu), AS (Assamese), BR (Urdu as 2nd official), GA
  # (Konkani), JH (Santali + other 2nd official tribal languages), KL
  # (Malayalam), MN (Manipuri/Meitei), MZ (Mizo), OD (Odia), PB (Punjabi), SK
  # (Nepali/Bhutia/Lepcha/Limbu), TS (Telugu+Urdu), TR (Bengali+Kokborok), UP
  # (Urdu as 2nd official), UK (Sanskrit as 2nd official -- nationally
  # unique), JK (Kashmiri/Dogri/Urdu, 2020 Official Languages Act), LA
  # (Ladakhi/Purgi/Tibetan), PY (French -- nationally unique colonial-era
  # status, plus Tamil/Malayalam/Telugu across its exclaves), CH (Punjabi,
  # shared with Punjab). LD (Malayalam) and DH (Gujarati/Marathi/Konkani) are
  # weaker trigger-1 cases -- the languages are official but also the
  # majority language of an already-curated or adjacent state; note but
  # verify before curating on this basis alone.
  #
  # Trigger 2 (plurality religion differs from India's Hindu plurality,
  # ~79.8%) -- CONFIRMED: ML Christian ~70%, NL Christian ~88-90%, MZ
  # Christian ~87% (also fires trigger 1), PB Sikh ~54-58% (also trigger 1),
  # JK Muslim ~68% (also trigger 1), LD Muslim ~96.6% (the strongest single
  # finding in this batch -- highest Muslim share of any Indian state/UT).
  # ML and NL matter most here: English is their sole official language,
  # same as the country's co-official default, so they do NOT clear trigger
  # 1 -- religion is what puts them on the list at all.
  #
  # Trigger 5 (Koppen main class differs from the curated set's A/B/C) --
  # the six curated regions cover Aw/Am/BSh/Cwa/Cwb only; D and E are
  # entirely unrepresented. CONFIRMED for AR (Dfc), SK (Dfc, also trigger 1),
  # UK (ET at altitude, also trigger 1), HP (Dfc in Lahaul-Spiti and similar
  # high districts, despite Cwb lower down -- HP does NOT fire trigger 1,
  # Hindi is its sole official language, so climate is the only reason it's
  # on this list). LA likely also fires this (high-altitude cold
  # desert/tundra) but already qualifies via trigger 1. RJ's Thar desert
  # (BWh) does NOT fire trigger 5 -- it shares main class B with GJ's
  # already-curated BSh; DESIGN.md's trigger is explicitly main-class-only.
  #
  # Checked and NOT found to fire (negative findings, lower confidence than
  # CHN's -- worth a second look before treating as final): CG, HR, MP, RJ
  # (all Hindi-only official language, no distinct climate class, no
  # confirmed differing religious plurality found). AN (Andaman & Nicobar)
  # also checked negative -- no distinct official language, Aw/Am climate
  # already covered by TN/MH -- but its religious composition (a real
  # Nicobarese Christian minority) wasn't fully run down; flagged rather
  # than asserted.
  tier: first-level
  totalUnits: 36
  status: partial

  gapReason: "11 of 36 curated (PR-1: AS/OD/TR/UP; PR-2: AP/GA/KL/PB/SK).
    ~14 confirmed trigger-firing units remain — 12 trigger-1 (BR/JH/MN/MZ/
    TS/UK/JK/LA/PY/CH + LD/DH weaker), 2 religion-only (ML/NL Christian),
    2 climate-only (HP/AR) — plus AN flagged for a second look. 4 units
    (CG/HR/MP/RJ) checked negative. Progress tracked in issue #101; PR-3+
    continue the batch."

languageUsage:
  - languageCode: hin
    domain: official
    # Hindi in the Devanagari script is the official language of the Union
    # (Constitution Art. 343). Flagged 1.0 as legal/administrative status.
    speakersShare: 1.0
    sourceId: gol-art343
  - languageCode: eng
    domain: official
    # English is the co-official / associate official language of the Union
    # (Official Languages Act 1963, extended indefinitely). Flagged 1.0.
    speakersShare: 1.0
    sourceId: gol-ola1963
  - languageCode: hin
    domain: locallySpoken
    # Hindi is the most widely spoken language: the 2011 Census recorded it as
    # the mother tongue/most-spoken at home for a plurality (~43.6% of the
    # population), with many more speaking it as a second language. Precise
    # 'share' varies by census metric.
    speakersShare: 0.436
    sourceId: census-2011
  - languageCode: eng
    domain: locallySpoken
    # English is the associate official language and widely used in business,
    # education, the professions and the higher courts. The 2011 Census's
    # bilingualism/trilingualism table (not the mother-tongue table) records
    # about 10.6% of the population reporting English as a second or third
    # language (roughly 129 million people) -- self-reported usage, not a
    # certified fluency test, but a real published figure this row is based on.
    speakersShare: 0.10
    sourceId: census-2011
# ethnicGroups intentionally omitted: India does not enumerate a single
# additively-exclusive 'ethnic group' share at the national level — the 2011
# Census records language and religion (Hindu ~79.8%, Muslim ~14.2%, Christian
# ~2.3%, Sikh ~1.7%, Buddhist ~0.7%, Jain ~0.4%), and 'ethnicity' is not a
# census category. A summative ethnic composition would misrepresent the data.
