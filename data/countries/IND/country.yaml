alpha2: IN
name:
  eng: India
  local:
    - languageCode: hin
      value: भारत (Bhārat)
    - languageCode: eng
      value: India
flagEmoji: "🇮🇳"
capital: New Delhi
isSovereign: true
# Classified federal: India is a federal parliamentary republic with 28 states
# and 8 union territories as first-order units, each with substantial
# legislative autonomy under a three-list division of powers in the
# Constitution (Union list, State list, Concurrent list). Federations always
# carry real ISO 3166-2 subdivisions: IN-MH Maharashtra, IN-DL Delhi (NCT),
# IN-KA Karnataka, IN-TN Tamil Nadu, IN-GJ Gujarat, IN-WB West Bengal, etc.
# Curated subset + WHOLE below. Hindi (Devanagari script) is the official
# language of the Union; English is the co-official/associate official
# language (Constitution Art. 343; Official Languages Act 1963). There is NO
# constitutionally designated 'national language'. The 22 Eighth-Schedule
# languages are regionally official. Both official-domain rows are flagged 1.0
# (legal status, not population share).
governanceType: federal
iso3166_2_prefix: IN
hasSubdivisions: true
languageUsage:
  - languageCode: hin
    domain: official
    # Hindi in the Devanagari script is the official language of the Union
    # (Constitution Art. 343). Flagged 1.0 as legal/administrative status.
    speakersShare: 1.0
    sourceId: gol-art343
  - languageCode: eng
    domain: official
    # English is the co-official / associate official language of the Union
    # (Official Languages Act 1963, extended indefinitely). Flagged 1.0.
    speakersShare: 1.0
    sourceId: gol-ola1963
  - languageCode: hin
    domain: locallySpoken
    # Hindi is the most widely spoken language: the 2011 Census recorded it as
    # the mother tongue/most-spoken at home for a plurality (~43.6% of the
    # population), with many more speaking it as a second language. Precise
    # 'share' varies by census metric.
    speakersShare: 0.436
    sourceId: census-2011
  - languageCode: eng
    domain: locallySpoken
    # English is the associate official language and widely used in business,
    # education, the professions and the higher courts. The 2011 Census's
    # bilingualism/trilingualism table (not the mother-tongue table) records
    # about 10.6% of the population reporting English as a second or third
    # language (roughly 129 million people) -- self-reported usage, not a
    # certified fluency test, but a real published figure this row is based on.
    speakersShare: 0.10
    sourceId: census-2011
# ethnicGroups intentionally omitted: India does not enumerate a single
# additively-exclusive 'ethnic group' share at the national level — the 2011
# Census records language and religion (Hindu ~79.8%, Muslim ~14.2%, Christian
# ~2.3%, Sikh ~1.7%, Buddhist ~0.7%, Jain ~0.4%), and 'ethnicity' is not a
# census category. A summative ethnic composition would misrepresent the data.
timezones:
