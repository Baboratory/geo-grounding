businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices typically run 09:30-17:00 Monday-Friday; Sunday is widely observed as a day of rest and church attendance."
  lunchBreakTiming: "A midday lunch break around 13:00 is standard."
  notableShutdownPeriods:
    - period: "Hornbill Festival (December) and Christmas"
      description: "The Hornbill Festival and Christmas bring closures and large community gatherings."
  notes: "Nagaland is overwhelmingly Christian (87.9%, 2011 Census) versus India's Hindu plurality — the basis for Nagaland's coverage trigger 2 (different plurality religion). Its official language is English, same as the Union's co-official, so it does not fire trigger 1."
