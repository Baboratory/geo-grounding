code: IN-NL
name:
  eng: Nagaland
  local:
    - languageCode: eng
      value: Nagaland
climates:
  - koppenCode: Cwb
    description: "Temperate highland climate across the Naga hills, with a heavy southwest monsoon and a cool dry winter."
  - koppenCode: Cwa
    description: "Humid subtropical monsoon conditions in the lower valleys and the Dimapur plain, warmer and wetter."
landmarks:
  - name: Kohima War Cemetery
    description: "The Commonwealth war cemetery honouring the defenders of the Battle of Kohima (1944), a turning point in WWII's Burma campaign."
  - name: Hornbill Festival (Kisama)
    description: "Nagaland's famous biennial festival of Naga tribes, music, food and tradition in December."
  - name: Dzükou Valley
    description: "The flower-filled valley on the border with Manipur, a renowned trekking destination."
  - name: Kachari Ruins (Dimapur)
    description: "The ancient brick ruins and gates of Dimapur's abandoned fortress."
  - name: Japfü Peak
    description: "One of Nagaland's highest peaks, sacred in Naga tradition and rich in rhododendrons."
culturalTraits:
  - "A largely Christian Naga state (one of India's three Christian-majority states), home of the many Naga tribes and their distinctive languages, dress and festivals"
  - "English is the sole official language (same as the Union's co-official); more than a dozen Naga languages are spoken"
  - "A frontier culture of head-taking-turned-peaceful tribal societies, renowned for festivals, wrestling, and the Hornbill Festival"
prideOf:
  - "The Hornbill Festival and the diversity of Naga tribal culture"
  - "The Battle of Kohima heritage at the War Cemetery"
  - "Dzükou Valley and the Naga hills' natural beauty"
animals:
  popular:
    - "Asiatic black bear"
    - "Sambhar"
    - "Wild boar"
  unique:
    - "Mrs Hume's pheasant (the state bird)"
    - "Capped langur"
    - "Hoolock gibbon (western districts)"
    - "Red headgehog-like serow of the high forests"
industries:
  - "Agriculture (shifting Jhum farming; rice, maize, and the state's bamboos)"
  - "Forestry and bamboo products"
  - "Tourism (the Hornbill Festival, Kohima, Dzükou)"
  - "Handloom and handicrafts (Naga shawls, bamboo craft)"
sports:
  - "Football"
  - "Wrestling and indigenous Naga sports"
  - "Archery"
  - "Volleyball"
  - "Cricket"
entertainment:
  - season: allYear
    items:
      - "Naga tribal festivals and the year-round football and wrestling culture"
  - season: winter
    items:
      - "The Hornbill Festival (Kisama, December), the apex of the Naga cultural calendar"
  - season: summer
    items:
      - "Spring festivals and the pre-monsoon window for Dzükou and the hills"
  - season: wet
    items:
      - "The heavy monsoon fills the Naga hills with greenery; villages keep their festival rhythms"
  - season: dry
    items:
      - "The clear dry season for the Kohima memorial and tribal circuit"
traditionalDishes:
  - season: allYear
    items:
      - "Smoked and dried meats (axone/akhuni-fermented soy), and bamboo-shoot dishes"
      - "Sticky rice and the Naga practice of eating with fiery bhoot-jolokia chillies"
      - "Rice beer (zutho) and local pork-based feasts"
  - season: wet
    items:
      - "Steamed rice with smoked-meat and bamboo-shoot curries in the rainy months"
  - season: winter
    items:
      - "Hearty meats and rice beer at the festival season (Hornbill, Dec)"
  - season: summer
    items:
      - "Light spring produce and fresh vegetables"
  - season: dry
    items:
      - "Harvest-season rice meals and tribal feasts"
traditionalClothing:
  - season: allYear
    items:
      - "Naga men and women wear their tribe's distinctive woven shawls and wraps (the Angami, Ao, etc.), often with the traditional dhoti"
      - "The famous Naga shawls carry intricate motifs celebrating courage and identity"
  - season: winter
    items:
      - "Wool shawls and the traditional heavy wraps against the cool hill nights"
  - season: wet
    items:
      - "Rainproofs for the heavy monsoon"
  - season: summer
    items:
      - "Light cotton wear during the day"
  - season: dry
    items:
      - "Festive tribal dress for the Hornbill Festival season"
