climates:
  - koppenCode: BSh
    description: "Hot semi-arid climate across much of Gujarat, very hot and dry with erratic monsoon rains."
  - koppenCode: Aw
    description: "Tropical savanna climate along the coastal Saurashtra region, hot with seasonal monsoon rain."
landmarks:
  - name: Gir Forest National Park
    description: "The only place on Earth where the Asiatic lion lives in the wild."
  - name: Statue of Unity
    description: "The world's tallest statue (182m), honouring Sardar Vallabhbhai Patel, near the Narmada river."
  - name: Sabarmati Ashram (Ahmedabad)
    description: "Mahatma Gandhi's former residence and the base of the Salt March."
  - name: Rani ki Vav (Patan)
    description: "An exquisite stepwell, a UNESCO World Heritage Site of intricate carving."
    unescoWorldHeritage: true
culturalTraits:
  - "The land of Mahatma Gandhi and the Salt March — a cradle of India's independence movement"
  - "A dynamic business state with a strong Gujarati entrepreneurial identity"
  - "Known for its vegetarian cuisine, textiles and vibrant festivals (Navratri)"
prideOf:
  - "Gandhi's legacy and the state's role in India's freedom struggle"
  - "A thriving entrepreneurial and industrial economy"
  - "The Great Indian festival: Navratri, its nine nights of Garba dance"
animals:
  popular:
    - "Asiatic lion (Gir)"
  unique:
    - "Indian wild ass (in the salt flats of the Rann of Kutch)"
industries:
  - "Petrochemicals, refining and chemicals"
  - "Diamond cutting and jewellery (Surat)"
  - "Textiles and garments"
  - "Agriculture (groundnut, cotton, dairy — Amul)"
  - "Automotive and manufacturing"
sports:
  - "Cricket (Narendra Modi Stadium, Ahmedabad — the world's largest)"
  - "Field hockey"
