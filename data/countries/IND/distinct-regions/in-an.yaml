    name: "Census of India 2011 — religion table (Andaman and Nicobar Islands)"
    publisher: "Registrar General and Census Commissioner of India, Ministry of Home Affairs"
    url: "https://censusindia.gov.in/"
    year: 2011
    accessedDate: "2026-09-30"
    note: "2011 Census religion distribution: Hindu ~69.5%, Christian ~21.3%, Muslim ~8.5%, Sikh ~0.3% — a Hindu plurality across the UT, but Christians are ~71% of the Nicobar district (the largely Christian indigenous Nicobarese), reflecting the islands' distinct settler and tribal make-up."
