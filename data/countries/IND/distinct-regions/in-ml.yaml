businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices typically run 09:30-17:00 Monday-Friday; Sunday is a day of rest and church attendance widely honoured."
  lunchBreakTiming: "A midday lunch break around 13:00 is standard, often a Jhum-harvest rice-and-meat meal."
  notableShutdownPeriods:
    - period: "Christmas and Nongkrem/Wangala festivals"
      description: "Christmas and the major tribal harvest festivals bring closures and community gatherings."
  notes: "Meghalaya is Christian-majority (74.6%, 2011 Census) versus India's Hindu plurality — the basis for Meghalaya's coverage trigger 2 (different plurality religion). Its official language is English, the same as the Union's co-official, so it does not fire trigger 1."
