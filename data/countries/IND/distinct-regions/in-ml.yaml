code: IN-ML
name:
  eng: Meghalaya
  local:
    - languageCode: eng
      value: Meghalaya
climates:
  - koppenCode: Cwa
    description: "Humid subtropical monsoon climate on the southern slopes, among the wettest places on Earth (Mawsynram and Cherrapunji receive some of the highest rainfall)."
  - koppenCode: Cwb
    description: "Temperate highland climate in the Khasi and Garo hills, mild with a very heavy monsoon."
landmarks:
  - name: Living Root Bridges (Khasi hills)
    description: "The famous living root bridges of the Khasi hills, grown from tree roots across rivers."
  - name: Cherrapunji (Sohra) and Mawsynram
    description: "Two of the wettest inhabited places on Earth, famed for their rains and waterfalls."
  - name: Nohkalikai Falls
    description: "India's tallest plunge waterfall, south of Cherrapunji."
  - name: Shillong Peak
    description: "The viewpoint above Shillong with panoramas over the Khasi hills."
  - name: Mawlynnong
    description: "The village called 'Asia's cleanest', in the Khasi hills."
culturalTraits:
  - "A predominantly Christian state of the Khasi, Garo and Jaintia peoples — one of India's three Christian-majority states — with its own matrilineal tradition"
  - "English is the sole official language (the same as the Union's co-official), while Khasi, Garo and related languages are widely spoken"
  - "A land of living root bridges, tribal festivals and one of the world's wettest climates"
prideOf:
  - "The living root bridges and the beauty of the Khasi hills"
  - "A Christian-majority, matrilineal society and its lively tribal culture"
  - "Cherrapunji and Mawsynram's record rains"
animals:
  popular:
    - "Asiatic black bear"
    - "Capped langur"
    - "Asian elephant"
  unique:
    - "Hoolock gibbon (in the western Garo hills at Nokrek)"
    - "Clouded leopard (Meghalaya's state animal, in the Khasi and Garo hill forests)"
    - "Pig-tailed macaque"
industries:
  - "Agriculture (the Khasi/Meghalaya betel-nut, orange, and broom-grass; shifting Jhum farming)"
  - "Coal and limestone mining (controversial in the hills)"
  - "Tourism (Cherrapunji, root bridges, Shillong)"
  - "Bamboo and cane craft"
sports:
  - "Football"
  - "Archery (a traditional sport)"
  - "Cricket"
  - "Volleyball"
entertainment:
  - season: allYear
    items:
      - "Khasi and Garo festivals (Nongkrem, Wangala), living root-bridge treks and church community life"
  - season: winter
    items:
      - "The clearer, cooler season for root bridges and Shillong viewpoints"
  - season: wet
    items:
      - "The monsoon brings Mawsynram and Cherrapunji to their record rainfall and the waterfalls to full flow"
  - season: summer
    items:
      - "The spring festival season and lighter visits before the peak rain"
  - season: dry
    items:
      - "The drier months favour the village circuit and the south-facing viewpoints"
traditionalDishes:
  - season: allYear
    items:
      - "Jadoh (the signature Khasi dish of rice cooked with pork) and doh-nei-iong (spicy pork)"
      - "Tungtap (fermented fish chutney) and the fermented para-rice dishes of the hills"
      - "Local rice beer and putharo (rice cakes)"
  - season: wet
    items:
      - "Steaming rice-and-meat dishes and warm local tea in the rainy season"
  - season: winter
    items:
      - "Hearty jadoh and smoked-meat preparations in the cool season"
  - season: summer
    items:
      - "Fresh mountain produce and lighter dishes before the peak rain"
  - season: dry
    items:
      - "Harvest-season rice and village feasts"
traditionalClothing:
  - season: allYear
    items:
      - "Khasi women wear the traditional jainsem (a wrap-skirt) with an ornament, and Garo women the dokmanda; men the khasi kilt-like dhoti"
      - "Church and formal wear often follows western dress"
  - season: winter
    items:
      - "Wool shawls and wraps against the cool hill evenings"
  - season: wet
    items:
      - "Rainproofs are essential in the heavy monsoon"
  - season: summer
    items:
      - "Light cotton wear in the valleys"
  - season: dry
    items:
      - "Festive tribal dress for the dry-season celebrations"
seasonCalendar:
  - season: winter
    months: [12, 1, 2]
  - season: summer
    months: [3, 4, 5]
  - season: wet
    months: [6, 7, 8, 9]
  - season: dry
    months: [10, 11]
