code: IN-CH
name:
  eng: Chandigarh
  local:
    - languageCode: pan
      value: ਚੰਡੀਗੜ੍ਹ
    - languageCode: hin
      value: चंडीगढ़
climates:
  - koppenCode: Cwa
    description: "Humid subtropical monsoon climate at the foothills of the Shivalik range, with hot dry summers, a wet monsoon and cool, often foggy winters."
landmarks:
  - name: Rock Garden
    description: "Nek Chand's famous sculpture garden built from industrial and urban waste at the edge of the city."
  - name: Capitol Complex (Chandigarh)
    description: "Le Corbusier's monumental modernist ensemble, a UNESCO World Heritage Site."
    unescoWorldHeritage: true
  - name: Sukhna Lake
    description: "The artificial lake at the foot of the Shivalik hills, a beloved leisure spot."
  - name: Le Corbusier Centre
    description: "Museum and archive of the architect who planned Chandigarh and its modernist layout."
  - name: Open Hand Monument
    description: "Le Corbusier's symbolic open-hand sculpture, emblem of the city."
culturalTraits:
  - "India's first planned modernist city, designed by Le Corbusier (awarded 'City Beautiful' status) in the 1950s"
  - "A union territory that serves as the shared capital of Punjab and Haryana, with Punjabi widely spoken alongside Hindi"
  - "A clean, green, grid-planned city known for its roundabouts, lake and the Rock Garden — a cultural and administrative hub"
prideOf:
  - "The Le Corbusier modernist heritage (Capitol Complex) and the Rock Garden"
  - "A model of planned urban living and cleanliness"
  - "Sukhna Lake and the city's greenery"
animals:
  popular:
    - "Indian grey mongoose"
    - "Nilgai (blue bull)"
    - "Peafowl"
  unique:
    - "Sambar (in the surrounding Shivalik foothills)"
    - "Wild boar"
    - "Birdlife around Sukhna Lake (migratory ducks in winter)"
industries:
  - "Administration and governance (capital of Punjab and Haryana)"
  - "Information technology and software"
  - "Education, research and health services"
  - "Manufacturing and light engineering (industrial area, Rajpura fringe)"
  - "Tourism (Capitol Complex, Rock Garden, Sukhna)"
sports:
  - "Cricket"
  - "Field hockey"
  - "Football"
  - "Athletics"
entertainment:
  - season: allYear
    items:
      - "The modernist city landmarks — Le Corbusier Centre, Open Hand and the Capitol Complex"
      - "Evening strolls around Sukhna Lake"
  - season: winter
    items:
      - "The pleasant cool season for the city's parks and heritage walks"
  - season: wet
    items:
      - "Monsoon greenery and rainy-season indoor visits (Rock Garden)"
  - season: summer
    items:
      - "Evenings at Sukhna Lake in the heat"
  - season: autumn
    items:
      - "The festive post-monsoon season with Diwali and Dussehra celebrations"
traditionalDishes:
  - season: allYear
    items:
      - "The city blends Punjabi and Haryanvi food — butter naan, tawa chicken and paneer"
      - "Lassi, gajar ka halwa and the mall-area chaat"
  - season: winter
    items:
      - "Sarson da saag and makki di roti in the cold months"
  - season: summer
    items:
      - "Cooling lassi and fruit in the heat"
  - season: wet
    items:
      - "Monsoon pakoras and spiced tea"
  - season: autumn
    items:
      - "Festive sweets around Diwali"
traditionalClothing:
  - season: allYear
    items:
      - "Cosmopolitan dress; the salwar-kameez for women and kurta-pajama for men reflect the Punjabi/Haryanvi mix, with western wear dominant in the city"
  - season: winter
    items:
      - "Wool shawls and jackets against the cool, foggy winters"
  - season: summer
    items:
      - "Light cotton wear against the heat"
  - season: wet
    items:
      - "Rainwear for the monsoon"
  - season: autumn
    items:
      - "Festive dress for the celebration season"
seasonCalendar:
  - season: winter
    months: [12, 1, 2]
  - season: summer
    months: [3, 4, 5]
  - season: wet
    months: [6, 7, 8, 9]
  - season: autumn
    months: [10, 11]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices typically run 09:30-17:30 Monday-Friday; the administration and IT sectors follow standard Indian hours."
  lunchBreakTiming: "A midday lunch break around 13:00-14:00 is common."
  notableShutdownPeriods:
    - period: "Diwali and Dussehra (October/November)"
      description: "The festive season brings widespread closures."
  notes: "Chandigarh is a union territory -- a first-level federal unit of India -- serving as the joint capital of Punjab and Haryana while belonging to neither. English is its sole official language; Hindi and Punjabi are the most widely spoken."
