code: IN-DL
name:
  eng: Delhi (National Capital Territory)
  local:
    - languageCode: hin
      value: दिल्ली
    - languageCode: urd
      value: دہلی
climates:
  - koppenCode: Cwa
    description: "Humid subtropical climate on the northern plains, with very hot summers, a strong monsoon and cool, foggy winters."
landmarks:
  - name: Red Fort (Lal Qila)
    description: "The historic Mughal fort in Old Delhi, a UNESCO World Heritage Site and site of Independence Day celebrations."
    unescoWorldHeritage: true
  - name: Qutub Minar
    description: "The 13th-century victory minaret complex, the tallest brick minaret in the world and a UNESCO World Heritage Site."
    unescoWorldHeritage: true
  - name: India Gate
    description: "The war memorial arch on Kartavya Path, an iconic symbol of Delhi."
  - name: Humayun's Tomb
    description: "The exquisite Mughal garden tomb, a UNESCO World Heritage Site and precursor of the Taj Mahal."
    unescoWorldHeritage: true
  - name: Akshardham Temple
    description: "A grand modern Hindu temple complex, famed for its architecture and light-and-water show."
culturalTraits:
  - "India's capital and seat of national government, at the crossroads of Old Delhi's Mughal heritage and New Delhi's modern avenues"
  - "A political, diplomatic and cultural powerhouse"
  - "Famous for its monuments, markets (Chandni Chowk), cuisine and a strong Metro system"
prideOf:
  - "Being the national capital and the beating heart of Indian politics"
  - "A layered history spanning the Delhi Sultanate, Mughals, colonial era and modern republic"
  - "Iconic landmarks and its world-class Delhi Metro"
animals:
  popular:
    - "Nilgai (blue bull)"
  unique:
    - "Saras / sarus crane (occasional wetland visitor)"
industries:
  - "Government and public administration"
  - "Information technology and services"
  - "Media, publishing and the arts"
  - "Retail and commerce"
  - "Education and research"
sports:
  - "Cricket"
  - "Field hockey"
  - "Football (growing)"
