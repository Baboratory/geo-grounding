    description: "Tropical climate across the Deccan plateau and Mumbai coast, with a hot dry season and a strong southwest monsoon."
  - koppenCode: BSh
    description: "Hot semi-arid climate in the rainshadow districts of central and eastern Maharashtra."
landmarks:
  - name: Gateway of India
    description: "The iconic arch monument on Mumbai's waterfront, built to commemorate King George V's 1911 visit."
  - name: Ajanta and Ellora Caves
    description: "Ancient Buddhist, Hindu and Jain rock-cut cave temples in Maharashtra, both UNESCO World Heritage Sites."
    unescoWorldHeritage: true
  - name: Elephanta Caves
    description: "A UNESCO World Heritage Site of cave temples dedicated to Shiva on Elephanta Island in Mumbai harbour."
    unescoWorldHeritage: true
  - name: Marine Drive
    description: "Mumbai's curving seaside boulevard, the 'Queen's Necklace', a favourite evening promenade."
