    percent: 96.58
    sourceId: census-2011-religion
  - name: Hinduism
    percent: 2.77
    sourceId: census-2011-religion
  - name: Christianity
    percent: 0.49
    sourceId: census-2011-religion
  - name: Sikhism / Buddhism / Jainism
    percent: 0.05
    sourceId: census-2011-religion
  - name: Not stated / other
    percent: 0.11
    sourceId: census-2011-religion
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices typically run 09:30-17:00 on the islands; fishing and coir follow a seasonal rhythm."
  lunchBreakTiming: "A midday meal around 13:00 is common, often tuna and rice."
  notableShutdownPeriods:
    - period: "Monsoon season (June-September)"
      description: "Rough seas largely suspend inter-island sea travel and tourism during the southwest monsoon."
  notes: "Lakshadweep is the only Indian union territory that is overwhelmingly Muslim — 96.58% (2011 Census) versus India's Hindu plurality — the basis for its coverage trigger 2 (the strongest single-figure religion case in the India batch). Malayalam is the principal official language (its trigger-1 basis is weaker since Malayalam is also Kerala's language, so it is curated here on trigger 2's strength)."
sources:
