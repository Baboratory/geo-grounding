climates:
  - koppenCode: Aw
    description: "Tropical savanna climate on the Coromandel coast, hot year-round with rains from the northeast monsoon in late autumn/winter."
  - koppenCode: Am
    description: "Tropical monsoon pockets on the coast, humid with intense seasonal rain."
landmarks:
  - name: Promenade Beach (Rock Beach)
    description: "The sea-facing boulevard of Puducherry, with the statue of Gandhi and the old colonial esplanade."
  - name: Sri Aurobindo Ashram and Matrimandir
    description: "The spiritual community founded by Sri Aurobindo and the Mother; the golden Matrimandir is the Auroville icon."
  - name: French Quarter (White Town)
    description: "The restored colonial quarter of bougainvillea houses, cafés and the governors' building along the sea."
  - name: Manakula Vinayagar Temple
    description: "The venerated Ganesha temple in the centre of the old town."
  - name: Auroville
    description: "Sri Aurobindo's international township, with the Matrimandir at its heart."
culturalTraits:
  - "A small union territory of four non-contiguous enclaves (Puducherry, Karaikal, Yanam and Mahe): Puducherry, Karaikal and Yanam face the Bay of Bengal (Puducherry and Karaikal on the Coromandel Coast, Yanam near the Godavari delta), while Mahe faces the Arabian Sea on the Malabar Coast — a former French colony until 1954"
  - "French retains a unique status, making it the only Indian territory where French is an official language, used alongside Tamil, Malayalam and Telugu across its enclaves"
  - "A singular Franco-Indian culture — Tamil heritage, French colonial architecture, Aurobindo spiritualism and a café-and-croissant seaside life"
prideOf:
  - "The French Quarter and its unique Franco-Tamil seaside culture"
  - "Auroville and the spiritual heritage of Sri Aurobindo"
  - "The blend that fascinates visitors — Tamil kovil, French villa and the beach promenade"
