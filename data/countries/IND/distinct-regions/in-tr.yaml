  - season: dry
    months: [10, 11]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices typically run 10:00-17:00 Monday-Friday; Agartala follows the standard northeastern state working rhythm."
  lunchBreakTiming: "A midday lunch break around 13:00 is standard, often a full rice-and-fish meal."
  notableShutdownPeriods:
    - period: "Kharchi Puja and Durga Puja (October)"
      description: "The big annual festivals bring multi-day closures and holiday."
