# Language official-status basis: English is the official language. The everyday
# vernacular is a locally spoken English-based creole (Virgin Islands Creole).
# Figures are composites and estimates — no single official proficiency census.
languageUsage:
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: vir-official-lang
  # FLAGGED ESTIMATE: English is the language of government, education and
  # business; Spanish and creole varieties are also spoken (a notable
  # Spanish-speaking community from neighbouring islands/PR).
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.72
    sourceId: vir-census-lang
  - languageCode: spa
    domain: locallySpoken
    speakersShare: 0.17
