businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Small-island rhythm tied to the arrival of the supply ship (about every three months) and visiting cruise vessels."
  notes: "Sunday aboard Pitcairn is kept as a rest day by much of the community, reflecting the island's mutineer-descended Protestant heritage."
