code: MA-06
name:
  eng: Casablanca-Settat
  local:
    - languageCode: ara
      value: "الدار البيضاء - سطات"
    - languageCode: zgh
      value: "ⴰⵏⴼⴰ (Anfa)"
climates:
  - koppenCode: Csa
    description: Mediterranean climate tempered by the Atlantic — mild winters, warm dry summers, relatively humid air.
landmarks:
  - name: Hassan II Mosque (Casablanca)
    description: One of the largest mosques in the world, on the Atlantic shore; its minaret is the tallest in Morocco.
  - name: Casablanca Corniche
    description: The city's seafront promenade and leisure quarter.
  - name: Anfa / the old medina of Casablanca
    description: The historic nucleus of the city.
culturalTraits:
  - The Arab/Arabic-speaking commercial heartland of Morocco
  - Strong Atlantic-north business and financial culture (economic capital)
  - Coffee-house culture and French Art Deco urban legacy
prideOf:
  - Being Morocco's economic capital and main port
  - The Hassan II Mosque, a modern architectural landmark
  - A cosmopolitan, outward-looking Atlantic-city identity
animals:
  popular:
    - Seagulls along the coast
    - Feral cats (ubiquitous in North African cities)
industries:
  - Finance and banking (Morocco's business capital)
  - Port and logistics (Casablanca port and nearby industrial complex)
  - Manufacturing, textiles and agro-industry
sports:
  - Football (Wydad AC and Raja CA, two of Africa's biggest club sides)
  - Basketball
# religions intentionally omitted at region level: no official region-level
