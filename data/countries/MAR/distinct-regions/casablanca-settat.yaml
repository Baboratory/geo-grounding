entertainment:
  - season: allYear
    items:
      - Casablanca International Book Fair (annual literary event)
      - Football derby matches between Wydad and Raja (national cultural phenomenon)
traditionalDishes:
  - season: allYear
    items:
      - Seafood tagine and grilled fish along the coast
      - Msemen and bissara (street breakfast staples)
      - "Krachel anise-sesame bread and local pastries"
traditionalClothing:
  - season: allYear
    items:
      - Djellaba (everyday/formal robe)
      - City-adapted (more European-style) business dress
seasonCalendar:
  - season: spring
    months: [3, 4, 5]
  - season: summer
    months: [6, 7, 8]
  - season: autumn
    months: [9, 10, 11]
  - season: winter
    months: [12, 1, 2]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Private sector and banks roughly 9:00am-6:00pm on weekdays; many firms run a continuous day. Casablanca is Morocco's business hub with a more formal, punctual work culture than smaller cities."
  lunchBreakTiming: "A shorter, often replaced-by-continuous-hours lunch break in the corporate sector; a Friday midday prayer pause is common."
  notes: "Casablanca-Settat is Morocco's economic engine; international-facing business culture here is more formal and punctual than in the rest of the country."
