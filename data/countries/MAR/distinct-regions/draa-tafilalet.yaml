entertainment:
  - season: autumn
    items:
      - Date Festival of Erfoud (September-October)
  - season: winter
    items:
      - Sahara desert camps and New Year (Yennayer) in the oases
  - season: summer
    items:
      - High Atlas summer hiking and the Heatwave Festival (Ouarzazate area)
traditionalDishes:
  - season: allYear
    items:
      - "Berber tagine (slow meat-and-vegetable stew)"
      - "Couscous with dates and local honey"
      - "Sahara-style lamb — mechoui"
traditionalClothing:
  - season: allYear
    items:
      - Djellaba and blue/Hassani-influenced desert robes (mulhafa/indigo dye tradition)
      - Turban for desert men
      - Berber woven shawls
seasonCalendar:
  - season: spring
    months: [3, 4, 5]
  - season: summer
    months: [6, 7, 8]
  - season: autumn
    months: [9, 10, 11]
  - season: winter
    months: [12, 1, 2]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Offices and shops broadly 9:00am-6:00pm in towns; oasis farming and tourism follow sunrise-to-sundown rhythms."
  lunchBreakTiming: "Long midday break is standard, especially in the hot season."
  notes: "Tourism in the dunes and gorges is strongly seasonal (peaking in spring and autumn to avoid the severe summer heat), and date harvest is centered on the early autumn."
