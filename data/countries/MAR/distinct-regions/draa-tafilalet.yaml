code: MA-08
name:
  eng: Drâa-Tafilalet
  local:
    - languageCode: ara
      value: "درعة - تافيلالت"
    - languageCode: tzm
      value: "ⴷⵔⴰ ⵜⴰⴼⵉⵍⴰⵍⵜ"
climates:
  - koppenCode: BSk
    description: Cold semi-arid steppe climate on the High Atlas plateaus and along the rivers.
  - koppenCode: BWh
    description: Hot desert climate in the pre-Saharan Drâa valley and Tafilalet oases.
  - koppenCode: Cfb
    description: Cool mountain climate in the High Atlas heights (e.g. around Midelt/Tinghir gorges).
landmarks:
  - name: Todgha and Dades Gorges
    description: Dramatic High Atlas canyon landscapes.
  - name: Ouarzazate (gateway to the Sahara)
    description: Desert film-making hub and ksour town.
  - name: Aït Benhaddou
    unescoWorldHeritage: true
    description: Iconic fortified ksar, a famed film location.
  - name: Tafilalet (Erfoud/Rissani) palm groves
    description: The great Saharan oasis of date palms at Morocco's southeast edge.
  - name: Merzouga / Erg Chebbi dunes
    description: The emblematic Sahara dunes, topped by camel treks and desert camps.
culturalTraits:
  - Deep Amazigh (Central Atlas Tamazight) highland culture
  - Pre-Saharan ksour (fortified villages) and oasis life along the Drâa and Ziz rivers
  - The distinctive blend of Berber, Saharan and caravan-trade heritage
prideOf:
  - Aït Benhaddou and the film legacy of Ouarzazate
  - The date-palm oases and the Sahara (Merzouga/Erg Chebbi)
  - Preserving Amazigh language and highland traditions
animals:
  popular:
    - Dromedary (camel) — caravan and tourism icon
    - Barbary sheep (arrui) in the Atlas
  unique:
    - Northern bald ibis (occasional; mainly further west)
industries:
  - Date palm cultivation (Drâa and Tafilalet oases)
  - Tourism and film production (Ouarzazate studios)
  - Mining (manganese at Imini; fossils)
  - Agriculture and rose cultivation (Rose Valley)
sports:
  - Camel trekking and desert tours
  - Mountain hiking
  - Football
# religions intentionally omitted at region level: no official region-level
