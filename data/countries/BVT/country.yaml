    name: "Low om Bouvetøya (Dependency Act, 27 February 1930)"
    publisher: "Wikipedia (secondary source; primary: Low om Bouvetøya, 1930 Dependency Act)"
    url: "https://en.wikipedia.org/wiki/Bouvet_Island"
    accessedDate: "2026-09-20"
    note: "Legal basis: Bouvet Island as a Norwegian dependency under the 1930 Dependency Act, Norwegian as the official language, the uninhabited status, and the permit regime."
  - id: npolar-bouvetoya
    name: "Bouvetøya (Bouvet Island)"
    publisher: "Norsk Polarinstitutt (Norwegian Polar Institute)"
    url: "https://npolar.no/en/themes/bouvetoya/"
