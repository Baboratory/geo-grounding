code: WHOLE
name:
  eng: Bouvet Island
  local:
    - languageCode: nob
      value: Bouvetøya
climates:
  - koppenCode: ET
    description: Sub-Antarctic tundra/island climate — cold, cloudy and windy year-round, with most of the island blanketed by glacier ice.
landmarks:
  - name: Bouvetøya glacier plateau
    description: Roughly 89% of the island is covered by an ice cap sitting on an extinct (periodically restless) shield volcano.
  - name: "Kapp Valdivia and the exposed west coast"
    description: One of the few largely ice-free sections of coastline, where seals and seabirds haul out.
culturalTraits:
  - "One of the Earth's most isolated landmasses; disused 2021 automated research station"
prideOf:
  - "Pristine sub-Antarctic ecosystem on the world's most isolated island"
animals:
  popular:
    - Macaroni penguin
    - Chinstrap penguin
    - Antarctic fur seal
    - Southern elephant seal
  unique:
    - "Seabird colonies breeding on the world's most remote island"
industries:
  - None (no human activity except occasional scientific visits and permit-based landings)
sports:
  - Expedition landings (permit only)
