code: WHOLE
name:
  eng: Saint Vincent and the Grenadines
  local:
    - languageCode: eng
      value: Saint Vincent and the Grenadines
# Generic country-wide fallback content for Saint Vincent and the Grenadines
# (unitary-small, single synthetic whole region). Used via the
# 'whole-country-fallback' path in usage_examples/python/get_data_by_ip.py.
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry (savanna) climate — hot year-round with a distinct drier season (roughly Dec-May) and a wetter season (roughly Jun-Nov)."
  - koppenCode: Am
    description: "Tropical monsoon climate on the wetter, higher-rainfall windward slopes of Saint Vincent (e.g. the forested central spine around the Soufrière volcanic massif)."
landmarks:
  - name: La Soufrière Volcano
    description: "An active stratovolcano at the north end of Saint Vincent — the island's iconic landmark; its April 2021 eruption prompted evacuations and blanketed the north in ash."
  - name: The Grenadines
    description: "A chain of some 30 islands and cays south of Saint Vincent, including Bequia, Mustique and Union Island — famed for yachting, diving and white-sand beaches."
  - name: Wallilabou Bay
    description: "A north-west bay on the island of Saint Vincent, made famous as a filming location for the Pirates of the Caribbean films."
  - name: Botanic Gardens (Kingstown)
    description: "The tranquil Kingstown Botanic Gardens, among the oldest in the Caribbean."
  - name: Fort Charlotte
    description: "The old fort on Berkshire Hill above Kingstown, offering panoramic views over the harbour."
  - name: Tobago Cays
    description: "A protected marine park and protected turtle-nesting ground in the southern Grenadines."
culturalTraits:
  - "Vincy Mas — the vibrant pre-Lenten Carnival (January-February), one of the Caribbean's most celebrated"
  - "Vincentian Creole English as the everyday vernacular alongside English"
  - "Bequia whaling heritage — one of the last communities in the world still practising small-scale traditional whaling under international allowance"
  - "Yachting and sailing culture across the Grenadines"
  - "Cricket as a national passion within West Indies cricket"
prideOf:
  - "The Grenadines — among the world's finest yachting and sailing waters"
  - "Vincy Mas carnival and its calypso and soca music"
  - "Friendship and resilience, including recovery from volcanic eruptions"
  - "Its natural scenery — from the Soufrière volcano to coral reefs"
animals:
  popular:
    - "Hawksbill and green sea turtles — nesting on the beaches of the Tobago Cays and the Grenadines"
    - "St Vincent parrot (the 'Amazonas guildingii', the national bird) — found nowhere else"
    - "Whales and dolphins around the Grenadines"
    - "Blackfish in the waters off Bequia"
  unique:
    - "St Vincent parrot (Amazonas guildingii) — the endemic national bird"
    - "The traditional Bequia whaling practice, now limited to a small subsistence take under international regulation"
industries:
  - "Tourism — the principal economic driver (especially yachting and sailing in the Grenadines)"
  - "Agriculture — bananas, arrowroot, breadfruit and root crops"
  - "Fisheries and the traditional Bequia whaling culture"
  - "Light manufacturing and services tied to tourism"
sports:
  - "Cricket — a national passion within West Indies cricket"
  - "Football (soccer)"
  - "Netball"
  - "Sailing, yachting and water sports across the Grenadines"
  - "Track and field / athletics"
