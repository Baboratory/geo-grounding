entertainment:
  - season: allYear
    items:
      - "Beach life, sailing and yachting across the Grenadines"
      - "Cricket and football matches"
      - "Diving and snorkelling on the reefs"
  - season: dry
    items:
      - "Christmas and New Year festivities (the drier, cooler months)"
      - "Vincy Mas carnival (January-February) — the pre-Lenten festival of calypso, soca and mas bands"
      - "Peak tourist 'season' (~December-April)"
  - season: wet
    items:
      - "Easter-period events"
      - "Independence celebrations (27 October) and the September/October national season"
      - "The height of the hurricane/wet season — some outdoor activities pause in heavier rain"
traditionalDishes:
  - season: allYear
    items:
      - "Roasted breadfruit — strongly associated with the island and its cuisine"
      - "Fresh fish and seafood (including around the Grenadines)"
      - "Root crops / provision, plantains, and callaloo"
      - "Pilau and the island's one-pot dishes"
      - "Rum punch and local rums"
  - season: dry
    items:
      - "Christmas ham, black cake (fruit cake) and sorrel drink"
      - "Carnival-season street food during Vincy Mas"
  - season: wet
    items:
      - "Hearty one-pot and soup dishes during wetter spells"
      - "Independence-season and festival fare"
traditionalClothing:
  - season: allYear
    items:
      - "Colourful cotton prints and light tropical wear"
  - season: dry
    items:
      - "Festive/formal wear for Christmas and New Year"
  - season: wet
    items:
      - "Vincy Mas carnival costumes (feathers, beads, sequins) in January-February"
seasonCalendar:
  - season: dry
    months: [12, 1, 2, 3, 4, 5]
  - season: wet
    months: [6, 7, 8, 9, 10, 11]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Government and offices typically 08:00/08:30-16:00/16:30 weekdays; private businesses often 09:00-17:00; retail usually Mon-Sat with many closed (or shorter hours) Sunday."
  lunchBreakTiming: "A standard midday break is common."
  notableShutdownPeriods:
    - period: "Vincy Mas carnival (January-February)"
      description: "The pre-Lenten carnival — business and activity adjust heavily for two days plus build-up."
    - period: "Independence (27 October)"
      description: "National public holiday marking independence from the United Kingdom (1979)."
    - period: "April 2021 La Soufrière eruption"
      description: "A major volcanic eruption forced mass evacuations and temporarily closed parts of the northern island; recovery was gradual. A one-off event, noted here for context rather than a recurring shutdown."
    - period: "Christmas and New Year"
      description: "Reduced business around the Christmas/New Year holidays."
  notes: "Tourism drives a pronounced high season in the drier months (December-May), centred on sailing in the Grenadines. Sunday is widely a rest day."
sources:
