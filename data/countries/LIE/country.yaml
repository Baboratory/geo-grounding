# Classified unitary-small: Liechtenstein is a small principality (~40,000
# people) whose eleven communes are purely administrative. German (Standard) is
# the sole official language; the everyday vernacular is a High Alemannic
# dialect (Liechtensteiner Dialekt / Alemannisch), spoken at home by about 73%
# of residents per the 2020 census — treated here the same way as Jamaica's
# patois (an unofficial vernacular recorded as locallySpoken, not official).
# Principality ruled by the House of Liechtenstein; EEA (EFTA) member, NOT an EU
# member — EU law such as the GDPR applies via the EEA Agreement.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
