    sourceId: census-2020
  - languageCode: eng
    domain: foreign
    speakersShare: 0.40
    sourceId: census-2020
# German (Standard) is the sole official language — 1.0, a legal-status flag.
# Per the 2020 census, 92.4% give German as their main language and 73% speak
# the Liechtensteiner Alemannic dialect at home (recorded above as locallySpoken
# gsw, following the Jamaica-patois approach: widely used vernacular, not
# official). Immigrant main-languages (Italian, Portuguese, Turkish,
# Serbian/Croatian) each sit around 1% of the resident population; English is a
# widespread learned foreign language in finance and cross-border business
# (ESTIMATE ~0.40, no census figure — flagged below).
ethnicGroups:
  - group: Liechtensteiner
    percent: 65.5
    sourceId: census-2020
  - group: Swiss
    percent: 9.6
    sourceId: census-2020
  - group: Austrian
    percent: 5.9
    sourceId: census-2020
  - group: German
    percent: 4.5
    sourceId: census-2020
  - group: Italian
    percent: 3.1
    sourceId: census-2020
  - group: Other nationalities
    percent: 11.4
    sourceId: census-2020
# Official 2020 census (Amt für Statistik Liechtenstein, resident population
# 39,055): Liechtensteiners ~65.5% (25,588) vs foreign nationals ~34.5%
# (13,467). The foreign breakdown (Swiss ~9.6%, Austrian ~5.9%, German ~4.5%,
# Italian ~3.1%, other ~11.4%) is approximate and derived from the official
# foreign-nationality figures. Naturalisation is selective (blood-descent rule
# plus long residence; dual citizenship only since 2003).
