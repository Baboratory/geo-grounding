  - name: Europe/Vaduz
    standardUtcOffset: "UTC+1"
    observesDst: true
    dstUtcOffset: "UTC+2"
    dstPeriod: "Last Sunday of March to last Sunday of October — Liechtenstein follows the EU/EEA DST schedule."
currency:
  code: CHF
  symbol: "CHF"
  name: Swiss franc
legalConstraints:
  - topic: "data protection — GDPR applies via the EEA Agreement"
    description: "Liechtenstein is an EEA EFTA State (joined the EEA on 1 May 1995), NOT an EU member — but the GDPR has applied here since 20 July 2018 because the EU data-protection rules were incorporated into the EEA Agreement (Annex XI) and implemented in national law (the Liechtenstein Datenschutzgesetz). In practice this dataset's EU-origin data-protection obligations (lawful basis, data-subject rights, breach notification) apply to Liechtenstein as to the EU single market."
    sourceId: gdpr-eea
  - topic: "consumer protection via the single market"
    description: "Because Liechtenstein is part of the EEA/European single market, the main EU consumer-protection directives (distance selling, consumer rights) apply here, transposed into Liechtenstein law. An agent advising on e-commerce/consumer contracts for Liechtenstein should treat EU consumer-rights rules as broadly applicable."
    sourceId: gdpr-eea
  - topic: "VAT / customs"
    description: "Liechtenstein is in a customs and currency union with Switzerland, so Swiss VAT (Mehrwertsteuer, MWST) rules apply — standard rate 8.1% since 1 January 2024 (raised from 7.7%), reduced rate 3.8%, special 2.6%. For EU VAT purposes supplies to Liechtenstein are treated as exports from the EU (it is EEA-but-not-EU). Prices are displayed Swiss-VAT-inclusive."
    sourceId: swiss-vat
  - topic: "Sunday and public-holiday rest / shop closing"
    description: "The Ordinance of 10 March 1992 on Sunday and public-holiday rest and shop closing makes Sunday work cease in establishments subject to the Trade Act, with statutory exceptions (pharmacies, catering, transport, service-station shops, cinemas, sports schools). Stores may open Mon-Fri 06:00-21:00 and Sat 06:00-17:00, and on Sundays only with official authorisation — except 8 December and the three Sundays before 24 December, which are open 07:00-17:00 without a permit."
    sourceId: sunday-closing-ordinance
paymentCulture:
  popularMethods:
    - "Cash in Swiss francs (CHF) — common for small and everyday purchases"
    - "Debit/credit cards and contactless (Maestro/debit, Visa/Mastercard) — standard at retail and restaurants"
    - "Bank transfers and e-banking (wealth-management and cross-border context)"
    - "Mobile payment apps (Swiss-style TWINT) in growing use"
  tipping:
    expected: false
    autoIncludedInBill: true
    typicalAmount: "Service is typically included in the bill; rounding up or leaving up to ~10% for excellent service in restaurants is customary, paid in cash."
    note: "Euros are accepted in many places but at poor exchange rates — pay in francs."
communicationStyle:
  contextLevel: low-context
  formalityNorms: "Formal, reserved and restrained; use titles and surnames until invited otherwise. Directness and reliability are valued, and personal or financial matters are kept private."
  greetingNorms: "A firm, polite handshake with eye contact is standard in business; among acquaintances, a brief German-style greeting with surnames is the norm."
  meetingEtiquette: "Punctuality is taken seriously — arrive on time. Meetings are well-prepared, structured and efficient, with decisions made by capable, trusted people; the Alpine work ethic favours thoroughness."
  topicsToAvoid:
    - "Personal wealth or income — a sensitive, private subject in one of the world's wealthiest countries per capita"
    - "Jokes or assumptions about the princely family or the principality's small size"
  giftGivingNotes: "Gifts are not expected at a first business meeting; when invited to a home, a modest, tasteful gift (wine, flowers, chocolates) is well received."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
