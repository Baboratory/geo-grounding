    name: "Religious identification in the Basque Country"
    publisher: "Basque Government / CIS survey data"
    url: "https://www.cis.es/"
    year: 2021
    accessedDate: "2026-09-20"
    note: "Estimated shares identifying as Roman Catholic (~56%), non-religious (~34%) and other (~10%), consistent with CIS and Basque Government survey figures. Rounded estimates."
