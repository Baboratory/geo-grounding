businessRhythm:
  restDays:
    - sunday
  notes: "Sunday opening in Catalonia follows the regional commerce framework; many small shops still close on Sunday, while a number of large stores open on designated Sundays. The working day often features the long midday break ('hora de comer') common across Spain."
