    file: distinct-regions/whole.yaml
sources:
  - id: es-constitution-art3
    name: "Constitución Española de 1978, Artículo 3"
    publisher: "Boletín Oficial del Estado (BOE)"
    url: "https://www.boe.es/legislacion/documentos/ConstitucionCASTELLANO.pdf"
    year: 1978
    accessedDate: "2026-09-20"
    note: "Legal basis for Castilian (Spanish) being the official language of the State, and for the other Spanish languages (Catalan/Valencian, Galician, Basque, Occitan) being co-official in their respective autonomous communities under their statutes of autonomy."
  - id: ine-languages-2016
    name: "Encuesta sobre la participación de la población adulta en las actividades de aprendizaje (ECE/EAP) — language usage, 2016"
    publisher: "Instituto Nacional de Estadística (INE)"
    url: "https://ine.es/"
    year: 2016
    accessedDate: "2026-09-20"
    note: "Shares of the adult population able to speak/use each language: Spanish ~98.9%, Catalan (incl. Valencian as a variety) ~17.5%, Galician ~6.2%, Basque ~3.0%. Aranese figure is an estimate of roughly a few thousand speakers in the Val d'Aran."
  - id: ef-english-proficiency-2024
    name: "EF English Proficiency Index 2024 (Spain score)"
    publisher: "EF Education First"
    url: "https://www.ef.com/wwen/epi/"
    year: 2024
    accessedDate: "2026-09-20"
    note: "Spain's English proficiency is classified as 'moderate'; roughly a quarter of the population reports some ability to speak English as a foreign language. Figure is an estimate."
  - id: banco-de-espana-payments-2023
    name: "Study on payment behaviour in Spain 2023"
    publisher: "Banco de España"
    url: "https://www.bde.es/wbe/en/areas-actuacion/estabilidad-financiera/mercado-pagos/estudios-pago/"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Cards account for the majority of point-of-sale transactions (~70%), cash for roughly a quarter (~27%), with other instruments making up the remainder. Shares are rounded."
  - id: eu-directive-98-6-ec
    name: "Directive (EU) 2018/98 (Consumer Rights Directive, price display)"
    publisher: "European Union"
    url: "https://eur-lex.europa.eu/eli/dir/2011/83/oj"
    year: 2011
    accessedDate: "2026-09-20"
    note: "EU-wide rule that consumer-facing prices are shown inclusive of VAT and other taxes."
  - id: eu-directive-2011-83-eu
    name: "Directive 2011/83/EU on consumer rights (distance/off-premises contracts)"
    publisher: "European Union"
    url: "https://eur-lex.europa.eu/eli/dir/2011/83/oj"
    year: 2011
    accessedDate: "2026-09-20"
    note: "EU-wide 14-day no-reason right of withdrawal for distance (online etc.) contracts."
  - id: eu-regulation-2016-679-gdpr
    name: "Regulation (EU) 2016/679 (General Data Protection Regulation)"
    publisher: "European Union"
    url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
    year: 2016
    accessedDate: "2026-09-20"
    note: "The EU-wide data-protection framework directly applicable in Spain."
  - id: eu-directive-2019-771
    name: "Directive (EU) 2019/771 (on contracts for the sale of goods)"
    publisher: "European Union"
    url: "https://eur-lex.europa.eu/eli/dir/2019/771/oj"
    year: 2019
    accessedDate: "2026-09-20"
    note: "EU-wide minimum 2-year legal guarantee of conformity for consumer goods."
  - id: es-retail-hours
    name: "Commercial opening-hours regulation by autonomous community"
    publisher: "Ministry of Industry, Trade and Tourism (Spain); regional commerce laws"
    url: "https://www.mintur.gob.es/"
    accessedDate: "2026-09-20"
    note: "Under the (national framework) commerce laws, each autonomous community sets its own Sunday and public-holiday opening schedule, generally permitting a number of 'domingos y festivos de apertura' per year with exemptions for tourist and small shops."
