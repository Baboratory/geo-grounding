name:
  eng: Netherlands
  local:
    - languageCode: nld
      value: Nederland
flagEmoji: "🇳🇱"
capital: Amsterdam
isSovereign: true
# Classified unitary-small: the Netherlands is a unitary parliamentary
# constitutional monarchy (the constitution establishes a decentralised
# unitary state of twelve provinces). West Frisian holds official regional
# status in the province of Friesland, but the state itself is neither
# federal nor does it present a widely-recognised cultural-historical regional
# divide of the scale that warrants curated sub-regions (unlike e.g. Spain or
# Belgium), so a single synthetic whole-country region is used.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: nld
    domain: official
    speakersShare: 1.0
    sourceId: dutch-constitution-art-3
  - languageCode: nld
    domain: locallySpoken
    speakersShare: 0.95
    sourceId: nl-cbs-mother-tongue
  - languageCode: fry
    domain: locallySpoken
    speakersShare: 0.025
    sourceId: nl-cbs-mother-tongue
  - languageCode: eng
    domain: foreign
    speakersShare: 0.9
    sourceId: ef-english-proficiency-2024
# Dutch is the sole de jure official language nationwide. West Frisian is
# recognised as a secondary official language in the province of Friesland
# (under the European Charter for Regional or Minority Languages), spoken by
# roughly 450-470 thousand people (about 2.5% of the Dutch population, and a
# majority within Friesland itself); it is listed as locallySpoken rather than
# official because its status is regional and territorial, not nationwide.
ethnicGroups:
