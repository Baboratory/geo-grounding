sources:
  - id: bmi-minority-languages
    name: "National Minorities and Minority and Regional Languages in Germany"
    publisher: "Federal Ministry of the Interior and Community (BMI)"
    url: "https://www.deutschland.de/en/topic/politics/germany-europe/regional-and-minority-languages-in-germany"
    year: 2016
    accessedDate: "2026-09-20"
    note: "Basis for German being the state's standard official/administrative language, and for the recognition and territorial scope of the four autochthonous national minorities (Danish, Frisian, Sorbian, Sinti and Roma) and their languages plus Low German as a regional language. Resident-speaker shares are stated here as rough estimates, as Germany collects no mother-tongue or ethnicity census data."
  - id: eurobarometer-languages-2024
    name: "Special Eurobarometer: Europeans and their Languages (2024 wave)"
    publisher: "European Commission (Eurobarometer)"
    url: "https://europa.eu/eurobarometer/surveys/detail/2979"
    year: 2024
    accessedDate: "2026-09-20"
    note: "Self-reported foreign-language ability in Germany: French ~16% and Spanish ~8%. The English figure is taken separately from the 2023 microcensus/language estimate given the country's very high English proficiency."
  - id: languages-of-germany-2023
    name: "Languages of Germany (2023 microcensus-derived speaker estimates)"
    publisher: "Federal Statistical Office of Germany (Destatis), via languages of Germany overview"
    url: "https://en.wikipedia.org/wiki/Languages_of_Germany"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Roughly 65% of Germans can speak English (very high proficiency by international measures, and ~1.01M residents list English as their main spoken immigrant language in the 2023 microcensus). Figure is an estimate of foreign-language facility."
  - id: ldslow-german-2016
    name: "2016 survey of Low German competence"
    publisher: "Institute for the German Language (IDS) and Institute for the Low German Language (INL)"
    url: "https://ids-pub.bsz-bw.de/frontdoor/deliver/index/docId/7853/file/Adler_Beyer_Languages_and_language_policies_in_Germany_2018.pdf"
    year: 2016
    accessedDate: "2026-09-20"
    note: "~32% of respondents in Northern Germany report fairly good to very good active Low German competence; across the whole national population the active-speaker share is far smaller, estimated here at ~3% as a composite estimate."
  - id: destatis-microcensus-2023
    name: "Population by migration background, microcensus 2023"
    publisher: "Statistisches Bundesamt (Federal Statistical Office of Germany)"
    url: "https://www.destatis.de/EN/Themes/Society-Environment/Population/Migration-Integration/_node.html"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Microcensus 2023: ~26.9% of residents have an immigration background (self or at least one parent born abroad). The 'no migration background' remainder (~73.1%) is a derived figure; the Turkish-descent ~2.8% line reflects the largest single community-with-migration-background group and is indicative."
  - id: bundesbank-payments-2023
    name: "Study on payment behaviour in Germany 2023"
    publisher: "Deutsche Bundesbank"
    url: "https://www.bundesbank.de/en/tasks/payment-systems/studies/payment-behaviour"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Cash still accounts for roughly half of point-of-sale transactions (51%) with cards and other non-cash payment instruments making up the remainder (49%) — rounding of the Bundesbank's headline split."
  - id: eu-directive-98-6-ec
    name: "Directive 98/6/EC on consumer protection in the indication of prices"
    publisher: "European Union"
    url: "https://eur-lex.europa.eu/eli/dir/1998/6/oj/eng"
    year: 1998
    accessedDate: "2026-09-20"
    note: "EU-wide rule that consumer-facing prices are shown inclusive of VAT and other taxes."
  - id: eu-directive-2011-83-eu
    name: "Directive 2011/83/EU on consumer rights (distance/off-premises contracts)"
    publisher: "European Union"
    url: "https://eur-lex.europa.eu/eli/dir/2011/83/oj"
    year: 2011
    accessedDate: "2026-09-20"
    note: "EU-wide 14-day no-reason right of withdrawal for distance (online etc.) contracts."
  - id: eu-regulation-2016-679-gdpr
    name: "Regulation (EU) 2016/679 (General Data Protection Regulation)"
    publisher: "European Union"
    url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
    year: 2016
    accessedDate: "2026-09-20"
    note: "The EU-wide data-protection framework directly applicable in Germany."
  - id: eu-directive-2019-771
    name: "Directive (EU) 2019/771 (on contracts for the sale of goods)"
    publisher: "European Union"
    url: "https://eur-lex.europa.eu/eli/dir/2019/771/oj"
    year: 2019
    accessedDate: "2026-09-20"
    note: "EU-wide minimum 2-year legal guarantee of conformity for consumer goods."
  - id: de-ladenschluss
    name: "Gesetz über den Ladenschluss (Shop Closing Act) and Länder opening-hours laws"
    publisher: "Government of Germany / state governments"
    url: "https://www.gesetze-im-internet.de/ladschlg/"
    accessedDate: "2026-09-20"
    note: "Federal and state legal framework under which Sunday and public-holiday retail closures are the default, with exemptions for certain goods, sectors and tourist areas set by each Land."
