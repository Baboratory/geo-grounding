# German is the standard official/administrative language of the federal state
# (the Constitution itself does not name an official language; the status is
# established by administrative practice and federal law as the language of the
# courts, administration and education). German is also the first/de facto
# language of roughly 90-95% of residents. The four recognized autochthonous
# minority languages (Danish, North/Sater Frisian, Upper/Lower Sorbian and
# Romani) and the regional language Low German are protected under the European
# Charter for Regional or Minority Languages; their resident-speaker shares are
# tiny (fractions of a percent) and are estimates — Germany collects no
# ethnicity or mother-tongue census data, so exact figures do not exist. English
# and French shares are Eurobarometer self-reported foreign-language skills; the
# English figure follows the 2023 microcensus speaker count (~1.01M with English
# as main immigrant language) plus widely-reported high second-language use.
ethnicGroups:
  # No ethnicity census exists in Germany (ethnic classification is a personal
  # choice and legally unrecorded); the recognized national minorities (Danish,
  # Frisian, Sorbian, Sinti and Roma) are estimates of a few thousand to tens of
  # thousands each and are not reported as separate statistical groups here.
  - group: German (no migrant background)
    percent: 73.1
    sourceId: destatis-microcensus-2023
  - group: Immigrant background (whole or partial)
    percent: 26.9
    sourceId: destatis-microcensus-2023
  - group: Community with migration background (Turkish descent, first/second generation)
    percent: 2.8
    sourceId: destatis-microcensus-2023
timezones:
  - name: Europe/Berlin
    standardUtcOffset: "UTC+1"
    observesDst: true
    dstUtcOffset: "UTC+2"
    dstPeriod: "Last Sunday of March to last Sunday of October (EU-wide schedule)."
currency:
  code: EUR
  symbol: "€"
  name: Euro
legalConstraints:
  - topic: "VAT price display"
    description: "Consumer-facing prices must be shown VAT-inclusive (the final price to the consumer, not a pre-tax figure), in accordance with EU-wide rules."
    sourceId: eu-directive-98-6-ec
  - topic: "consumer withdrawal right"
    description: "Consumers buying at a distance (online, etc.) have a 14-day no-reason withdrawal/return right, EU-wide. In Germany, the statutory cooling-off period must be clearly communicated by the merchant."
    sourceId: eu-directive-2011-83-eu
  - topic: "data protection (GDPR)"
    description: "Collecting or processing personal data (names, emails, browsing/behavioral data, etc.) requires a lawful basis such as consent, must be limited to a stated purpose, and grants individuals rights including access, correction, and erasure ('right to be forgotten') — the EU-wide GDPR, directly applicable in Germany."
    sourceId: eu-regulation-2016-679-gdpr
  - topic: "consumer guarantee"
    description: "Goods sold to consumers carry a minimum 2-year legal guarantee of conformity from delivery, during which a faulty item must be repaired, replaced, discounted, or refunded free of charge — independent of and in addition to any commercial/manufacturer warranty."
    sourceId: eu-directive-2019-771
  - topic: "Sunday trading"
    description: "Sunday and public-holiday shop closures are the statutory default nationwide (Ladenschlussgesetz); the individual states (Länder) set their own shop-opening laws within the federal framework, so Sunday exceptions vary by state."
    sourceId: de-ladenschluss
paymentMethodShares:
  - method: cash (share of point-of-sale transactions)
    percent: 51.0
    sourceId: bundesbank-payments-2023
  - method: card and other non-cash (share of point-of-sale transactions)
    percent: 49.0
    sourceId: bundesbank-payments-2023
paymentCulture:
  popularMethods:
    - "Cash (bar) — still widely used and accepted, especially in smaller shops, bakeries, markets and restaurants, though card use keeps rising; Germans historically have a strong cash preference"
    - "Girocard (EC-card) — the dominant domestic debit card, accepted at the large majority of German point-of-sale terminals"
    - "Contactless card and mobile payments (Giropay, Apple Pay, Google Pay, PayPal online) — growing rapidly, led by younger urban shoppers"
    - "Credit cards (Visa, Mastercard, American Express) — common but historically less universal than debit; increasingly accepted"
  tipping:
    expected: false
    autoIncludedInBill: true
    typicalAmount: "Service is included in the bill, but rounding up or leaving ~5-10% is customary for good service in restaurants and cafés. Say 'stimmt so' ('keep the change') to tell the server to keep the difference. Tipping in cash is preferred so it reaches staff directly."
communicationStyle:
  contextLevel: low-context
  formalityNorms: "Use the formal 'Sie' with strangers, older people and in most professional settings until invited to use 'du'. Titles and surnames are common in formal business contexts; first-name basis is reserved for colleagues, friends and younger settings."
  greetingNorms: "A firm handshake with direct eye contact is standard in business and most formal encounters; close friends may greet with a brief hug on one side, and cheek-kissing is only for very close acquaintances or family. Punctuality is taken very seriously."
  meetingEtiquette: "Punctuality is essential; being on time (or a few minutes early) signals respect. Meetings are structured, focused and direct; Germans value preparation, clear agendas and factual, well-reasoned arguments over small talk. Rank and titles matter somewhat, but decisions are made by consensus and thorough discussion."
  topicsToAvoid:
    - "Income, personal wealth and how much something cost"
    - "Overly personal questions with people you have just met"
  giftGivingNotes: "Not expected at a first business meeting. If invited to a German home, bring a small gift — flowers (odd numbers, not red roses, which imply romance), good-quality chocolates, or a bottle of wine. Gifts are typically opened immediately, and a tasteful, non-extravagant present is appreciated."
