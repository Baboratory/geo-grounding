isSovereign: true
# Classified federal: the Federal Republic of Germany is a federal parliamentary
# republic of sixteen states (Länder), each with its own state parliament
# (Landtag), constitution and substantial legislative autonomy, so subdivision
# by state (real ISO 3166-2 codes) is mandatory. German is the state's standard
# (de facto) official and administrative language; four autochthonous national
# minorities (Danes, Frisians, Sorbs, Sinti and Roma) and their languages enjoy
# special protection, and Low German is a recognized regional language under the
# European Charter.
governanceType: federal
iso3166_2_prefix: DE
hasSubdivisions: true
