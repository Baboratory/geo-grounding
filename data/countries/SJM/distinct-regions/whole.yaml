code: WHOLE
name:
  eng: Svalbard and Jan Mayen
  local:
    - languageCode: nob
      value: "Svalbard og Jan Mayen"
climates:
  - koppenCode: ET
    description: "Arctic tundra climate — cold year-round; the west coast of Spitsbergen is kept relatively warm by the North Atlantic Current, while interior and eastern fjords stay much colder."
landmarks:
  - name: Longyearbyen
    description: Svalbard's administrative centre and largest settlement (~2,600 inhabitants), in Adventfjorden on the west coast of Spitsbergen.
  - name: "Svalbard Global Seed Vault"
    description: An underground seed repository in a mountain near Longyearbyen holding back-up crop seeds from gene banks worldwide.
  - name: Ny-Ålesund
    description: A research town and the world's northernmost permanent settlement, a hub for Arctic scientific observation.
  - name: "Beerenberg (Jan Mayen)"
    description: A 2,277 m active stratovolcano on the uninhabited island of Jan Mayen, the northernmost active volcano above sea level on Earth.
culturalTraits:
  - "Polar-research and expedition heritage on the frontier of the Arctic"
  - "Multilingual population of Norwegian, Russian and international residents"
prideOf:
  - "The Global Seed Vault and Arctic research leadership"
  - "Unspoiled high-Arctic wilderness and wildlife"
animals:
  popular:
    - Polar bear
    - Arctic fox
    - Svalbard reindeer
    - Walrus
  unique:
    - "Svalbard reindeer (Rangifer tarandus platyrhynchus) — an endemic dwarf subspecies"
industries:
  - Scientific research (UNIS, Ny-Ålesund, Kjell Henriksen Observatory)
  - Coal mining (Store Norske Spitsbergen; Russian Arktikugol at Barentsburg)
  - Arctic expedition tourism
sports:
  - Skiing and dogsledding
  - Snowmobiling
  - Northern-lights and glacier tours
