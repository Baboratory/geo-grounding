alpha3: COG
alpha2: CG
name:
  eng: Republic of the Congo
  local:
    - languageCode: fra
      value: République du Congo
flagEmoji: "🇨🇬"
capital: Brazzaville
isSovereign: true
# Classified unitary-small: the Republic of the Congo meets NONE of the 3
# DESIGN.md unitary-large criteria. (1) Population ~6.2M (2024 est.) — far below
# the 20-25M threshold. (2) French is the sole official language (2015
# Constitution, Art. 4); Kituba and Lingala are recognized national vehicular
# languages but are NOT co-official in a multi-language federal sense. (3) No
# widely recognized federal/multi-region identity — the 12 departments are
# administrative units, not culturally distinct federal regions worth curating.
# One synthetic WHOLE region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: fra
    domain: official
    speakersShare: 1.0
    sourceId: cog-language
  - languageCode: fra
    domain: locallySpoken
    speakersShare: 0.3
    sourceId: cog-language
  - languageCode: mkw
    domain: locallySpoken
    speakersShare: 0.5
    sourceId: cog-language
  - languageCode: lin
    domain: locallySpoken
    speakersShare: 0.4
    sourceId: cog-language
  - languageCode: kon
    domain: locallySpoken
    speakersShare: 0.4
    sourceId: cog-language
# French is the sole official language (2015 Constitution, Art. 4). Kituba
# (mkw, also called Munukutuba/Monokutuba) and Lingala (lin) are the two
# recognized national vehicular languages (Art. 22); Kongo/Kikongo (kon) is the
# language of the country's largest ethnic group and widely spoken in the
# south. All locallySpoken shares are ESTIMATES — Congo has no published
# language-proficiency census, so shares reflect ethnic/vehicular usage
# approximations (SIL, Ethnologue, academic surveys) rather than exact counts.
ethnicGroups:
  # CIA World Factbook 2014-2015 estimate — no recent official census breakdown.
  - group: Kongo (Bakongo)
    percent: 40.5
    sourceId: cog-ethnic-2015
  - group: Teke
    percent: 16.9
    sourceId: cog-ethnic-2015
  - group: Mbochi
    percent: 13.1
    sourceId: cog-ethnic-2015
  - group: foreigner
    percent: 8.2
    sourceId: cog-ethnic-2015
  - group: Sangha
    percent: 5.6
    sourceId: cog-ethnic-2015
  - group: Mbere/Mbeti/Kele
    percent: 4.4
    sourceId: cog-ethnic-2015
  - group: Punu
    percent: 4.3
    sourceId: cog-ethnic-2015
  - group: Pygmy
    percent: 1.6
    sourceId: cog-ethnic-2015
  - group: Oubanguiens
    percent: 1.6
    sourceId: cog-ethnic-2015
  - group: Duma
    percent: 1.5
    sourceId: cog-ethnic-2015
  - group: Makaa
    percent: 1.3
    sourceId: cog-ethnic-2015
  - group: Other and unspecified
    percent: 1.0
    sourceId: cog-ethnic-2015
# CIA-estimated composition (2014-15). Congo's Constitution and data-protection
# law (Law 29-2019, Art. 14) restrict the processing of ethnic-origin data, so
# these are international estimates, not official census figures.
timezones:
  - name: Africa/Brazzaville
    standardUtcOffset: "UTC+1"
    observesDst: false
currency:
  code: XAF
  symbol: "FCFA"
  name: Central African CFA franc (BEAC)
legalConstraints:
  - topic: "EU data-protection regime inapplicable"
    description: "The Republic of the Congo is NOT an EU member or EEA state. EU rules — GDPR, VAT-inclusive price display, the 14-day withdrawal right, the 2-year guarantee — do NOT apply directly; national law governs."
    sourceId: cog-not-eu
  - topic: "data protection"
    description: "National law governs: Law No. 29-2019 of 10 October 2019 on the protection of personal data. Processing requires consent; a national commission oversees compliance and cross-border transfers to countries without adequate protection require authorization. Article 14 prohibits the processing of data revealing ethnic/regional origin, political opinions, religious belief, health or genetics — relevant to any ethnicity/religion data-collection activity."
    sourceId: cog-data-protection
  - topic: "ethnicity and religion data collection"
    description: "Under Law No. 29-2019 (Art. 14), processing personal data that reveals ethnic or regional origin is prohibited; collection and storage of ethnicGroup/religious data must be justified by law or by explicit safeguards. Treat ethnic composition figures accordingly."
    sourceId: cog-data-protection
paymentCulture:
  popularMethods:
    - "Cash — dominant across the country, especially outside Brazzaville and Pointe-Noire"
    - "Mobile money and mobile banking — rapidly growing for transfers and informal commerce"
    - "Bank cards (Visa/Mastercard) — standard in hotels, larger restaurants and modern retail in the two main cities"
    - "Bank transfers, wire and checks in formal business"
    - "Remittances via mobile money and money-transfer operators"
  tipping:
    expected: false
    typicalAmount: "Not required; 5-10% is appreciated in upscale restaurants and hotels when service is good"
    autoIncludedInBill: false
    note: "Tipping is not customary but small gratuities are welcome; a service charge may occasionally appear on hotel bills. Bargaining at markets is normal."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "French is used in business and government; formal 'Monsieur/Madame' with surnames is standard until a first-name basis is offered. Elders and hierarchy command respect."
  greetingNorms: "A handshake is standard; 'Bonjour/Bonsoir' first, then local greetings such as 'Mbote' (Lingala/Kikongo/Kituba). Asking after family and general wellbeing before business is expected."
  meetingEtiquette: "Personal relationships and trust open doors; things move at a measured, relationship-first pace. Decisions often rest with senior leadership; patience is valued."
  topicsToAvoid:
    - "Computerized politics and criticism of the long-serving administration"
    - "Confusing the Republic of the Congo with the much larger Democratic Republic of the Congo"
    - "Ethnic stereotyping or treating the many groups as interchangeable"
    - "Overly blunt, direct criticism delivered without warmth"
  giftGivingNotes: "Not required at business meetings; a small thoughtful gesture is welcome once a relationship forms. Gift-giving is more about hospitality and personal bonds than business protocol."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
