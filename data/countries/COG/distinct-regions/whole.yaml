    note: "Religious composition (2010 est.): Roman Catholic 33.1%, Awakening/Christian Revival 22.3%, Protestant 19.9%, Salutiste 2.2%, Muslim 1.6%, Kimbanguiste 1.5%, other 8.1%, none 11.3%. Many blend Christianity with traditional beliefs."
