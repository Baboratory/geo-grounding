alpha3: SOM
alpha2: SO
name:
  eng: Somalia
  local:
    - languageCode: som
      value: Soomaaliya
    - languageCode: arb
      value: الصومال
flagEmoji: "🇸🇴"
capital: Mogadishu
isSovereign: true
# Classified federal: the 2012 Provisional Constitution declares the Federal
# Republic of Somalia a federal republic with a two-tier system of the federal
# government and federal member states (FMS) (Art. 48-52), and that federal
# structure is genuinely realised on the ground — Somaliland (a self-declared
# independent, internationally unrecognised polity of the former British
# colony), Puntland, and Galmudug, Hirshabelle, South West and Jubaland all
# administer defined territories with their own regional governments. Somalia
# meets the federal bar (a real constitutional federal structure), so
# hasSubdivisions=true with curated real ISO 3166-2 regions. Note the caveat:
# population estimates (~18M) sit below the 20-25M unitary-large threshold, but
# the constitutional federal framework plus a uniquely strong regional identity
# (Somaliland and Puntland especially) settles the call as federal.
# Curated regions: Banaadir (the capital region), Somaliland (the self-declared
# state, grouping its five ISO 3166-2 regions), Puntland (grouping Bari, Nugaal
# and Mudug), plus the mandatory WHOLE country-wide fallback. The other
# ISO 3166-2 regions (Bakool, Bay, Galguduud, Gedo, Hiiraan, Jubbada Dhexe,
# Jubbada Hoose, Shabeellaha Dhexe, Shabeellaha Hoose) are not yet curated and
# fall back to WHOLE.
governanceType: federal
iso3166_2_prefix: SO
hasSubdivisions: true
regionCoverage:
  # Count per ISO 3166-2 as of 2026-09. The uncurated units have NOT yet been
  # tested against DESIGN.md's five coverage triggers -- this declaration records
  # the gap so it is visible, not a finding that the gap is correct. Pending the
  # coverage re-audit (see TODO.md).
  tier: first-level
  totalUnits: 18
  status: partial
  gapReason: "3 of 18 first-level units curated. Which of the
    remaining units fire a coverage trigger has not been assessed yet -- the
    curated set predates the coverage floor and was chosen by size/capital,
    not by divergence. Queued for the coverage re-audit."
languageUsage:
