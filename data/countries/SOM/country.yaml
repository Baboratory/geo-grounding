    domain: official
    speakersShare: 1.0
    sourceId: somali-constitution
  - languageCode: arb
    domain: official
    speakersShare: 1.0
    sourceId: somali-constitution
  - languageCode: som
    domain: locallySpoken
    speakersShare: 0.96
