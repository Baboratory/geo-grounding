# Spanish (castellano) is the sole official language (Const. Art. 9), though
# the Constitution and the 2008 Ley de Idiomas Indígenas recognize the
# country's indigenous languages as official for the indigenous peoples and
# mandate their use within indigenous territories. The largest are Wayuu
# (~305,000 self-declared speakers, mainly Zulia), Warao (Orinoco Delta) and
# Pemon (Bolívar/Gran Sabana). As in the rest of the dataset these are listed
# as locallySpoken ESTIMATES rather than competing 1.0 official rows, keeping
# Spanish as the sole national official language.
ethnicGroups:
  - group: Moreno (mixed/mestizo)
    percent: 51.6
