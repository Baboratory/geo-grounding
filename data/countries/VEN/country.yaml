    adminUnitCodes: [VE-A, VE-M, VE-X, VE-D, VE-G]
  - code: VE-V
    file: distinct-regions/ve-v.yaml
    adminUnitCodes: [VE-V]
  - code: VE-L
    file: distinct-regions/ve-l.yaml
    adminUnitCodes: [VE-L, VE-S, VE-T, VE-U]
  - code: VE-P
    file: distinct-regions/ve-p.yaml
    adminUnitCodes: [VE-P, VE-E, VE-C, VE-J, VE-H, VE-N]
  - code: VE-F
