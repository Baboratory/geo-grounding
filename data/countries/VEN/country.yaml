# Self-identification per the XIV National Population and Housing Census 2011
# (INE). No complete census has been published since; these remain the last
# official figures and are used with that caveat.
timezones:
  - name: America/Caracas
    standardUtcOffset: "UTC-4"
    observesDst: false
currency:
  code: VES
  symbol: "Bs."
  name: Bolívar soberano
legalConstraints:
  - topic: "official language"
    description: "Constitution (1999) Art. 9: Spanish (castellano) is the single official language of the Republic; indigenous languages are also official for the indigenous peoples and must be respected across the national territory as cultural heritage. The 2008 Ley de Idiomas Indígenas mandates their use in indigenous territories, education, labour and administrative/judicial domains. Public/government text is Spanish."
    sourceId: ven-constitution
  - topic: "currency / legal tender"
    description: "The bolívar (currently Bolívar soberano, ISO code VES) is the legal tender issued by the Banco Central de Venezuela. After hyperinflation there were multiple redenominations (2018, and the 1 Oct 2021 'bolívar digital' scale suppressing six zeros, still code VES). Since ~2019 the US dollar is accepted de facto across much of the economy (de facto dollarization) though it is not official legal tender."
    sourceId: ven-bcv
paymentCulture:
  popularMethods:
    - "US dollar cash — de facto dominant since ~2019 (widely used alongside bolívares despite not being official tender)"
    - "Cash in bolívares (VES), increasingly in the 2021 'bolívar digital' decimal scale"
    - "Pago Móvil / Biopago — mobile phone transfer and QR payments, very widespread"
    - "Debit and credit cards (Visa, Mastercard) in urban commerce"
    - "International remittance networks (Venezuelan diaspora support)"
  tipping:
    expected: true
    typicalAmount: "About 10% ('la propina') in restaurants and for service staff; commonly added manually to the bill rather than always automatic"
    autoIncludedInBill: false
    note: "A ~10% tip is customary in restaurants and for service staff; unlike in Peru it is usually added manually to the bill rather than auto-included. US-dollar cash and Pago Móvil/Biopago transfers dominate given the de facto dollarization of the economy."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Warm and direct; 'usted' is common and polite for unfamiliar adults, 'tú' among friends and peers. Title + surname (Ingeniero/Ingeniera, Doctora) is expected in professional settings until told otherwise. Relationships and personal warmth matter as much as the content."
  greetingNorms: "A verbal greeting is always given (Buenos días/Buenas tardes/Hola) plus a handshake in business; among friends a light kiss on the cheek (besito) and hugs are common and expected. Looking people in the eye and smiling conveys sincerity."
  meetingEtiquette: "Meetings open with small talk and cordial greetings before business; considerable expressiveness and overlapping, animated speech are normal and not rude. Punctuality is more relaxed in social settings; business meetings are closer to on-time. Decisions often rely on trusted personal relationships."
  topicsToAvoid:
    - "Political opinions, especially about chavismo/opposition and the current government — highly sensitive and polarizing"
    - "Public discussion of the economic crisis, hyperinflation, shortages or emigration's impact on families"
    - "Praising or criticizing particular politicians; framing any comment in a way that invites partisanship"
  giftGivingNotes: "Not required in business; small, tasteful gifts (chocolate, coffee, or a quality local item) are appreciated once a relationship forms. When invited to someone's home, flowers, dessert or a good bottle is well received."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
  - code: VE-A
