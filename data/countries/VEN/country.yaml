sources:
  - id: ven-constitution
    name: "Constitución de la República Bolivariana de Venezuela (1999), Arts. 4, 9"
    publisher: "Asamblea Nacional de Venezuela"
    url: "https://www.asambleanacional.gob.ve/storage/documentos/botones/constitucion-nacional-20191205135853.PDF"
    year: 1999
    accessedDate: "2026-09-19"
    note: "Basis for the federal classification (Art. 4), the single official language (Art. 9), and the co-official status of indigenous languages for the indigenous peoples (Arts. 9, 100)."
  - id: ven-ine
    name: "XIV Censo Nacional de Población y Vivienda 2011 (resultados definitivos)"
    publisher: "Instituto Nacional de Estadística (INE) de Venezuela"
    url: "https://www.ine.gov.ve/"
    year: 2011
    accessedDate: "2026-09-19"
    note: "Last official census (27,227,930 residents) and the ethnic self-identification and indigenous-language speaker figures. No complete census has been published since the 2015 economic crisis; these figures are the most recent official ones. Indigenous language speaker shares are ESTIMATES from census self-identification of those pueblos."
  - id: ven-embassy
    name: "Venezuelan embassy language overview (Spanish as mother tongue of ~92% of the population)"
    publisher: "Embajada de Venezuela"
    url: "https://www.embajadadevenezuela.org/generalidades/idiomas"
    accessedDate: "2026-09-19"
    note: "Supporting source for the estimate that Spanish is the native language of ~92% of the population; flagged as an ESTIMATE."
  - id: ven-bcv
    name: "Banco Central de Venezuela (BCV) — bolívar and monetary redenominations"
    publisher: "Banco Central de Venezuela (BCV)"
    url: "https://www.bcv.org.ve/"
    accessedDate: "2026-09-19"
    note: "Basis for currency (Bolívar soberano, VES), the redenominations (2018 and 2021 'bolívar digital'), and the de facto dollarization context since ~2019."
