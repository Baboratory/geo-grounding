alpha3: VEN
alpha2: VE
name:
  eng: Venezuela
  local:
    - languageCode: spa
      value: República Bolivariana de Venezuela
flagEmoji: "🇻🇪"
capital: Caracas
isSovereign: true
# Classified federal: Venezuela is a FEDERAL republic per Constitución de la
# República Bolivariana de Venezuela (1999), Art. 4 ('Los estados son
# entidades autónomas e iguales en lo político... unidas en una federación').
# It comprises 23 states, the Capital District (Distrito Capital/Caracas) and
# the Federal Dependencies (islands). Each state has its own elected governor
# and Legislative Council under a federal system. Meets DESIGN.md's federal
# criteria and has a population (~27-28M) well above any small-state
# threshold. Five curated cultural-geographic regions (capital/central-north,
# Zulia/west, Andes, Llanos, Guayana/Orinoco) sit alongside the generic WHOLE
# fallback.
governanceType: federal
iso3166_2_prefix: "VE"
hasSubdivisions: true
languageUsage:
  - languageCode: spa
    domain: official
    speakersShare: 1.0
    sourceId: ven-constitution
  - languageCode: spa
