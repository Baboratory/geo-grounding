# religions intentionally omitted at country level: figures are only
# approximate and adult-affiliation figures vary by survey source; Roman
# Catholic is the large majority and a substantial Protestant minority
# exists, but per the no-unsourced-stats rule they are captured qualitatively
# at region level where citable.
timezones:
  - name: America/Curacao
    standardUtcOffset: "UTC-4"
    observesDst: false
# Uses the Caribbean guilder (XCG), introduced 31 March 2025 and replacing the
# Netherlands Antillean guilder (ANG), issued by the Central Bank of Curaçao
# and Sint Maarten (CBCS). Pegged to the US dollar at 1 USD = 1.79 XCG.
currency:
  code: XCG
  symbol: "Cg"
  name: Caribbean guilder
legalConstraints:
  - topic: "consumption tax (OB) and price display"
    description: "Curaçao levies a turnover/ad valorem consumption tax ('omzetbelasting', OB) — the standard rate is 6%. Consumer prices are generally displayed inclusive of the OB, and there is no VAT."
    sourceId: cuw-tax
  - topic: "official languages"
    description: "The official languages of Curaçao are Papiamentu, Dutch and English (Constitution of Curaçao 2010). Dutch is the language of most administration, legislation and court proceedings."
    sourceId: cuw-constitution
  - topic: "data protection / privacy"
    description: "Curaçao has no autonomous comprehensive data-protection law as of late 2025; processing of personal data generally follows Kingdom-of-the-Netherlands standards where applicable (and for EU-oriented processors the GDPR may engage via the Kingdom), but Curaçao is not an EU/EEA member state and has not enacted its own GDPR-style regime. Flagged for confirmation."
    sourceId: cuw-privacy
# paymentMethodShares intentionally omitted: no official consumer
# payment-method share (cash vs card vs wallet) is published by CBCS. Cash is
# historically dominant; card adoption is growing in the tourism sector.
paymentCulture:
  popularMethods:
    - "Cash (Caribbean guilder and US dollar — the latter accepted widely given tourism)"
    - "Visa and Mastercard / debit cards at hotels, restaurants and supermarkets"
    - "Mobile/contactless payments growing at larger merchants"
  tipping:
    expected: true
    typicalAmount: "10-15% in restaurants when no service charge is added"
    autoIncludedInBill: false
    note: "Several restaurants include a service charge on the check; otherwise 10-15% gratuity for good service is common in the hospitality trade."
communicationStyle:
  contextLevel: mixed
  formalityNorms: "Relaxed, warm and informal; first names are common among colleagues once acquainted. Formal titles and 'Mevrouw/Meneer' (Mrs./Mr., Dutch) or 'Sra./Sr.' (Papiamentu) are used with strangers, officials and in formal written communication."
  greetingNorms: "A friendly greeting — a handshake among men, and between acquaintances often a kiss on both cheeks or a hug. 'Bon dia' (good morning) / 'Bon tardi' (good afternoon) in Papiamentu, or Dutch/English greetings, are all received well."
  meetingEtiquette: "Punctuality is appreciated but flexibility ('island time') is reasonably common outside formal meetings. Business meetings are typically cordial with small talk up front; relationship and trust matter and decisions can take a couple of rounds. Dress is smart-casual."
  topicsToAvoid:
    - "Politics and the constitutional relationship with the Netherlands"
    - "The oil refinery / environmental controversies (a point of island sensitivity)"
  giftGivingNotes: "Gifts are not expected in business; if invited to a home, a modest gift (flowers, chocolates) is appreciated. Offer and receive with the right hand."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
