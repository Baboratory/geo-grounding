# Language official-status basis: the Constitution of Curaçao (Staatsregeling,
# in force 10 October 2010 on the dissolution of the Netherlands Antilles)
# recognises Papiamentu, Dutch and English as official languages; Dutch is used
# for most administration and legal matters while Papiamentu is the everyday
# first language of the large majority. (The local spelling of the language in
# Curaçao is 'Papiamentu'; the ISO 639-3 code pap is the same language as
# Aruba's 'Papiamento'.)
languageUsage:
  - languageCode: pap
    domain: official
    speakersShare: 1.0
    sourceId: cuw-constitution
  - languageCode: nld
    domain: official
    speakersShare: 1.0
    sourceId: cuw-constitution
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: cuw-constitution
  # 2001 census (most recent with a widely cited mother-tongue table):
  # Papiamentu was the first language of ~81.2%, Dutch ~8%, Spanish ~4%,
  # English ~2.9%. Figures for locallySpoken are drawn from that census and
  # flagged accordingly.
  - languageCode: pap
    domain: locallySpoken
    speakersShare: 0.812
    sourceId: cuw-census-2001
  - languageCode: nld
    domain: locallySpoken
    speakersShare: 0.08
    sourceId: cuw-census-2001
  - languageCode: spa
    domain: locallySpoken
    speakersShare: 0.04
    sourceId: cuw-census-2001
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.029
    sourceId: cuw-census-2001
