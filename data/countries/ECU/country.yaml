    publisher: "this factsheet"
    url: "https://www.ecuadorencifras.gob.ec/"
    accessedDate: "2026-09-17"
    note: "Placeholder sourceId for values that are estimates or could not be verified against a directly-fetchable primary source: locallySpoken shares for spa (0.97), que (0.031), jiv (0.0035), eng foreign (0.1). Flagged as estimates in their notes."