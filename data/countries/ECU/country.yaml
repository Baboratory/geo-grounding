# NOTE on language codes: Ecuadorian Kichwa is covered by the ISO 639-3
# macrolanguage 'que' (Quechua); 'shu' is NOT Shuar (it is Chadian Arabic) — the
# correct Shuar code is 'jiv'. The official rows (spa/que/jiv) are legal-status
# flags at 1.0 per Constitucion Art. 2. LocallySpoken shares are ESTIMATES: spa
# 0.97 (near-universal, per 2010 census via secondary references); que 0.031
# (527,333 Kichwa speakers / 16,938,986, 2022 census via secondary tabulation);
# jiv 0.0035 (59,894 / 16,938,986); eng 0.1 (estimated low proficiency).
