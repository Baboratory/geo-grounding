# Classified unitary-small: population 16,938,986 (INEC 2022 census) is below the
# unitary-large threshold; Kichwa and Shuar are co-official languages for
# intercultural relations NATIONWIDE (2008 Constitucion Art. 2), not language-defined
# regional structures; and the Costa/Sierra/Oriente identities are geographic
# rather than a widely-recognized cultural-historical regional identity. One
# synthetic WHOLE region.
