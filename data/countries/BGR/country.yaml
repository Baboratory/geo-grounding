# Bulgaria's states are unitary; its widely used regional and minority
# languages (notably Turkish and Romani) are statutory minorities rather than
# officials, so they appear here as locallySpoken rows only. No one region
# meets the bar for a distinct cultural-regional divide warranting curated
# regions, so the country is a single WHOLE entry.
ethnicGroups:
  - group: Bulgarians
    percent: 84.6
    sourceId: bg-census-2021
  - group: Turks
    percent: 8.4
    sourceId: bg-census-2021
  - group: Roma (Romani)
    percent: 4.4
    sourceId: bg-census-2021
  - group: Other (including Armenians, Russians, Vlach)
    percent: 1.3
    sourceId: bg-census-2021
  - group: Did not self-identify / would not answer
    percent: 1.3
    sourceId: bg-census-2021
timezones:
  - name: Europe/Sofia
    standardUtcOffset: "UTC+2"
    observesDst: true
    dstUtcOffset: "UTC+3"
    dstPeriod: "Last Sunday of March to last Sunday of October (EU-wide schedule)."
currency:
  code: BGN
  symbol: "лв"
  name: Bulgarian lev
legalConstraints:
  - topic: "VAT price display"
    description: "Consumer-facing prices must be shown VAT-inclusive."
    sourceId: eu-directive-98-6-ec
  - topic: "consumer withdrawal right"
    description: "Consumers buying at a distance (online, etc.) have a 14-day no-reason withdrawal/return right, EU-wide."
    sourceId: eu-directive-2011-83-eu
  - topic: "data protection (GDPR)"
    description: "Collecting or processing personal data (names, emails, browsing/behavioral data, etc.) requires a lawful basis such as consent, must be limited to a stated purpose, and grants individuals rights including access, correction, and erasure ('right to be forgotten') — the EU-wide GDPR, directly applicable in Bulgaria."
    sourceId: eu-regulation-2016-679-gdpr
  - topic: "consumer guarantee"
    description: "Goods sold to consumers carry a minimum 2-year legal guarantee of conformity from delivery, during which a faulty item must be repaired, replaced, discounted, or refunded free of charge — independent of and in addition to any commercial/manufacturer warranty."
    sourceId: eu-directive-2019-771
paymentMethodShares:
  - method: "card payment (share of non-cash payment transactions)"
    percent: 70.0
    sourceId: bnb-payments-2024
paymentCulture:
  popularMethods:
    - "Cards (Visa, Mastercard, Maestro) — dominant for daily payments"
    - "Local debit cards (linked to the national payment system)"
    - "Instant/bank transfers (including the national TARGET2-like instant rail)"
    - "Cash (lev; still accepted widely, especially in small towns and rural areas)"
  tipping:
    expected: true
    autoIncludedInBill: false
    typicalAmount: "In restaurants a tip of about 10% is customary for good service, typically paid in cash or rounded up. In cafés, rounding up is common. Tipping taxi drivers by rounding up is appreciated."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Bulgarians use the formal 'vi' (you) with strangers and in professional settings; move to first names and the informal 'ty' only when invited. Titles and politeness are noticed."
  greetingNorms: "Handshake is standard in business. Among friends and acquaintances, a handshake or a nod is common; in more familiar settings, cheek-to-cheek air kisses or a pat on the back may replace it."
  meetingEtiquette: "Punctuality is generally respected, though in business a brief tolerance for slight lateness is common. Meetings often open with small talk and coffee before business. Bulgarians tend to build personal relationships first and appreciate directness once trust is established."
  topicsToAvoid:
    - "Personal income and politics with new acquaintances"
    - "Criticising the country's history or recent political situation unprompted"
  giftGivingNotes: "Not required at a first business meeting. If invited to a Bulgarian home, bring a bottle of wine, chocolates, or flowers (odd number, avoiding red roses). A small gift for children is always welcome."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
  - id: bg-constitution-art3
