      value: الإمارات العربية المتحدة
flagEmoji: "🇦🇪"
capital: Abu Dhabi
isSovereign: true
# Classified federal: the UAE is a federation of seven emirates (Abu Dhabi,
# Dubai, Sharjah, Ajman, Umm Al Quwain, Ras Al Khaimah and Fujairah), each with
# substantial autonomy and a ruling royal family, per the 1971 Constitution.
# Real ISO 3166-2 (emirate) region files are curated alongside the WHOLE
# fallback.
governanceType: federal
iso3166_2_prefix: AE
hasSubdivisions: true
regionCoverage:
  # Count per ISO 3166-2 as of 2026-09. The uncurated units have NOT yet been
  # tested against DESIGN.md's five coverage triggers -- this declaration records
  # the gap so it is visible, not a finding that the gap is correct. Pending the
  # coverage re-audit (see TODO.md).
  tier: first-level
  totalUnits: 7
  status: partial
  gapReason: "3 of 7 first-level units curated. Which of the
    remaining units fire a coverage trigger has not been assessed yet -- the
    curated set predates the coverage floor and was chosen by size/capital,
    not by divergence. Queued for the coverage re-audit."
