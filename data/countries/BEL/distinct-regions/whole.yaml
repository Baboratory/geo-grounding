businessRhythm:
  restDays:
    - sunday
  notes: "Sunday is the default closure day for retail (see country.yaml's Sunday-trading legalConstraints), with legislated exceptions. In practice most shops close on Sunday except in the Christmas period, tourist areas and city centres where many stay open. Public holidays and the summer (July-August) are common times for reduced business hours."
