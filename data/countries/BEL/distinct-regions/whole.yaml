  - name: Protestant
    percent: 2.0
    sourceId: bel-religion-ess
  - name: Eastern Orthodox
    percent: 1.0
    sourceId: bel-religion-ess
  - name: Other Christian and other religions
    percent: 1.0
    sourceId: bel-religion-ess
entertainment:
  - season: allYear
    items:
      - "Café culture and beer tasting in traditional 'bruine kroegen' (brown cafés)"
      - Football and cycling spectating
      - "Cinema, theatre and the vibrant music scene (Belgian electronic and jazz scenes)"
      - "Dim sum-style 'plat du jour' restaurant and 'frituur' (fries stand) outings"
  - season: summer
    items:
      - "Outdoor festivals: Tomorrowland, Pukkelpop, Rock Werchter and countless town fêtes (kermesse/volksfeesten)"
      - "The Brussels flower carpet at the Grand Place (every even year in August)"
      - Beach and coastal season on the North Sea (Ostend, De Panne, Knokke)
  - season: winter
    items:
      - "Christmas markets in Brussels, Bruges, Ghent and Antwerp"
      - "New Year's Eve and Saint Nicholas (Sinterklaas, 6 December) celebrations"
      - "Carnival traditions (e.g. the Carnival of Binche), a UNESCO-listed pre-Lenten festival"
traditionalDishes:
  - season: allYear
    items:
      - "Moules-frites (mussels with fries) — the classic national dish"
      - "Carbonnade flamande (beef stew braised in brown beer)"
      - "Waterzooi (a creamy chicken or fish stew, from Ghent)"
      - "Stoemp (mashed potato mixed with vegetables, often served with sausage)"
      - "Belgian fries with 'fritessaus/mayonnaise' and the many stroopwafel-like sweet treats"
  - season: summer
    items:
      - "Fresh North Sea seafood: shrimp ('grey shrimps'), mussels in season (roughly July to April)"
      - "Crisp 'witte' (white/ witbier) and fruit beers, and summer salads"
  - season: winter
    items:
      - "Hearty stews, stoemp and game in the Ardennes"
      - "Chocolate and speculoos (spiced biscuit) during the holiday season"
      - "Oliebollen (doughnuts) at New Year"
traditionalClothing:
  - season: allYear
    items:
      - "Folk costumes worn at traditional festivals and processions (e.g. the Binche Gilles' waxed mask and ostrich-feather headdress, and Manneken Pis-style historical dress at civic events)"
      - "The historical guild and folklore clothing seen at the Ommegang and other pageants"
seasonCalendar:
  - season: spring
    months: [3, 4, 5]
  - season: summer
    months: [6, 7, 8]
  - season: autumn
    months: [9, 10, 11]
  - season: winter
