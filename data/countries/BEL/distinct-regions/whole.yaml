code: WHOLE
name:
  eng: Belgium
  local:
    - languageCode: nld
      value: België
    - languageCode: fra
      value: Belgique
    - languageCode: deu
      value: Belgien
climates:
  - koppenCode: Cfb
    description: Temperate maritime climate, the dominant climate of Belgium — mild winters, cool summers, and rain spread fairly evenly through the year across most of the country.
  - koppenCode: Cfb
    description: Slightly more continental conditions with warmer, occasionally hot summers in inland areas away from the North Sea.
landmarks:
  - name: Grand Place (Grote Markt), Brussels
    description: The ornate central square ringed by guildhalls and the Town Hall, one of Europe's most celebrated civic squares and a symbol of Belgium.
    unescoWorldHeritage: true
  - name: Atomium
    description: The giant iron-crystal-shaped monument (58 m) built for the 1958 Brussels World's Fair, Belgium's best-known modern landmark.
  - name: Bruges
    description: The beautifully preserved medieval canal city of West Flanders, a UNESCO-listed historic centre.
    unescoWorldHeritage: true
  - name: Belfries of Belgium and France
    description: A series of historic belfry towers in towns across Flanders, Wallonia and northern France, listed together as a UNESCO World Heritage site.
    unescoWorldHeritage: true
  - name: Ardennes
    description: The forested, hilly low-mountain plateau of the southeast (Wallonia), traversed by the Meuse and Ourthe rivers, famed for its castles and wild scenery.
culturalTraits:
  - Federalized power-sharing between three linguistic communities (Dutch, French, German), built on compromise and consensus
  - Deep tradition of beer culture — over 1,500 beer varieties, monastic Trappist brewing and lambic sour beers, recognised by UNESCO intangible heritage
  - Chocolates and pralines, waffles and fries ('frites', with 'friet' 'saus' culture) as national staples
  - Strong comic-strip tradition (Tintin, The Smurfs, Spirou) and Beaux-Arts/surrealist art (Magritte, Ensor)
  - Efficient, pragmatic work culture with a strong social-welfare state
prideOf:
  - Its beer, chocolate and culinary craft
  - A laid-back, tolerant society with a strong sense of humour
  - Gothic-brick architecture and the preserved medieval towns of Flanders
  - Its role as de facto capital of the European Union, with global institutions clustered in Brussels
animals:
  popular:
    - "Common badger (dassen) in the Ardennes and Meuse valley woodlands"
    - Red deer and wild boar in the Ardennes forests
    - "Pied avocet and other wading birds along the North Sea coast and the Zwin reserve"
    - Cows and dairy cattle across the Flemish and Walloon countryside
  unique:
    - "The Belgian Blue (Blanc Bleu Belge), a heavily-muscled double-muscled beef breed developed in Belgium"
    - "The Belgian draft horse (Brabants trekpaard), a heavy draught workhorse"
industries:
  - "Chemicals and pharmaceuticals (Antwerp is a major global chemicals cluster)"
  - "Machinery, automotive and manufacturing (Flanders' strong industrial base)"
  - "Food and drink (beer, chocolate, processing)"
  - "Logistics and transport (the Port of Antwerp-Bruges and intricate inland waterways)"
  - "Services, finance and the European-Union-related 'institutional' economy of Brussels"
sports:
  - Football (soccer — the most popular spectator sport, with a strong club culture)
  - Cycling (road racing and cyclocross — cycling is a national passion)
  - Tennis (long a leading sport, with the Belgian Tennis Federation's strong legacy)
  - "Motorsport (Formula 1 at Spa-Francorchamps)"
  - Athletics and a strong walking/kar (hiking) culture
