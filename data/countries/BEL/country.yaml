isSovereign: true
# Classified federal: Belgium is a federal state (federale staat / État fédéral)
# with three Regions (Flanders, Wallonia, Brussels-Capital) and three
# Communities (Flemish, French, German-speaking), a structure with deep
# constitutional footing since 1970 and enshrined by Art. 1 of the
# consolidated Constitution. It has three official languages (Dutch, French,
# German) and a widely recognized cultural-historical divide between its
# linguistic communities. The dataset curates the three Regions plus a WHOLE
# fallback; the Communities (which overlap the Regions) are not curated
# separately.
governanceType: federal
iso3166_2_prefix: BE
hasSubdivisions: true
languageUsage:
  - languageCode: nld
    domain: official
    speakersShare: 1.0
    sourceId: bel-constitution
  - languageCode: fra
    domain: official
    speakersShare: 1.0
