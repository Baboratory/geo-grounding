alpha3: FRO
alpha2: FO
name:
  eng: Faroe Islands
  local:
    - languageCode: fao
      value: Føroyar
    - languageCode: dan
      value: Færøerne
flagEmoji: "🇫🇴"
capital: Tórshavn
isSovereign: false
governanceType: dependent-territory
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: fao
    domain: official
    speakersShare: 1.0
    sourceId: home-rule-act-1948
  # Faroese is the "principal language" per the Home Rule Act (Sec. 11);
  # Danish is not co-official -- the Act only says Danish "may be used as
  # well as Faroese in public affairs" and is taught from an early age. The
  # high share below reflects near-universal Danish proficiency as a second
  # language, not official status.
  - languageCode: fao
    domain: locallySpoken
    speakersShare: 0.98
    sourceId: home-rule-act-1948
  - languageCode: dan
    domain: locallySpoken
    speakersShare: 0.85
    sourceId: faroeislands-fo-language
  - languageCode: eng
    domain: foreign
    speakersShare: 0.4
    sourceId: faroeislands-fo-language
timezones:
  - name: Atlantic/Faroe
    standardUtcOffset: "UTC+0"
    observesDst: true
    dstUtcOffset: "UTC+1"
    dstPeriod: "Last Sunday in March to last Sunday in October (Western European Time / Western European Summer Time)."
currency:
  code: DKK
  symbol: "kr"
  name: Danish krone
legalConstraints:
  - topic: "Home rule within the Kingdom of Denmark"
    description: "The 1948 Home Rule Act establishes the Faroe Islands as a self-governing community within the Kingdom of Denmark, taking over many fields of domestic administration while Denmark retains foreign and defence policy. The Act recognises Faroese as the principal language."
    sourceId: home-rule-act-1948
paymentCulture:
  popularMethods:
    - Visa and Mastercard (accepted essentially everywhere, contactless)
    - Mobile and card payments are dominant; cash is accepted at most retailers
  tipping:
    expected: false
    typicalAmount: "Not customary"
    autoIncludedInBill: false
    note: "Service is generally considered included."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
  - id: home-rule-act-1948
    name: "Faroe Islands Home Rule Act (Act no. 137 of 23 March 1948), as consolidated"
    publisher: "Government of the Faroe Islands"
    url: "https://www.government.fo/en/the-government/the-home-rule-act"
    year: 1948
    accessedDate: "2026-09-20"
    note: "Legal basis for the Faroe Islands' self-governing status within the Kingdom of Denmark and for Faroese being recognised as the principal language, with Danish taught and usable in public affairs."
  - id: faroeislands-fo-language
    name: "The Faroese Language"
    publisher: "Faroe Islands (official tourism and culture portal, faroeislands.fo)"
    url: "https://www.faroeislands.fo/arts-culture/the-faroese-language/"
    accessedDate: "2026-09-20"
    note: "Source for Faroese being the national and official language (spoken by roughly 75,000-80,000 worldwide), Danish taught in schools and usable in public affairs (not co-official), and English widely spoken. The page states these qualitatively; the 0.85 Danish and 0.4 English shares are ESTIMATES, not figures given on the page."
  - id: wikipedia-languages-faroe
    name: "Languages of the Faroe Islands"
    publisher: "Wikipedia"
    url: "https://en.wikipedia.org/wiki/Languages_of_the_Faroe_Islands"
    accessedDate: "2026-09-20"
    note: "Confirms Faroese as the sole official language and Danish's status as a widely-used, taught second language, not co-official."
