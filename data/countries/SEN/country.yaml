alpha3: SEN
alpha2: "SN"
name:
  eng: Senegal
  local:
    - languageCode: fra
      value: République du Sénégal
flagEmoji: "🇸🇳"
capital: Dakar
isSovereign: true
# Classified unitary-small per the batch-19 brief. Senegal meets none of the 3
# DESIGN.md unitary-large criteria as a curatable multi-region state: (1) its
# population (~18.4M at 2023 est.) is below the 20-25M threshold; (2) French is the
# sole *official* language — Wolof, Pulaar, Serer, Jola, Mandinka and Soninke are
# constitutionally recognized *national* languages, not co-official regional
# languages with autonomous self-government; (3) there is no strong
# widely-recognized cultural-historical federal/regional identity we curate as
# regions — the historic kingdoms (Jolof, Cayor, Waalo) remain cultural heritage,
# not present-day self-governing regions. One synthetic WHOLE region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: fra
    domain: official
    speakersShare: 1.0
    sourceId: sen-official-language
  - languageCode: wol
    domain: locallySpoken
    speakersShare: 0.80
    sourceId: sen-language-wolof
  - languageCode: fuc
    domain: locallySpoken
    speakersShare: 0.26
    sourceId: sen-language
  - languageCode: srr
    domain: locallySpoken
    speakersShare: 0.16
    sourceId: sen-language
  - languageCode: dyo
    domain: locallySpoken
    speakersShare: 0.04
    sourceId: sen-language
# French is the official language (Constitution Art. 1), which also recognizes the
# national languages wolof, pulaar, serer, jola, mandinka and soninke. Wolof is the
# de facto national lingua franca, spoken as first or second language by the large
# majority (ESTIMATE ~80%). The fuc/srr/dyo shares approximate the corresponding
# ethnic-group shares (mother-tongue speakers); no official language-proficiency
# census is published, so all locallySpoken shares are marked ESTIMATE in the notes.
ethnicGroups:
  # 2019 estimates (CIA World Factbook).
  - group: Wolof
    percent: 39.7
    sourceId: sen-ethnic
  - group: Pular (Fulani/Peul)
    percent: 27.5
    sourceId: sen-ethnic
  - group: Serer
    percent: 16.0
    sourceId: sen-ethnic
  - group: Mandinka
    percent: 4.9
    sourceId: sen-ethnic
  - group: Jola
    percent: 4.2
    sourceId: sen-ethnic
  - group: Soninke
    percent: 2.4
    sourceId: sen-ethnic
  - group: Other (incl. Europeans and persons of Lebanese descent)
    percent: 5.4
    sourceId: sen-ethnic
# Shares are 2019 estimates; the 2023 census (RGPH-5) collected ethnicity data but
# had not yet published a detailed breakdown.
timezones:
  - name: Africa/Dakar
    standardUtcOffset: "UTC+0"
    observesDst: false
currency:
  code: XOF
  symbol: "FCFA"
  name: West African CFA franc
legalConstraints:
  - topic: "not an EU member"
    description: "Senegal is NOT an EU member or EEA state (a sovereign republic, independent from France in 1960). EU directives — GDPR, VAT-inclusive price display, the 14-day withdrawal right, the 2-year guarantee — do NOT apply directly; national law governs."
    sourceId: sen-sovereign
  - topic: "data protection"
    description: "Loi n° 2008-12 du 25 janvier 2008 sur la protection des données à caractère personnel governs personal-data processing; the Commission de Protection des Données Personnelles (CDP) is the national regulator. National law, not GDPR."
    sourceId: sen-data-protection
paymentCulture:
  popularMethods:
    - "Cash (West African CFA franc, XOF) — dominant for daily retail and market payments"
    - "Mobile money (Orange Money, Wave, MTN MoMo) — widespread in urban and rural areas"
    - "Bank transfers and cash-deposit terminals (BCEAO-licensed banks)"
    - "Cards — limited outside formal retail, hotels and larger merchants"
  tipping:
    expected: false
    typicalAmount: "Small discretionary sums (~5%) or rounding in formal/urban restaurants; appreciated but not mandated"
    autoIncludedInBill: false
    note: "Tipping is not institutionalized in Senegal. A small gratuity is welcome in formal restaurants and for porters, but local markets and small vendors expect exact cash."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "French is the official working language; Wolof is used for social and informal interaction. Use Monsieur/Madame and titles with elders and officials; first names follow once a relationship forms."
  greetingNorms: "Greeting is important — 'Salaamalekum' ('peace be upon you') is common; a handshake (often prolonged) with genuine enquiries after health and family comes before any business."
  meetingEtiquette: "Personal trust and relationship-building come before transactions ('teranga' hospitality). Greet all present; punctuality is expected of visitors though local meetings may run late; decisions trend senior and often consultative."
  topicsToAvoid:
    - "Religious matters of personal affiliation (Islamic brotherhood or Sufi sensitivities)"
    - "Ethnic or regional stereotypes, or the political crises"
    - "Dismissing the importance of family, age and seniority"
    - "Overly direct criticism of a counterpart in public"
  giftGivingNotes: "Not required in business. A small considerate gift is appreciated once a relationship forms; hospitality is expected to be reciprocated (offer and accept refreshment)."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
