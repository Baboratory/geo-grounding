code: MG-A
name:
  eng: Toamasina (East Coast)
  local:
    - languageCode: mlg
      value: Toamasina
    - languageCode: fra
      value: Toamasina (Tamatave)
climates:
  - koppenCode: Af
    description: "Tropical rainforest climate — the wettest region of Madagascar, receiving trade-wind rain year-round with a peak December-March."
landmarks:
  - name: Rainforests of the Atsinanana
    description: "Eastern rainforest national parks (Andasibe-Mantadia, Ranomafana, Marojejy among them) protecting endemic ecosystems; UNESCO natural site 2007."
    unescoWorldHeritage: true
  - name: Andasibe-Mantadia National Park
    description: "Prime spot to see the indri, Madagascar's largest lemur, and abundant chameleons."
  - name: Canal des Pangalanes
    description: "A chain of natural lakes and man-made channels running ~645 km along the east coast, a historic and scenic transport route."
  - name: Toamasina (Tamatave)
    description: "Madagascar's chief seaport and second-largest city, gateway for the island's trade."
culturalTraits:
  - "The ancestral homeland of the Betsimisaraka, the largest coastal ethnic group"
  - "A lush, verdant region where vanilla, cloves and coffee grow"
  - "Warm, open coastal culture with strong ties to piracy-era and trading history"
prideOf:
  - "The indri and the extraordinary eastern rainforest biodiversity"
  - "The vanilla, lychee and spice trade of the coast"
  - "The Canal des Pangalanes and the port of Toamasina"
animals:
  popular:
    - "Indri (largest lemur)"
    - "Ring-tailed lemurs and sifakas"
    - "Chameleons and leaf-tailed geckos"
    - "Fossa"
  unique:
    - "Indri (endemic to eastern Madagascar)"
    - "Numerous endemic rainforest birds and herpetofauna (chameleons, day geckos)"
industries:
  - "Vanilla, cloves and lychee exports"
  - "Seaport and shipping (Toamasina is the primary port)"
  - "Coffee and cocoa"
  - "Ecotourism (Andasibe-Mantadia, rainforest parks)"
sports:
  - "Football (soccer)"
  - "Rugby"
  - "Basketball"
