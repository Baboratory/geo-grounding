name:
  eng: Mombasa
  local:
    - languageCode: swa
      value: Mombasa
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry savanna climate on the Indian Ocean coast, hot and humid year-round with monsoon-driven rains."
  - koppenCode: Am
    description: "Tropical monsoon influence along the immediate coast, with a pronounced wet season."
landmarks:
  - name: Fort Jesus
    description: "A 16th-century Portuguese coastal fortress, a key relic of the Indian Ocean trading era."
  - name: Old Town Mombasa
    description: "Historic Swahili and Omani-influenced quarters with coral-stone buildings, balconies and arched doorways."
  - name: Mombasa Marine National Park
    description: "A protected coral reef park off Mombasa for snorkelling and diving."
  - name: Gedi Ruins
    description: "Ancient Swahili city ruins just inland, remnants of a great medieval East African trading town."
culturalTraits:
  - "Kenya's second city and principal seaport on the Indian Ocean"
  - "A historic Swahili, Arab and Asian trading crossroads with a distinctive coast cuisine and dialect"
  - "Famous for the Swahili culture, dhow sailing and the Festival of the Dhow Countries"
prideOf:
  - "Being the heartbeat of East African coastal trade and the Swahili identity"
  - "A vibrant mix of Swahili, Omani, Indian and Portuguese heritage"
  - "The warm, relaxed pace of coastal life"
animals:
  popular:
    - "Sea turtles"
    - "Humpback and spinner dolphins off the coast"
    - "Vervet monkeys"
  unique:
    - "Coral reef fish of the Mombasa Marine National Park"
    - "Mangrove crab in the coastal mangroves"
industries:
  - "Port and shipping — Mombasa is East Africa's busiest port"
  - "Tourism and beach resorts"
  - "Fishing and seafood processing"
  - "Refining and logistics (Korea/India/Alba refineries and coastal industry)"
