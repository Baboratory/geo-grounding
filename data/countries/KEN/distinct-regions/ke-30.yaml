code: KE-30
name:
  eng: Nairobi City
  local:
    - languageCode: swa
      value: Nairobi
    - languageCode: eng
      value: Nairobi
climates:
  - koppenCode: Cfb
    description: "Subtropical highland climate at ~1,700m, with mild temperatures year-round, warm days, cool nights and a marked wet season."
landmarks:
  - name: Nairobi National Park
    description: "The world's only national park inside a capital city, with wild lion, giraffe and rhino against the city skyline."
  - name: Giraffe Centre
    description: "A conservation and education centre where visitors can hand-feed and view the endangered Rothschild's giraffe."
  - name: David Sheldrick Wildlife Trust
    description: "A famous elephant and rhino orphanage where rescued calves are cared for."
  - name: Kenyatta International Convention Centre and Parliament
    description: "Landmarks of Kenya's seat of government in the heart of the capital."
  - name: Bomas of Kenya
    description: "A cultural centre presenting traditional dances and music of Kenya's many ethnic groups."
culturalTraits:
  - "Kenya's capital and largest city, and the region's financial, tech and diplomatic hub"
  - "A youthful, dynamic African metropolis — home to the 'Silicon Savannah' fintech scene"
  - "A true melting pot of all Kenya's ethnic communities plus a large international community"
prideOf:
  - "Being Africa's leading tech and innovation hub (the 'Silicon Savannah')"
  - "The convenient blend of a bustling city with a national park at its edge"
  - "Vibrant nightlife, live music and a growing dining scene"
