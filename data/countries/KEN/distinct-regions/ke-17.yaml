      value: Kisumu
climates:
  - koppenCode: Cfb
    description: "Temperate highland climate beside Lake Victoria, with mild temperatures moderated by the lake."
  - koppenCode: Aw
    description: "Tropical savanna influence in the low-lying lake basin, with a distinct wet season."
landmarks:
  - name: Ruma National Park
    description: "A grassy savanna national park in the Lambwe Valley, home to the endangered roan antelope and sitatunga."
  - name: Kisumu and the Port of Kisumu
    description: "Kenya's principal Lake Victoria port, with a historic railway terminus and ferries across the lake."
  - name: Ndere Island National Reserve
    description: "A small unspoiled island on Lake Victoria near Kisumu, important for bird life and panoramic lake views."
  - name: Hippo Point
    description: "A scenic lakeside viewpoint where buffalo and hippos graze by the shore at dusk."
  - name: Kisumu Museum
    description: "Regional museum presenting Luo culture and the natural history of the Lake Victoria basin."
culturalTraits:
  - "Kenya's port city on Lake Victoria and the heartland of the Luo people"
  - "A lively, business-friendly city known for its lakeside setting and laid-back Luo culture"
  - "Buzz of both commerce and fishing on Kenya's largest lake"
prideOf:
  - "Being Kenya's gateway to Lake Victoria and East Africa's great lake trade"
  - "The warm, welcoming Luo hospitality and distinctive songs and dances"
  - "Fishing and boat-building heritage of the lake communities"
