    standardUtcOffset: "UTC-10"
    observesDst: false
# The Cook Islands is on a single timezone UTC-10 year-round with no DST.
currency:
  code: NZD
  symbol: "$"
  name: New Zealand dollar
legalConstraints:
  - topic: "official languages"
    description: "English, Cook Islands Māori and Pukapukan are all official languages (Te Reo Maori Act 2003 made Cook Islands Māori official; it is the sole official language of the Cook Islands alongside English, with Pukapukan recognized)."
    sourceId: wp-lang
  - topic: "Sunday trading"
    description: "Widespread Sunday trading restrictions reflect the strongly Christian (predominantly Protestant/CICC) culture, with many businesses closed and church attendance central to community life."
    sourceId: wp-culture
  - topic: "free association with New Zealand"
    description: "Most Cook Islanders hold New Zealand citizenship plus Cook Islands national status; New Zealand retains responsibility for defence (the country has no armed forces) and provides financial support and aid."
    sourceId: wp-politics
  - topic: "customary land tenure"
    description: "Land is largely held under customary tenure administered by lineage (kopu tangata) descent groups, with title not freely saleable to outsiders — most land is owned communally by families."
    sourceId: wp-culture
paymentCulture:
  popularMethods:
    - "Cash is widely used in the islands' largely cash-based domestic economy"
    - "The Cook Islands dollar circulates alongside the New Zealand dollar (NZ$), both legal tender"
    - "EFTPOS/debit cards in hotels, resorts and shops on Rarotonga and Aitutaki"
    - "Remittances from the large Cook Islander diaspora in New Zealand and Australia"
  tipping:
    expected: false
    typicalAmount: "Not customary"
    autoIncludedInBill: false
    note: "Tipping is generally not expected."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Polynesian community culture built around extended family (kopu tangata) and village communities; respect for elders and chiefs (ariki, via the House of Ariki) is important."
  greetingNorms: "Greet with 'Kia orāna' (Cook Islands Māori, 'may you live long') or a warm handshake and smile."
  meetingEtiquette: "Meetings open with a prayer (karakia); church and faith are integral to community life. Defer to elders, seek consensus, and take time for relationship-building before business."
  topicsToAvoid:
    - "Criticizing the Church or chiefly (ariki) authority"
    - "Disrespecting island customs and communal etiquette"
  giftGivingNotes: "Modest gifts are appreciated; contributing food to community and church gatherings is customary."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
