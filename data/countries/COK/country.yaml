      value: Cook Islands
    - languageCode: rar
      value: "Kūki 'Āirani"
flagEmoji: "🇨🇰"
capital: Avarua
isSovereign: true
# Classified unitary-small: the Cook Islands is a self-governing state in free
# association with New Zealand (~15k people, 2021 census). It does not meet the
# unitary-large criteria — the 15-island split into Southern and Northern groups
# is geographic rather than a widely recognized cultural-historical regional
# identity meriting curation. One synthetic WHOLE region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
