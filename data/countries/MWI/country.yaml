    accessedDate: "2026-09-19"
    note: "Malawi's national data-protection regime, administered by MACRA; commenced 3 June 2024. Not GDPR."
  - id: mwi-payments
    name: "Reserve Bank of Malawi National Payments System Report 2025"
    publisher: "Reserve Bank of Malawi (RBM)"
    url: "https://mwnation.com/rbm-says-mobile-money-use-sidelines-payments"
    year: 2025
    accessedDate: "2026-09-19"
    note: "Mobile-money volumes rose 31.6% to 2.4 billion transactions (value K37.9 trillion) in 2025, yet ~75% are airtime top-up and cash-in/cash-out; merchant payments only 7.7% of value. Basis for the cash-dominant/mobile-money paymentCulture."
