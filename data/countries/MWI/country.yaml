timezones:
  - name: Africa/Blantyre
    standardUtcOffset: "UTC+2"
    observesDst: false
currency:
  code: MWK
  symbol: "MK"
  name: Malawian kwacha
legalConstraints:
  - topic: "not an EU member"
    description: "Malawi is NOT an EU or EEA state (an African Union, SADC and COMESA member). EU directives — GDPR, VAT-inclusive price display, the 14-day withdrawal right, the 2-year guarantee — do NOT apply directly; national and regional (AU/SADC/COMESA) law governs."
    sourceId: mwi-constitution
  - topic: "freedom of religion and belief"
    description: "The Constitution of the Republic of Malawi (1994), s.33, guarantees freedom of conscience, religion, belief and thought — a secular protection of belief."
    sourceId: mwi-constitution
  - topic: "data protection"
    description: "The Data Protection Act, 2023 (assented Jan 2024, commenced 3 June 2024) is Malawi's national data-protection regime, administered by the Malawi Communications Regulatory Authority (MACRA) — national law, not GDPR."
    sourceId: mwi-data-protection
paymentCulture:
  popularMethods:
    - "Cash — dominant for daily transactions"
    - "Mobile money — Airtel Money and TNM Mpamba are the leading non-cash rails"
    - "Bank transfers and mobile banking"
    - "Cards (Visa/Mastercard) mainly in urban Lilongwe and Blantyre"
  tipping:
    expected: true
    typicalAmount: "5-10% in restaurants, lodges and for good hospitality"
    autoIncludedInBill: false
    note: "Tipping is appreciated as a gesture in restaurants/lodges; a service charge is not standard (ESTIMATE from travel guides, not a central-bank statistic)."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Respect for elders is fundamental — younger people kneel or clap when greeting village elders; modesty and titles matter; offer/receive with both hands or the right hand."
  greetingNorms: "Greet everyone, especially elders — not greeting is rude. Handshake with 'Muli bwanji?'; in rural areas lightly clasp the right forearm with the left hand."
  meetingEtiquette: "Business is built on personal trust; invest time in small talk before meetings; wait for elders/host to begin; composure and patience are valued."
  topicsToAvoid:
    - "Politics and party affiliation (sensitive around ethnic-party dynamics)"
    - "Corruption, government finances and personal wealth"
    - "Dismissing traditional beliefs"
  giftGivingNotes: "Bring food, fruit or small practical gifts when visiting homes; chitenje fabric is an ideal culturally appropriate gift; avoid alcohol unless you know the recipient drinks."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
  - id: mwi-official-language
    name: "Language policy in Malawi (1968 MCP declaration; 1966 & 2018 censuses)"
    publisher: "National Statistical Office of Malawi / Linguapax (Matiki 2002)"
    url: "https://linguapax.org/wp-content/uploads/2015/07/CMPL2002_T1_AMatiki.pdf"
    year: 2002
    accessedDate: "2026-09-19"
    note: "Chichewa declared national language and, with English, official at the 1968 MCP convention; English is the de facto primary official language of government/education. Basis for official rows."
  - id: mwi-title-census
    name: "2018 Population and Housing Census (final results)"
    publisher: "Wikipedia (secondary source; primary: National Statistical Office of Malawi, 2018 census)"
    url: "https://en.wikipedia.org/wiki/2018_census_of_Malawi"
    year: 2018
    accessedDate: "2026-09-19"
    note: "Population 17,563,749; first-time ethnicity question: Chewa 34.4%, Lomwe 18.9%, Yao 13.3%, Ngoni 10.4%, Tumbuka 9.2%, Sena 3.8%, Mang'anja 3.2%, Tonga 1.8%, Nyanja 1.5%, Lambya 0.6%, Sukwa 0.5%, other 1.1%. Also basis for the Chitumbuka locallySpoken share and religion figures."
  - id: mwi-language-estimate
    name: "Chichewa usage estimate (1966 census via Linguapax)"
    publisher: "National Statistical Office of Malawi / Linguapax"
    url: "https://linguapax.org/wp-content/uploads/2015/07/CMPL2002_T1_AMatiki.pdf"
    year: 1966
    accessedDate: "2026-09-19"
    note: "Chichewa native language of ~50.2% and understood by ~76.6% (1966 NSO); ~60% speak it as a first or second language — basis for the 0.6 Chichewa locallySpoken estimate."
  - id: mwi-timezone
    name: "Time in Malawi (Africa/Blantyre) — IANA tz database"
    publisher: "Wikipedia (secondary source; primary: IANA tz database)"
    url: "https://en.wikipedia.org/wiki/Time_in_Malawi"
    year: 2026
    accessedDate: "2026-09-19"
    note: "Africa/Blantyre = UTC+02:00 (CAT) year-round; no DST."
  - id: mwi-currency
    name: "Malawi kwacha — currency"
    publisher: "Wikipedia (secondary source; primary: Reserve Bank of Malawi / CIA World Factbook)"
    url: "https://en.wikipedia.org/wiki/Economy_of_Malawi"
    year: 2026
    accessedDate: "2026-09-19"
    note: "Malawian kwacha (MWK), symbol MK; issued by the Reserve Bank of Malawi."
  - id: mwi-constitution
    name: "Constitution of the Republic of Malawi, 1994 (s.33)"
    publisher: "Government of the Republic of Malawi"
    url: "https://malawilii.org/akn/mw/act/1994/20/eng@2020-11-03"
    year: 1994
    accessedDate: "2026-09-19"
    note: "Supreme law; s.33 guarantees freedom of conscience/religion/belief/thought; confirms unitary-republic status and non-EU membership."
  - id: mwi-data-protection
    name: "Data Protection Act, 2023 (commenced 3 Jun 2024)"
    publisher: "Parliament of Malawi / Malawi Communications Regulatory Authority (MACRA)"
    url: "https://research.lawlab.africa/malawi/"
