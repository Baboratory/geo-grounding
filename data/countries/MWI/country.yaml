alpha3: MWI
alpha2: MW
name:
  eng: Republic of Malawi
  local:
    - languageCode: nya
      value: "Dziko la Malawi"
    - languageCode: eng
      value: "Republic of Malawi"
flagEmoji: "🇲🇼"
capital: Lilongwe
isSovereign: true
# Classified unitary-small: Malawi meets NONE of the 3 DESIGN.md unitary-large
# criteria. (1) Population 17,563,749 (2018 census; ~21.2M 2024 estimate) —
# at/below the 20-25M threshold. (2) No officially recognized regional/minority
# or co-official languages — Chichewa is the national language and, with
# English, in practice official; neither is region-anchored. (3) No strong
# federal or multi-region cultural identity — Malawi is a unitary republic under
# the 1994 Constitution. One synthetic WHOLE region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: nya
    domain: official
    speakersShare: 1.0
    sourceId: mwi-official-language
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: mwi-official-language
  - languageCode: nya
    domain: locallySpoken
    speakersShare: 0.6
    sourceId: mwi-language-estimate
  - languageCode: tum
    domain: locallySpoken
    speakersShare: 0.09
    sourceId: mwi-title-census
# Chichewa is the national language and, with English, an official language
# (declared by the Malawi Congress Party in 1968; English is the de facto
# primary language of government, legislation and education). Chichewa is the
# national lingua franca (native language of ~50% and understood by ~77% per
# the 1966 census; ~60% speak it as a first/second language). Chitumbuka is the
# dominant language of the Northern Region. Officials are de jure 1.0 flags;
# locallySpoken shares are estimates.
ethnicGroups:
  # 2018 Population & Housing Census — the first census to ask ethnicity; per
  # those who stated an ethnicity. NSO 2018.
  - group: Chewa
    percent: 34.4
    sourceId: mwi-title-census
  - group: Lomwe
    percent: 18.9
    sourceId: mwi-title-census
  - group: Yao
    percent: 13.3
    sourceId: mwi-title-census
  - group: Ngoni
    percent: 10.4
    sourceId: mwi-title-census
  - group: Tumbuka
    percent: 9.2
    sourceId: mwi-title-census
  - group: Sena
    percent: 3.8
    sourceId: mwi-title-census
  - group: Mang'anja
    percent: 3.2
    sourceId: mwi-title-census
  - group: Tonga
    percent: 1.8
    sourceId: mwi-title-census
  - group: Nyanja
    percent: 1.5
    sourceId: mwi-title-census
  - group: Lambya
    percent: 0.6
    sourceId: mwi-title-census
  - group: Sukwa
    percent: 0.5
    sourceId: mwi-title-census
  - group: Other
