code: WHOLE
name:
  eng: Malawi
  local:
    - languageCode: nya
      value: Malawi
    - languageCode: eng
      value: Malawi
# Generic country-wide fallback content for Malawi (unitary-small, single
# synthetic whole region). Used via the 'whole-country-fallback' path.
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry (savanna) dominant across the lowlands and lake shore — a well-defined rainy season (Nov-Apr) and a long dry season."
  - koppenCode: Cwa
    description: "Subtropical highland climate (warm wet summer, mild dry winter) on the central and southern plateau (Lilongwe, Blantyre)."
  - koppenCode: Cwb
    description: "Subtropical highland climate on the high massifs (Nyika Plateau, Mount Mulanje) — cooler and wetter."
landmarks:
  - name: Lake Malawi National Park
    description: "UNESCO World Heritage Site (1984) — hundreds of endemic cichlid fish ('mbuna') in one of the world's deepest Rift Valley lakes."
    unescoWorldHeritage: true
  - name: Chongoni Rock-Art Area
    description: "UNESCO World Heritage Site (2006) — the richest concentration of rock art in Central Africa, linked to Chewa rituals."
    unescoWorldHeritage: true
  - name: Mount Mulanje (Cultural Landscape)
    description: "A great granite massif ringed by tea estates; inscribed on the World Heritage List as 'Mount Mulanje Cultural Landscape' (2025)."
    unescoWorldHeritage: true
  - name: Nyika Plateau National Park
    description: "High montane grassland with roan antelope, zebra and elephants."
  - name: Liwonde National Park
    description: "Elephants, hippos and crocodiles along the Shire River."
culturalTraits:
  - "Famous hospitality — Malawi is known as the 'Warm Heart of Africa'"
  - "Chichewa as the national lingua franca and a shared cultural identity"
  - "Gule Wamkulu — the Chewa Nyau masked masquerade dance (UNESCO Intangible Cultural Heritage 2008)"
  - "Nsima (maize porridge) culinary tradition and communal eating (UNESCO Intangible Cultural Heritage)"
  - "Chitenje wrap cloth worn by women — ubiquitous and a good gift"
  - "Deep elder respect, extended-family structure and oral storytelling"
prideOf:
  - "'Warm Heart of Africa' hospitality"
  - "Lake Malawi — over 350 endemic cichlid species (~30% of the world's cichlids)"
  - "Gule Wamkulu and Chichewa cultural identity"
  - "The nsima culinary heritage"
  - "Chongoni and Mulanje heritage sites"
animals:
  popular:
    - "Lake Malawi cichlids ('mbuna')"
    - "Elephant, hippo and crocodile"
    - "Lion, leopard, roan antelope and zebra (Nyika)"
  unique:
    - "Over 350 endemic cichlid fish species unique to Lake Malawi"
    - "Nyika roan antelope and sable"
industries:
  - "Agriculture (dominant) — maize (~80% of cultivated land), tobacco (main export), tea, sugar, coffee"
  - "Agro-processing and food manufacturing"
  - "Fishing on Lake Malawi"
  - "Tourism (lake resorts, safari parks)"
  - "Small-scale mining/coal"
sports:
  - "Football (soccer) — the most popular sport"
  - "Netball — highly competitive national teams"
  - "Athletics and long-distance running"
  - "Basketball and volleyball (growing)"
religions:
