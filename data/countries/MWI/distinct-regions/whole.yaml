    percent: 58.5
    sourceId: mwi-region-census
  - name: Roman Catholic
    percent: 17.2
    sourceId: mwi-region-census
  - name: Other Christian
    percent: 6.6
    sourceId: mwi-region-census
  - name: Muslim
    percent: 13.8
    sourceId: mwi-region-census
  - name: No religion
    percent: 2.1
    sourceId: mwi-region-census
  - name: Traditional faiths
    percent: 1.2
    sourceId: mwi-region-census
  - name: Other
    percent: 0.6
    sourceId: mwi-region-census
entertainment:
  - season: allYear
    items:
      - "Football league, local music/dance, and lake resorts (boating, snorkelling)"
  - season: dry
    items:
      - "Gule Wamkulu performances in the season after the July harvest (May-Oct)"
      - "Best game-viewing and mountaineering (Mulanje)"
      - "Cultural festivals"
  - season: wet
    items:
      - "Green-season photography and planting/rain-cycled community ceremonies"
      - "More indoor/community gatherings"
traditionalDishes:
  - season: allYear
    items:
      - "Nsima (maize porridge) with ndiwo (relish) — chambo (tilapia) from Lake Malawi, dried usipa fish, vegetable relishes"
      - "Thobwa (sweet fermented maize drink)"
  - season: wet
    items:
      - "Fresh vegetables, groundnuts, pumpkin leaves and mangoes (end of wet season)"
traditionalClothing:
  - season: allYear
    items:
      - "Chitenje wrap skirt for women; modest Western dress for men"
      - "Ceremonial masks, wood and straw costumes at Gule Wamkulu rituals"
seasonCalendar:
  - season: dry
    months: [5, 6, 7, 8, 9, 10]
  - season: wet
    months: [11, 12, 1, 2, 3, 4]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Government and offices roughly 07:30/08:00-16:30/17:00 Mon-Fri."
  lunchBreakTiming: "A standard midday break around 12:00-14:00."
  notableShutdownPeriods:
    - period: "Christmas and New Year"
      description: "Reduced business between Christmas and New Year."
    - period: "Easter"
      description: "Public holidays around Easter reduce trading."
    - period: "Post-harvest festival season (Aug)"
      description: "Gule Wamkulu festivals after the July harvest bring community celebration."
  notes: "Wet-season rains (Nov-Apr) can disrupt fieldwork and rural transport; business is warm and relationship-driven."
