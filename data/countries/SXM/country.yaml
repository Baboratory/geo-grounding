    publisher: "Department of Statistics Sint Maarten"
    url: "https://stats.sintmaartengov.org"
    year: 2001
    accessedDate: "2026-09-20"
    note: "First-language shares: English 67.5%, Spanish 12.9%, creole 8.2%, Dutch 4.2%, Papiamento 2.2%, French 1.5%. Eng locallySpoken = 67.5+8.2=75.7% (English + local English creole)."
  - id: sxm-ethnic-2011
    name: "Sint Maarten population by country of birth (2011 estimate)"
    publisher: "Department of Statistics Sint Maarten / Caribbean census"
    url: "https://stats.sintmaartengov.org"
    year: 2011
    accessedDate: "2026-09-20"
    note: "Population-by-country-of-birth shares used for ethnicGroups."
  - id: sxm-tax
    name: "Taxation of Sint Maarten — turnover tax (TOV)"
    publisher: "Sint Maarten Tax Administration"
    url: "https://www.sintmaartengov.org"
    year: 2024
    note: "Standard 5% turnover-tax rate and price-display note."
  - id: sxm-privacy
    name: "Data protection landscape — Sint Maarten (no autonomous national data-protection law)"
    publisher: "DLA Piper Data Protection Laws of the World / Composite estimate"
    url: "https://www.dlapiperdataprotection.com"
    year: 2025
    note: "Flags the absence of an autonomous comprehensive data-protection regime."
