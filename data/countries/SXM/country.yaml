# Language official-status basis: the Constitution of Sint Maarten
# (Staatsregeling van Sint Maarten, in force 10 October 2010 when it became a
# constituent country within the Kingdom of the Netherlands) states in
# Article 1(2) that the official languages are Dutch and English. English is
# the everyday and first language of most residents; a local variety of
# English creole is spoken informally. Language figures from the 2001 census
# (the most recent with a widely published first-language table).
languageUsage:
  - languageCode: nld
    domain: official
    speakersShare: 1.0
    sourceId: sxm-constitution
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: sxm-constitution
  # 2001 census first-language shares: English 67.5%, Spanish 12.9%,
  # creole (local English creole) 8.2%, Dutch 4.2%, Papiamento 2.2%,
  # French 1.5%. The 'creole' share is a local English-based creole;
  # it is folded into the eng locallySpoken estimate rather than given a
  # separate code because no single ISO 639-3 code cleanly covers the
  # Sint Maarten English creole variety.
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.757
    sourceId: sxm-census-2001
  - languageCode: spa
    domain: locallySpoken
    speakersShare: 0.129
    sourceId: sxm-census-2001
  - languageCode: nld
    domain: locallySpoken
    speakersShare: 0.042
    sourceId: sxm-census-2001
  - languageCode: pap
    domain: locallySpoken
    speakersShare: 0.022
    sourceId: sxm-census-2001
  - languageCode: fra
    domain: locallySpoken
    speakersShare: 0.015
    sourceId: sxm-census-2001
