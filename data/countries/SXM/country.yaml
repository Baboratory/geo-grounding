# religions intentionally omitted: figures vary by survey; Protestant is the
# largest grouping (Pentecostal, Methodist, Seventh-day Adventist among other
# Protestant), with a substantial Roman Catholic minority and a Hindu
# community; no stable official percentage set is published — captured
# qualitatively at region level where citable.
timezones:
  - name: America/Lower_Princes
    standardUtcOffset: "UTC-4"
    observesDst: false
# Uses the Caribbean guilder (XCG), introduced 31 March 2025 and replacing the
# Netherlands Antillean guilder (ANG), issued by the Central Bank of Curaçao
# and Sint Maarten (CBCS). Pegged to the US dollar at 1 USD = 1.79 XCG.
# The US dollar is widely used informally across the tourism economy.
currency:
  code: XCG
  symbol: "Cg"
  name: Caribbean guilder
legalConstraints:
  - topic: "turnover tax (TOV) and price display"
    description: "Sint Maarten levies a turnover tax ('turnover belasting', TOV) on goods and services provided on the island — the standard rate is 5%. Consumer prices are generally displayed inclusive of the applicable turnover tax; there is no VAT."
    sourceId: sxm-tax
  - topic: "official languages"
    description: "The official languages of Sint Maarten are Dutch and English (Constitution of Sint Maarten, Article 1(2)). English is the principal everyday and business language."
    sourceId: sxm-constitution
  - topic: "data protection / privacy"
    description: "Sint Maarten has no autonomous comprehensive data-protection law as of late 2025; the island is not an EU/EEA member state, though Kingdom-of-the-Netherlands standards and, for EU-oriented processing, the GDPR may engage. Flagged for confirmation before heavy personal-data processing."
    sourceId: sxm-privacy
# paymentMethodShares intentionally omitted: no official consumer
# payment-method split is published by CBCS; cash and US-dollar use dominate
# alongside growing card/wallet acceptance in the tourism sector.
paymentCulture:
  popularMethods:
    - "Cash (Caribbean guilder and US dollar — the latter widely accepted given tourism)"
    - "Visa and Mastercard / debit cards at hotels, restaurants and larger retailers"
    - "Mobile/contactless payments growing at larger merchants and the cruise port"
  tipping:
    expected: true
    typicalAmount: "10-15% in restaurants when no service charge is included"
    autoIncludedInBill: false
    note: "Some restaurants add a service charge; otherwise a 10-15% tip for good service is customary in the hospitality trade, mirroring US/regional norms."
communicationStyle:
  contextLevel: low-context
  formalityNorms: "Relaxed and informal, English-centric; first names are common among colleagues and in service settings. Positions/titles are used formally in government and legal contexts (Minister, Commissioner)."
  greetingNorms: "A warm 'good morning/afternoon' and a handshake is standard; among acquaintances a hug or a side-hand greeting is common. English is the default working language."
  meetingEtiquette: "Punctuality is expected though some caribbean flexibility exists; meetings are typically friendly and direct with small talk opening. Decisions in the small close-knit business community often build on personal relationships. Dress is smart-casual."
  topicsToAvoid:
    - "The constitutional relationship with the Netherlands"
    - "Inter-island rivalry or politics of the ABC/SSS islands"
  giftGivingNotes: "Gifts are not a business expectation; if invited to a home, a modest host/hostess gift (flowers, chocolates, liquor) is appreciated."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
