  - season: allYear
    items:
      - "Kinabalu park treks and the summit climb"
      - "Sipadan and Mabul diving"
      - "Kinabatangan wildlife cruises"
      - "Kaamatan harvest festival celebrations (May)"
  - season: dry
    items:
      - "The drier months (roughly February-April) are prime for diving and mountain climbing"
