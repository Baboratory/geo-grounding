code: MY-12
name:
  eng: Sabah
  local:
    - languageCode: msa
      value: Sabah
climates:
  - koppenCode: Af
    description: "Tropical rainforest climate — hot and humid year-round; the wet season varies, and the highlands around Kinabalu are cooler."
landmarks:
  - name: Mount Kinabalu
    description: "At 4,095m, Southeast Asia's highest peak, a UNESCO World Heritage Site and the crown of Borneo."
    unescoWorldHeritage: true
  - name: Sipadan Island
    description: "A world-renowned diving site with spectacular vertical drop-offs, turtles and sharks."
  - name: Kinabatangan River
    description: "Borneo's key wildlife river — orangutans, proboscis monkeys and pygmy elephants on its banks."
  - name: Kota Kinabalu (KK) and the Mari-Mari Cultural Village
    description: "Sabah's capital and the living museum of the state's Kadazan-Dusun, Murut, Bajau and Rungus peoples."
  - name: Kundasang and the Kinabalu hinterland
    description: "Cool highland valleys famous for their markets and the Kinabalu park hikes."
culturalTraits:
  - "'Land Below the Wind' — Sabah is a majestic Bornean state of rainforest, reefs and mountains"
  - "Home to dozens of indigenous peoples — Kadazan-Dusun, Murut, Bajau, Rungus, Orang Sungai — celebrated each May at the Kaamatan harvest festival"
  - "A melding of indigenous, Malay, Chinese and Filipino coastal communities around Kota Kinabalu"
prideOf:
  - "Mount Kinabalu and the surrounding heritage park"
  - "The richest marine dive sites in Malaysia (Sipadan)"
  - "Its proud, diverse indigenous culture and the annual Kaamatan festival"
animals:
  popular:
    - "Orangutan"
    - "Proboscis monkey"
    - "Pygmy elephant"
    - "Hornbill"
  unique:
    - "Pygmy elephants and orangutans of the Kinabatangan"
    - "The Mount Kinabalu endemic orchids and Rafflesia"
industries:
  - "Oil, gas and palm oil"
  - "Fisheries and aquaculture"
  - "Tourism — diving (Sipadan), eco-tourism and mountain trekking"
  - "Agriculture — cocoa, coffee, rubber and rice"
sports:
  - "Football"
  - "Sepak takraw"
  - "Diving and water sports"
  - "Mountaineering (Kinabalu climbs)"
