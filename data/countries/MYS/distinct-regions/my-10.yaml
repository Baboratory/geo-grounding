code: MY-10
name:
  eng: Selangor
  local:
    - languageCode: msa
      value: Selangor
climates:
  - koppenCode: Af
    description: "Tropical equatorial climate — hot and humid year-round with frequent afternoon thunderstorms."
landmarks:
  - name: Shah Alam Blue Mosque
    description: "The grand Sultan Salahuddin Abdul Aziz Mosque, one of the largest mosques in Southeast Asia."
  - name: Batu Caves
    description: "The famous Hindu cave-temple and golden Murugan statue, on Selangor's borders with the federal territory."
  - name: Kuala Selangor Fireflies
    description: "Evening boat trips along the river to see the synchronous fireflies and the historic Bukit Melawati fort."
  - name: Sepang International Circuit
    description: "The premier Formula 1 and motorcycle circuit of Malaysia."
  - name: National Zoo (Zoo Negara)
    description: "Malaysia's main zoological park showing orangutans and other native fauna."
culturalTraits:
  - "Selangor is Malaysia's most populous and wealthiest state, surrounding Kuala Lumpur and Shah Alam"
  - "A dynamic, industrial and cosmopolitan hub of manufacturing, hi-tech and urban Malay life"
  - "A land of Malay village (kampung) heritage now fused with modern suburban cities (Petaling Jaya, Subang, Shah Alam)"
prideOf:
  - "Being Malaysia's economic powerhouse and industrial heartland"
  - "A diverse, modern and outward-looking society"
animals:
  popular:
    - "Fireflies (Kuala Selangor)"
    - "Long-tailed macaque and silvered langur"
  unique:
    - "The Kuala Selangor firefly colonies are among the world's largest known synchronous swarms"
industries:
  - "Manufacturing — electronics, automobiles (PROTON), robotics and F&B"
  - "Logistics, ports (Port Klang) and warehousing"
  - "Technology hubs (Cyberjaya) and services"
  - "Palm oil and agriculture in the outer districts"
sports:
  - "Football"
  - "Badminton"
  - "Motorsport (Sepang)"
  - "Aquatics and athletics"
