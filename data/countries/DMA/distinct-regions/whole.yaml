    sourceId: dma-census-2011
entertainment:
  - season: allYear
    items:
      - "Beach life and the 'Nature Isle' outdoor scene — hiking, swimming in rivers and Emerald Pool, diving and kayaking"
      - "Cricket and football matches"
      - "Market and cultural life in Roseau"
  - season: dry
    items:
      - "Christmas and New Year festivities (the drier, cooler months)"
      - "Peak tourist 'season' (~December-April)"
      - "Carnival (February/March, the pre-Lenten interval)"
      - "Easter-period events and water festivals"
  - season: wet
    items:
      - "World Creole Music Festival (late October)"
      - "Independence celebrations (3 November) and the week of national events"
      - "The height of the hurricane/wet season — some outdoor activities pause in heavier rain"
traditionalDishes:
  - season: allYear
    items:
      - "The 'national dish' — crab and callaloo (dasheen leaves stewed with coconut milk, often with crab)"
      - "Yeasted breadfruit, plantains and provision (root crops)"
      - "Fresh fish and seafood — including the famed (now protection-minded) mountain chicken"
      - "Rum punch and local rums; Kubuli lager"
      - "Cocoa and local chocolate"
  - season: dry
    items:
      - "Christmas ham, black cake (fruit cake) and sorrel drink"
      - "Carnival-season street food"
  - season: wet
    items:
      - "Hearty one-pot and soup dishes during wetter spells"
      - "Festival-season fare around the World Creole Music Festival and Independence"
traditionalClothing:
  - season: allYear
    items:
      - "Colourful madras and cotton prints"
      - "Light, bright tropical resort wear"
  - season: dry
    items:
      - "Festive/formal wear for Christmas and New Year"
  - season: wet
    items:
      - "Carnival mas costumes (feathers, beads, sequins) during the pre-Lenten season"
seasonCalendar:
  - season: dry
    months: [12, 1, 2, 3, 4, 5]
  - season: wet
    months: [6, 7, 8, 9, 10, 11]
businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Government and offices typically 08:00/08:30-16:00/16:30 weekdays; private businesses often 09:00-17:00; retail usually Mon-Sat with many closed (or shorter hours) Sunday."
  lunchBreakTiming: "A standard midday break is common."
  notableShutdownPeriods:
    - period: "Carnival (pre-Lenten, usually February/March)"
      description: "Two days of national celebration around Carnival Monday/Tuesday; activity adjusts heavily."
    - period: "World Creole Music Festival (late October)"
      description: "A multi-day national festival drawing visitors; business rhythms relax around the events."
    - period: "Independence (3 November)"
      description: "National public holiday marking independence from the United Kingdom (1978)."
    - period: "Christmas and New Year"
      description: "Reduced business around the Christmas/New Year holidays."
  notes: "Tourism drives a pronounced high season in the drier months (December-May). Sunday is widely a rest day."
sources:
  - id: dma-census-2011
    name: "2011 Population and Housing Census Report"
    publisher: "Central Statistical Office of Dominica"
