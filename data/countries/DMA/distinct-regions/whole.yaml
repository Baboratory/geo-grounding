    year: 2011
    accessedDate: "2026-09-18"
    note: "Religious composition (Roman Catholic 52.8%, no religion 9.3%, SDA 6.7%, Pentecostal 6.1%, Baptist 5.1%, Christian Union 4.1%, Methodist 2.6%, Gospel Mission 2.0%, other Evangelical 1.5%, Jehovah's Witness 1.3%, Rastafarian 1.1%). Flagged as 2011-census vintage."
  - id: dma-unesco-trois-pitons
    name: "Morne Trois Pitons National Park — UNESCO World Heritage Centre (list entry 814)"
    publisher: "UNESCO World Heritage Centre"
    url: "https://whc.unesco.org/en/list/814/"
    year: 1997
    accessedDate: "2026-09-18"
    note: "Confirms Morne Trois Pitons National Park was inscribed in 1997 — basis for the unescoWorldHeritage flag on that landmark."
