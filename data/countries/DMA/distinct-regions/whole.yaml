code: WHOLE
name:
  eng: Dominica
  local:
    - languageCode: eng
      value: Dominica
    - languageCode: acf
      value: Dominik
# Generic country-wide fallback content for Dominica (unitary-small, single
# synthetic whole region). Used via the 'whole-country-fallback' path in
# usage_examples/python/get_data_by_ip.py.
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry (savanna) climate — hot year-round with a distinct drier season (roughly Dec-May) and a wetter season (roughly Jun-Nov)."
  - koppenCode: Am
    description: "Tropical monsoon climate on the wetter, higher-rainfall windward and mountainous interior (the Morne Diablotin and Morne Trois Pitons uplands are among the wettest places in the Caribbean)."
landmarks:
  - name: Morne Trois Pitons National Park
    description: "A rainforest-clad volcanic massif with the Boiling Lake, Trafalgar Falls and the Valley of Desolation — a UNESCO World Heritage Site."
    unescoWorldHeritage: true
  - name: Boiling Lake
    description: "One of the world's largest hot-water lakes, a bubbling geothermal pool in the Morne Trois Pitons National Park."
  - name: Emerald Pool
    description: "A serene swimming spot on the Middleham Falls trail in the rainforest interior."
  - name: Trafalgar Falls
    description: "Twin waterfalls in the central highlands beside the Trafalgar hot springs."
  - name: Cabrits National Park
    description: "A peninsula on the northwest coast holding the restored 18th-century Fort Shirley."
  - name: Scotts Head
    description: "A dramatic south-coast headland and PADI-listed dive site where the Caribbean Sea meets the Atlantic."
  - name: Kalinago Territory
    description: "The lands of the Indigenous Kalinago (Carib) people on the east coast, the last of their kind in the Eastern Caribbean."
culturalTraits:
  - "Carnival — held in February/March (the interval before Lent), with a mas band and calypso/soca tradition"
  - "World Creole Music Festival (October) — the flagship celebration of Kweyol and Creole culture"
  - "Kweyol / Dominican Creole French as the everyday vernacular alongside English"
  - "Rum heritage and the 'Nature Isle' identity built on rainforest, rivers and volcanic scenery"
  - "Indigenous Kalinago (Carib) cultural survival — the Kalinago Territory and its community museum"
  - "Cricket as a national passion within West Indies cricket"
prideOf:
  - "Being the 'Nature Isle of the Caribbean' — lush rainforest, rushing rivers and unspoiled volcanic landscape"
  - "Its UNESCO World Heritage rainforest and the Boiling Lake"
  - "The World Creole Music Festival and the strength of Kweyol culture"
  - "The resilience of the Kalinago people and their preserved territory"
animals:
  popular:
    - "Sisserou (imperial amazon parrot, Amazona imperalis) — the national bird"
    - "Jacquot (red-necked amazon parrot)"
    - "Agouti (a large forest rodent)"
    - "Wildfowl and herons along the island's rivers and wetlands"
  unique:
    - "Sisserou (imperial amazon) and Jacquot (red-necked amazon) — two endemic Amazon parrots found only in Dominica's rainforest"
    - "Mountain chicken (Leptodactylus fallax) — the world's largest frog, a national delicacy now critically endangered"
industries:
  - "Tourism — the principal economic driver, built on the 'Nature Isle' brand"
  - "Agriculture — bananas, citrus, root crops and cocoa"
  - "Rum and the small but iconic heritage distilleries"
  - "Offshore financial services and the international business sector"
  - "Fisheries and aquaculture (including the sea moss / seaweed trade)"
sports:
  - "Cricket — a national passion within West Indies cricket"
  - "Football (soccer)"
  - "Netball and basketball"
  - "Water sports — diving, snorkelling, kayaking and river tubing"
  - "Hiking and eco-activities tied to the national parks"
