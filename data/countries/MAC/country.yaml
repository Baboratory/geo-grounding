flagEmoji: "🇲🇴"
capital: "Macau (no separate capital; the city and territory are contiguous)"
isSovereign: false
# Classified dependent-territory: Macau is a Special Administrative Region (SAR) of
# the People's Republic of China, not a sovereign state. A compact territory of
# ~700,000 people on the west side of the Pearl River estuary, made up of the Macau
# Peninsula, the Cotai strip and Taipa and Coloane islands. A single synthetic WHOLE
# region per the governance rule for non-sovereign ISO 3166-1 entries (the peninsula
# / islands split is geographic, not a culturally distinct curated region).
governanceType: dependent-territory
iso3166_2_prefix: null
hasSubdivisions: false
