      - "Eating out: dim sum, Macanese cuisine and the famous egg tarts"
      - "Wandering the heritage old town and its squares"
  - season: summer
    items:
      - "Dragon Boat Festival races on the water"
      - "Beach and waterfront outings"
  - season: winter
    items:
      - "Lunar New Year celebrations, markets and red-lantern displays"
      - "Cooler sightseeing and the Procession of Our Lady of Fatima in December"
