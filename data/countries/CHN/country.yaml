sources:
  - id: npc-language-law
    name: "Law of the People's Republic of China on the Standard Spoken and Written Chinese Language (2000, amended 2025)"
    publisher: "National People's Congress of the PRC (via Chinese government legal portals / PKU Law)"
    url: "https://www.gov.cn/"
    year: 2025
    accessedDate: "2026-09-21"
    note: "Designates Putonghua as the countrywide common spoken and written language; minority-language constitutional protection noted."
  - id: moe-putonghua-2021
    name: "Ministry of Education press conference on the status of Chinese language use"
    publisher: "Ministry of Education of the People's Republic of China"
    url: "http://en.moe.gov.cn/news/press_releases/202106/t20210616_538404.html"
    year: 2021
    accessedDate: "2026-09-22"
    note: "MOE official Zhou Wei reported that about 80.72% of China's population could speak Putonghua as of 2020, up 27.66 percentage points from 2000 -- the basis for the cmn locallySpoken usage share."
  - id: samr-consumer
    name: "Law on the Protection of Consumer Rights and Interests (1993, revised 2013)"
    publisher: "State Administration for Market Regulation (SAMR), PRC"
    url: "https://www.samr.gov.cn/"
    year: 2013
    accessedDate: "2026-09-21"
    note: "Consumer-rights law with enforcement by SAMR against fraud, substandard goods and deceptive marketing."
  - id: npc-pipl2021
    name: "Personal Information Protection Law of the PRC (PIPL, 2021)"
    publisher: "National People's Congress of the PRC (via Chinese government legal portals)"
    url: "https://www.gov.cn/"
    year: 2021
    accessedDate: "2026-09-21"
    note: "China's comprehensive personal-data law: consent, cross-border transfer rules, important-data duties; with Cybersecurity Law 2017 and Data Security Law 2021."
  - id: stats-china-vat
    name: "China VAT rates — value-added tax"
    publisher: "State Taxation Administration, PRC (via official tax guidance)"
    url: "https://www.chinatax.gov.cn/"
    year: 2026
    accessedDate: "2026-09-21"
    note: "Standard 13% VAT on goods; 9%/6% bands for services and some items; 3% for small-scale taxpayers."
