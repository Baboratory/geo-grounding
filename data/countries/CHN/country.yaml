alpha3: CHN
alpha2: CN
name:
  eng: China
  local:
    - languageCode: zho
      value: 中国 (Zhōngguó)
flagEmoji: "🇨🇳"
capital: Beijing
isSovereign: true
# Classified unitary-large: the People's Republic of China is a unitary
# socialist republic whose 23 provinces, autonomous regions and
# direct-administered municipalities are first-tier administrative units with
# NO residual sovereignty (all authority flows from the central State Council
# and the ruling Party-state; there is no federal division of powers). But the
# population (~1.41-1.43 billion, 2020 census) is orders of magnitude above the
# small-state threshold, and there is a genuine, widely recognized
# cultural-historical regional and ethnic diversity (Cantonese/Yue and other
# Sinitic regional identities, Tibet, Xinjiang/Uyghur, Inner Mongolia,
# Guangxi/Zhuang). Curated regions are real ISO 3166-2 subdivisions: CN-BJ
# Beijing, CN-SH Shanghai, CN-GD Guangdong, CN-SC Sichuan + WHOLE. Standard
# Chinese (Putonghua) is the 'countrywide common spoken and written language'
# per the Law on the Standard Spoken and Written Chinese Language (2000, amended
# 2025); minority languages are constitutionally protected for use.
governanceType: unitary-large
iso3166_2_prefix: CN
hasSubdivisions: true
regionCoverage:
  # Partially assessed 2026-09-23 (coverage-floor pilot, TODO.md). Confirmed:
  # CN-HK, CN-MO, CN-TW are covered by sibling country entries (HKG/MAC/TWN,
  # see DESIGN.md's exception), not curatable or an open gap. The other 5
  # official autonomous regions fire trigger 1: the Law on Regional Ethnic
  # Autonomy gives autonomous areas the right to use the local minority
  # language alongside Mandarin -- CN-NM (Mongolian), CN-XJ (Uyghur), CN-XZ
  # (Tibetan), CN-GX (Zhuang) confirmed; CN-NX (Ningxia, Hui) is a weaker
  # case since the Hui are Sinophone and Ningxia's divergence is really
  # religious (Islam) rather than linguistic -- tentatively trigger 2, not
  # independently confirmed as a plurality (China has no country-level
  # religions[] here to compare against; needs checking before curating).
  # Trigger 4 (time zone) structurally never fires for any CHN unit: China
  # runs its entire territory on one legal time zone (Beijing Time, UTC+8,
  # since 1949) despite spanning ~5 geographic zones -- confirmed, don't
  # re-derive this per-province. Trigger 5 (climate) fires for CN-HI (Hainan):
  # it is China's only fully tropical province (Koppen Aw, main class A),
  # outside every class (Cfa/Cwa/Cwb/Dwa) the other curated regions cover --
  # cn-hi.yaml added. CN-HL (Heilongjiang) does NOT fire trigger 5: its humid
  # continental/subarctic (Dwa/Dwb/Dwc) is the same main class (D) as the
  # already-curated Beijing (CN-BJ, Dwa), so it stays covered by WHOLE -- see
  # issue #87 comment for the documented negative finding. CN-NX (Ningxia)
  # also fires no trigger (negative finding posted; see issue #87).
  # CN-NM/CN-XJ/CN-XZ/CN-GX autonomous regions fire trigger 1 and are being
  # added in separate PRs (#97/#98). The remaining ~16 provinces/municipalities
  # have not been individually checked.
  tier: first-level
  totalUnits: 34
  status: partial
  gapReason: "9 of 34 curated — all 5 trigger-firing units now have
    files: the 4 autonomous regions on trigger 1 (Inner Mongolia CN-NM,
    Xinjiang CN-XJ, Tibet CN-XZ, Guangxi CN-GX), Hainan CN-HI on trigger 5
    (tropical Aw vs the C/D main classes of the other curated regions),
    alongside the already-curated Beijing, Shanghai, Guangdong and
    Sichuan. CN-HL (Heilongjiang)
    and CN-NX (Ningxia) were assessed and do NOT fire a trigger (negative
    findings on issue #87): Heilongjiang shares Dwa/Dwb/Dwc main class D
    with Beijing; Ningxia's Hui divergence is confessional, not a regional
    language or a religion plurality. CN-HK/CN-MO/CN-TW are covered by
    sibling country entries. ~16 other provinces/municipalities still
    need individual assessment."
languageUsage:
  - languageCode: zho
    domain: official
    # Standard Chinese (Putonghua, based on the Beijing dialect of Mandarin) is
    # the national common language designated by the Law on the Standard Spoken
    # and Written Chinese Language. Flagged 1.0 as legal/administrative status.
    speakersShare: 1.0
    sourceId: npc-language-law
  - languageCode: cmn
    domain: locallySpoken
    # The Ministry of Education reported that about 80.72% of the population
    # could speak Putonghua (Mandarin) as of 2020, up from about 53% in 2000 --
    # this survey figure, not the language law, is the basis for this share.
    speakersShare: 0.80
    sourceId: moe-putonghua-2021
# zho and cmn are both in the pool: zho is the ISO 639-3 macrolanguage 'Chinese'
# (used as the official-domain row consistent with other dataset entries), cmn
# is 'Mandarin' the standardized dialect spoken most widely. Grouped under the
# macrolanguage for official status per ISO 639 conventions.
timezones:
  - name: Asia/Shanghai
    standardUtcOffset: "UTC+8"
    observesDst: false
  - name: Asia/Urumqi
    standardUtcOffset: "UTC+6"
    # Officially the whole PRC observes UTC+8 (Beijing Time), but Xinjiang
    # commonly operates on unofficial UTC+6 local time.
    observesDst: false
currency:
  code: CNY
  symbol: "¥"
  name: Chinese yuan (renminbi)
legalConstraints:
  - topic: "official language"
    description: "The Law on the Standard Spoken and Written Chinese Language (2000, amended 2025) designates Standard Chinese (Putonghua) and standard written characters as the countrywide common language; all state organs, schools and public media use it. The Constitution also guarantees the ethnic minority groups' freedom to use and develop their own languages and scripts."
    sourceId: npc-language-law
  - topic: "consumer protection"
    description: "The Law on the Protection of Consumer Rights and Interests (1993, revised 2013) protects consumers against fraud and substandard goods, establishes rights of complaint and compensation, and assigns enforcement to the State Administration for Market Regulation (SAMR), which also enforces advertising and price-law rules against deceptive marketing."
    sourceId: samr-consumer
  - topic: "data protection"
    description: "The Personal Information Protection Law (PIPL, 2021) is China's comprehensive data-protection statute, imposing consent-based obligations on personal-information processors, cross-border transfer rules, and duties on 'important' personal data; the Cybersecurity Law (2017) and Data Security Law (2021) complete the framework, with the Cyberspace Administration of China (CAC) supervising."
    sourceId: npc-pipl2021
  - topic: "VAT"
    description: "A value-added tax (VAT) with a standard 13% rate applies to most goods; services and many transfers use a 9% or 6% band, with the lowest 3% for small-scale taxpayers; imported essential goods and some services may be exempt. The rate structure is set under the Interim Regulations on VAT."
    sourceId: stats-china-vat
paymentCulture:
  popularMethods:
    - "QR-code mobile payments dominate — Alipay and WeChat Pay are accepted almost everywhere, from large retailers to street stalls"
    - "Cash is legal but increasingly little-used, especially in cities"
    - "UnionPay cards and bank apps support transfers and payments"
  tipping:
    expected: false
    typicalAmount: "None — tipping is not customary or expected in China and is generally not practiced"
    autoIncludedInBill: true
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Hierarchy-aware and indirect. Titles, seniority and respect ('face', mianzi) matter deeply; communication tends to be courteous, harmonious and non-confrontational, with meaning often implied rather than stated bluntly."
  greetingNorms: "A handshake or a nod with a polite 'nǐ hǎo' (你好) is standard; business cards are exchanged with both hands, and people are usually addressed by title and surname (e.g. 'Manager Li')."
  meetingEtiquette: "Punctuality is important. Meetings are formal, open with pleasantries and place emphasis on building relationships and trust (guanxi); the most senior person typically speaks last and decisions rest with authority. Indirect disagreement is the norm rather than open debate."
  topicsToAvoid:
    - "Directly criticising a senior or openly challenging authority in front of others"
    - "Sensitive political and historical topics (Tibet, Xinjiang, Taiwan, Tiananmen)"
    - "Gift-giving corruption (bribery) and boastful personal claims"
  giftGivingNotes: "Gift-giving is significant for relationship-building (guanxi); modest, well-packaged gifts are appreciated. Avoid clocks, white flowers and items in sets of four (associated with death), and 'singing' numbers of money; refuse-gracefully-then-accept gift etiquette applies."
