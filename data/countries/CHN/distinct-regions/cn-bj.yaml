  - name: Tiananmen Square
    description: "The vast central city square, fronting the National Museum and the Great Hall of the People."
  - name: Temple of Heaven
    description: "The exquisite Ming-dynasty sacrificial complex, a UNESCO World Heritage Site of circular halls."
    unescoWorldHeritage: true
  - name: Summer Palace
    description: "The landscaped imperial garden on Kunming Lake, a UNESCO World Heritage Site."
    unescoWorldHeritage: true
  - name: Great Wall (Badaling/Mutianyu)
    description: "The best-known sections of the Great Wall, an easy day trip from Beijing."
    unescoWorldHeritage: true
