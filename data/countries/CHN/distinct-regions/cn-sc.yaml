code: CN-SC
name:
  eng: Sichuan Province
  local:
    - languageCode: zho
      value: 四川省 (Sìchuān Shěng)
climates:
  - koppenCode: Cwa
    description: "Humid subtropical monsoon climate in the Sichuan Basin, with hot humid summers, mild winters and frequent cloudy/misty weather."
  - koppenCode: Cwb
    description: "Highland temperate climate in the mountains of western Sichuan, cooler and wetter."
landmarks:
  - name: Chengdu Research Base of Giant Panda Breeding
    description: "The world-famous panda conservation and research centre, home to the beloved giant panda."
  - name: Leshan Giant Buddha
    description: "The colossal 71m stone Buddha carved into the cliff at Leshan, a UNESCO World Heritage Site."
    unescoWorldHeritage: true
  - name: Jiuzhaigou Valley
    description: "A fairy-tale gorge of turquoise lakes and waterfalls, a UNESCO World Heritage Site and national park."
    unescoWorldHeritage: true
  - name: Mount Emei
    description: "One of China's four sacred Buddhist mountains, a UNESCO World Heritage Site."
    unescoWorldHeritage: true
culturalTraits:
  - "The birthplace of Sichuan cuisine, famous worldwide for its numbing-and-spicy (mala) flavour"
  - "A relaxed, tea-house culture and love of leisure (mahjong, hotpot)"
  - "Home of the giant panda and a proud, hospitable Sichuanese identity"
prideOf:
  - "Sichuan cuisine and hotpot culture"
  - "The giant panda and the province's spectacular natural parks"
  - "A famously easy-going, fun-loving spirit"
