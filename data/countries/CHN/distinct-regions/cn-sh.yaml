code: CN-SH
name:
  eng: Shanghai Municipality
  local:
    - languageCode: zho
      value: 上海市 (Shànghǎi Shì)
climates:
  - koppenCode: Cfa
    description: "Humid subtropical climate on the Yangtze delta, with hot humid summers, mild winters and distinct plum-rain (meiyu) season."
landmarks:
  - name: The Bund
    description: "The waterfront promenade of colonial-era architecture facing the Pudong skyline across the Huangpu river."
  - name: Oriental Pearl Tower and the Lujiazui skyline
    description: "The iconic towers of Pudong, the symbol of Shanghai's modern rise."
  - name: Yu Garden
    description: "The classical Ming-dynasty garden and bazaar in the old city."
  - name: Shanghai Museum
    description: "One of China's finest museums of ancient Chinese art, on People's Square."
  - name: Former French Concession
    description: "Tree-lined streets of historic shikumen houses and cafés, the city's cultural heart."
culturalTraits:
  - "China's most modern and cosmopolitan city, a global financial and commercial hub"
  - "A dynamic fusion of East and West, old shikumen lanes and cutting-edge skyscrapers"
  - "A trendsetting culinary, fashion and arts scene"
prideOf:
  - "Being China's global financial capital (a leading world financial centre)"
  - "A cosmopolitan, forward-looking identity"
  - "The dazzling Pudong skyline and culinary innovation"
animals:
  popular:
    - "Shanghai's parks are home to wild birds, egrets and butterflies"
  unique:
    - "The Chinese soft-shelled turtle and endemic wetland species of the delta"
industries:
  - "Finance, banking and stock exchange"
  - "Trade and ports (Shanghai is the world's busiest container port)"
  - "Technology, biotech and automotive (Tesla gigafactory)"
  - "Fashion, luxury and consumer goods"
  - "Tourism"
