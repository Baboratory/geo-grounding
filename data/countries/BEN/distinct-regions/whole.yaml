    url: "https://www.state.gov/reports/2022-report-on-international-religious-freedom/benin"
    year: 2022
    accessedDate: "2026-09-19"
    note: "Religious composition (2022 IRF, drawing on official data): Christian 48.5%, Muslim 27.7%, Vodoun 11.6%, other indigenous religions 2.6%, remainder unaffiliated/other."
  - id: ben-unesco-abomey
    name: "Royal Palaces of Abomey — UNESCO World Heritage Centre"
    publisher: "UNESCO World Heritage Centre"
    url: "https://whc.unesco.org/en/list/323/"
    year: 1985
    accessedDate: "2026-09-19"
    note: "Inscribed 1985 for the Dahomey royal palaces — basis for the unescoWorldHeritage flag."
  - id: ben-holidays
    name: "Benin public holidays"
    publisher: "OfficeHolidays"
    url: "https://www.officeholidays.com/countries/benin"
    year: 2026
    accessedDate: "2026-09-19"
    note: "Public holiday calendar: 1 Jan, Vodoun Festival Day (10 Jan), Easter, Labour Day (1 May), Independence Day (1 Aug), Assumption (15 Aug), Eid al-Fitr and Eid al-Adha, Christmas (25-26 Dec)."
