capital: "Pretoria (Tshwane) — executive; Cape Town legislative; Bloemfontein judicial"
isSovereign: true
# Classified unitary-large: South Africa meets 2 of the 3 DESIGN.md criteria even
# though the state is constitutionally a single unitary parliamentary republic.
# (1) recognized regional/minority languages — 11 official languages (Constitution
# Sec. 6), several regionally concentrated (isiZulu ~80% in KwaZulu-Natal, isiXhosa
# ~82% in Eastern Cape, Afrikaans/English in Western Cape); (2) genuine
# cultural-historical regional identities anchored in the provinces. The nine
# provinces exercise concurrent/devolved powers but hold no residual sovereignty,
# so NOT federal. Curated regions: Gauteng (ZA-GP, economic core),
# Western Cape (ZA-WC, Afrikaans/English + Cape heritage), KwaZulu-Natal
# (ZA-KZN, isiZulu heartland), Eastern Cape (ZA-EC, isiXhosa heartland) + WHOLE.
governanceType: unitary-large
iso3166_2_prefix: "ZA"
hasSubdivisions: true
languageUsage:
  # Official languages (all de jure official per Constitution Sec. 6: speakersShare
  # is a legal-status flag = 1.0, never a population share). The historic 11 are
  # listed here; South African Sign Language became the 12th official in 2023
  # (see the locallySpoken row and the SASL source note).
