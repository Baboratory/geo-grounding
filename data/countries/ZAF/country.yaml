# South African Sign Language (sfs) became the 12th official language on 19 July
# 2023 (Eighteenth Amendment to the Constitution). It carries the official
# legal-status flag (1.0) above. No census home-language share is published for a
# sign language, so the locallySpoken row (an estimate of the deaf community's
# share) is flagged as an estimate via the sasl-2023 source note; the 11 spoken
# official languages carry their census home-language shares.
