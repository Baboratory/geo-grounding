legalConstraints:
  - topic: "official languages"
    description: "Section 6 of the Constitution recognizes 11 official languages (Sepedi, Sesotho, Setswana, siSwati, Tshivenda, Xitsonga, Afrikaans, English, isiNdebele, isiXhosa and isiZulu), plus South African Sign Language made the 12th official language in 2023. The State must use at least two official languages in national government and promote their equal dignity."
    sourceId: constitution-sec6
  - topic: "ethnicity data collection"
    description: "The census collects population-group self-identification (Black African, Coloured, White, Indian/Asian). These are legal categories retained from apartheid-era classification but still used for redress and policy; treat them as self-identification, not biological race."
    sourceId: stats-sa-census-2022
  - topic: "national currency / legal tender"
    description: "The South African rand (ISO 4217 code ZAR, symbol R) is legal tender. Only the South African Reserve Bank may issue banknotes (South African Reserve Bank Act 90 of 1989); the Bank is the sole monetary authority."
    sourceId: sarb
paymentCulture:
  popularMethods:
    - "Bank and merchant cards (Visa/Mastercard) — dominant in formal retail"
    - "EFT / bank transfers — widely used for bills and B2B"
    - "Mobile wallets and QR codes — SnapScan, Zapper, Yoco and PayShap instant payments"
    - "Cash — still common for small-value and informal transactions"
  tipping:
    expected: true
    typicalAmount: "10% at table-service restaurants; round up for car guards, luggage and petrol attendants"
    autoIncludedInBill: false
    note: "Qualitative and customary. South Africa has a strong digital payment culture for an emerging market: card acceptance is broad (Tap-to-Pay), PayShap (2023) enables instant interbank transfers, and mobile QR payments (SnapScan/Zapper/Yoco) are common in retail. No single authoritative national payment-method-share study is asserted here; no percentages are given."
communicationStyle:
  contextLevel: mixed
  formalityNorms: "Workplaces are generally relaxed but professional; first-name use is common once working together. English is the dominant language of business. South Africa is a culturally diverse, 11-official-language society, so style varies by community."
  greetingNorms: "A firm handshake with eye contact is standard in business. A single 'howzit' or 'sawubona'/'hello' opens exchanges; warmth is valued."
  meetingEtiquette: "Punctuality is expected in formal business though 'African time' may apply in some community contexts. Meetings often open with informal rapport before the agenda; decisions tend to be consultative."
  topicsToAvoid:
    - "Race, apartheid and political history — deeply sensitive; approach with care and respect"
    - "Income and personal wealth comparisons"
    - "Biltong/boerewors stereotyping as an ice-breaker"
  giftGivingNotes: "Not expected in business. If visiting a home, a modest gift (wine, flowers or chocolates) is appreciated."
