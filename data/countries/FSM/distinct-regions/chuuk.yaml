# Most populous state of the federation; the Chuuk (Truk) Lagoon of WWII-wreck
# fame. Includes the outer islands. UTC+11.
climates:
  - koppenCode: Af
    description: "Tropical marine — warm and wet year-round; rainfall is heavy in most months."
landmarks:
  - name: Truk Lagoon wrecks
    description: "Over 60 WWII Japanese shipwrecks lying in clear, calm lagoon waters — the world's premier wreck-diving site."
  - name: Tonnachau and the Mount Tonaachau viewpoint
    description: "Overlook across the lagoon from Chuuk's main volcanic island."
  - name: Chuuk State Museum (Weno)
    description: "Local history and WWII-era museum in the state capital."
culturalTraits:
  - "Chefchiefly authority and strong clan identity in the Chuukic matrilineal system"
  - "Chuukese (chk) as the everyday language alongside English"
  - "A wartime heritage that is deeply woven into local memory"
