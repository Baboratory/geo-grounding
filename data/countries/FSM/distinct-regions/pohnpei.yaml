code: FM-PNI
name:
  eng: Pohnpei
  local:
    - languageCode: pon
      value: Pohnpei
    - languageCode: eng
      value: Pohnpei
# Hosts the national capital Palikir and the city of Kolonia. Includes the
# Pohnpei outer islands (Kapingamarangi, Nukuoro, Pingelap, Mokil) and the
# world-famous Nan Madol ruins. UTC+11.
climates:
  - koppenCode: Af
    description: "Tropical marine — warm, wet and lush; one of the rainiest inhabited islands in the world (green high-island interior)."
landmarks:
  - name: Nan Madol
    description: "The ruined megalithic city on a mangrove lagoon — a UNESCO World Heritage Site and the only major ancient city of the Pacific built on a lagoon."
  - name: Sokehs Rock and Kepirohi Falls
    description: "Landmark cliffs and one of Pohnpei's many tall waterfalls."
  - name: Palikir
    description: "The national capital, an unassuming administrative town on Pohnpei island."
culturalTraits:
  - "Matrilineal clans and sapei (title) system; the bai men's houses"
  - "The Nahnmwarki and Wasai chiefly lineages rooted at Nan Madol"
  - "Pohnpeian (pon) everyday usage; outer islands speak Kapingamarangi (kpg), Nukuoro (nkr), Pingelapese (pif), Mokilese (mkj)"
prideOf:
  - "Nan Madol — a wonder of ancient Pacific engineering"
  - "Pohnpei's extraordinary lushness and waterfalls"
  - "Pearl farming in the mangrove lagoons"
animals:
  popular:
    - "Reef sharks"
    - "Flying foxes"
    - "Mangrove crabs"
    - "Sea turtles"
  unique:
    - "Pohnpei fantail (endemic bird)"
    - "Micronesian megapode (endemic)"
    - "Kepirohi and Nan Madol mangrove ecosystems"
industries:
  - "Public sector (national capital)"
  - "Fisheries and pearl farming"
  - "Tourism (Nan Madol, diving)"
  - "Subsistence agriculture"
