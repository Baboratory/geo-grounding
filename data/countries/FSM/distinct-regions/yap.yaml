code: FM-YAP
name:
  eng: Yap
  local:
    - languageCode: yap
      value: Yap
    - languageCode: eng
      value: Yap
# Westernmost state of the federation; Yap proper plus the outer-island atolls
# (Ulithi, Woleai, Satawal, Fais). UTC+10 (the other three states are UTC+11).
climates:
  - koppenCode: Af
    description: "Tropical marine — warm and wet year-round; Yap proper receives heavy rain in most months."
landmarks:
  - name: Stone money (rai) of Yap
    description: "The enormous disc-shaped stone currency, some weighing several tonnes, still a cultural icon of Yap."
  - name: Bechiyal village and traditional men's houses (faluw)
    description: "Best-preserved traditional village life with faluw and stone-money pathways."
  - name: Yap's traditional dances
    description: "Famed stick and lovers' dances performed during festivals; a point of pride."
culturalTraits:
  - "The rai stone money tradition — discs transferred by renown, not moved physically"
  - "Faluw (men's houses) and the matrilineal clan system"
  - "Village councils and the authority of chiefship"
  - "Yapese language (yap) plus outer-island languages Ulithian (uli), Woleaian (woe), Satawalese (stw)"
prideOf:
  - "The stone money — one of the world's most famous traditional currencies"
  - "Living traditional culture and strong clan identity"
  - "Pristine outer-island reefs (Ulithi)"
animals:
  popular:
    - "Reef sharks"
    - "Manta rays"
    - "Sea turtles"
    - "Flying foxes"
  unique:
    - "Yap flying fox"
    - "Yap monarch (bird) and other endemic island birds"
industries:
  - "Subsistence agriculture and fishing"
  - "Tourism (diving and cultural visits)"
  - "Public sector employment"
sports:
  - "Baseball"
  - "Basketball"
  - "Traditional sailing and canoe races"
