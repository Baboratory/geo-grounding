  restDays:
    - friday
    - saturday
  typicalWorkHours: "Port and industrial operations run through the week; commercial offices roughly 09:00-18:00 with a Friday-Saturday weekend."
  lunchBreakTiming: "A lunch break around 14:00 is common."
