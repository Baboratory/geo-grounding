businessRhythm:
  restDays:
    - friday
    - saturday
  typicalWorkHours: "Commercial hours roughly 09:00-18:00 with a Friday-Saturday weekend; tea gardens follow dawn-based work patterns."
  lunchBreakTiming: "A lunch break around 14:00 is common."
