    items:
      - "Football and basketball on TV; live music and dance"
      - "Traditional Intore drumming and dance performances"
  - season: dry
    items:
      - "Best months for Lake Tanganyika beaches and park visits (Jul-Sep)"
      - "Outdoor cultural festivals and community gatherings"
  - season: wet
    items:
      - "Indoor/city culture and coffee-trading activities during the rainy months"
      - "Hiking the green highlands (muddy-path caution)"
traditionalDishes:
  - season: allYear
    items:
      - "Ugali (maize/cassava dough) served with beans, greens and stews"
      - "Kirundi-style goat and bean dishes; plantain (matoke)"
      - "Fresh fruit (banana, mango, passion fruit)"
  - season: dry
    items:
      - "Grilled dishes and brochettes at weekend markets and celebrations"
  - season: wet
    items:
      - "Hearty bean and vegetable stews during the rainy months"
traditionalClothing:
  - season: allYear
    items:
      - "Colourful wax-print (kitenge) cloth for women; smart-casual Western dress for men"
      - "Ceremonial dress with drums and woven textiles at festivals"
  - season: dry
    items:
      - "Light cotton wear suited to the warm season"
