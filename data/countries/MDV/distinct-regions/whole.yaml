    accessedDate: "2026-09-18"
    note: "Documents the Maldives' tropical monsoon climate (Am) over most atolls and equatorial rainforest (Af) in the far south, with a drier northeast-monsoon season roughly Dec-Apr and a wetter southwest monsoon roughly May-Nov. Basis for the climates entries."
  - id: mdv-unesco-mosques
