    note: "Religious affiliation of the resident population (2020): Islam 98.69%, Buddhist 0.65%, Christian 0.29%, Hindu 0.29%, non-religious 0.06%, other (incl. Baha'i) 0.03%. Basis for the religions rows. Citizenship law requires Sunni Islam, so the non-Muslim shares reflect foreign residents."
