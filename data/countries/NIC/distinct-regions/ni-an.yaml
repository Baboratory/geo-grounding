    - "Rama Cay island fauna"
    - "Coastal dolphin pods off the Corn Islands"
industries:
  - "Seafood & fisheries (Caribbean lobster, shrimp)"
  - "Smallholder coconut, plantain, palm"
  - "Eco and community tourism (Corn Islands, Rio Indio Maíz, Miskito Keys)"
  - "Artisanal fishing; remittance-supported economies"
  - "Timber and (northern) small-scale mining"
sports:
  - "Cricket and baseball"
  - "Football (fútbol)"
  - "Swimming/kayaking and offshore fishing"
