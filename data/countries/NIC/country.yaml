isSovereign: true
# Classified unitary-large: meets 2 of the 3 DESIGN.md criteria even though its
# ~6.8M population (INIDE 2023 estimate) is below the >20-25M threshold.
# (2) Officially recognized regional/minority languages: Spanish is the sole
# official language of the State (Const. Art. 11), BUT the languages of the
# Communities of the Atlantic Coast (Miskito, Sumo/Mayangna, Rama, Garifuna,
# Creole English) have official use within the Autonomous Regions of the
# Caribbean Coast as established by law (Ley 28 Estatuto de Autonomía 1987/2016;
# 1993 law on official use of Atlantic-coast languages). (3) A widely recognized,
# constitutionally-institutionalized cultural-historical regional divide: the
# Caribbean/Autonomous Coast (RACCN + RACCS) vs Pacific. Curated regions: Managua
# (NI-MN), the Caribbean Coast Autonomous Regions (NI-AN + NI-AS), León/Matagalpa
# (NI-LE + NI-MT) + WHOLE.
