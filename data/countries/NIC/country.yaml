legalConstraints:
  - topic: "official languages"
    description: "Spanish (castellano) is the sole official language of the State (Const. 1987 rev. Art. 11). The languages of the Communities of the Atlantic Coast (Miskito, Sumo/Mayangna, Rama, Garifuna, Creole English) 'will also have official use in the cases established by law' — regional co-official status within the Autonomous Regions of the Caribbean Coast (Ley 28 Estatuto de Autonomía 1987/2016; 1993 law on official use of Atlantic-coast languages). Mother-tongue/bilingual education is guaranteed for the Caribbean communities."
    sourceId: constitution-art11
  - topic: "currency / legal tender"
    description: "The Córdoba (NIO, C$) is the monetary unit, 100 centavos; only the Banco Central de Nicaragua issues banknotes/coins, which have legal tender and full discharging power throughout the territory; foreign-currency clauses are void except enumerated exceptions. USD circulate widely by custom though they are not legal tender."
    sourceId: bcn-ley-monetaria
  - topic: "ethnicity / religion data collection"
    description: "Ethnic self-identification was collected in the 2005 census (the last full census; a new IX Censo 2024 is pending). Religion was last collected in the 2005 census and NOT asked since — religion figures are the 2005 values, not current."
    sourceId: inide-censo-2005
paymentCulture:
  popularMethods:
    - "Cash (córdobas, with USD notes circulating informally) — dominant in retail/markets and the mass economy"
    - "SINPE — the national electronic payments / real-time interbank and mobile-money network (Banco Central)"
    - "Debit/credit cards (Visa, Mastercard) — common in supermarkets, malls, hotels, tourist zones"
    - "Bank transfers / ACH and mobile banking — growing among the banked"
    - "Western Union / remittance rails — large diaspora remittances"
  tipping:
    expected: true
    typicalAmount: "About 10% in sit-down restaurants (a ~10% propina is often added); loose change in taxis/for guides"
    autoIncludedInBill: true
    note: "Qualitative and customary. The córdoba is the unit of account; USD is widely accepted (especially in tourist/border areas). No authoritative single consumer payment-method share exists (the BCN publishes monetary aggregates/SINPE volumes, not a household breakdown), so none are asserted."
communicationStyle:
  contextLevel: mixed
  formalityNorms: "Warm, polite, relationship-first. Spanish business uses professional honorifics (Licenciado/a, Ingeniero/a, Doctor/Doctora, Economista) at first contact, loosening to first names once rapport forms. Value respect, though less formal than Mexican/Spanish norms."
  greetingNorms: "Firm handshake with eye contact in business; hug/kiss on the cheek among friends. 'Buenos días / buenas tardes' plus title; inquiry after family and well-being is expected first."
  meetingEtiquette: "Relational — friendly small talk before the agenda. Punctuality is relaxed ('hora nica'); arrive on time but do not take lateness as disrespect. Decisions flow through senior relationship-based contacts; personal trust closes deals."
  topicsToAvoid:
    - "The current political situation and the Ortega government (deeply polarizing since 2018)"
    - "The Somoza era and 1979 revolution history"
    - "Personal wealth display / dwelling on poverty and hardship"
    - "Sensitive ethnic/racial topics on the Caribbean coast without familiarity"
  giftGivingNotes: "Not expected at a first business meeting. Once a relationship forms, a small tasteful gift (quality coffee, Flor de Caña rum, rosquillas/cacao, branded item) is welcome; at a home, flowers, fruit or dessert."
