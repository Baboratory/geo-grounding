# Spanish (spa) is the sole official language of the State (Const. Art. 11). The
# Atlantic/Caribbean Coast community languages — Miskito (miq), Mayangna/Sumo
# (yan), Rama (rma), Garifuna (cab), Nicaragua Creole English (bzk) — have
# official use ONLY within the Autonomous Regions of the Caribbean Coast as
# established by law, so they are modeled as locallySpoken (regional shares),
# not nationwide-official rows. NOTE on ISO codes: Miskito is 'miq' (NOT 'mis',
# which is 'miscellaneous/uncoded'); Rama is 'rma' (NOT 'ram'/'rmc'); Sumo/
# Mayangna is 'yan' (obsolete 'sum' was deprecated and split in 2010). Shares
# are ESTIMATES (speakers / ~6.8M, 2023); mother-tongue data date to ~1995.
