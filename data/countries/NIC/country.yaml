sources:
  - id: constitution-art11
    name: "Constitución Política de la República de Nicaragua (1987 rev.) — Art. 11"
    publisher: "Asamblea Nacional (via OAS)"
    url: "https://www.oas.org/juridico/spanish/mesicic3_nic_const.pdf"
    year: 1987
    accessedDate: "2026-09-17"
    note: "Art. 11: Spanish is the sole official language of the State; the languages of the Communities of the Atlantic Coast 'will also have official use in the cases established by law'. Basis for the official row, the regional-official status, the language legal constraint, and the criterion-2 governance justification."
  - id: ley-28-autonomia
    name: "Ley No. 28 Estatuto de Autonomía de las Regiones de la Costa Caribe (1987/2016)"
    publisher: "Asamblea Nacional (via FAOLEX)"
    url: "https://faolex.fao.org/docs/pdf/nic163854-2016.pdf"
    year: 2016
    accessedDate: "2026-09-17"
    note: "Creates RACCN (Costa Caribe Norte, seat Puerto Cabezas/Bilwi) and RACCS (Costa Caribe Sur, seat Bluefields); governs the Miskitos/Mayagnas/Ramas/Creoles/Garifunas/Mestizos; mother-tongue education. Basis for unitary-large (criterion 3), the Caribbean region, and the language constraint."
  - id: ley-lenguas-1993
    name: "Ley de uso oficial de las lenguas de las Comunidades de la Costa Atlántica (1993)"
    publisher: "Asamblea Nacional (via UNESCO)"
    url: "https://www.unesco.org/en/right-education/observatory/law-official-use-languages-communities-atlantic-coast-nicaragua-1993"
    year: 1993
    accessedDate: "2026-09-17"
    note: "Implements Art. 11 regulating official use of Miskito/Sumo/Rama/Garifuna/Creole English. Basis for the regional co-official framework and criterion-2 justification."
  - id: inide-censo-2005
    name: "VIII Censo de Población y IV de Vivienda 2005 — Cuadro 8 (ethnic self-ID) and religion variable"
    publisher: "INIDE (formerly INEC)"
    url: "https://www.inide.gob.ni/docu/censos2005/ResumenCensal/Res_Anexos3.pdf"
    year: 2005
    accessedDate: "2026-09-17"
    note: "Ethnic self-ID counts: Miskitu 120,817, Mestizo Costa Caribe 112,253, Chorotega-Nahua-Mangue 46,002, Xiu-Sutiaba 19,949, Creole 19,890, Cacaopera-Matagalpa 15,240, Nahoas-Nicarao 11,113, Mayagna-Sumu 9,756, Rama 4,185, Garifuna 3,271, Ulwa 698. Religion: Catholic 58.5%, Evangelical 21.6% (see arda-religion)."
  - id: inide-poblacion
    name: "Estimaciones y proyecciones de población (revisión dic 2023)"
    publisher: "INIDE / BCN"
    url: "https://www.bcn.gob.ni/sites/default/files/documentos/Nicaragua%20en%20cifras%202023.pdf"
    year: 2023
    accessedDate: "2026-09-17"
    note: "INIDE 2023: ~6.8M (30-Jun-2023 estimate 6,803,886). Last actual census 2005 (5,142,098); new IX Censo 2024 pending. Basis for the population in the governance classification and locallySpoken denominators."
  - id: bcn-ley-monetaria
    name: "Ley Orgánica/Estatuto BCN — Capítulo VIII 'Unidad Monetaria' and 'Emisión de la Moneda'"
    publisher: "Banco Central de Nicaragua (BCN)"
    url: "https://bcn.gob.ni/capitulo-viii"
    accessedDate: "2026-09-17"
    note: "Art. 34: córdoba/córdobas, symbol C$, 100 centavos. Art. 35: only BCN emissions are legal tender. Arts. 101-102: exclusive issuance. Basis for the currency object and the currency constraint."
  - id: iana-timezones
    name: "IANA Time Zone Database — America/Managua"
    publisher: "Internet Assigned Numbers Authority (IANA)"
    url: "https://www.iana.org/time-zones"
    accessedDate: "2026-09-17"
    note: "America/Managua = UTC-6, no DST (stable since 2006). Single timezone."
  - id: iso-639-3
    name: "ISO 639-3 codes miq/yan/rma/bzk/cab + change 2009-037"
    publisher: "SIL / ISO 639-3 RA"
    url: "https://iso639-3.sil.org/code/miq"
    accessedDate: "2026-09-17"
    note: "Authoritative codes: miq=Miskito (NOT 'mis'), rma=Rama (NOT 'ram'/'rmc'), yan=Mayangna (deprecated 'sum' split in 2010 into yan+ulw), bzk=Nicaragua Creole English, cab=Garifuna."
  - id: etnn-miq
    name: "Ethnologue — Miskito (miq)"
    publisher: "Ethnologue (SIL)"
    url: "https://www.ethnologue.com/language/miq"
    accessedDate: "2026-09-17"
    note: "~150,000 Miskito speakers. Basis for the miq share (~0.022). ESTIMATE (secondary)."
  - id: apics-bzk
    name: "APiCS — Nicaraguan Creole English"
    publisher: "APiCS"
    url: "https://apics-online.info/surveys/11"
    accessedDate: "2026-09-17"
    note: "35,000-50,000 L1 speakers of bzk across RACCN/RACCS/Managua/US diaspora. Basis for the bzk share (~0.006). ESTIMATE."
  - id: estimate-flag
    name: "Estimated / secondary figure — marked as non-primary"
