code: WHOLE
name:
  eng: Grenada
  local:
    - languageCode: eng
      value: Grenada
# Generic country-wide fallback content for Grenada (unitary-small, single
# synthetic whole region: the main island plus Carriacou and Petite Martinique).
# Used via the 'whole-country-fallback' path.
climates:
  - koppenCode: Am
    description: "Tropical monsoon — hot, humid and wet year-round with the heaviest rain typically in the June-to-November wet season; the dominant climate across the island."
  - koppenCode: Af
    description: "Tropical rainforest in the wettest, highest-rainfall interior (e.g. around the Grand Etang crater and the central volcanic ridges)."
  - koppenCode: Aw
    description: "Tropical wet-and-dry (savanna) in the drier, leeward coastal stretches, which get a more distinct dry spell (roughly Jan-May)."
landmarks:
  - name: Grand Anse Beach
    description: "Grenada's most famous two-mile crescent of white sand just south of St. George's, often ranked among the best beaches in the Caribbean."
  - name: St. George's Harbour (Carenage)
    description: "The scenic, steeply terraced horseshoe harbour of the capital, one of the most picturesque towns in the Caribbean, with pastel buildings and the French/Georgian colonial core."
  - name: Grand Etang National Park and crater lake
    description: "A 1,000-hectare mountainous rainforest reserve in the island's centre holding a 12-hectare volcanic crater lake at ~530m; hiking up Mt Qua Qua and Mount St. Catherine."
  - name: Molinere Bay Underwater Sculpture Park
    description: "The world's first underwater sculpture park (installed 2006 by Jason deCaires Taylor) in the Molinere Beauséjour Marine Protected Area off the west coast near St. George's; it doubles as an artificial reef and snorkelling site."
  - name: Belmont Estate, St. Patrick
    description: "A working 17th-century plantation and agri-tourism heritage site — one of Grenada's best-known tree-to-bar cocoa and chocolate producers."
  - name: Mount St. Catherine
    description: "Grenada's highest peak (~840m), an extinct volcanic dome in the central mountain spine reachable by rainforest trails."
  - name: Fort George / Fort Frederick
    description: "Colonial-era fortifications above St. George's offering panoramic views over the harbour and capital."
  - name: Concord and Annandale waterfalls
    description: "Grenada's best-loved waterfalls, easily reached from central and southwestern Grenada within the Grand Etang area."
culturalTraits:
  - "'Isle of Spice' (Spice Isle) — Grenada is the world's second-largest producer of nutmeg after Indonesia and grows nutmeg, mace, cinnamon, cloves and other spices"
  - "Carnival 'Spicemas' — a portmanteau of 'spice' and 'Mas' (masquerade), held in August with unique traditional masquerade characters"
  - "Masquerade (Mas) tradition — Jab Jab (a chained devil figure), Shortknee, Wild Indian, Vieux Corps and Moko Jumbie, with roots in African-derived satire and resistance"
  - "Afro-Caribbean heritage as the majority cultural base, enriched by Indo-Caribbean, European and small indigenous (Carib/Arawak) strands"
  - "Cricket as the traditional national sport (as part of the West Indies team)"
  - "Tree-to-bar chocolate movement — Grenada pioneered Caribbean single-origin craft chocolate (Grenada Chocolate Company, Belmont Estate)"
prideOf:
  - "Being the 'Isle of Spice' and the world's second-biggest nutmeg and mace producer"
  - "The warmth and friendliness of its people"
  - "Rich Carnival and Mas traditions, from Jab Jab to Shortknee"
  - "Stunning beaches and unspoilt rainforest interior"
  - "A pioneering Caribbean bean-to-bar chocolate heritage"
  - "Resilience and independence, from the 1979 revolution to modern reconstruction"
animals:
  popular:
    - "Leatherback, hawksbill, green and loggerhead sea turtles (nesting beaches, esp. Levera Beach)"
    - "Mona monkeys (introduced, seen at Belmont Estate and in the wild)"
    - "Grenada dove (the national bird, a rare endemic)"
    - "Armadillos (locally 'cussi')"
    - "Coral reef fish and marine life around the underwater sculpture park"
  unique:
    - "Grenada dove (Leptotila wellsi) — a critically endangered endemic pigeon and the national bird"
    - "Leatherback turtles (Dermochelys coriacea) — Levera Beach on Grenada's northeast is a major regional nesting site"
    - "Grenadian nutmeg heritage embodied in the islands' flora, from the nutmeg tree to endemic rainforest species"
    - "Grenadian worm lizard and other small endemic reptiles"
industries:
  - "Nutmeg, mace and spice production — Grenada's signature export and the 'Isle of Spice' economy"
  - "Tourism — the largest economic pillar (beaches, yachting, diving, spice/chocolate agri-tourism)"
  - "Cocoa and craft (tree-to-bar) chocolate production"
  - "Agriculture — bananas, cocoa, mangoes, soursop, vegetables, fish and construction materials"
  - "Fishing and the national fish industry"
  - "International financial services / off-shore banking and insurance (an OECS/ECCU financial centre)"
  - "Higher education — St. George's University is a major employer and foreign-exchange earner"
sports:
  - "Cricket — the traditional national sport, played as part of the West Indies team; Grenada was a co-host of the 2007 ICC Cricket World Cup (National Cricket Stadium, St. George's)"
  - "Football (soccer)"
  - "Track and field / athletics"
  - "Netball and basketball"
  - "Sailing and water sports (yachting, scuba diving, snorkelling)"
