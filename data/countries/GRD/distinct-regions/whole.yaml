entertainment:
  - season: allYear
    items:
      - "Caribbean music and dance (soca, calypso, reggae); local live bands and rum shops"
      - "Beach and resort nightlife on Grand Anse and the south coast"
      - "Cricket, football, athletics and netball"
      - "Festival culture — Spicemas carnival drums and traditional Mas performances (Jab Jab, Shortknee, Wild Indian)"
      - "Diving and snorkelling at the Molinere underwater sculpture park"
traditionalDishes:
  - season: allYear
    items:
      - "Oil down — the national dish: a one-pot stew of breadfruit, callaloo/dasheen, dumplings, salted meat or fish cooked down in coconut milk and spices"
      - "Saltfish souse and bakes"
      - "Curried dishes reflecting the Indo-Caribbean influence (curry goat, roti, dhal)"
      - "Bakes, doubles and cocoa tea"
      - "Nutmeg ice cream and nutmeg syrup"
      - "Fresh fish (grilled or fried) and callaloo soup"
      - "Rum, including offerings from the historic River Antoine Rum Distillery"
traditionalClothing:
  - season: allYear
    items:
      - "Bright, light resort wear suited to the tropical climate"
      - "Madras/cotton prints reflecting Afro-Caribbean heritage"
      - "Traditional Mas carnival costuming — Jab Jab's blackened body, chains and horned helmet, Shortknee's colourful hooded jumpsuit and wire mask, Wild Indian headdresses and Fancy Mas feather costumes"
      - "Business/formal attire for work (collared shirts, suits in formal settings)"
businessRhythm:
  restDays:
    - saturday
    - sunday
  typicalWorkHours: "Government and offices roughly 08:00-16:00 Mon-Fri, with many closing 12:00-13:00 for lunch; retail and shops often open Mon-Sat (Saturday often a half-day), closing Sunday."
  lunchBreakTiming: "A standard midday break (about 12:00-13:00) is common."
  notableShutdownPeriods:
    - period: "Christmas and New Year"
      description: "Reduced business over Christmas (late Dec-early Jan)."
    - period: "Carnival (Spicemas) weekend in August"
      description: "Banks, offices and many shops close for the annual national carnival, which runs from the second Monday of August through Tuesday (with celebrations building from July/August)."
    - period: "Easter weekend"
      description: "Good Friday and Easter Monday public holidays; reduced trading."
    - period: "Hurricane season (June-November)"
      description: "Business can be briefly interrupted by tropical storms and hurricanes, though many storms pass offshore; the tourist 'high' season runs roughly Dec-Apr."
  notes: "Sunday is widely a rest day outside commercial and tourist zones. The December-April high season drives the tourism peak cycle."
sources:
  - id: grd-religion-2011
    name: "Grenada — People and Society: Religions (2011 est.)"
    publisher: "CIA World Factbook"
    url: "https://www.cia.gov/the-world-factbook/countries/grenada/"
    year: 2011
    accessedDate: "2026-09-18"
    note: "Religious affiliation (2011 govt estimate, also cited in the US State Dept 2020 International Religious Freedom Report): Protestant 49.2% (Pentecostal 17.2%, Seventh-day Adventist 13.2%, Anglican 8.5%, Baptist 3.2%, Church of God 2.4%, Evangelical 1.9%, Methodist 1.6%, other 1.2%), Roman Catholic 36%, Jehovah's Witness 1.2%, Rastafarian 1.2%, other 5.5%, none 5.7%, unspecified 1.3%."
  - id: grd-nutmeg
    name: "Isle of Spice / nutmeg economy"
    publisher: "The World Bank / FAO"
    url: "https://www.fao.org/americas/news/news-detail/The-Spice-Isle-seeks-to-expand-commodities/en"
    year: 2023
    accessedDate: "2026-09-18"
    note: "Grenada is known as the 'Spice Isle/Isle of Spice' and is the world's second-largest producer of nutmeg after Indonesia (~20% of global market), also growing mace, cinnamon and cloves — basis for the spice cultural trait and industries."
  - id: grd-leatherback
    name: "Leatherback nesting at Levera Beach, Grenada"
    publisher: "Ocean Spirits (Grenada)"
    url: "http://www.oceanspirits.org/research-and-monitoring/"
    year: 2014
    accessedDate: "2026-09-18"
    note: "Levera Beach in northeast Grenada is one of the top-three regional nesting sites for leatherback sea turtles in the wider Caribbean (high of 1,143 confirmed nests by 300+ turtles in 2014) — basis for the leatherback unique-animal and popular-animal entries."
  - id: grd-cwc-2007
    name: "2007 ICC Cricket World Cup — hosts and venues"
    publisher: "International Cricket Council (via Wikipedia)"
    url: "https://en.wikipedia.org/wiki/2007_Cricket_World_Cup"
    year: 2007
    accessedDate: "2026-09-18"
    note: "Grenada was one of nine co-hosting Caribbean nations of the 2007 Cricket World Cup, staging matches at the National Cricket Stadium (Queen's Park) in St. George's — basis for the 2007 co-hosting sports claim."
