    description: "The principal urban centre of northern Uganda, historically the heartland of the Acholi people."
  - name: Acholi ecosystem and the National Cultural Centre
    description: "Centres presenting Acholi songs, dances and the rich oral heritage of the north."
  - name: Ajai Wildlife Reserve (nearby)
