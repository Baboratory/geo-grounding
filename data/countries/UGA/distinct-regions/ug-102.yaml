climates:
  - koppenCode: Am
    description: "Tropical monsoon climate at ~1,200m near Lake Victoria, warm and humid with a pronounced wet season."
landmarks:
  - name: Kasubi Tombs
    description: "A UNESCO World Heritage Site — the burial grounds of the Buganda kings, with traditional Ganda architecture."
    unescoWorldHeritage: true
  - name: Uganda Martyrs Cathedral (Namugongo)
    description: "A site of pilgrimage honouring the 1886 Uganda Martyrs."
  - name: Bahá'í House of Worship
    description: "One of only seven Bahá'í temples in the world, set on Kikaya Hill."
  - name: Uganda Museum
    description: "The oldest museum in East Africa, presenting Uganda's ethnography, culture and natural history."
  - name: Lake Victoria (Speke Resort and Ggaba beach)
    description: "Uganda's capital overlooks the world's second-largest freshwater lake."
culturalTraits:
  - "Uganda's capital, largest city and political, economic and cultural hub"
  - "A youthful, energetic metropolis at the heart of Buganda country"
  - "Famous for its lively nightlife, street food and vibrant music scene"
prideOf:
  - "Being the vibrant heart of Uganda and the seat of government"
  - "The mix of modern life with the heritage of the Buganda kingdom"
  - "The famous 'rolex' street food and bustling markets"
