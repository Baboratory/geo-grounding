code: WHOLE
name:
  eng: Saint Lucia
  local:
    - languageCode: eng
      value: Saint Lucia
    - languageCode: acf
      value: Sent Lisi
# Generic country-wide fallback content for Saint Lucia (unitary-small, single
# synthetic whole region). Used via the 'whole-country-fallback' path. The WHOLE
# region carries the country-wide Kwéyòl name 'Sent Lisi' alongside the official
# English name — Kwéyòl is locally used across the island even though it is not
# official.
climates:
  - koppenCode: Am
    description: "Tropical monsoon — hot year-round with a pronounced wet season (Jun-Nov, aligned with the Atlantic hurricane season) matched to the islands's trade-wind climate and lush interior rainforest; dominant over much of the island."
  - koppenCode: Af
    description: "Tropical rainforest in the wettest, mountainous interior and windward slopes."
  - koppenCode: Aw
    description: "Tropical wet-and-dry (savanna) on the drier leeward coast, with a distinct drier season roughly Dec-Apr."
landmarks:
  - name: The Pitons (Gros Piton & Petit Piton)
    description: "Twin volcanic spires rising to 770-777 m and 743 m from the sea near Soufrière — the island's iconic symbol and the centrepiece of the Pitons Management Area, a UNESCO World Heritage Site."
    unescoWorldHeritage: true
  - name: Soufrière Volcano (Sulphur Springs / Qualibou)
    description: "The 'drive-in volcano' near Soufrière — the most active geothermal field in the Lesser Antilles, with steaming fumaroles, bubbling mud pools and hot springs within the Qualibou depression."
  - name: Marigot Bay
    description: "A scenic sheltered yacht haven on the west coast, famed as one of the Caribbean's most beautiful bays."
  - name: Pigeon Island (Gros Islet)
    description: "A historic island landmark linked to the shore by a causeway, with a restored 18th-century British fort (Fort Rodney) and sweeping coastal views."
  - name: Castries Market
    description: "The lively central market in the capital where fresh produce, spices, crafts and local life meet."
  - name: Rodney Bay
    description: "The island's main resort and nightlife hub on the northwest coast, at the northern end of Gros Islet."
culturalTraits:
  - "Creole / Kwéyòl heritage — a French-based creole language and culture at the heart of national identity, celebrated in literature, music and everyday speech"
  - "La Woz (La Rose) and La Mas (La Marguerite) — the traditional flower-festival societies held in August and October, preserving African-derived song, dance and costume"
  - "Carnival — the pre-Lenten street festival with mas bands, costumes, calypso and soca; plus a separate Jouvert-style celebration"
  - "Saint Lucia Jazz & Arts Festival — the world-renowned music festival held each May in Rodney Bay"
  - "Nobel laureates Derek Walcott (Literature, 1992) and W. Arthur Lewis (Economic Sciences, 1979) — the world's highest Nobel-laureates-per-capita count"
  - "Kwéyòl music and drumming, incl. kadril/quadrille, belè and Pikante heritage"
  - "Brother George Odlum — the legendary fiery orator and Labour politician, a beloved national icon of the bar and the platform"
  - "Chocolate and cocoa heritage plus a strong banana/plantation colonial history"
prideOf:
  - "The two Nobel laureates (Derek Walcott and Sir Arthur Lewis) — the most per capita of any country"
  - "The Pitons and spectacular natural beauty — rainforest, volcanic landscape and beaches ('The Helen of the West Indies')"
  - "The warm, welcoming people and the hospitality culture"
  - "Creole (Kwéyòl) language and cultural heritage, and the island's music and festivals"
animals:
  popular:
    - "Saint Lucia amazon (Amazona versicolor) — the endemic national bird"
    - "Leatherback sea turtles — large nesting beaches"
    - "Hawksbill turtles and green sea turtles"
    - "Dolphins and humpback whales along the coast"
    - "Agouti (guinea pig-like rodent)"
  unique:
    - "Saint Lucia amazon parrot (Amazona versicolor) — endemic to Saint Lucia, the national bird, recovering from near-extinction"
    - "Saint Lucia iguana (endemic lizard)"
    - "Saint Lucia oriole (endemic bird)"
    - "Leatherback sea turtles — among the largest; endangered species nesting on the island's beaches"
industries:
  - "Tourism — the largest economic pillar"
  - "Agriculture — bananas, coconuts, mangoes, root crops (dasheen, sweet potato, yam) and cocoa"
  - "Off-shore banking and international financial services (a recognised international financial centre)"
  - "Manufacturing and assembly, and the rum/liquor trade"
  - "Construction and the port of Castries"
sports:
  - "Cricket — a passion; Darren Sammy, a Saint Lucian, captained the West Indies to successive T20 World Cup titles"
  - "Football (soccer)"
  - "Athletics / track and field"
  - "Netball"
