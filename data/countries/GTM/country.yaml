# Spanish is the sole official language (Const. Art. 143; Decreto 19-2003 Art. 1
# — 'El idioma oficial de Guatemala es el español'). The national-language status
# of the Maya/Xinca/Garifuna languages is honored here as locallySpoken rows
# (they are recognized as national-language heritage but are NOT co-official,
# so they do not carry the 1.0 official flag). Shares are % of total population
# from the INE 2018 census language-of-learning tables (mother tongue). Note:
# Q'eqchi' (kek, ~8.31%) is the LARGEST Mayan language, ahead of K'iche' (quc,
# ~7.76%).
ethnicGroups:
  # Ethnic self-identification (pueblo de pertenencia), INE 2018 census.
