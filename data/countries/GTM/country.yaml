    file: distinct-regions/gt-qz.yaml
    adminUnitCodes: [GT-09]
  - code: GT-17
    file: distinct-regions/gt-pe.yaml
    adminUnitCodes: [GT-17]
sources:
  - id: ine-censo-2018
    name: "XII Censo Nacional de Población y VII de Vivienda 2018 — Resultados (pueblo de pertenencia & comunidades lingüísticas)"
    publisher: "Instituto Nacional de Estadística (INE) Guatemala"
    url: "https://censo2018.ine.gob.gt/archivos/resultados_censo2018.pdf"
    year: 2018
    accessedDate: "2026-09-17"
    note: "Total population 14,901,286. Ethnic self-identification (pueblo de pertenencia): Maya 41.7% (6,207,503), Ladino 56.0% (8,346,120), Xinka 1.8% (264,167), Garifuna 0.1% (19,529), Afrodescendant/Creole/Afromestizo 0.2% (27,647), Foreign 0.2% (36,320). Language-of-learning shares: Spanish ~69.9%, Q'eqchi' ~8.31% (1,127,387), K'iche' ~7.76% (1,054,818), Mam ~4.4% (590,641), Kaqchikel ~3.03% (411,089)."
  - id: decreto-19-2003
    name: "Ley de Idiomas Nacionales, Decreto Número 19-2003 del Congreso"
    publisher: "Congreso de la República de Guatemala (text via ACNUR mirror)"
    url: "https://www.acnur.org/fileadmin/Documentos/BDL/2008/6731.pdf"
    year: 2003
    accessedDate: "2026-09-17"
    note: "Art. 1: 'El idioma oficial de Guatemala es el español.' Recognizes the languages of the Maya, Xinca and Garifuna peoples as national languages forming part of the cultural heritage, and obliges the State to use them in services to speakers. Basis for the official-language row, the minority-language criterion, and the 'official language' legal constraint."
  - id: constitucion-1985-art143
    name: "Constitución Política de la República de Guatemala (1985, as amended) — Art. 143 (Idioma oficial)"
    publisher: "Congreso de la República de Guatemala (text via Jurista legal database)"
    url: "https://www.jurista.com.gt/laws/constitucion-politica"
    year: 1985
    accessedDate: "2026-09-17"
    note: "Art. 143 ('Idioma oficial') establishes Spanish as the official language of Guatemala. Cited together with Decreto 19-2003."
  - id: ley-monetaria-17-2002
    name: "Ley Monetaria, Decreto Número 17-2002 (Arts. 1-2, 6)"
    publisher: "Banco de Guatemala"
    url: "https://banguat.gob.gt/sites/default/files/banguat/leyes/2013/ley_monetaria.pdf"
    year: 2002
    accessedDate: "2026-09-17"
    note: "Art. 1: the monetary unit is the Quetzal, symbol 'Q', divided into 100 centavos. Art. 2: only the Banco de Guatemala may issue banknotes/coins. Art. 6: the Quetzal is the unit of account and means of payment absent express agreement otherwise. Basis for the currency object and the currency legal constraint."
  - id: usdos-irf-2018
    name: "2018 Report on International Religious Freedom: Guatemala"
    publisher: "U.S. Department of State, Bureau of Democracy, Human Rights, and Labor"
    url: "https://www.state.gov/wp-content/uploads/2019/05/GUATEMALA-2018-INTERNATIONAL-RELIGIOUS-FREEDOM-REPORT.pdf"
    year: 2018
    accessedDate: "2026-09-17"
    note: "Religion survey estimates (ProDatos 2016): ~45% Catholic, ~42% Protestant/evangelical, ~11% no affiliation, combined <3% other. FLAGGED as estimates — Guatemala's census does not record religion."
  - id: iana-timezone
    name: "IANA Time Zone Database — America/Guatemala"
    publisher: "Internet Assigned Numbers Authority (IANA)"
    url: "https://www.iana.org/time-zones"
    accessedDate: "2026-09-17"
    note: "America/Guatemala = UTC-6, no daylight saving time observed; the sole timezone for the country."
