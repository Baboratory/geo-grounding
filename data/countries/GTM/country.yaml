alpha3: GTM
alpha2: GT
name:
  eng: Guatemala
  local:
    - languageCode: spa
      value: Guatemala
flagEmoji: "🇬🇹"
capital: Ciudad de Guatemala
isSovereign: true
# Classified unitary-large: Guatemala meets 2 of the 3 DESIGN.md criteria even
# though its ~14.9M population (INE 2018 census) is below the >20-25M threshold:
# (1) officially recognized minority languages — Decreto 19-2003 (Ley de Idiomas
# Nacionales) recognizes 22 Mayan languages plus Xinca and Garifuna as national
# languages of the cultural heritage (Const. Art. 143), and (2) a widely
# recognized cultural-historical regional identity — 41.7% Maya across 22
# linguistic communities with strong department-level identity. The state is
# constitutionally unitary (22 departments, 340 municipalities) so NOT federal.
# Curated regions: Guatemala (GT-01, capital), Quetzaltenango (GT-09, K'iche'/Mam
# highlands), Petén (GT-17, northern lowlands/Tikal) + the generic WHOLE fallback.
governanceType: unitary-large
iso3166_2_prefix: "GT"
hasSubdivisions: true
regionCoverage:
  # Guatemala's 22 departments, per ISO 3166-2 as of 2026-09. NOTE: this file's
  # adminUnitCodes are not current ISO codes, so IP lookup can't reach these
  # region files at all -- see TODO.md's coverage re-audit, item 3.
  # Count per ISO 3166-2 as of 2026-09. The uncurated units have NOT yet been
  # tested against DESIGN.md's five coverage triggers -- this declaration records
  # the gap so it is visible, not a finding that the gap is correct. Pending the
  # coverage re-audit (see TODO.md).
  tier: first-level
  totalUnits: 22
  status: partial
  gapReason: "3 of 22 first-level units curated. Which of the
    remaining units fire a coverage trigger has not been assessed yet -- the
    curated set predates the coverage floor and was chosen by size/capital,
    not by divergence. Queued for the coverage re-audit."
