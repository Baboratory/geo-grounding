currency:
  code: GTQ
  symbol: "Q"
  name: Quetzal
legalConstraints:
  - topic: "official language"
    description: "Spanish is the sole official language (Constitución Art. 143; Ley de Idiomas Nacionales Decreto 19-2003 Art. 1). The State recognizes and must use the languages of the Maya, Xinca and Garifuna peoples in services provided to their speakers, as part of the national cultural heritage."
    sourceId: decreto-19-2003
  - topic: "national currency / legal tender"
    description: "The Quetzal (GTQ) is the national currency and, absent express agreement to the contrary, the unit of account and legally-binding means of payment for all monetary transactions, with full discharging power over debts. Only the Banco de Guatemala may issue banknotes and coins (Ley Monetaria Decreto 17-2002 Arts. 1-2, 6)."
    sourceId: ley-monetaria-17-2002
  - topic: "ethnicity/religion data collection"
    description: "Ethnic self-identification (Maya/Ladino/Xinca/Garifuna/Afrodescendant) is collected in the census; religion is NOT asked in the census. Religion figures are therefore survey-derived estimates (see religions source notes) — do not present as census statistics."
    sourceId: usdos-irf-2018
paymentCulture:
  popularMethods:
    - "Cash — dominant, especially in retail, market stalls and the informal/mass economy"
    - "Visa and Mastercard-branded debit/credit cards — no domestic card scheme of its own"
    - "Bank transfers / national ACH and interbank rails (electronic funds transfer systems operated by the banking system)"
    - "Mobile banking apps and digital wallets — growing but penetration is incomplete"
  tipping:
    expected: true
    typicalAmount: "About 10% in nicer restaurants; a 10% propina is commonly added to restaurant bills"
    autoIncludedInBill: true
    note: "Qualitative and customary. Cash remains most common in the mass economy; some establishments include a 10% service charge. No authoritative national payment-method-share study was located, so no percentages are asserted here."
communicationStyle:
  contextLevel: mixed
  formalityNorms: "Warm and relational; Spanish business uses professional titles (Licenciado/a, Doctor/Doctora, Ingeniero/a). In Maya regions address with respect and allow for a formal-but-warm style; first names arrive once rapport/trust builds."
  greetingNorms: "Firm handshake and direct eye contact in business; among acquaintances/friends a hug or kiss on the cheek. A warm, unhurried greeting and inquiry after well-being is normal."
  meetingEtiquette: "Meetings are relational — expect warm small talk before the agenda. Punctuality is commonly relaxed ('hora chapina'); arrive on time but do not be offended by a host running late. Decisions flow through senior relationship-based contacts; patience expected."
  topicsToAvoid:
    - "Guatemala's 1960-1996 internal armed conflict and genocide/atrocity history — deeply sensitive, especially in Maya communities"
    - "Ethnic/indigenous discrimination and racism — sensitive"
    - "Direct criticism of the government or President in casual settings"
    - "Personal wealth or income display"
  giftGivingNotes: "Not expected at a first business meeting. When visiting a home, a modest gift (flowers, fruit, sweets, or regional artisan/coffee craft) is welcome. Avoid anything that could be read as a bribe in a business context."
