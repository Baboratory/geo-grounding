sources:
  - id: irq-constitution-art4
    name: "Constitution of the Republic of Iraq, Article 4"
    publisher: "Constitute Project (comparative constitutions), text of the Iraqi Constitution"
    url: "https://www.constituteproject.org/constitution/Iraq_2005"
    year: 2005
    accessedDate: "2026-09-20"
    note: "Arabic and Kurdish are the two official languages of Iraq; other languages (Turkmen, Syriac, Armenian) are official where spoken by sizeable communities in their regions."
  - id: irq-cia-people
    name: "CIA World Factbook — Iraq (people and society)"
    publisher: "CIA World Factbook"
    url: "https://www.cia.gov/the-world-factbook/countries/iraq/"
    year: 2025
    accessedDate: "2026-09-20"
    note: "Ethnic composition (Arab ~75%, Kurd ~20%, other ~5%) and language shares (Arabic ~80%, Kurdish ~20%, Turkmen ~9%). 'kur' here is the Kurdish macrolanguage covering both Sorani (ckb) and Kurmanji (kmr)."
  - id: irq-data-protection
    name: "Iraqi legal framework for privacy and data protection"
    publisher: "Government of Iraq / Communications and Media Commission (CMC)"
    url: "https://www.cmc.iq/"
    year: 2020
    accessedDate: "2026-09-20"
    note: "Privacy is protected via the Constitution (Article 17), the Telecommunications Law and sectoral rules; no standalone national data-protection law yet."
  - id: irq-cabinet-tax
    name: "Finance laws and consumption tax on goods and services"
    publisher: "Iraqi Council of Ministers / Ministry of Finance"
    url: "https://www.mof.gov.iq/"
    year: 2022
    accessedDate: "2026-09-20"
    note: "A consumption/sales tax applies to goods and services; price display in dinars generally expected to be inclusive."
  - id: irq-consumer-law
    name: "Iraqi Consumer Protection Law No. 1 of 2010"
    publisher: "Ministry of Trade, Central Agency for Consumer Protection"
    url: "https://www.mot.gov.iq/"
    year: 2010
    accessedDate: "2026-09-20"
    note: "Protects consumers against defective, fraudulent and dangerous goods and provides for refunds on defective products."
  - id: irq-cia-econ
    name: "CIA World Factbook — Iraq (economy)"
    publisher: "CIA World Factbook"
    url: "https://www.cia.gov/the-world-factbook/countries/iraq/"
    year: 2025
    accessedDate: "2026-09-20"
    note: "Cash-dominant economy, infrastructural challenges and the importance of security and local partnerships."
  - id: irq-ef-english-2023
    name: "EF English Proficiency Index 2023 — Iraq"
    publisher: "EF Education First"
    url: "https://www.ef.com/wwen/epi/"
    year: 2023
    accessedDate: "2026-09-20"
    note: "Approximate share of the population able to hold an English conversation (~20%, concentrated among educated, younger and urban Iraqis)."
  - id: irq-payment-composite
    name: "Composite estimate of Iraqi payment-method shares (2023-2024)"
    publisher: "Composite estimate"
    url: "https://www.cbi.iq/"
    year: 2024
    accessedDate: "2026-09-20"
    note: "Approximate shares derived from central-bank and market reporting: cash (incl. dollars) ~70%, bank transfer/local cards ~20%, money services ~6%, other ~4%. Composite estimate; there is no published official paymentMethodShares split."
