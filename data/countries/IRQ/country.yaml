paymentCulture:
  popularMethods:
    - "Cash — strongly dominant; many transactions, especially in the bazaar and small trade, are settled in cash, often in US dollars alongside dinars"
    - "Local bank debit cards and transfers through the state and private banks"
    - "Money-service businesses (hawala-style remittances) for domestic and international transfers"
    - "Dollarisation — US dollars are commonly used for large-ticket purchases, real estate and savings"
  tipping:
    expected: false
    typicalAmount: "5-10%"
    autoIncludedInBill: false
    note: "Tipping is not obligatory. In restaurants and cafés, leaving a small tip (a few percent to ~10%) is appreciated; in public services a customary small tip (rags/pourboire) to porters and helpers is common."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Communication is warm, hospitable and relationship-driven. Use titles ('Sayyid'/'Sayyida', honorifics) and surnames; there is a strong sense of family, tribe and community honour. Negotiation is personal and takes time; trust built over face-to-face meetings matters more than written formalities."
  greetingNorms: "The greeting 'As-salamu alaykum' with the reply 'Wa alaykum as-salam' is standard. Men shake hands warmly, often adding a light embrace or touching shoulders among close acquaintances. Greetings with women follow cultural and religious norms — often verbal or a nod unless the woman offers her hand."
  meetingEtiquette: "Meetings open with tea, coffee and pleasantries before business; jumping straight to business is considered rude. Hospitality is generous and offers are often insisted upon. Decisions can be slow and are usually confirmed through trusted local intermediaries. Respect for elders and hierarchy is important."
  topicsToAvoid:
    - "Sectarian tensions and recent political instability"
    - "Criticism of religion, tribal or family honour"
    - "The role of foreign forces and sensitive regional politics"
    - "Sensitive assertions about ethnic or religious communities"
  giftGivingNotes: "Gift-giving is appreciated when a relationship is established. Sweets, dates, quality perfumes and tactful items are safe. Give and receive with the right hand. Gifts are often opened when received. Avoid alcohol and pork-linked gifts, and any item that could carry religious or political overtones."
