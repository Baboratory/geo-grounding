legalConstraints:
  - topic: "data protection regime"
    description: "Iraq lacks a standalone comprehensive data-protection law. Data subjects and privacy are addressed piecemeal through the Constitution's right to privacy (Article 17), the Telecommunications Law and sectoral rules in banking and health. In the Kurdistan Region, the KRG has advanced draft privacy legislation, but nationally enforcement is carried out by the Communications and Media Commission (CMC) and by sectoral bodies; cross-border data flow rules are not yet codified in a national statute."
    sourceId: irq-data-protection
  - topic: "price display and VAT"
    description: "Prices for goods and services are normally quoted and displayed in Iraqi dinars; a VAT-like Consumption Tax (sales tax) was introduced and adjusted in phases under the finance laws of the 2020s, and retailers are generally expected to display inclusive prices, though practice varies between modern retail and the bazaar."
    sourceId: irq-cabinet-tax
  - topic: "consumer withdrawal right"
    description: "A national Consumer Protection Law (Law No. 1 of 2010) protects consumers against fraudulent, defective or dangerous goods and unfair practices, and provides a basis for refunds on defective products; rules are administered by the Ministry of Trade's Central Agency for Consumer Protection."
    sourceId: irq-consumer-law
  - topic: "security and commercial risk"
    description: "Parts of the country have historically faced instability and security concerns, and infrastructure (electricity, banking connectivity) can be inconsistent. Businesses should plan for interruptions, cash dependence, and the importance of local partnerships, licences and relationship-based operations."
    sourceId: irq-cia-econ
