    name: "Brimstone Hill Fortress — UNESCO World Heritage Centre (list entry 910)"
    publisher: "UNESCO World Heritage Centre"
    url: "https://whc.unesco.org/en/list/910/"
    year: 1999
    accessedDate: "2026-09-18"
    note: "Confirms Brimstone Hill Fortress was inscribed in 1999 — basis for the unescoWorldHeritage flag on that landmark."
