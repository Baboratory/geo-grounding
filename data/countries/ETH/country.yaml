    adminUnitCodes: [ET-TI]
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
  - id: eth-constitution
    name: "1995 Constitution of the Federal Democratic Republic of Ethiopia (Art. 5 languages, Art. 40 land)"
    publisher: "Federal Democratic Republic of Ethiopia"
    url: "https://en.wikipedia.org/wiki/1995_Constitution_of_Ethiopia"
    year: 1995
    accessedDate: "2026-09-19"
    note: "Article 5 makes Amharic the working language of the Federal Government and grants all languages equal state recognition; Article 40(3) makes land common property not subject to sale. Basis for the amh official-domain row and the land-tenure legal constraint."
  - id: fed-lang-2020
    name: "One to five: Ethiopia gets four new federal working languages"
    publisher: "Africanews (reporting the Council of Ministers decision of 29 Feb 2020)"
    url: "https://africanews.com/2020/03/04/one-to-five-ethiopia-gets-four-new-federal-working-languages"
    year: 2020
    accessedDate: "2026-09-19"
    note: "The 2020 decision elevating Oromo, Tigrinya, Somali, and Afar to federal working languages alongside Amharic — basis for the orm/tir/som/aar official-domain rows and the language legal constraint."
  - id: census-2007-lang
    name: "Languages of Ethiopia (2007 census first-language shares)"
    publisher: "Wikipedia, citing the 2007 Population and Housing Census, Central Statistical Agency of Ethiopia"
    url: "https://en.wikipedia.org/wiki/Languages_of_Ethiopia"
    year: 2007
    accessedDate: "2026-09-19"
    note: "Mother-tongue spoken shares of the principal local languages (Oromo 33.8%, Amharic 29.3%, Somali 6.2%, Tigrinya 5.9%, Sidamo 4.0%, Wolaytta 2.2%, Afar 1.7%) — the locallySpoken rows."
  - id: census-2007-ethnic
    name: "Responses to Information Requests: ethnic composition of Ethiopia"
    publisher: "Immigration and Refugee Board of Canada, Research Directorate (citing Central Statistical Agency of Ethiopia, 2007 census)"
    url: "https://irb-cisr.gc.ca/en/country-information/rir/Pages/index.aspx?doc=458455"
    year: 2007
    accessedDate: "2026-09-19"
    note: "Ethnic composition percentages from the 2007 census (Oromo 34.5%, Amhara 26.9%, Somali 6.2%, Tigray 6.1%, Sidama 4.0%, Gurage 2.5%, Welayta 2.3%, Hadiya 1.7%, Afar 1.7%, Gamo 1.5%, remainder smaller groups)."
  - id: eng-estimate
    name: "Composite estimate — English as a foreign language in Ethiopia"
    publisher: "Composite estimate (based on Languages of Ethiopia / educational-policy sources)"
    url: "https://en.wikipedia.org/wiki/Languages_of_Ethiopia"
    year: 2026
    accessedDate: "2026-09-19"
    note: "English is the principal learned/foreign language (medium of instruction in higher education, common in urban business and government). No census publishes an English-proficiency figure; the ~0.12 foreign-domain share is a labelled composite estimate, not an official statistic."
  - id: eth-data-protection
    name: "Personal Data Protection Proclamation No. 1321/2024"
    publisher: "Ministry of Innovation and Technology, Federal Democratic Republic of Ethiopia"
    url: "http://www.mint.gov.et/documents/d/guest/proclamation_no-_1321_-2024personal_data_protection?download=true"
    year: 2024
    accessedDate: "2026-09-19"
    note: "Ethiopia's national data-protection law (published in the Federal Negarit Gazette, 2024) — basis for the personal-data legal constraint relevant to data collection/consulting on Ethiopian residents."
