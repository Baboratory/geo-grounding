code: WHOLE
name:
  eng: Lebanon
  local:
    - languageCode: ara
      value: لبنان
climates:
  - koppenCode: Csa
    description: "Mediterranean hot-summer climate: mild, wet winters and hot, dry summers on the coast and lower western slopes, with nearly all rain falling November-March."
  - koppenCode: BSk
    description: "Cold semi-arid climate in the interior (Bekaa Valley and Anti-Lebanon), which lies in the rain shadow of Mount Lebanon and has stronger seasonal temperature swings."
landmarks:
  - name: Baalbek
    description: Colossal Roman sanctuary complex (Temples of Jupiter and Bacchus), among the finest examples of Imperial Roman architecture.
    unescoWorldHeritage: true
  - name: Tyre
    description: Ancient Phoenician city and archaeological site (Roman baths, hippodrome, colonnaded road, necropolis), legendary birthplace of purple dye.
    unescoWorldHeritage: true
  - name: Byblos
    description: One of the oldest continuously inhabited cities, a Phoenician port closely linked to the origins and diffusion of the Phoenician alphabet.
    unescoWorldHeritage: true
  - name: Anjar
    description: Well-preserved Umayyad city ruins (8th century), the only Umayyad site in Lebanon.
    unescoWorldHeritage: true
  - name: Ouadi Qadisha (Holy Valley) and the Cedars of God (Horsh Arz el-Rab)
    description: Sacred valley with ancient monasteries and the remnant cedar forest of the famous Cedars of Lebanon.
    unescoWorldHeritage: true
  - name: Jeita Grotto
    description: Spectacular system of limestone caves near Beirut known for its huge stalactites and underground river; not on the UNESCO list.
    unescoWorldHeritage: false
culturalTraits:
  - "Famous hospitality and generosity to guests, with food and coffee offered immediately"
  - "Sharing culture: meals served as large mezze spreads to be shared communally"
  - "Trilingualism (Arabic, French, English) and a strong cafe culture"
  - "Strong family and clan loyalty and a deeply social, expressive communication style"
  - "Resilience and defiance in the face of crises"
  - "Deep attachment to music, the arts and nightlife, especially in Beirut"
prideOf:
  - "Phoenician heritage and Lebanon's ancient, continuous history"
  - "Lebanese cuisine, recognized and enjoyed worldwide"
  - "The national symbol, the Cedar of Lebanon"
  - "Beirut's reputation as a cultural, artistic and nightlife capital of the region"
  - "The country's resilience and famed hospitality"
