businessRhythm:
  restDays:
    - sunday
  notes: "The 2019-2021 financial and banking crisis, chronic electricity shortages and episodes of conflict have shortened and disrupted normal business hours; many enterprises rely on private generators and operate reduced schedules. Many businesses also close for Friday prayers or take a half-day on Friday."
  typicalWorkHours: "Generally 09:00-17:00/18:00 Monday-Friday; retail often runs longer (09:00-19:00); banks typically about 08:30-14:00; hours vary by sector."
