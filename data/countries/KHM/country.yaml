      value: កម្ពុជា
flagEmoji: "🇰🇭"
capital: Phnom Penh
isSovereign: true
# Classified unitary-small: population ~17M (2019 census 15.55M) is under the threshold,
# and although Cambodia has recognized indigenous minority languages (and Cham, small
# Chinese and Vietnamese communities), they are national-level statuses, not the basis of
# a widely-recognized cultural-historical regional identity divide. The province-level
# admin units are not such a divide. So: a single country-wide WHOLE entry.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
