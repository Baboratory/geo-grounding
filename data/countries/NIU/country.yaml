alpha3: NIU
alpha2: NU
name:
  eng: Niue
  local:
    - languageCode: eng
      value: Niue
    - languageCode: niu
      value: "Niuē"
flagEmoji: "🇳🇺"
capital: Alofi
isSovereign: true
# Classified unitary-small: Niue is a self-governing island state in free
# association with New Zealand (~1.7k people, 2022 census). It does not meet the
# unitary-large criteria — the 14 village subdivisions are administrative, not a
# widely recognized cultural-historical regional identity meriting curation. One
# synthetic WHOLE region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: niu
    domain: official
    speakersShare: 1.0
    sourceId: wp-lang
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: wp-lang
  - languageCode: niu
    domain: locallySpoken
    speakersShare: 0.46
    sourceId: wp-bilingual
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.11
    sourceId: wp-bilingual
# Niue is bilingual: ~30% speak both Niuean and English, ~46% speak only
# Niuean, ~11% speak only English (per Wikipedia research). The locallySpoken
# entries reflect the monolingual shares; bilingual speakers are captured
# across both.
ethnicGroups:
  - group: Niuean
    percent: 68.4
    sourceId: wp-ethnic
  - group: Part-Niuean
    percent: 5.3
    sourceId: wp-ethnic
  - group: Other
    percent: 29.3
    sourceId: wp-ethnic
timezones:
  - name: Pacific/Niue
    standardUtcOffset: "UTC-11"
    observesDst: false
# Niue is on a single timezone UTC-11 year-round with no DST.
currency:
  code: NZD
  symbol: "$"
  name: New Zealand dollar
legalConstraints:
  - topic: "official languages"
    description: "Niuean (Vagahau Niue) and English are both official languages."
    sourceId: wp-lang
  - topic: "free association with New Zealand"
    description: "Niue is self-governing in free association with New Zealand (Constitution Act 1974). Niueans are New Zealand citizens; New Zealand carries out most diplomatic representation and provides the largest share of the budget and development aid."
    sourceId: wp-politics
  - topic: "Sunday trading"
    description: "Christian tradition is strong on Niue (predominantly Ekklesia Niue/Protestant); Sunday is widely observed as a day of rest and church, with limited commercial activity."
    sourceId: wp-culture
  - topic: "customary land tenure"
    description: "Most land is held under customary tenure managed by village councils and extended families; land alienability to outsiders is restricted by law."
    sourceId: wp-culture
paymentCulture:
  popularMethods:
    - "Cash is commonly used in Niue's small cash-based economy"
    - "The Niue dollar (pegged at par with the NZ dollar) is official legal tender but used mainly for collector coins; the New Zealand dollar circulates in practice"
    - "Banking via the Bank of Niue (BON)"
    - "Remittances from the large Niuean diaspora in New Zealand (90-95% of Niueans live there)"
  tipping:
    expected: false
    typicalAmount: "Not customary"
    autoIncludedInBill: false
    note: "Tipping is generally not expected."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Small island community culture centred on extended families, the 14 village councils, and chiefly (patu-iki and village matahega) respect; personal relationships matter greatly."
  greetingNorms: "Greet with 'Fakaalofa lahi atu' (Niuean) or a warm handshake."
  meetingEtiquette: "Meetings in villages and the Niue Assembly value consensus and respect for elders; church prayer often opens gatherings. Pace is relaxed — build relationships before business."
  topicsToAvoid:
    - "Criticizing village chiefs or church authority"
    - "Disregarding island customs and manners"
  giftGivingNotes: "Modest gifts and contributing food to community and church events are customary and appreciated."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
