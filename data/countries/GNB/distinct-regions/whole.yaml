code: WHOLE
name:
  eng: Guinea-Bissau
  local:
    - languageCode: por
      value: Guiné-Bissau
# Generic country-wide fallback content for Guinea-Bissau (unitary-small, single
# synthetic whole region). Used via the 'whole-country-fallback' path.
climates:
  - koppenCode: Aw
    description: "Tropical wet-and-dry (savanna) — hot year-round with a distinct dry season (~Dec-May) and wet season (~Jun-Nov); dominant across the country."
  - koppenCode: Am
    description: "Sub-Guinean high-rainfall monsoon climate in the southern coastal areas."
landmarks:
  - name: Bijagós Archipelago
    description: "UNESCO biosphere reserve of ~88 islands and islets off the coast, famed for saltwater hippos and marine biodiversity."
    unescoWorldHeritage: false
  - name: Bissau's historic centre and fortress
    description: "The colonial-era capital's old town, fortress and Amílcar Cabral monuments."
  - name: Cacheu
    description: "Historic riverside town on the Cacheu River with mangroves and colonial-era heritage."
culturalTraits:
  - "Rural, agrarian society (~80% employed in agriculture)"
  - "Ethnic diversity — 20+ ethnic groups (Balanta, Fulani, Manjaco, Mandinga, Papel...)"
  - "Warm hospitality — the local 'morabeza' (grace/welcome) ethos"
  - "Communal and family-centred social life"
  - "Kriol as the unifying everyday language across ethnic groups"
  - "Cashew economy woven into daily life"
prideOf:
  - "One of the world's top cashew producers (~80% of the population derives income from cashew; cashew dominates exports)"
  - "The Bijagós Archipelago's marine biodiversity and saltwater hippos"
  - "Historic role in the anti-colonial liberation struggle (Amílcar Cabral)"
animals:
  popular:
    - "Saltwater hippos (Bijagós Archipelago)"
    - "West African manatee"
    - "Marine turtles"
    - "Seasonal shorebirds"
  unique:
    - "Saltwater hippos — iconic residents of the Bijagós islands (Orango)"
    - "West African manatee in the coastal rivers and mangroves"
industries:
  - "Cashew — the dominant export and livelihood"
  - "Fishing and coastal resources"
  - "Agriculture — rice, cashew, groundnuts, palm"
  - "Small-scale processing and trade"
  - "Offshore oil reserves (emerging/pre-development)"
sports:
  - "Football (soccer) — the dominant sport"
  - "Traditional wrestling"
religions:
