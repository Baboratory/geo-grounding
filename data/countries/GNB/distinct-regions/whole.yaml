businessRhythm:
  restDays:
    - saturday
    - sunday
  typicalWorkHours: "Government and offices roughly 08:00-17:00 Mon-Fri with a midday break; commerce slows during the rainy season."
  lunchBreakTiming: "A standard midday break is common."
  notableShutdownPeriods:
    - period: "Rainy season (Jun-Nov)"
      description: "Business and travel slow noticeably during the heavy rainy season."
    - period: "Eid al-Fitr and Eid al-Adha"
      description: "Moveable Muslim holidays; reduced business, especially in the Muslim-majority areas."
  notes: "Relationship-first business culture; Sunday widely a rest day."
