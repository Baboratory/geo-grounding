# Norfuk (also spelled Norf'k) is a co-official language of the island — a
# creole of 18th-century English and Tahitian brought by the Pitcairn
# community resettled in 1856, made co-official by the Norfolk Island
# Language (Norf'k) Act 2004. It shares ISO 639-3 code pih
# (Pitcairn-Norfolk) with Pitkern, the sister language on the Pitcairn
# Islands. English is universally spoken; Norfuk is the community's
# heritage/home language.
