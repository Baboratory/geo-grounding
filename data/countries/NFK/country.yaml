legalConstraints:
  - topic: "Australian external territory with self-government"
    description: "Norfolk Island is an external territory of Australia, self-governing under the Norfolk Island Act 1979 (Cth). It became a regular part of the Australian mainland taxation system in 2016-17, ending the earlier low-tax regime; Australian income tax, GST and social security now apply. Population is roughly 1,800-2,200."
    sourceId: nfk-act
