alpha3: NRU
alpha2: NR
name:
  eng: Nauru
  local:
    - languageCode: eng
      value: Republic of Nauru
    - languageCode: nau
      value: Repubrikin Naoero
flagEmoji: "🇳🇷"
capital: Yaren
# Nauru has no formal capital city designation; government offices are in Yaren
# district on the southwest coast.
isSovereign: true
# Classified unitary-small: Nauru does NOT meet the unitary-large criteria. It is
# a single raised coral island, the world's smallest republic (~10k, 2023 est.),
# with no federal structure and no subnational administrative regions that merit
# curation. Nauruan is the official language with English the de facto language
# of government and business. One synthetic WHOLE region.
governanceType: unitary-small
iso3166_2_prefix: null
hasSubdivisions: false
languageUsage:
  - languageCode: nau
    domain: official
    speakersShare: 1.0
    sourceId: cwf-languages
  - languageCode: eng
    domain: official
    speakersShare: 1.0
    sourceId: cwf-languages
  - languageCode: nau
    domain: locallySpoken
    speakersShare: 0.93
    sourceId: cwf-languages
  - languageCode: eng
    domain: locallySpoken
    speakersShare: 0.66
    sourceId: cwf-languages
# Nauruan ('nau') is the official language; English, while not always listed as
# a designated sole official language, is in practice the language of government
# and business (de facto co-official). CIA records Nauruan as the main language
# spoken at home (93%) and English spoken by ~66% of the population.
ethnicGroups:
  # CIA World Factbook, 2021 est.
  - group: Nauruan
    percent: 94.6
    sourceId: cwf-ethnic
  - group: I-Kiribati
    percent: 2.2
    sourceId: cwf-ethnic
  - group: Fijian
    percent: 1.3
    sourceId: cwf-ethnic
  - group: Other
    percent: 1.9
    sourceId: cwf-ethnic
timezones:
  - name: Pacific/Nauru
    standardUtcOffset: "UTC+12"
    observesDst: false
# Nauru is on a single standard timezone UTC+12 year-round with no DST.
currency:
  code: AUD
  symbol: "$"
  name: Australian dollar
legalConstraints:
  - topic: "official languages"
    description: "Nauruan is the official language; English functions as the language of government and business (de facto co-official) even though Nauru has no single formally-designated sole official language."
    sourceId: cwf-languages
  - topic: "taxation"
    description: "Nauru does not impose a general personal income tax on worldwide income. It levies an Employment and Services Tax (EST) at 10% on employment and services income sourced in Nauru, plus taxes on business income."
    sourceId: tax-regime
  - topic: "customary land tenure"
    description: "Nauruan land is held under customary family/clan tenure and is not freely alienable to outsiders; foreign freehold purchase is effectively unavailable (leases are the vehicle). Extensive phosphate mining made ~90% of the interior unsuitable for farming."
    sourceId: cwf-ethnic
  - topic: "Sunday observance"
    description: "Sunday is observed as a rest and church day."
    sourceId: cwf-ethnic
  - topic: "banking access"
    description: "Only one commercial bank operates in Nauru (Bendigo Bank Australia branch), and Nauru has had difficulty accessing correspondent banking services — cross-border digital payments are constrained."
    sourceId: imf-banking
paymentCulture:
  popularMethods:
    - "Cash — the everyday default in a small, largely cash-based economy"
    - "A single commercial bank (Bendigo Bank) serves the island; no nationwide payment switch needed"
    - "Cross-border digital payments are constrained by correspondent-banking limits"
  tipping:
    expected: false
    typicalAmount: "Not expected or customary"
    autoIncludedInBill: false
    note: "Tipping is not customary in Nauru."
communicationStyle:
  contextLevel: high-context
  formalityNorms: "Communal, family- and clan-based ('eb' clan system) society; high-context, relationship-first, with respect for elders central. Direct confrontation and open criticism are avoided in favour of subtlety."
  greetingNorms: "Greet with 'Ekamowir omo' (hello) or informal 'Omo'/'Mo mo'. Meet elders and chiefs with respect and build personal relationships before transacting."
  meetingEtiquette: "Small, polite island society; personal warmth is expected before business. Defer to elders, avoid rushing, and prefer indirect, harmonious communication."
  topicsToAvoid:
    - "Clan/lineage sensitivities and the phosphate legacy/mistrust of outside exploitation"
    - "Religion and sensitive politics"
  giftGivingNotes: "Modest small gifts and customary exchanges are fine; generosity is appreciated in a small close-knit community."
distinct-regions:
  - code: WHOLE
    file: distinct-regions/whole.yaml
sources:
  - id: cwf-languages
    name: "CIA World Factbook — Nauru (People: Languages, main language spoken at home 2011 est.)"
    publisher: "CIA World Factbook"
    url: "https://www.cia.gov/the-world-factbook/countries/nauru/"
    year: 2024
    accessedDate: "2026-09-18"
    note: "Nauruan 93%, English 2% at home; Nauruan spoken by ~95%, English by ~66%; official-language status."
  - id: cwf-ethnic
    name: "CIA World Factbook — Nauru (People: ethnic groups, 2021 est.)"
    publisher: "CIA World Factbook"
    url: "https://www.cia.gov/the-world-factbook/countries/nauru/"
    year: 2021
    accessedDate: "2026-09-18"
    note: "Nauruan 94.6%, I-Kiribati 2.2%, Fijian 1.3%, other 1.9%. ~90% of interior unsuitable for farming after phosphate mining."
  - id: tax-regime
    name: "Nauru Revenue Office — administered legislation (EST 10%)"
    publisher: "Nauru Revenue Office / Nauru Finance"
    url: "https://naurufinance.info/nauru-revenue-office/nro-administered-legislation/"
    year: 2026
    accessedDate: "2026-09-18"
    note: "Employment and Services Tax of 10%; no general personal income tax on worldwide income."
  - id: imf-banking
    name: "IMF Departmental Paper DP/2024/003 — payment rails in Pacific islands"
    publisher: "International Monetary Fund"
    url: "https://www.imf.org/-/media/files/publications/dp/2024/english/rdmea.pdf"
    year: 2024
    accessedDate: "2026-09-18"
    note: "Single bank in Nauru; correspondent-banking constraints on cross-border payments."
  - id: iso-nau
    name: "ISO 639-3 entry: nau — Nauruan"
    publisher: "SIL International (ISO 639-3 Registration Authority)"
    url: "https://iso639-3.sil.org/code/nau"
    year: 2026
    accessedDate: "2026-09-18"
    note: "Verifies ISO 639-3 code nau = Nauruan (Individual, Living)."
