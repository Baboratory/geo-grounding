businessRhythm:
  restDays:
    - sunday
  typicalWorkHours: "Government and offices roughly 08:00-16:30/17:00 Mon-Fri; Sunday is a rest and church day."
  lunchBreakTiming: "A midday break is common."
  notes: "A single commercial bank (Bendigo Bank) serves the island; cash is the everyday default. Cross-border digital payments are constrained by correspondent-banking limits."
