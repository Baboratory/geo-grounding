code: zdj
name:
  eng: Ngazidja Comorian
  local: Shikomoro
# Ngazidja Comorian (Shikomoro), the Comorian variety of Grande Comore island
# (home of the capital Moroni). There is NO ISO 639-3 macrolanguage for
# Comorian; zdj is the variety of the politically dominant island of the Union
# of the Comoros, distinct from swb (Maore/Mayotte), wlc (Mwali/Moheli) and
# wni (Ndzwani/Anjouan).
